name: Bootstrap repair 410 compatibility refinement
on:
  push:
    branches:
      - fix/410-independent-arm-seeds
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/410-independent-arm-seeds
      - run: python3 scripts/apply-repair-410-compat.py
      - run: |
          rm scripts/apply-repair-410-compat.py
          rm .github/workflows/repair-410-compat-bootstrap.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'fix: preserve existing Monte Carlo diagnostic shapes'
          git push origin HEAD:fix/410-independent-arm-seeds
