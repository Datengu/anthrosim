name: AV5-001 branch patch bootstrap

on:
  push:
    branches:
      - audit/repair-606-av5-001

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-606-av5-001
          fetch-depth: 0
      - name: Apply asserted AV5-001 source patch
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('crates/anthrosim-core/src/temporary_mobility.rs')
          text = path.read_text()

          old_policy = 'const M9_DESTINATION_TIE_POLICY_ID: &str = "m9/equal-cost-destination-scientific-coupling-v2";'
          new_policy = '''const M9_DESTINATION_TIE_POLICY_ID: &str =
              "m9/equal-cost-destination-local-household-coupling-v3";
          const M9_HOUSEHOLD_COUPLING_POLICY_ID: &str =
              "m9/household-local-demographic-equivalence-v1";'''
          assert text.count(old_policy) == 1, text.count(old_policy)
          text = text.replace(old_policy, new_policy)

          call_pattern = re.compile(
              r'let destination_tie_coupling_key\s*=\s*household_stochastic_coupling_key\(population, household\)\?;'
          )
          text, count = call_pattern.subn(
              'let destination_tie_coupling_key = household_m9_coupling_key(population, household)?;',
              text,
          )
          assert count == 1, count

          function_pattern = re.compile(
              r'fn household_stochastic_coupling_key\(.*?\n}\n\n(?=fn household_living_count\()',
              re.S,
          )
          new_function = '''fn household_m9_coupling_key(
              population: &Population,
              household: HouseholdId,
          ) -> Result<u64, TemporaryMobilityExecutionError> {
              // M9 needs a label-neutral local coupling class, not a globally unique population
              // ordinal. Birth day and reproductive sex are stable person-level scientific state
              // that do not change when unrelated records are inserted, removed, or relabelled.
              // Sorting the local multiset makes the key independent of PersonId/packed-record
              // order. Exact demographic duplicates deliberately share one ambiguity realization
              // rather than being separated by an arbitrary storage/global-order label.
              let mut members = Vec::new();
              for index in 0..population.person_count() {
                  if !population.is_alive_index(index)
                      || population.household_at_index(index) != Some(household)
                  {
                      continue;
                  }
                  let person_id = population.person_id_at_index(index).ok_or(
                      TemporaryMobilityExecutionError::MissingHouseholdCouplingKey { household },
                  )?;
                  let person = population.person(person_id).ok_or(
                      TemporaryMobilityExecutionError::MissingHouseholdCouplingKey { household },
                  )?;
                  let sex_rank = match person.reproductive_sex {
                      crate::population::ReproductiveSex::Female => 0_u64,
                      crate::population::ReproductiveSex::Male => 1_u64,
                  };
                  members.push((person.birth_day, sex_rank));
              }
              if members.is_empty() {
                  return Err(TemporaryMobilityExecutionError::MissingHouseholdCouplingKey {
                      household,
                  });
              }
              members.sort_unstable();

              let mut hash = FNV_OFFSET_BASIS;
              digest_str(&mut hash, M9_HOUSEHOLD_COUPLING_POLICY_ID);
              digest_u64(&mut hash, members.len() as u64);
              for (birth_day, sex_rank) in members {
                  digest_u64(&mut hash, birth_day as u64);
                  digest_u64(&mut hash, sex_rank);
              }
              Ok(avalanche64(hash))
          }

          '''
          text, count = function_pattern.subn(new_function, text)
          assert count == 1, count
          path.write_text(text)

          path = Path('crates/anthrosim-core/src/provenance.rs')
          text = path.read_text()
          old = '''/// by equal subintervals of the existing choice draw. A v32 checkpoint must therefore not resume
          /// under v33 with unchanged migration RNG positions while silently reassigning candidate draws.
          pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v33";'''
          new = '''/// by equal subintervals of the existing choice draw. A v32 checkpoint must therefore not resume
          /// under v33 with unchanged migration RNG positions while silently reassigning candidate draws.
          ///
          /// v34 removes the remaining nonlocal population-order dependency from M9 equal-cost
          /// destination coupling. Tied M9 departures use a household-local, label-neutral demographic
          /// equivalence key instead of the minimum globally ordinal person stochastic-coupling rank.
          /// Unrelated founder insertion/removal can therefore no longer perturb an unchanged focal
          /// household's tie realization. A v33 checkpoint must not resume under v34 while silently
          /// changing future tied M9 destinations.
          pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v34";'''
          assert text.count(old) == 1, text.count(old)
          path.write_text(text.replace(old, new))
          PY

          cargo fmt --all
          cargo test -p anthrosim-core --test m9_remote_founder_tie_locality
          cargo test -p anthrosim-core authoritative_tied_destination_is_household_label_invariant

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_mobility.rs crates/anthrosim-core/src/provenance.rs
          git commit -m "fix: localize M9 household tie coupling"
          git push origin HEAD:audit/repair-606-av5-001
