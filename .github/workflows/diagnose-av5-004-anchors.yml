name: Diagnose AV5-004 patch anchors

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/diagnose-av5-004-anchors.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: false
      - name: Replay patch with numbered anchors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          mobility = Path('crates/anthrosim-core/src/temporary_mobility.rs')
          text = mobility.read_text()

          canonical_10 = "            equal_cost_destinations: None,\n            destination_tie_seed: None,\n        };\n"
          staged_10 = "            equal_cost_destinations: None,\n        destination_tie_seed: None,\n    };\n"
          if text.count(canonical_10) != 1:
              raise SystemExit(
                  f'anchor-10 precondition expected one canonical initializer, found {text.count(canonical_10)}'
              )
          text = text.replace(canonical_10, staged_10, 1)

          canonical_11 = "    pub(crate) fn new_m9_4(\n        resolutions: Vec<TemporaryTravelResolution>,\n        accumulated_cost_units: Vec<Option<u64>>,\n        equal_cost_destinations: Vec<Vec<TemporaryTravelDestinationCandidate>>,\n        destination_tie_seed: u64,\n        travel_model: TemporaryTravelModel,\n        region: &FocalRegion,\n        world: &World,\n    ) -> Result<Self, TemporaryMobilityProgramError> {\n        let table = Self {\n            schema_version: Self::CURRENT_SCHEMA_VERSION,\n            resolutions,\n            travel_model: Some(travel_model),\n            accumulated_cost_units: Some(accumulated_cost_units),\n            equal_cost_destinations: Some(equal_cost_destinations),\n            destination_tie_seed: Some(destination_tie_seed),\n        };\n"
          staged_11 = "    pub(crate) fn new_m9_4(\n    resolutions: Vec<TemporaryTravelResolution>,\n    accumulated_cost_units: Vec<Option<u64>>,\n    equal_cost_destinations: Vec<Vec<TemporaryTravelDestinationCandidate>>,\n    destination_tie_seed: u64,\n    travel_model: TemporaryTravelModel,\n    region: &FocalRegion,\n    world: &World,\n) -> Result<Self, TemporaryMobilityProgramError> {\n    let table = Self {\n        schema_version: Self::CURRENT_SCHEMA_VERSION,\n        resolutions,\n        travel_model: Some(travel_model),\n        accumulated_cost_units: Some(accumulated_cost_units),\n        equal_cost_destinations: Some(equal_cost_destinations),\n        destination_tie_seed: Some(destination_tie_seed),\n    };\n"
          if text.count(canonical_11) != 1:
              raise SystemExit(
                  f'anchor-11 precondition expected one constructor, found {text.count(canonical_11)}'
              )
          mobility.write_text(text.replace(canonical_11, staged_11, 1))

          workflow = Path('.github/workflows/apply-av5-004-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')
          source = [line[10:] if line.startswith('          ') else line for line in workflow[start:end]]
          instrumented = []
          for line in source:
              if line == 'def replace_once(path, old, new):':
                  instrumented.append('_anchor_counter = 0')
                  instrumented.append(line)
                  instrumented.append('    global _anchor_counter')
                  instrumented.append('    _anchor_counter += 1')
                  continue
              if line == '    count = text.count(old)':
                  instrumented.append(line)
                  instrumented.append('    first = old.splitlines()[0] if old.splitlines() else "<empty>"')
                  instrumented.append('    print(f"ANCHOR {_anchor_counter}: {path}: count={count}: {first!r}", flush=True)')
                  continue
              if line.strip() == 'raise SystemExit(f"{path}: expected exactly one replacement target, found {count}")':
                  instrumented.append('        print(f"FULL_OLD_{_anchor_counter}={old!r}", flush=True)')
                  instrumented.append('        raise SystemExit(f"ANCHOR {_anchor_counter} {path}: expected exactly one replacement target, found {count}: {first!r}")')
                  continue
              instrumented.append(line)
          exec(compile('\n'.join(instrumented) + '\n', '<av5-004-patch>', 'exec'), {'__name__': '__main__'})
          PY
