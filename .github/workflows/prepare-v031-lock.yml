name: Prepare v0.3.1 lockfile

on:
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - .github/workflows/prepare-v031-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    if: github.head_ref == 'release/v0.3.1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Refresh workspace lock identity and remove bootstrap workflow
        run: |
          cargo check --workspace
          git rm .github/workflows/prepare-v031-lock.yml
          git add Cargo.lock
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "release: refresh v0.3.1 workspace lock"
          git push origin HEAD:${{ github.head_ref }}
