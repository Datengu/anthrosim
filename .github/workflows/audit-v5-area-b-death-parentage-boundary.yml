name: Audit v5 Area B mortality-parentage boundary adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_b_death_parentage_boundary.rs'
      - '.github/workflows/audit-v5-area-b-death-parentage-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  death-parentage-boundary-adversary:
    name: Day-365 mortality before parentage adversary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-B mortality-parentage adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_b_death_parentage_boundary -- --nocapture
