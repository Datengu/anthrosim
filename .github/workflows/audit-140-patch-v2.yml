name: Audit 140 exact source patch

on:
  push:
    branches:
      - audit/140-close-m9-provenance-escape
    paths:
      - .github/workflows/audit-140-patch-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/140-close-m9-provenance-escape

      - name: Apply exact replacements
        run: python3 scripts/audit_140_patch.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/simulation.rs \
                  crates/anthrosim-core/src/spatial_simulation.rs \
                  crates/anthrosim-core/src/m9_integration_tests.rs
          git commit -m "Close temporary mobility provenance escape hatch"
          git push origin HEAD:audit/140-close-m9-provenance-escape
