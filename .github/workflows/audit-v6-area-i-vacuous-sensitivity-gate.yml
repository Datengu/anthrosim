name: Audit v6 Area I vacuous sensitivity gate

on:
  pull_request:
    paths:
      - "scripts/audit-v6-area-i-vacuous-sensitivity-gate.py"
      - ".github/workflows/audit-v6-area-i-vacuous-sensitivity-gate.yml"
      - "scripts/research-long-run-diagnostics.py"

permissions:
  contents: read

jobs:
  vacuous-sensitivity-adversary:
    name: Equilibrium sensitivity-coverage adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run vacuous sensitivity-coverage adversary
        run: python3 scripts/audit-v6-area-i-vacuous-sensitivity-gate.py
