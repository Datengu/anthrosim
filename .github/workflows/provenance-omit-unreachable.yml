name: Omit unreachable pre-sanitisation provenance

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  clean:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove obsolete unreachable SHA pointers
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          marker = 'pre-sanitisation-ref-omitted-after-2026-09-02-privacy-rewrite'
          unresolved = {
            '0cd8253ef8813a75818f12ef131bc6d91696a0b2',
            '100558f92beec25cd20a6f7f17ee0b0cf7ff5f3e',
            '179b5d1eb1131e3f24aad2e83bb80329bd54c601',
            '4711431704948c8f9f842c968aa113243b8a41a0',
            '4a224061e4f4387430a33215518503b064810a1f',
            '75d91b178c847ce12459f048fbcfdd954b23ba05',
            '96e50e9114e05543ae1fc6fd94a095867e54385a',
            '9dd1e447fa4ccab4d4e7be5f962b0236898b2b04',
            'bdee1f2831d8c18a9798acc5756cc10d21df1d04',
            'd0986a833e68a3682e831a2ed1b9ffea174f7a9d',
            'd1afb6b5d1824c685a8f910e2ad723f9efe71331',
            'd1df97e9e47dd1e252e683fc7cbc05ceedeec644',
            'de045e09e4a9550ea1d964ac644c22e0dac31e44',
            'e86cef007694bdfae6377248b27f737b8fd7693e',
            'f6ecc05ceeb800ae442820f5ad87eb28951474da',
          }

          # GitHub-generated PR merge refs are not ordinary refs and therefore had no
          # rewritten reachable counterpart. Preserve the evidence identity via run,
          # artifact and rewritten branch-head fields, while deliberately omitting the
          # obsolete pre-sanitisation merge-ref SHA.
          p = Path('experiments/v0.1-resource-variability-reference.json')
          obj = json.loads(p.read_text())
          if obj.get('referenceTestMergeCommit') in unresolved:
              obj['referenceTestMergeCommit'] = None
              obj['referenceTestMergeCommitStatus'] = marker
              p.write_text(json.dumps(obj, separators=(',', ':')) + '\n')

          for name in [
              'examples/m8-first-evidence-grounded-benchmark/reference-result.json',
              'examples/m9-controlled-aggregation-benchmark/reference-result.json',
          ]:
              p = Path(name)
              obj = json.loads(p.read_text())
              ref = obj.get('referenceExecution', {})
              if ref.get('pullRequestMergeRefBuildSha') in unresolved:
                  ref['pullRequestMergeRefBuildSha'] = None
                  ref['pullRequestMergeRefBuildStatus'] = marker
                  p.write_text(json.dumps(obj, separators=(',', ':')) + '\n')

          # In narrative records, no scientifically honest rewritten commit exists for
          # these GitHub-generated or otherwise non-reachable pre-rewrite objects. Do
          # not invent one: retain the provenance fact while omitting the obsolete SHA.
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix == '.json' or p.as_posix().startswith('.github/workflows/'):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              out = text
              for sha in unresolved:
                  out = out.replace(sha, marker)
              if out != text:
                  p.write_text(out, encoding='utf-8')
          PY
          rm .github/workflows/provenance-omit-unreachable.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: omit unreachable pre-sanitisation SHA pointers'
          git push
