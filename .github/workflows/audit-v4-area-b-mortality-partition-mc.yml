name: Audit v4 Area B mortality partition Monte Carlo

on:
  pull_request:
    paths:
      - "crates/anthrosim-core/tests/audit_v4_mortality_partition_monte_carlo.rs"
      - ".github/workflows/audit-v4-area-b-mortality-partition-mc.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mortality-partition-monte-carlo:
    name: Mortality partition Monte Carlo adversary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 mortality partition Monte Carlo
        run: cargo test -p anthrosim-core --test audit_v4_mortality_partition_monte_carlo --locked -- --nocapture
