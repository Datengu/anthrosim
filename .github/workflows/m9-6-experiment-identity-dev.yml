name: M9.6 experiment identity development integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'm9/m9-6-experiment-identity' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          ref: m9/m9-6-experiment-identity
          fetch-depth: 0

      - name: Normalize final M9.6 spatial validator shape
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/anthrosim-core/src/spatial_simulation.rs')
          text = p.read_text()
          compact = '''    checkpoint
              .temporary_mobility
              .validate_at_day(checkpoint.time.days(), &checkpoint.population, world)
              .map_err(|error| SpatialLandscapeError::TemporaryMobilityInvalid {
                  reason: error.to_string(),
              })?;
          '''
          expanded = '''    checkpoint
              .temporary_mobility
              .validate_at_day(
                  checkpoint.time.days(),
                  &checkpoint.population,
                  world,
              )
              .map_err(|error| SpatialLandscapeError::TemporaryMobilityInvalid {
                  reason: error.to_string(),
              })?;
          '''
          if text.count(compact) != 1:
              raise SystemExit(f'expected one compact spatial temporary validator, found {text.count(compact)}')
          p.write_text(text.replace(compact, expanded, 1))
          PY

      - name: Apply M9.6 experiment-identity patch
        run: python scripts/apply_m9_6_experiment_identity.py

      - name: Format
        run: cargo fmt --all

      - name: Test focused experiment identity
        run: cargo test --locked -p anthrosim-core --test temporary_mobility_experiment_identity

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Remove development helper
        run: |
          rm scripts/apply_m9_6_experiment_identity.py
          rm .github/workflows/m9-6-experiment-identity-dev.yml

      - name: Commit integrated M9.6 experiment identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M9.6: make temporary mobility part of experiment identity"
          git push origin HEAD:m9/m9-6-experiment-identity
