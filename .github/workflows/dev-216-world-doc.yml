name: Dev 216 world doc
on:
  push:
    branches:
      - fix/216-initial-resource-state
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/216-initial-resource-state
      - run: python3 scripts/dev-216-world-doc.py
      - run: cargo fmt --all
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/world.rs
          git commit -m "docs: distinguish world stock marker from M3 initial state"
          git push origin HEAD:fix/216-initial-resource-state
