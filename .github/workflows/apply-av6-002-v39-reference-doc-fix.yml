name: Apply AV6-002 v39 reference documentation correction

on:
  push:
    branches: [audit/repair-694-av6-002]
    paths:
      - '.github/workflows/apply-av6-002-v39-reference-doc-fix.yml'

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-694-av6-002
          persist-credentials: true

      - name: Download reviewed v39 M9 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: m9-controlled-aggregation-benchmark
          path: /tmp/m9
          github-token: ${{ github.token }}
          repository: Datengu/anthrosim
          run-id: 34563596919

      - name: Regenerate reference projection and synchronize living docs
        shell: python
        run: |
          import json
          from pathlib import Path

          root = Path('.')
          actual_path = Path('/tmp/m9/m9-benchmark-output/benchmark-summary.json')
          if not actual_path.is_file():
              raise SystemExit('reviewed M9 benchmark-summary.json is missing')
          actual = json.loads(actual_path.read_text(encoding='utf-8'))
          if actual['schemaVersion'] != 3 or actual['benchmarkId'] != 'm9_7_controlled_continuous_vs_intermittent_v1':
              raise SystemExit('unexpected reviewed M9 artifact identity')
          if actual['classification']['benchmarkClass'] != 'capability_distinguished':
              raise SystemExit('reviewed M9 artifact changed capability classification')
          if actual['aggregate']['pairedSeedsPassing'] != 8 or actual['aggregate']['pairedSeedsTotal'] != 8:
              raise SystemExit('reviewed M9 artifact does not retain 8/8 passing seeds')

          continuous_keys = (
              'residentPersonDays', 'visitorPersonDays', 'daysWithAnyVisitors', 'peakVisitors',
              'permanentMigrations', 'conditionMortalityDeaths', 'journeysStarted', 'journeysCompleted',
          )
          intermittent_keys = continuous_keys + (
              'transitPersonDays', 'notStartedTotal', 'notStartedUnreachable', 'originCatchmentCells',
          )
          travel_keys = (
              'plannedRoundTripTravelDays', 'observedTransitDays', 'unrealizedPlannedTransitDays',
              'plannedRoundTripTravelCostUnits', 'realizedTravelCostUnits', 'unrealizedPlannedTravelCostUnits',
              'plannedRoundTripRouteDistanceEdges', 'realizedRouteDistanceEdges', 'unrealizedPlannedRouteDistanceEdges',
          )

          def legacy_pair(pair):
              intermittent = {key: pair['intermittent'][key] for key in intermittent_keys}
              intermittent.update({
                  'totalTravelDays': pair['intermittent']['plannedRoundTripTravelDays'],
                  'totalRoundTripTravelCostUnits': pair['intermittent']['plannedRoundTripTravelCostUnits'],
                  'totalRoundTripRouteDistanceEdges': pair['intermittent']['plannedRoundTripRouteDistanceEdges'],
              })
              return {
                  'seed': pair['seed'],
                  'continuous': {key: pair['continuous'][key] for key in continuous_keys},
                  'intermittent': intermittent,
                  'totalFocalPersonDayDifferencePermilleExact': pair['totalFocalPersonDayDifferencePermilleExact'],
                  'totalFocalPersonDayDifferencePermilleRounded': pair['totalFocalPersonDayDifferencePermilleRounded'],
                  'intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleExact': pair['intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleExact'],
                  'intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleRounded': pair['intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleRounded'],
                  'criteria': pair['criteria'],
                  'pass': pair['pass'],
              }

          reference_path = root / 'examples/m9-controlled-aggregation-benchmark/reference-result.json'
          reference = json.loads(reference_path.read_text(encoding='utf-8'))
          execution = reference.get('referenceExecution', {})
          if execution.get('modelSemanticsId') != 'anthrosim-model-semantics-v39':
              raise SystemExit('M9 checked reference is not the reviewed v39 execution')
          if execution.get('workflowRunId') != 34563596919 or execution.get('artifactId') != 10185319300:
              raise SystemExit('M9 reference provenance does not match reviewed v39 artifact')

          reference['benchmarkId'] = actual['benchmarkId']
          reference['definitionCanonicalSha256'] = actual['definitionCanonicalSha256']
          reference['declaredSeeds'] = actual['declaredSeeds']
          reference['classification'] = actual['classification']
          reference['aggregate'] = actual['aggregate']
          for arm in ('continuous', 'intermittent'):
              reference['arms'][arm]['experimentId'] = actual['arms'][arm]['experimentId']
              reference['arms'][arm]['configCanonicalSha256'] = actual['arms'][arm]['configCanonicalSha256']
              reference['arms'][arm]['stateDigests'] = actual['arms'][arm]['stateDigests']
          reference['pairs'] = [legacy_pair(pair) for pair in actual['pairs']]
          seed_9705 = next(pair for pair in reference['pairs'] if pair['seed'] == 9705)
          if seed_9705['intermittent']['visitorPersonDays'] != 161820:
              raise SystemExit('reviewed M9 artifact does not contain expected seed-9705 observation')
          reference_path.write_text(json.dumps(reference, separators=(',', ':')) + '\n', encoding='utf-8')

          travel_path = root / 'examples/m9-controlled-aggregation-benchmark/travel-burden-reference.json'
          travel = json.loads(travel_path.read_text(encoding='utf-8'))
          travel['intermittentBySeed'] = {
              str(pair['seed']): {key: pair['intermittent'][key] for key in travel_keys}
              for pair in actual['pairs']
          }
          travel_path.write_text(json.dumps(travel, separators=(',', ':')) + '\n', encoding='utf-8')

          m8_path = root / 'docs/research/m8-first-evidence-grounded-benchmark-result.md'
          m8 = m8_path.read_text(encoding='utf-8')
          old_marker = '**Current machine-readable reference: `anthrosim-model-semantics-v33`.**'
          if old_marker not in m8:
              raise SystemExit('expected stale M8 current-reference marker not found')
          m8 = m8.replace(old_marker, '**Current machine-readable reference: `anthrosim-model-semantics-v39`.**', 1)
          old_header = '## Current regression reference — model semantics v33\n'
          if old_header not in m8:
              raise SystemExit('expected M8 v33 current header not found')
          m8_section = (
              '## Current regression reference — model semantics v39\n\n'
              'Audit-v6 AV6-002/#694 makes the configured male-parent age window refer to completed age at the recorded child-birth boundary. Because corrected parentage chronology can propagate into genealogy, household and migration histories, the frozen M8.6 design was rerun unchanged and the checked scientific reference was rebaselined from reviewed v39 evidence rather than relabelled.\n\n'
              'Reviewed v39 execution:\n\n'
              '- workflow run: `34563596919`;\n'
              '- artifact: `10185320001`;\n'
              '- artifact SHA-256: `3d1ebbde531945d61f698aefac6131669ed863b85679acf91c614fb6952533bb`;\n'
              '- reviewed branch head: `ec9829e5902c7b8a4c6a0bd62d56d2dac57dc603`;\n'
              '- pull-request merge-ref build: `8f70575b24473376f779e2d73f03e946f5250825`;\n'
              '- aggregate canonical SHA-256: `e5d3b6882f4fc35995ba89d7047c97de9347c5e32a35a6621465df6744730c6b`;\n'
              '- model semantics: `anthrosim-model-semantics-v39`.\n\n'
              'All 32 declared runs completed and all arms remain non-degenerate. The overall benchmark remains **`fragile_spatial_structure`**. Under the unchanged predeclared criteria, `terminalLargestCellSharePermille` is robust in the v39 reference, while migration distance, cell-time occupancy and terminal population Herfindahl remain not distinctive. This is a causal upstream-semantics rebaseline of the same terrain-only null model, not archaeological validation.\n\n'
              '## Historical reviewed reference — model semantics v33\n'
          )
          m8 = m8.replace(old_header, m8_section, 1)
          m8_path.write_text(m8, encoding='utf-8')

          m9_path = root / 'docs/research/m9-controlled-aggregation-benchmark-result.md'
          m9 = m9_path.read_text(encoding='utf-8')
          old_marker = '**Current machine-readable reference: `anthrosim-model-semantics-v38`.**'
          if old_marker not in m9:
              raise SystemExit('expected stale M9 current-reference marker not found')
          m9 = m9.replace(old_marker, '**Current machine-readable reference: `anthrosim-model-semantics-v39`.**', 1)
          old_header = '## Current regression reference — model semantics v38\n'
          if old_header not in m9:
              raise SystemExit('expected M9 v38 current header not found')
          m9_section = (
              '## Current regression reference — model semantics v39\n\n'
              'Audit-v6 AV6-002/#694 corrects the temporal meaning of the male-parent age window. The frozen M9.7 design was therefore rerun unchanged because altered births and genealogy can change the represented population even with permanent migration disabled. The checked reference is bound to the reviewed v39 execution rather than assuming the v38 population history remains authoritative.\n\n'
              'Reviewed v39 execution:\n\n'
              '- workflow run: `34563596919`;\n'
              '- artifact: `10185319300`;\n'
              '- artifact SHA-256: `086d639de983fbfdf3521715939af1d5e65124ed782a8bbea042c4f2be27f271`;\n'
              '- reviewed branch head: `ec9829e5902c7b8a4c6a0bd62d56d2dac57dc603`;\n'
              '- pull-request merge-ref build: `8f70575b24473376f779e2d73f03e946f5250825`;\n'
              '- aggregate canonical SHA-256: `95ab89935029a28516c21216b48eb403e943d882342cadba4b7f0a3e55441a09`;\n'
              '- reference model semantics: `anthrosim-model-semantics-v39`.\n\n'
              'The capability conclusion remains **`capability_distinguished`**: all **8/8** paired seeds pass, median focal-person-day difference is **31 permille**, the maximum is **36 permille**, median intermittent peak-visitor share is **433 permille**, and the minimum is **396 permille**. The independently preserved M9.6 travel-burden fields reproduce exactly, and replay plus active-checkpoint/resume equivalence pass in the protected workflow.\n\n'
              'A subsequent exact-merge rerun (`34572831776`) reproduced the reviewed v39 verifier projection exactly. It exposed one transcription error in the initially checked seed-9705 legacy projection (`visitorPersonDays` was written as `161822`; the reviewed artifact and exact rerun both contain `161820`). The reference is regenerated from the reviewed artifact here, so no criterion or verifier is weakened.\n\n'
              '## Historical reviewed reference — model semantics v38\n'
          )
          m9 = m9.replace(old_header, m9_section, 1)
          m9_path.write_text(m9, encoding='utf-8')

          record_path = root / 'research/general-demography-baseline-v1/model-semantics-v39-reverification.md'
          record = record_path.read_text(encoding='utf-8')
          note_header = '## Exact-head reference correction\n'
          if note_header not in record:
              record = record.rstrip() + (
                  '\n\n## Exact-head reference correction\n\n'
                  'Protected exact-merge run `34572831776` reran the same M8.6 and M9.7 designs after the references were checked in. M8.6 passed its canonical comparison. M9.7 reproduced the reviewed v39 verifier projection, but the gate exposed a single transcription error in the checked seed-9705 legacy projection: the artifact value is `visitorPersonDays=161820`, while the first checked projection said `161822`. The exact fraction and every other verifier-relevant field already corresponded to `161820`.\n\n'
                  'The M9 reference is therefore regenerated directly from reviewed artifact `10185319300`; the benchmark definition, criteria, verifier, travel-burden contract and scientific classification are unchanged. The living M8/M9 result pages are also synchronized to identify v39 as their checked current reference.\n'
              )
          record_path.write_text(record.rstrip() + '\n', encoding='utf-8')

      - name: Verify corrected references and documentation
        run: |
          python3 scripts/verify-m9-aggregation-benchmark-reference.py \
            --actual /tmp/m9/m9-benchmark-output/benchmark-summary.json \
            --reference examples/m9-controlled-aggregation-benchmark/reference-result.json
          python3 scripts/test-current-model-semantics-docs.py
          git diff --check

      - name: Commit artifact-bound correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/m9-controlled-aggregation-benchmark/reference-result.json \
                  examples/m9-controlled-aggregation-benchmark/travel-burden-reference.json \
                  docs/research/m8-first-evidence-grounded-benchmark-result.md \
                  docs/research/m9-controlled-aggregation-benchmark-result.md \
                  research/general-demography-baseline-v1/model-semantics-v39-reverification.md
          git diff --cached --check
          git commit -m "research: correct v39 benchmark references and docs"
          git push origin HEAD:audit/repair-694-av6-002
