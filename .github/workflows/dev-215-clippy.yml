name: Stage issue 215 clippy fix
on:
  push:
    branches: [feat/215-resource-condition-observability]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[215-clippy-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checked division
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/anthrosim-core/src/resources.rs')
          s=p.read_text()
          old='''        mean_permille: if living_people == 0 {\n            None\n        } else {\n            Some(\n                u16::try_from(sum / living_people)\n                    .map_err(|_| ResourceError::AccountingOverflow)?,\n            )\n        },'''
          new='''        mean_permille: sum\n            .checked_div(living_people)\n            .map(|mean| u16::try_from(mean).map_err(|_| ResourceError::AccountingOverflow))\n            .transpose()?,'''
          if s.count(old) != 1:
              raise SystemExit(f'anchor count {s.count(old)}')
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/resources.rs
          git commit -m "fix: use checked mean division for condition observability [215-clippy-fix]"
          git push origin HEAD:feat/215-resource-condition-observability
