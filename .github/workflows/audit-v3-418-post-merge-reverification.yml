name: AV3-010 post-merge reverification

on:
  pull_request:
    paths:
      - "scripts/audit-v3-post-merge-test-held-out-envelope.py"
      - ".github/workflows/audit-v3-418-post-merge-reverification.yml"
      - "scripts/research-identifiability.py"

permissions:
  contents: read

jobs:
  reverify-av3-010:
    name: Reverify AV3-010 conservative held-out envelope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Replay original AV3-010 overlap adversary
        run: python3 scripts/audit-v3-post-merge-test-held-out-envelope.py
