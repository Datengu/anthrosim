name: AV4-005 final candidate cleanup

on:
  push:
    branches:
      - repair/av4-005-parentage-coupling
    paths:
      - ".github/workflows/av4-005-parentage-production-regression.yml"

permissions:
  contents: write

jobs:
  finalize:
    name: Format and synchronize v29 evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-005-parentage-coupling
      - name: Install pinned Rust formatter
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Synchronize living v29 documentation
        run: python3 scripts/av4-005-finalize-temporary.py
      - name: Validate synchronized candidate
        run: |
          cargo fmt --all -- --check
          python3 scripts/test-current-model-semantics-docs.py
          python3 -m py_compile scripts/test-current-model-semantics-docs.py
          python3 - <<'PY'
          import json
          from pathlib import Path
          assert json.loads(Path('research/general-demography-baseline-v1/confirmatory-result.json').read_text())['modelSemanticsId'] == 'anthrosim-model-semantics-v29'
          assert json.loads(Path('examples/m8-first-evidence-grounded-benchmark/reference-result.json').read_text())['source']['modelSemanticsId'] == 'anthrosim-model-semantics-v29'
          assert json.loads(Path('examples/m9-controlled-aggregation-benchmark/reference-result.json').read_text())['referenceExecution']['modelSemanticsId'] == 'anthrosim-model-semantics-v29'
          PY
      - name: Remove temporary helpers and commit final candidate
        run: |
          set -euo pipefail
          git rm .github/workflows/av4-005-parentage-production-regression.yml scripts/av4-005-finalize-temporary.py
          git add crates/anthrosim-core/src/demography.rs crates/anthrosim-core/tests/parentage_label_invariance.rs docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md docs/research/general-scientific-demographic-baseline-v1.md docs/research/m8-first-evidence-grounded-benchmark-result.md docs/research/m9-controlled-aggregation-benchmark-result.md research/general-demography-baseline-v1/model-semantics-v29-reverification.md
          git diff --cached --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: finalize v29 parentage remediation evidence"
          git push origin HEAD:repair/av4-005-parentage-coupling
