name: AV4-005 parentage production regression

on:
  pull_request:
    paths:
      - "crates/anthrosim-core/src/demography.rs"
      - "crates/anthrosim-core/tests/parentage_label_invariance.rs"
      - ".github/workflows/av4-005-parentage-production-regression.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parentage-label-invariance:
    name: Parentage label invariance regression
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run permanent AV4-005 parentage regression
        run: cargo test -p anthrosim-core --test parentage_label_invariance --locked -- --nocapture
