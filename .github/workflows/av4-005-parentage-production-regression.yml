name: AV4-005 v29 reference regeneration

on:
  push:
    branches:
      - repair/av4-005-parentage-coupling
    paths:
      - ".github/workflows/av4-005-parentage-production-regression.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate-reference:
    name: Regenerate exact v29 issue-304 reference
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-005-parentage-coupling
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Validate permanent parentage regression
        run: cargo test -p anthrosim-core --test parentage_label_invariance --locked -- --nocapture
      - name: Validate predeclared precision plans
        run: |
          set -euo pipefail
          for p in research/general-demography-baseline-v1/precision-v2/*-plan.json; do
            python3 scripts/research-monte-carlo-sufficiency.py validate-plan "$p"
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          expected=list(range(3042001,3042131))
          plans=list(Path('research/general-demography-baseline-v1/precision-v2').glob('*-plan.json'))
          assert len(plans)==3
          for p in plans:
              d=json.loads(p.read_text())
              assert d['design']['mode']=='fixed'
              assert d['design']['seedBatches']==[expected]
          PY
      - name: Build research binaries
        run: |
          export ANTHROSIM_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --locked --release -p anthrosim-cli --bin anthrosim-research --bin anthrosim-demography-observability
      - name: Freeze central confirmatory design
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/general-demography-baseline-v1/exploratory-definition.json').read_text())
          seeds=list(range(3042001,3042131)); d['seeds']=seeds; d['base']['experiment']['seed']=seeds[0]
          d['base']['experiment']['population']['syntheticMaxAgeYears']=60
          d['base']['experiment']['resources']['productivityScalePermille']=1000
          for x in d['dimensions']:
              if x['id']=='founder_age_ceiling_years': x['values']=[60]
              if x['id']=='resource_productivity_scale_permille': x['values']=[1000]
          Path('/tmp/confirm-source.json').write_text(json.dumps(d,separators=(',',':'))+'\n')
          p=json.loads(Path('research/general-demography-baseline-v1/long-run-protocol.json').read_text())
          p['studyId']='issue-304-general-demography-baseline-confirmatory-v2'
          p['rationale']='130 fresh paired process seeds over the central 3x2 contrast at founder age ceiling 60 and resource productivity 1000 permille. This v2 confirmatory revision was predeclared after the fixed 64-seed v21 replication failed only the positive-fission extinction Monte Carlo precision gate: n=130 is the minimum fixed count that guarantees a two-sided 95% Wilson probability interval has maximum half-width <= 0.085 even at worst-case p=0.5. No outcomes from seeds 3042001..3042130 were inspected before fixing this count. Long-run thresholds/windows are unchanged.'
          Path('/tmp/confirm-long-run.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          python3 scripts/prepare-general-demography-baseline-definition.py /tmp/confirm-source.json /tmp/confirm-definition.json
          cmp /tmp/confirm-definition.json research/general-demography-baseline-v1/confirmatory-definition.json
          cmp /tmp/confirm-long-run.json research/general-demography-baseline-v1/confirmatory-long-run-protocol.json
      - name: Execute and summarize 780 confirmatory runs
        run: |
          rm -rf /tmp/c304 /tmp/o304 /tmp/a304
          target/release/anthrosim-research --definition /tmp/confirm-definition.json --run-dir /tmp/c304
          mkdir -p /tmp/o304 /tmp/a304/precision
          python3 - <<'PY' >/tmp/runs304.tsv
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/c304/analysis/runs.json').read_text())['runs']; assert len(rows)==780
          for r in rows:
              assert r['state']=='completed'; print(f"{r['runId']}\t{r['relativeDir']}")
          PY
          while IFS=$'\t' read -r id rel; do target/release/anthrosim-demography-observability --run-dir "/tmp/c304/$rel" --output "/tmp/o304/$id.json" >/dev/null; done </tmp/runs304.tsv
          python3 scripts/research-long-run-diagnostics.py /tmp/c304 /tmp/confirm-long-run.json --output /tmp/a304/long-run.json
          python3 scripts/research-general-demography-baseline.py /tmp/c304 /tmp/o304 /tmp/a304/summary.json --definition /tmp/confirm-definition.json --long-run /tmp/a304/long-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          summary=json.loads(Path('/tmp/a304/summary.json').read_text())
          paired=summary['pairedHouseholdEffects']
          assert len(paired)==3
          assert all(effect['pairedReplicates']==130 for effect in paired)
          assert sum(effect['pairedReplicates'] for effect in paired)==390
          PY
      - name: Apply Monte Carlo precision gates
        run: |
          python3 - <<'PY'
          import json,shutil
          from pathlib import Path
          s=json.loads(Path('/tmp/a304/summary.json').read_text()); seeds=list(range(3042001,3042131)); root=Path('/tmp/a304/precision')
          def runs(life): return {r['seed']:r for r in s['runs'] if r['demography']=='positive_growth_control_v1' and r['householdLifecycle']==life}
          fixed=runs('fixed_founder_v1'); fiss=runs('deterministic_dependency_fission_v2'); assert set(fixed)==set(seeds)==set(fiss)
          samples={
            'positive-fixed-growth':{'schemaVersion':1,'groups':[{'id':'positive-fixed','replicates':[{'seed':x,'value':fixed[x]['lateGrowthRatePerYear']} for x in seeds]}]},
            'positive-fission-extinction':{'schemaVersion':1,'groups':[{'id':'positive-fission-extinction','replicates':[{'seed':x,'value':fiss[x]['extinct']} for x in seeds]}]},
            'positive-household-population-effect':{'schemaVersion':1,'groups':[{'id':'fission','replicates':[{'seed':x,'value':fiss[x]['terminalPopulation']} for x in seeds]},{'id':'fixed','replicates':[{'seed':x,'value':fixed[x]['terminalPopulation']} for x in seeds]}]},
          }
          for name,sample in samples.items():
              shutil.copyfile(f'research/general-demography-baseline-v1/precision-v2/{name}-plan.json',root/f'{name}-plan.json')
              (root/f'{name}-samples.json').write_text(json.dumps(sample,indent=2,sort_keys=True)+'\n')
          PY
          for p in /tmp/a304/precision/*-plan.json; do s="${p%-plan.json}"; python3 scripts/research-monte-carlo-sufficiency.py diagnose "$p" "${s}-samples.json" "${s}-diagnostic.json"; done
      - name: Materialize exact v29 reference
        run: |
          python3 - <<'PY'
          import json,re
          from pathlib import Path
          s=json.loads(Path('/tmp/a304/summary.json').read_text())
          prec={p.stem:json.loads(p.read_text()) for p in Path('/tmp/a304/precision').glob('*-diagnostic.json')}
          provenance=Path('crates/anthrosim-core/src/provenance.rs').read_text()
          match=re.search(r'pub const MODEL_SEMANTICS_ID: &str = "([^"]+)"', provenance)
          assert match
          expected={'schemaVersion':1,'scientificStatus':'confirmatory_synthetic_model_analysis','modelSemanticsId':match.group(1),'recommendation':'no_universal_demographic_baseline','researchId':s['researchId'],'runCount':s['runCount'],'arms':s['arms'],'pairedHouseholdEffects':s['pairedHouseholdEffects'],'longRun':s['longRun'],'monteCarloPrecision':prec}
          assert expected['modelSemanticsId']=='anthrosim-model-semantics-v29'
          assert expected['recommendation']=='no_universal_demographic_baseline'
          Path('research/general-demography-baseline-v1/confirmatory-result.json').write_text(json.dumps(expected,indent=2,sort_keys=True)+'\n')
          PY
      - name: Commit only the generated reference
        run: |
          set -euo pipefail
          git add research/general-demography-baseline-v1/confirmatory-result.json
          if git diff --cached --quiet; then
            echo "Reference already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: rebaseline issue 304 for v29"
          git push origin HEAD:repair/av4-005-parentage-coupling
