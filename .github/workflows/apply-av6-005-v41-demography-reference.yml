name: Bind AV6-005 v41 demographic confirmation

on:
  push:
    branches:
      - audit/repair-708-av6-005

permissions:
  contents: write
  actions: read

jobs:
  bind-reference:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repair-708-av6-005
          fetch-depth: 0

      - name: Verify exact v41 documentation head
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6afd192d37afea0d98a81378a0834c9497473d15 HEAD
          grep -q 'anthrosim-model-semantics-v41' crates/anthrosim-core/src/provenance.rs

      - name: Download exact v41 confirmation artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Datengu/anthrosim/actions/artifacts/10272866623/zip' \
            -o /tmp/issue-304-v41.zip

      - name: Prove exact scientific equivalence and bind v41
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/bind-v41-demography.py
          test "$(sha256sum /tmp/bind-v41-demography.py | cut -d' ' -f1)" = "334a0359ca82fe97fa5181f5ef782d6f32af1ee551e1b5ee7d35c2a2686c11ab"
          python3 /tmp/bind-v41-demography.py
          python3 scripts/test-current-model-semantics-docs.py
          git diff --check

      - name: Commit v41 reference and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-av6-005-v41-demography-reference.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'research: bind demographic confirmation to v41'
          git push origin HEAD:audit/repair-708-av6-005
