name: Issue 304 analysis repair
on:
  pull_request:
    paths:
      - ".github/workflows/issue-304-analysis-repair.yml"
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/304-general-demographic-baseline
          persist-credentials: true
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('scripts/research-general-demography-baseline.py')
          t=p.read_text()
          old='''    founder = int(coords["founder_age_ceiling_years"])
    resource = int(coords["resource_productivity_scale_permille"])
'''
          new='''    founder = int(coords.get("founder_age_ceiling_years", 60))
    resource = int(coords.get("resource_productivity_scale_permille", 1000))
'''
          assert t.count(old)==1
          p.write_text(t.replace(old,new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/research-general-demography-baseline.py
          git commit -m "fix: summarize fixed confirmatory coordinates"
          git push origin HEAD:feat/304-general-demographic-baseline
