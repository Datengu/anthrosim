name: Audit v6 Area L drifting initialization dependence

on:
  pull_request:
    paths:
      - "scripts/audit-v6-area-l-drifting-initialization-dependence.py"
      - ".github/workflows/audit-v6-area-l-drifting-initialization-dependence.yml"
      - "scripts/research-long-run-diagnostics.py"

permissions:
  contents: read

jobs:
  drifting-initialization-dependence-adversary:
    name: Drifting initialization-dependence adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run drifting initialization-dependence adversary
        run: python3 scripts/audit-v6-area-l-drifting-initialization-dependence.py
