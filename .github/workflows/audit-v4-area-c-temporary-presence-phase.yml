name: Audit v4 Area C temporary-presence phase

on:
  pull_request:
    paths:
      - 'crates/anthrosim-core/tests/audit_v4_household_temporary_presence.rs'
      - '.github/workflows/audit-v4-area-c-temporary-presence-phase.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporary-presence-phase:
    name: Household temporary-presence phase adversary
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 temporary-presence lifecycle adversary
        run: cargo test --locked -p anthrosim-core --test audit_v4_household_temporary_presence -- --nocapture
