name: Bind AV6-005 v41 living results

on:
  push:
    branches:
      - audit/repair-708-av6-005
    paths:
      - .github/workflows/bind-av6-005-v41-living-results.yml

permissions:
  contents: write
  actions: read

jobs:
  bind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-708-av6-005
          fetch-depth: 0

      - name: Verify v41 repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 9e0755bd8d0ae270836e54793f1ade17c0e76f93 HEAD
          grep -q 'anthrosim-model-semantics-v41' crates/anthrosim-core/src/provenance.rs

      - name: Download exact issue-207 v41 artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -fL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/Datengu/anthrosim/actions/artifacts/10272929466/zip' \
            -o /tmp/household-lifecycle-v41.zip

      - name: Bind exact references and synchronize living result pages
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/bind-v41-living.py
          test "$(sha256sum /tmp/bind-v41-living.py | cut -d' ' -f1)" = "cebbe27d5b7c392a86afbca3ec5de3d3c4b61af3d9233a2c5dad6c528eb83e19"
          python3 /tmp/bind-v41-living.py

      - name: Verify living result surfaces
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-current-model-semantics-docs.py
          python3 scripts/test-current-household-lifecycle-docs.py
          python3 scripts/test-current-demographic-baseline-docs.py
          grep -q 'anthrosim-model-semantics-v41' research/household-lifecycle-sensitivity-v2/reference-result.json
          grep -q 'Current living-semantics revalidation — v41' docs/research/household-lifecycle-structural-sensitivity-result-v2.md
          grep -q 'Audit-v6 AV6-005 v41 applicability revalidation' docs/research/general-scientific-demographic-baseline-v1.md
          git diff --check

      - name: Commit bindings and remove transient verifiers
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/bind-av6-005-v41-living-results.yml
          rm .github/workflows/verify-av6-005-v41-household-lifecycle-reference.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'research: bind AV6-005 v41 living results'
          git push origin HEAD:audit/repair-708-av6-005
