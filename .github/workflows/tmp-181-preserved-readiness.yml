name: Temporary #181 preserved readiness patch

on:
  push:
    branches:
      - feat/181-preserve-evidence-closure

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/181-preserve-evidence-closure
          fetch-depth: 0
      - name: Apply guarded source patch
        run: python3 .github/scripts/patch_181_preserved_readiness.py
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --workspace --all-features
      - name: Commit production patch and remove temporary runner
        run: |
          rm .github/scripts/patch_181_preserved_readiness.py
          rm .github/workflows/tmp-181-preserved-readiness.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: preserve evidence closure in run provenance"
          git push origin HEAD:feat/181-preserve-evidence-closure
