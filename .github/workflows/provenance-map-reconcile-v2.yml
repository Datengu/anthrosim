name: Provenance map reconciliation v2

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map obsolete commit identities outside workflows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json, os, re, subprocess, urllib.error, urllib.request
          from collections import defaultdict
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          def git(*a): return subprocess.check_output(['git',*a],text=True)
          commits=[]
          by_exact=defaultdict(list); by_msg=defaultdict(list); by_tree=defaultdict(list)
          for sha in git('rev-list','--all').splitlines():
              raw=git('show','-s','--format=%at%x00%an%x00%ae%x00%T%x00%B',sha)
              epoch_s,name,email,tree,msg=raw.split('\x00',4); msg=msg.rstrip('\n')
              rec=(sha,int(epoch_s),name,email,tree,msg); commits.append(rec)
              by_exact[(int(epoch_s),email,msg)].append(sha)
              by_msg[msg].append(sha); by_tree[tree].append(sha)

          files=[]; candidate_paths=defaultdict(set)
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('.github/workflows/'):
                  continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              files.append((p,text))
              for v in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{40}(?![0-9a-fA-F])',text):
                  v=v.lower()
                  if subprocess.run(['git','cat-file','-e',v],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode!=0:
                      candidate_paths[v].add(p.as_posix())

          mappings={}; unresolved={}
          for old,paths in sorted(candidate_paths.items()):
              req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/commits/{old}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'anthrosim-provenance-reconcile'})
              try:
                  with urllib.request.urlopen(req) as r: obj=json.load(r)
              except urllib.error.HTTPError as exc:
                  unresolved[old]=f'not commit object ({exc.code})'; continue
              a=obj['author']; epoch=int(dt.datetime.fromisoformat(a['date'].replace('Z','+00:00')).timestamp()); msg=obj['message']; tree=obj.get('tree',{}).get('sha')
              hits=by_exact.get((epoch,a['email'],msg),[])
              if len(hits)!=1:
                  time_msg=[sha for sha,e,n,em,t,m in commits if e==epoch and m==msg]
                  if len(time_msg)==1: hits=time_msg
                  elif tree and len(by_tree.get(tree,[]))==1: hits=by_tree[tree]
                  elif len(by_msg.get(msg,[]))==1: hits=by_msg[msg]
              if len(hits)==1: mappings[old]=hits[0]
              else: unresolved[old]=f'no unique rewritten match (hits={len(hits)})'

          changed=[]
          for p,text in files:
              out=text
              for old,new in mappings.items(): out=re.sub(rf'(?<![0-9a-fA-F]){old}(?![0-9a-fA-F])',new,out,flags=re.I)
              if out!=text: p.write_text(out,encoding='utf-8'); changed.append(p.as_posix())
          print('MAPPED',len(mappings))
          for o,n in sorted(mappings.items()): print('MAP',o,'->',n)
          print('CHANGED',len(changed))
          for p in changed: print('FILE',p)
          print('UNRESOLVED',len(unresolved))
          for o,r in sorted(unresolved.items()): print('UNRESOLVED',o,r,'paths=',','.join(sorted(candidate_paths[o])))
          PY
          rm -f .github/workflows/provenance-map-reconcile.yml
          rm -f .github/workflows/provenance-map-reconcile-v2.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'docs: remap rewritten historical commit identities'
          git push
