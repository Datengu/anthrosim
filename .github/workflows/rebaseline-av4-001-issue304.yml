name: "Restore exact v26 issue 304 baseline"

on:
  push:
    branches:
      - fix/486-fertility-label-invariance
    paths:
      - .github/workflows/rebaseline-av4-001-issue304.yml

permissions:
  contents: write
  actions: read

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/486-fertility-label-invariance
          persist-credentials: true
          fetch-depth: 0

      - name: Download exact v26 issue 304 artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: issue-304-demographic-baseline-confirmatory
          path: /tmp/issue304-v26
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Datengu/anthrosim
          run-id: 33756260873

      - name: Validate and restore exact scientific result
        run: |
          python3 - <<'PY'
          import json
          import shutil
          from pathlib import Path

          artifact = Path('/tmp/issue304-v26/expected-result.json')
          if not artifact.is_file():
              raise SystemExit('expected-result.json missing from run 33756260873 artifact')

          result = json.loads(artifact.read_text(encoding='utf-8'))
          assert result['modelSemanticsId'] == 'anthrosim-model-semantics-v26'
          assert result['researchId'] == 'research-execution-v1-2187fac3eabf3d3c'
          assert result['recommendation'] == 'no_universal_demographic_baseline'
          assert result['runCount'] == 780
          assert result['longRun']['researchGateStatus'] == 'failed'
          assert result['longRun']['multipleStableRegimesDetected'] is True
          assert all(v['decision'] == 'sufficient_stop' for v in result['monteCarloPrecision'].values())

          paired = result['pairedHouseholdEffects']
          assert len(paired) == 3
          for effect in paired:
              assert effect['fissionMinusFixedTerminalPopulation']['mean'] < 0
              assert effect['fissionMinusFixedLateGrowthRatePerYear']['mean'] < 0
              assert effect['fissionMinusFixedMateLimitationFraction']['mean'] > 0

          target = Path('research/general-demography-baseline-v1/confirmatory-result.json')
          shutil.copyfile(artifact, target)
          assert target.read_bytes() == artifact.read_bytes()
          PY

      - name: Commit byte-exact artifact restoration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/general-demography-baseline-v1/confirmatory-result.json
          git diff --cached --quiet && exit 0
          git commit -m 'research: restore exact v26 issue 304 baseline artifact'
          git push origin HEAD:fix/486-fertility-label-invariance
