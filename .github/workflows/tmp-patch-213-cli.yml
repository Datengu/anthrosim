name: Temporary patch 213 CLI

on:
  push:
    branches:
      - fix/213-spatial-founder-initialization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/213-spatial-founder-initialization
      - name: Apply narrow CLI patch
        run: python scripts/tmp_patch_213_cli.py
      - name: Format and test CLI
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt --component clippy
          rustup default 1.97.1
          cargo fmt --all
          cargo test -p anthrosim-cli --locked
      - name: Remove temporary files and commit
        run: |
          git rm .github/workflows/tmp-patch-213-cli.yml scripts/tmp_patch_213_cli.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-cli/src/main.rs crates/anthrosim-cli/src/ensemble.rs crates/anthrosim-cli/src/ensemble_bundle_validation_tests.rs crates/anthrosim-core/tests/spatial_founder_initialization.rs
          git commit -m "feat: support declared founders in spatial experiments"
          git push origin HEAD:fix/213-spatial-founder-initialization
