name: Temporary patch 213 CLI

on:
  push:
    branches:
      - fix/213-spatial-founder-initialization

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/213-spatial-founder-initialization
      - name: Apply narrow CLI patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, found {count}')
              return text.replace(old, new, 1)

          def replace_exact(text, old, new, expected, label):
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{label}: expected {expected} matches, found {count}')
              return text.replace(old, new)

          ensemble_path = Path('crates/anthrosim-cli/src/ensemble.rs')
          ensemble = ensemble_path.read_text()
          ensemble = replace_once(
              ensemble,
              '    EvidenceCatalog, ExperimentConfig, LandscapeBinding, LandscapeBundle, MigrationConfig,\n',
              '    EvidenceCatalog, ExperimentConfig, FounderPopulationDefinition, LandscapeBinding,\n    LandscapeBundle, MigrationConfig,\n',
              'ensemble import',
          )
          ensemble = replace_once(
              ensemble,
              '''    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub(crate) evidence: Option<EvidenceCatalog>,
    #[serde(skip)]
    pub(crate) runtime_landscape_path: Option<PathBuf>,
''',
              '''    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub(crate) evidence: Option<EvidenceCatalog>,
    #[serde(default, skip_serializing_if = "Option::is_none")]
    pub(crate) founder_population: Option<FounderPopulationDefinition>,
    #[serde(skip)]
    pub(crate) runtime_landscape_path: Option<PathBuf>,
''',
              'spatial founder field',
          )
          ensemble = replace_once(
              ensemble,
              '''            && self.mechanisms == other.mechanisms
            && self.evidence == other.evidence
''',
              '''            && self.mechanisms == other.mechanisms
            && self.evidence == other.evidence
            && self.founder_population == other.founder_population
''',
              'spatial equality',
          )
          ensemble = replace_once(
              ensemble,
              '''        mechanisms,
        evidence,
        runtime_landscape_path: Some(landscape_path.to_path_buf()),
''',
              '''        mechanisms,
        evidence,
        founder_population: None,
        runtime_landscape_path: Some(landscape_path.to_path_buf()),
''',
              'spatial loader default founder',
          )
          ensemble = replace_once(
              ensemble,
              '''    if let Some(temporary_mobility) = &settings.temporary_mobility {
        config = config.with_temporary_mobility(temporary_mobility.clone());
    }
''',
              '''    if let Some(founder_population) = settings
        .spatial
        .as_ref()
        .and_then(|spatial| spatial.founder_population.as_ref())
    {
        config = config.with_founder_population(founder_population.clone());
    }
    if let Some(temporary_mobility) = &settings.temporary_mobility {
        config = config.with_temporary_mobility(temporary_mobility.clone());
    }
''',
              'experiment founder binding',
          )
          ensemble_path.write_text(ensemble)

          main_path = Path('crates/anthrosim-cli/src/main.rs')
          main = main_path.read_text()
          main = replace_once(
              main,
              '''        /// Optional versioned M9 temporary-mobility definition JSON shared by every run.
        #[arg(long)]
        temporary_mobility: Option<PathBuf>,

        /// Optional normalized M8.1 LandscapeBundle JSON; requires --mechanisms.
''',
              '''        /// Optional versioned M9 temporary-mobility definition JSON shared by every run.
        #[arg(long)]
        temporary_mobility: Option<PathBuf>,

        /// Optional declared founder-state JSON shared by every spatial run. Its person count replaces --population.
        #[arg(long, requires = "landscape")]
        founder_population: Option<PathBuf>,

        /// Optional normalized M8.1 LandscapeBundle JSON; requires --mechanisms.
''',
              'ensemble founder arg',
          )
          main = replace_once(
              main,
              '''        /// Optional versioned M9 temporary-mobility definition JSON shared by every point/run.
        #[arg(long)]
        temporary_mobility: Option<PathBuf>,

        /// Optional normalized M8.1 LandscapeBundle JSON shared by every point; requires --mechanisms.
''',
              '''        /// Optional versioned M9 temporary-mobility definition JSON shared by every point/run.
        #[arg(long)]
        temporary_mobility: Option<PathBuf>,

        /// Optional declared founder-state JSON shared by every spatial point/run. Its person count replaces --population.
        #[arg(
            long,
            requires = "landscape",
            conflicts_with_all = ["sweep_population", "sweep_household_size"]
        )]
        founder_population: Option<PathBuf>,

        /// Optional normalized M8.1 LandscapeBundle JSON shared by every point; requires --mechanisms.
''',
              'sweep founder arg',
          )
          main = replace_exact(
              main,
              '''            migration_radius,
            temporary_mobility,
            landscape,
''',
              '''            migration_radius,
            temporary_mobility,
            founder_population,
            landscape,
''',
              2,
              'command destructuring',
          )
          spatial_block = '''            let spatial = match (landscape, mechanisms) {
                (Some(landscape), Some(mechanisms)) => Some(load_spatial_run_settings(
                    &landscape,
                    &mechanisms,
                    evidence.as_deref(),
                )?),
                (None, None) => None,
                _ => unreachable!("clap requires landscape and mechanisms together"),
            };
            let temporary_mobility = temporary_mobility
'''
          spatial_replacement = '''            let mut spatial = match (landscape, mechanisms) {
                (Some(landscape), Some(mechanisms)) => Some(load_spatial_run_settings(
                    &landscape,
                    &mechanisms,
                    evidence.as_deref(),
                )?),
                (None, None) => None,
                _ => unreachable!("clap requires landscape and mechanisms together"),
            };
            let founder_population = founder_population
                .as_deref()
                .map(read_json::<FounderPopulationDefinition>)
                .transpose()?;
            let configured_population = founder_population
                .as_ref()
                .map(|definition| {
                    u32::try_from(definition.people.len()).map_err(|_| {
                        io::Error::new(
                            io::ErrorKind::InvalidInput,
                            "declared founder population exceeds the supported u32 initial-population range",
                        )
                    })
                })
                .transpose()?
                .unwrap_or(population);
            if let Some(spatial) = &mut spatial {
                spatial.founder_population = founder_population;
            }
            let temporary_mobility = temporary_mobility
'''
          main = replace_exact(
              main,
              spatial_block,
              spatial_replacement,
              2,
              'spatial command setup',
          )
          main = replace_exact(
              main,
              '''            let settings = EnsembleRunSettings {
                years,
                world_width,
                world_height,
                population,
                household_size,
''',
              '''            let settings = EnsembleRunSettings {
                years,
                world_width,
                world_height,
                population: configured_population,
                household_size,
''',
              2,
              'ensemble settings population',
          )
          main_path.write_text(main)
          PY
      - name: Format and test CLI
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt --component clippy
          rustup default 1.97.1
          cargo fmt --all
          cargo test -p anthrosim-cli --locked
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/tmp-patch-213-cli.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-cli/src/main.rs crates/anthrosim-cli/src/ensemble.rs crates/anthrosim-core/tests/spatial_founder_initialization.rs
          git commit -m "feat: support declared founders in spatial experiments"
          git push origin HEAD:fix/213-spatial-founder-initialization
