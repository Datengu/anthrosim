name: Temporary issue 94 patch

on:
  push:
    branches: [fix/94-versioned-sweep-provenance-preflight]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/94-versioned-sweep-provenance-preflight
      - name: Apply scoped source changes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          main = Path('crates/anthrosim-cli/src/main.rs')
          text = main.read_text()
          old = '''use anthrosim_core::{\n    EventLog, MetricSeries, Population, RecordedRun, Simulation, SimulationCheckpoint, World,\n};'''
          new = '''use anthrosim_core::{\n    EventLog, MetricSeries, Population, RecordedRun, Simulation, SimulationCheckpoint,\n    SourceRevisionIdentity, World,\n};'''
          if old not in text:
              raise SystemExit('main.rs import anchor not found')
          text = text.replace(old, new, 1)

          old = '''    /// Resume a deterministic M5 annual-boundary checkpoint to its configured duration.\n    Resume {'''
          new = '''    /// Print exact build/source provenance embedded in this executable.\n    Provenance,\n\n    /// Resume a deterministic M5 annual-boundary checkpoint to its configured duration.\n    Resume {'''
          if old not in text:
              raise SystemExit('main.rs command anchor not found')
          text = text.replace(old, new, 1)

          old = '''fn run(cli: Cli) -> Result<(), Box<dyn std::error::Error>> {\n    match cli.command {\n        Command::Run {'''
          new = '''fn run(cli: Cli) -> Result<(), Box<dyn std::error::Error>> {\n    match cli.command {\n        Command::Provenance => {\n            println!(\n                "{}",\n                serde_json::to_string_pretty(&SourceRevisionIdentity::current())?\n            );\n        }\n        Command::Run {'''
          if old not in text:
              raise SystemExit('main.rs run-match anchor not found')
          text = text.replace(old, new, 1)
          main.write_text(text)

          script = Path('scripts/run-versioned-sweep.py')
          text = script.read_text()
          old = '''def is_dirty_source_identity(revision: str) -> bool:\n    return revision.endswith("-dirty") or "-dirty-" in revision\n\n\ndef require_reproducible_source_identity(manifest: dict) -> str:\n    revision = manifest.get("gitCommit")'''
          new = '''def is_dirty_source_identity(revision: str) -> bool:\n    return revision.endswith("-dirty") or "-dirty-" in revision\n\n\ndef inspect_binary_provenance(binary: Path) -> dict:\n    completed = subprocess.run(\n        [str(binary), "provenance"],\n        check=False,\n        capture_output=True,\n        text=True,\n    )\n    if completed.returncode != 0:\n        detail = completed.stderr.strip() or completed.stdout.strip() or "no diagnostic output"\n        raise SystemExit(\n            f"could not inspect AnthroSim binary provenance before sweep execution: {detail}"\n        )\n    try:\n        provenance = json.loads(completed.stdout)\n    except json.JSONDecodeError as error:\n        raise SystemExit(\n            "AnthroSim binary provenance command did not return valid JSON"\n        ) from error\n    if not isinstance(provenance, dict):\n        raise SystemExit("AnthroSim binary provenance command returned a non-object JSON value")\n    if not provenance.get("modelVersion") or not provenance.get("modelSemanticsId"):\n        raise SystemExit("AnthroSim binary provenance is missing model identity fields")\n    return provenance\n\n\ndef require_reproducible_source_identity(manifest: dict) -> str:\n    revision = manifest.get("gitCommit")'''
          if old not in text:
              raise SystemExit('run-versioned-sweep provenance anchor not found')
          text = text.replace(old, new, 1)

          old = '''    if not binary.is_file():\n        raise SystemExit(f"AnthroSim binary not found: {binary}")\n\n    command = build_command(definition, binary, args.run_dir, args.retry)\n    completed = subprocess.run(command, check=False)'''
          new = '''    if not binary.is_file():\n        raise SystemExit(f"AnthroSim binary not found: {binary}")\n\n    binary_provenance = inspect_binary_provenance(binary)\n    source_revision = require_reproducible_source_identity(binary_provenance)\n\n    command = build_command(definition, binary, args.run_dir, args.retry)\n    completed = subprocess.run(command, check=False)'''
          if old not in text:
              raise SystemExit('run-versioned-sweep main preflight anchor not found')
          text = text.replace(old, new, 1)

          old = '''    manifest = verify_manifest(definition, args.run_dir)\n    source_revision = require_reproducible_source_identity(manifest)\n    source_hash = hashlib.sha256(raw).hexdigest()'''
          new = '''    manifest = verify_manifest(definition, args.run_dir)\n    manifest_revision = require_reproducible_source_identity(manifest)\n    if manifest.get("modelVersion") != binary_provenance["modelVersion"]:\n        raise SystemExit(\n            "completed sweep manifest modelVersion does not match the preflighted AnthroSim binary"\n        )\n    if manifest_revision != source_revision:\n        raise SystemExit(\n            "completed sweep manifest gitCommit does not match the preflighted AnthroSim binary"\n        )\n    source_hash = hashlib.sha256(raw).hexdigest()'''
          if old not in text:
              raise SystemExit('run-versioned-sweep post-run anchor not found')
          text = text.replace(old, new, 1)
          script.write_text(text)

          docs = Path('docs/source-provenance.md')
          text = docs.read_text()
          old = '''## Research/reference policy\n\n`scripts/run-versioned-sweep.py` requires reproducible source identity. It fails after validating the generated immutable sweep manifest when:\n\n- `gitCommit` is absent/null; or\n- `gitCommit` carries an automatic dirty-tree marker (`-dirty` or `-dirty-<working-tree-digest>`).\n\nThe legacy `-dirty` form remains recognized so older dirty builds cannot bypass this policy.\n\nA versioned research sweep therefore requires either a clean Git build with automatic revision capture or a deliberate non-empty `ANTHROSIM_GIT_COMMIT` override supplied by a controlled build environment.\n\nThis policy applies only to the versioned research adapter. It does not prevent ordinary local runs from being used for development or exploratory work when exact source identity is unavailable.\n'''
          new = '''## Binary provenance inspection\n\nThe main experiment runner exposes the exact provenance embedded in that executable without creating run artifacts:\n\n```text\nanthrosim provenance\n```\n\nThe command emits the shared `SourceRevisionIdentity` JSON (`modelVersion`, `modelSemanticsId`, and `gitCommit`). Tooling should use this command when it must inspect the executable that will actually run an experiment rather than infer provenance from the caller's checkout.\n\n## Research/reference policy\n\n`scripts/run-versioned-sweep.py` requires reproducible source identity. Before constructing or executing the sweep command, it invokes `provenance` on the exact `--binary` path and fails immediately when:\n\n- `gitCommit` is absent/null; or\n- `gitCommit` carries an automatic dirty-tree marker (`-dirty` or `-dirty-<working-tree-digest>`).\n\nThis preflight does not create the requested experiment directory, so an invalid research binary cannot consume a long sweep before being rejected. The legacy `-dirty` form remains recognized so older dirty builds cannot bypass this policy.\n\nAfter the sweep finishes, the adapter still validates the immutable sweep manifest and requires its `modelVersion` and `gitCommit` to match the preflighted executable. This post-run reconciliation is retained as defense in depth.\n\nA versioned research sweep therefore requires either a clean Git build with automatic revision capture or a deliberate non-empty `ANTHROSIM_GIT_COMMIT` override supplied by a controlled build environment.\n\nThis policy applies only to the versioned research adapter. It does not prevent ordinary local runs from being used for development or exploratory work when exact source identity is unavailable.\n'''
          if old not in text:
              raise SystemExit('source-provenance docs anchor not found')
          docs.write_text(text.replace(old, new, 1))

          workflow = Path('.github/workflows/source-provenance.yml')
          text = workflow.read_text()
          old = '''            --seed 80 \\\n            --output /tmp/anthrosim-clean-provenance.json\n          python3 - <<'PY'\n'''
          new = '''            --seed 80 \\\n            --output /tmp/anthrosim-clean-provenance.json\n          cp target/debug/anthrosim /tmp/anthrosim-clean\n          python3 - <<'PY'\n'''
          if old not in text:
              raise SystemExit('clean workflow anchor not found')
          text = text.replace(old, new, 1)

          old = '''            --seed 80 \\\n            --output /tmp/anthrosim-dirty-a-provenance.json\n\n          git checkout -- README.md\n'''
          new = '''            --seed 80 \\\n            --output /tmp/anthrosim-dirty-a-provenance.json\n          cp target/debug/anthrosim /tmp/anthrosim-dirty\n\n          git checkout -- README.md\n'''
          if old not in text:
              raise SystemExit('dirty workflow anchor not found')
          text = text.replace(old, new, 1)

          old = '''            --seed 80 \\\n            --output /tmp/anthrosim-override-provenance.json\n          python3 - <<'PY'\n'''
          new = '''            --seed 80 \\\n            --output /tmp/anthrosim-override-provenance.json\n          cp target/debug/anthrosim /tmp/anthrosim-override\n          python3 - <<'PY'\n'''
          if old not in text:
              raise SystemExit('override workflow anchor not found')
          text = text.replace(old, new, 1)

          addition = r'''\n\n      - name: Build binary with unavailable Git metadata\n        run: |\n          rm -rf /tmp/anthrosim-missing-target /tmp/anthrosim-missing-git\n          mkdir -p /tmp/anthrosim-missing-git\n          GIT_DIR=/tmp/anthrosim-missing-git \\\n            CARGO_TARGET_DIR=/tmp/anthrosim-missing-target \\\n            cargo build --locked -p anthrosim-cli --bin anthrosim\n          cp /tmp/anthrosim-missing-target/debug/anthrosim /tmp/anthrosim-missing\n          /tmp/anthrosim-missing provenance > /tmp/anthrosim-missing-provenance.json\n          python3 - <<'PY'\n          import json\n          from pathlib import Path\n\n          provenance = json.loads(Path('/tmp/anthrosim-missing-provenance.json').read_text())\n          assert provenance['gitCommit'] is None\n          PY\n\n      - name: Preflight exact binaries before versioned sweep execution\n        run: |\n          cat > /tmp/anthrosim-provenance-preflight-definition.json <<'JSON'\n          {\n            "schemaVersion": 1,\n            "definitionId": "ci-source-provenance-preflight",\n            "scientificStatus": "synthetic_validation",\n            "seeds": [9401],\n            "base": {\n              "years": 0,\n              "worldWidth": 1,\n              "worldHeight": 1,\n              "population": 1,\n              "householdSize": 1,\n              "maxPersonRecords": 1\n            },\n            "dimensions": {\n              "annualFoodNeed": [100]\n            }\n          }\n          JSON\n\n          rm -rf /tmp/anthrosim-preflight-clean /tmp/anthrosim-preflight-dirty \\\n            /tmp/anthrosim-preflight-missing /tmp/anthrosim-preflight-override\n\n          python3 scripts/run-versioned-sweep.py \\\n            /tmp/anthrosim-provenance-preflight-definition.json \\\n            --binary /tmp/anthrosim-clean \\\n            --run-dir /tmp/anthrosim-preflight-clean\n          test -f /tmp/anthrosim-preflight-clean/reproduction-record.json\n\n          if python3 scripts/run-versioned-sweep.py \\\n            /tmp/anthrosim-provenance-preflight-definition.json \\\n            --binary /tmp/anthrosim-dirty \\\n            --run-dir /tmp/anthrosim-preflight-dirty; then\n            echo 'dirty binary unexpectedly passed versioned-sweep preflight' >&2\n            exit 1\n          fi\n          test ! -e /tmp/anthrosim-preflight-dirty\n\n          if python3 scripts/run-versioned-sweep.py \\\n            /tmp/anthrosim-provenance-preflight-definition.json \\\n            --binary /tmp/anthrosim-missing \\\n            --run-dir /tmp/anthrosim-preflight-missing; then\n            echo 'missing-provenance binary unexpectedly passed versioned-sweep preflight' >&2\n            exit 1\n          fi\n          test ! -e /tmp/anthrosim-preflight-missing\n\n          python3 scripts/run-versioned-sweep.py \\\n            /tmp/anthrosim-provenance-preflight-definition.json \\\n            --binary /tmp/anthrosim-override \\\n            --run-dir /tmp/anthrosim-preflight-override\n          test -f /tmp/anthrosim-preflight-override/reproduction-record.json\n\n          python3 - <<'PY'\n          import json\n          import subprocess\n          from pathlib import Path\n\n          for label in ('clean', 'override'):\n              provenance = json.loads(subprocess.check_output(\n                  [f'/tmp/anthrosim-{label}', 'provenance'], text=True\n              ))\n              record = json.loads(Path(\n                  f'/tmp/anthrosim-preflight-{label}/reproduction-record.json'\n              ).read_text())\n              manifest = json.loads(Path(\n                  f'/tmp/anthrosim-preflight-{label}/sweep-manifest.json'\n              ).read_text())\n              assert record['gitCommit'] == provenance['gitCommit']\n              assert manifest['gitCommit'] == provenance['gitCommit']\n              assert manifest['modelVersion'] == provenance['modelVersion']\n          PY\n'''
          marker = "\n"
          # Append the integration cases as final steps in the single provenance job.\n          text = text.rstrip() + addition.replace('\\n', '\n') + '\n'\n          workflow.write_text(text)\n\n          Path('.github/workflows/zz-temp-issue-94-patch.yml').unlink()\n          PY\n\n          cargo fmt --all\n          git config user.name 'github-actions[bot]'\n          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'\n          git add -A\n          git commit -m 'Preflight versioned sweep source provenance'\n          git push origin HEAD:fix/94-versioned-sweep-provenance-preflight
