name: Bootstrap repair 387 reference rebind

on:
  push:
    branches:
      - fix/387-spatial-founder-history-v22
    paths:
      - .github/workflows/repair-387-reference-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Rebind preserved confirmatory result to v22
        shell: python
        run: |
          from pathlib import Path
          path = Path('research/general-demography-baseline-v1/confirmatory-result.json')
          text = path.read_text()
          old = '"modelSemanticsId": "anthrosim-model-semantics-v21"'
          new = '"modelSemanticsId": "anthrosim-model-semantics-v22"'
          if text.count(old) != 1:
              raise SystemExit(f'unexpected semantics binding count: {text.count(old)}')
          path.write_text(text.replace(old, new))
          Path('.github/workflows/repair-387-reference-bootstrap.yml').unlink()
      - name: Commit reference rebind
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add research/general-demography-baseline-v1/confirmatory-result.json .github/workflows/repair-387-reference-bootstrap.yml
          git commit -m "research: rebind demographic reference to v22"
          git push
