name: AV4-001 repair bootstrap

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-av4-001-repair.py'
      - '.github/workflows/av4-001-repair-bootstrap.yml'

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply production repair
        run: python scripts/apply-av4-001-repair.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit repair to PR branch
        run: |
          if git diff --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/population.rs \
                  crates/anthrosim-core/src/demography.rs \
                  crates/anthrosim-core/src/demography_observability.rs \
                  crates/anthrosim-core/src/provenance.rs \
                  docs/research/m2-demography-observability-v1.md
          git commit -m 'fix: make fertility RNG assignment person-label invariant'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
