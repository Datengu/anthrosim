name: Provenance map reconciliation

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  map:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Map obsolete commit identities to rewritten commits
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime as dt
          import json
          import os
          import re
          import subprocess
          import urllib.error
          import urllib.request
          from collections import defaultdict
          from pathlib import Path

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']

          def git(*args):
              return subprocess.check_output(['git', *args], text=True, errors='strict')

          # Build an index over every rewritten commit reachable from ordinary fetched refs/tags.
          index = defaultdict(list)
          for sha in git('rev-list', '--all').splitlines():
              raw = git('show', '-s', '--format=%at%x00%ae%x00%B', sha)
              epoch_s, email, message = raw.split('\x00', 2)
              index[(int(epoch_s), email, message.rstrip('\n'))].append(sha)

          candidates = defaultdict(set)
          files = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('.github/workflows/provenance-map-reconcile.yml'):
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              files.append((p, text))
              for value in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{40}(?![0-9a-fA-F])', text):
                  low = value.lower()
                  if subprocess.run(['git','cat-file','-e',low], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode != 0:
                      candidates[low].add(p.as_posix())

          mappings = {}
          unresolved = {}
          for old, paths in sorted(candidates.items()):
              url = f'https://api.github.com/repos/{repo}/git/commits/{old}'
              req = urllib.request.Request(url, headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'anthrosim-provenance-reconcile',
              })
              try:
                  with urllib.request.urlopen(req) as r:
                      obj = json.load(r)
              except urllib.error.HTTPError as exc:
                  unresolved[old] = f'not a GitHub commit object ({exc.code})'
                  continue
              author = obj['author']
              when = dt.datetime.fromisoformat(author['date'].replace('Z','+00:00'))
              epoch = int(when.timestamp())
              key = (epoch, author['email'], obj['message'])
              hits = index.get(key, [])
              if len(hits) == 1:
                  mappings[old] = hits[0]
              elif len(hits) == 0:
                  unresolved[old] = 'no rewritten commit matched author-time/email/message'
              else:
                  # Prefer an unchanged tree when possible.
                  old_tree = obj.get('tree', {}).get('sha')
                  tree_hits = [h for h in hits if git('show','-s','--format=%T',h).strip() == old_tree]
                  if len(tree_hits) == 1:
                      mappings[old] = tree_hits[0]
                  else:
                      unresolved[old] = f'ambiguous rewritten match ({len(hits)} candidates)'

          changed = []
          for p, text in files:
              updated = text
              for old, new in mappings.items():
                  updated = re.sub(rf'(?<![0-9a-fA-F]){re.escape(old)}(?![0-9a-fA-F])', new, updated, flags=re.IGNORECASE)
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(p.as_posix())

          print(f'Mapped obsolete commit identities: {len(mappings)}')
          for old, new in sorted(mappings.items()):
              print(f'MAP {old} -> {new}')
          print(f'Changed files: {len(changed)}')
          for p in changed:
              print('FILE', p)
          print(f'Unresolved non-live 40-hex tokens: {len(unresolved)}')
          for old, reason in sorted(unresolved.items()):
              print(f'UNRESOLVED {old}: {reason}')
          PY

          rm .github/workflows/provenance-map-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No mapped provenance replacements required.'
            exit 0
          fi
          git commit -m 'docs: remap rewritten historical commit identities'
          git push
