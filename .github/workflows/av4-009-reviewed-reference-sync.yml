name: AV4-009 reviewed reference sync

on:
  push:
    branches:
      - repair/av4-009-m4-spatial-candidate-coupling

permissions:
  contents: write
  actions: read

jobs:
  sync-reviewed-references:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-009-m4-spatial-candidate-coupling
          fetch-depth: 0
      - name: Download exact reviewed artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          rm -rf /tmp/review304 /tmp/reviewM8
          mkdir -p /tmp/review304 /tmp/reviewM8
          gh run download 33884799723 -R Datengu/anthrosim -n issue-304-demographic-baseline-confirmatory -D /tmp/review304
          gh run download 33884800100 -R Datengu/anthrosim -n m8-evidence-grounded-benchmark -D /tmp/reviewM8
      - name: Verify artifact ZIP digests from GitHub metadata
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, subprocess
          expected={9941547662:'sha256:dc439b48bb7d2a048c3fe2365698d2403a67ac2a26e340c17bb6dc8a8901fa83',9941586776:'sha256:21b2f9dacdbf85c5b036bae7ca90d158cad5257a67cca1dae66bc17e54e9f9ba'}
          for run, aid in [(33884799723,9941547662),(33884800100,9941586776)]:
              data=json.loads(subprocess.check_output(['gh','api',f'repos/Datengu/anthrosim/actions/runs/{run}/artifacts'],text=True))
              found={a['id']:a.get('digest') for a in data['artifacts']}
              assert found.get(aid)==expected[aid], (run, aid, found.get(aid))
          PY
      - name: Materialize reviewed v33 references
        run: python3 scripts/av4-009-reviewed-reference-sync.py
      - name: Validate synced references
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('research/general-demography-baseline-v1/confirmatory-result.json'))
          assert d['modelSemanticsId']=='anthrosim-model-semantics-v33'
          assert d['runCount']==780
          assert d['recommendation']=='no_universal_demographic_baseline'
          m=json.load(open('examples/m8-first-evidence-grounded-benchmark/reference-result.json'))
          assert m['source']['modelSemanticsId']=='anthrosim-model-semantics-v33'
          assert m['classification']['benchmarkClass']=='fragile_spatial_structure'
          assert m['classification']['fragileMetrics']==['terminalLargestCellSharePermille']
          PY
      - name: Commit reviewed references
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add research/general-demography-baseline-v1/confirmatory-result.json research/general-demography-baseline-v1/model-semantics-v33-reverification.md examples/m8-first-evidence-grounded-benchmark/reference-result.json
          git diff --cached --check
          git commit -m 'research: reverify AV4-009 v33 scientific references'
          git push origin HEAD:repair/av4-009-m4-spatial-candidate-coupling
