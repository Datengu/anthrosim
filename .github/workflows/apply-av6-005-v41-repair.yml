name: Apply AV6-005 v41 repair

on:
  push:
    branches:
      - audit/repair-708-av6-005

permissions:
  contents: write

jobs:
  apply-repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repair-708-av6-005
          fetch-depth: 0

      - name: Verify production ancestry
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 8f69fd951ae62773fa2a1f228efa00d17e9b6e53 HEAD

      - name: Apply representation-invariant duration tie repair
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 --decode > /tmp/apply-av6-005.py
          python /tmp/apply-av6-005.py

      - name: Format and focused verification
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          cargo clippy -p anthrosim-core --all-targets -- -D warnings
          cargo test -p anthrosim-core m9_duration_rounding_tie_is_invariant_to_canonical_household_relabelling
          cargo test -p anthrosim-core repeated_fifty_fifty_one_unit_ties_do_not_favour_home
          cargo test -p anthrosim-core larger_odd_fifty_fifty_demand_is_cumulatively_balanced_and_exact
          cargo test -p anthrosim-core same_season_ties_do_not_alias_to_one_side_at_power_of_two_cadence
          cargo test -p anthrosim-core period_phase_is_household_relabel_invariant_and_long_run_balanced
          cargo test -p anthrosim-core non_tied_duration_remainders_ignore_tie_phase_and_keep_largest_remainder
          cargo test -p anthrosim-core serialized_resource_period_sequence_preserves_next_tie_decision
          cargo test -p anthrosim-core exact_tie_phase_moves_real_resource_pressure_between_home_and_destination
          git diff --check

      - name: Commit repair and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-av6-005-v41-repair.yml
          git config user.name 'Jack'
          git config user.email '15160645+Datengu@users.noreply.github.com'
          git add -A
          git commit -m 'fix(audit-v6): remove household identity from M9 resource tie phase'
          git push origin HEAD:audit/repair-708-av6-005
