name: PR324 v2 household sensitivity experiment

on:
  push:
    branches:
      - fix/324-dependency-aware-household-fission

jobs:
  experiment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/324-dependency-aware-household-fission
      - name: Run frozen issue 207 design under lifecycle v2
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo run --locked -q -p anthrosim-core --example household_lifecycle_sensitivity > household-lifecycle-v2.json
          python3 - <<'PY'
          import json
          p='household-lifecycle-v2.json'
          d=json.load(open(p))
          assert d['seeds'] == [20701,20702,20703,20704,20705,20706,20707,20708]
          assert d['durationYears'] == 40
          assert d['baseline']['completedRuns'] == 8
          assert d['deterministicSizeFission']['completedRuns'] == 8
          assert d['baseline']['populationExtinctRuns'] == 0
          assert d['deterministicSizeFission']['populationExtinctRuns'] == 0
          assert d['deterministicSizeFission']['lifecycleModelId'] == 'deterministic_dependency_fission_v2'
          print(json.dumps(d, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: household-lifecycle-v2
          path: household-lifecycle-v2.json
