name: Temporary AV3-003 v23 documentation convergence

on:
  push:
    branches:
      - fix/396-founder-latest-birth-consistency

permissions:
  contents: write

jobs:
  converge-current-semantics-docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/396-founder-latest-birth-consistency
      - name: Update exact living semantics labels and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('docs/scientific-model.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]
          for path in paths:
              text = path.read_text()
              old = 'current model semantics v22 (immutable v0.3.2 release baseline: v19)'
              new = 'current model semantics v23 (immutable v0.3.2 release baseline: v19)'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one current v22 label, found {text.count(old)}')
              path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/tmp-396-doc-convergence.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md .github/workflows/tmp-396-doc-convergence.yml
          git commit -m 'docs: identify current model semantics as v23'
          git push origin HEAD:fix/396-founder-latest-birth-consistency
