name: Publish clean provenance reconciliation branch

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish one-commit clean branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --binary origin/main...HEAD -- . ':(exclude).github/workflows/provenance-squash.yml' > /tmp/provenance.patch
          git checkout -B docs/history-provenance-reconcile-clean origin/main
          git apply --index /tmp/provenance.patch
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs: reconcile privacy-rewritten provenance identities'
          git push --force origin docs/history-provenance-reconcile-clean
          git push origin --delete docs/history-provenance-reconcile
