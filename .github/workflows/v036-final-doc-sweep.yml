name: v0.3.6 final documentation sweep

on:
  push:
    branches:
      - release/v0.3.6-prep
    paths:
      - .github/workflows/v036-final-doc-sweep.yml

permissions:
  contents: write

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/v0.3.6-prep
          fetch-depth: 0

      - name: Reconcile remaining living documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'README.md',
              'with supported-grid-reflection-equivariant destination realization on the v35 development line;',
              'with supported-grid-reflection-equivariant destination realization on the v0.3.6/v35 release line;'
          )
          replace_once(
              'README.md',
              'Five comprehensive audit generations have now reached discovery completion. Audit v4 fully closed 15/15 findings on the v33 repaired line; Audit v5 is the latest discovery pass, challenging immutable `v0.3.5`/v33 and currently proceeding through post-discovery remediation. This strengthens implementation/convergence evidence, but repeated audits are evidence about verification maturity rather than proof of correctness.',
              'Five comprehensive audit generations have now completed discovery. Audit v5 challenged immutable `v0.3.5`/v33, demonstrated 8 findings (4 P1 and 4 P2), and all 8 were subsequently repaired/dispositioned and closed on the v35 line with required P1 post-merge adversarial re-verification. Because Audit v5 discovered new P1 defects, it is a non-clean convergence pass; another fresh full audit of the frozen v0.3.6/v35 baseline is required before the first empirical/site-specific study. Repeated audits are evidence about verification maturity rather than proof of correctness.'
          )

          replace_once(
              'docs/research/README.md',
              '- [`general-scientific-demographic-baseline-v1.md`](general-scientific-demographic-baseline-v1.md) — current demographic-baseline/model-analysis record, including the v33 re-verification state.',
              '- [`general-scientific-demographic-baseline-v1.md`](general-scientific-demographic-baseline-v1.md) — current demographic-baseline/model-analysis record; its checked result is bound to v35 after a 780-run confirmation reproduced the scientific payload, while earlier v33 evidence remains historical.'
          )

          replace_once(
              'docs/research/trace.md',
              '| 2. Model description | Established for the living v35 framework line | ODD 2020, ODD+D and the detailed scientific specification describe current model semantics while preserving immutable v0.3.4/v25 and v0.3.3/v21 history. |',
              '| 2. Model description | Established for the living v35 framework line | ODD 2020, ODD+D and the detailed scientific specification describe current model semantics while preserving immutable v0.3.5/v33, v0.3.4/v25 and v0.3.3/v21 history. |'
          )
          replace_once(
              'docs/research/trace.md',
              '| 4. Conceptual model evaluation | Strong framework audit evidence; study-specific evaluation remains required | Scientific Audit v4 completed the fourth independent A–N audit generation against immutable v0.3.4/v25, demonstrated 15 findings, and all 15 were repaired and independently re-verified/dispositioned on the living line. Structural assumptions and empirical applicability remain study-specific. |',
              '| 4. Conceptual model evaluation | Strong framework audit evidence; study-specific evaluation remains required | Scientific Audit v5 completed the fifth independent A–N audit generation against immutable v0.3.5/v33, demonstrated 8 findings (4 P1, 4 P2), and all 8 were repaired/dispositioned with independent post-merge re-verification for every P1. Because new P1 defects were found, the pass is non-clean and another fresh full audit is required before the first empirical/site-specific study. |'
          )
          replace_once(
              'docs/research/trace.md',
              '| 5. Implementation verification | Strong framework-level convergence; never proof of correctness | Four comprehensive audit generations have now been completed. Audit v4 closed 15/15 demonstrated findings after protected production repair and independent post-merge/current-state evidence, leaving no open Audit-v4 finding on the repaired v33 line. |',
              '| 5. Implementation verification | Strong framework-level verification; convergence gate not yet satisfied | Five comprehensive audit generations have completed discovery. Audit v5 closed 8/8 demonstrated findings after protected production repair and required P1 post-merge adversarial re-verification, producing the v35 line; because the pass discovered four P1 defects, a fresh full audit of v0.3.6/v35 is still required before the first empirical/site-specific study. |'
          )
          replace_once(
              'docs/research/trace.md',
              '**Established for description of the living current model semantics v35 line**, subject to normal documentation/code consistency review. The immutable `v0.3.4` release baseline remains v25 and immutable `v0.3.3` remains v21; living documentation does not retroactively redefine those releases.',
              '**Established for description of the living current model semantics v35 line**, subject to normal documentation/code consistency review. The immutable `v0.3.5` release baseline remains v33, immutable `v0.3.4` remains v25 and immutable `v0.3.3` remains v21; living documentation does not retroactively redefine those releases.'
          )
          replace_once(
              'docs/research/trace.md',
              "The repository's adversarial scientific audits provide issue-level evidence that conceptual/causal semantics are actively challenged rather than accepted because code runs reproducibly. Scientific Audit v4 is the latest comprehensive framework audit: it restarted A–N coverage from zero against immutable v0.3.4/v25, demonstrated 13 P1 and 2 P2 findings, and the subsequent remediation programme repaired and independently re-verified/dispositioned all 15 on the living line. Authoritative semantic repairs advanced the living identity through v26–v33 where required.\n\nAudit-v4 repairs covered arbitrary label/order coupling in fertility, background mortality, M4 migration scheduling, newborn sex, parentage, condition-mediated mortality, M9 equal-cost destinations, scarce-resource remainder assignment and M4 spatial candidate choice, plus statistical/provenance/finalization/documentation defects. The current Audit-v4 closure record is [`audit-v4/STATUS.md`](audit-v4/STATUS.md).",
              "The repository's adversarial scientific audits provide issue-level evidence that conceptual/causal semantics are actively challenged rather than accepted because code runs reproducibly. Scientific Audit v5 is the latest completed comprehensive framework audit: it restarted A–N coverage from zero against immutable v0.3.5/v33, demonstrated 4 P1 and 4 P2 findings, and the subsequent remediation programme repaired/dispositioned all 8 with independent post-merge adversarial re-verification for every P1. Authoritative M9 coupling repairs advanced the living identity through v34 to v35 where required.\n\nAudit-v5 findings covered M9 household-local and spatially equivariant stochastic coupling, parentage-relatedness scope, spatial history replay seed identity, small-n statistical validity, held-out discrimination tolerance, exact numeric-coordinate fidelity and survivor-window alignment. The final Audit-v5 closure record is [`audit-v5/STATUS.md`](audit-v5/STATUS.md); Audit-v4 remains preserved historical convergence evidence in [`audit-v4/STATUS.md`](audit-v4/STATUS.md)."
          )
          replace_once(
              'docs/research/trace.md',
              '**Current assessment:** Framework-level conceptual audit evidence is strong for the repaired v33 line. There are no open Audit-v4 findings, but empirical inferential work still requires question-specific evidence, calibration/validation, uncertainty, applicability and corroboration gates.',
              '**Current assessment:** Framework-level conceptual audit evidence is strong for the repaired v35 line and there are no open Audit-v5 findings. Audit v5 was nevertheless a non-clean convergence pass because it discovered four P1 defects, so another fresh full audit of frozen v0.3.6/v35 is required before the first empirical/site-specific study. Question-specific evidence, calibration/validation, uncertainty, applicability and corroboration remain separate requirements even after that convergence gate is satisfied.'
          )

          # Strengthen the permanent current-status guard against these exact stale states.
          guard = Path('scripts/test-current-model-semantics-docs.py')
          text = guard.read_text(encoding='utf-8')
          anchor = '            "#629 remains open until",\n'
          addition = (
              '            "#629 remains open until",\n'
              '            "currently proceeding through post-discovery remediation",\n'
              '            "Scientific Audit v4 is the latest comprehensive framework audit",\n'
              '            "Four comprehensive audit generations have now been completed",\n'
              '            "Framework-level conceptual audit evidence is strong for the repaired v33 line",\n'
          )
          if text.count(anchor) != 1:
              raise SystemExit('documentation stale-status guard anchor is not unique')
          guard.write_text(text.replace(anchor, addition, 1), encoding='utf-8')
          PY

          python3 scripts/test-current-model-semantics-docs.py
          python3 -m py_compile scripts/test-current-model-semantics-docs.py

          python3 - <<'PY'
          from pathlib import Path
          readme = Path('README.md').read_text(encoding='utf-8')
          trace = Path('docs/research/trace.md').read_text(encoding='utf-8')
          research = Path('docs/research/README.md').read_text(encoding='utf-8')
          assert 'currently proceeding through post-discovery remediation' not in readme
          assert 'Scientific Audit v4 is the latest comprehensive framework audit' not in trace
          assert 'Four comprehensive audit generations have now been completed' not in trace
          assert 'repaired v33 line. There are no open Audit-v4 findings' not in trace
          assert 'including the v33 re-verification state' not in research
          assert 'fresh full audit of frozen v0.3.6/v35' in trace
          print('final v0.3.6 living-document sweep passed')
          PY

      - name: Commit final documentation sweep
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add README.md docs/research/README.md docs/research/trace.md scripts/test-current-model-semantics-docs.py
          git commit -m 'docs: finish v0.3.6 convergence sweep'
          git push origin HEAD:release/v0.3.6-prep
