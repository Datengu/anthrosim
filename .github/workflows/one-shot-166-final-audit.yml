name: One-shot audit 166 fix

on:
  push:
    branches: [audit/166-final-m9-explorer-semantics]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: true

      - name: Apply exact final-audit fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          def replace_count(path, old, new, expected):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f"{path}: expected {expected} matches, found {count}: {old!r}")
              p.write_text(text.replace(old, new))

          # Pure event-to-inspector routing seam and explicit persistent-residence replay semantics.
          replace_once(
              "explorer/model.mjs",
              '''function exactJsonEqual(left, right) {
            return JSON.stringify(left) === JSON.stringify(right);
          }

          function terminalSnapshot(metrics, endTime) {''',
              '''function exactJsonEqual(left, right) {
            return JSON.stringify(left) === JSON.stringify(right);
          }

          export function inspectionTargetForEvent(event) {
            if (!event || typeof event !== "object") return null;
            if (Object.hasOwn(event, "person") && event.person !== null && event.person !== undefined) {
              return { kind: "person", id: asNumber(event.person, "event person") };
            }
            if (Object.hasOwn(event, "household") && event.household !== null && event.household !== undefined) {
              return { kind: "household", id: asNumber(event.household, "event household") };
            }
            return null;
          }

          function terminalSnapshot(metrics, endTime) {''',
          )
          replace_once(
              "explorer/model.mjs",
              '''export function reconstructState(bundle, day) {
            const endTime = runEndTime(bundle);''',
              '''// Reconstruct persistent residence only. M9 temporary visitor/transit presence is represented
          // separately by temporary-observability.json and must not be invented as ordinary cell occupancy.
          export function reconstructState(bundle, day) {
            const endTime = runEndTime(bundle);''',
          )
          replace_once(
              "explorer/model.mjs",
              '''      const touchesCell = Number(event.cell) === cellId || Number(event.origin) === cellId || Number(event.destination) === cellId;''',
              '''      const touchesCell = Number(event.cell) === cellId ||
                Number(event.origin) === cellId ||
                Number(event.destination) === cellId ||
                Number(event.residence) === cellId;''',
          )

          # Use the pure routing helper in the browser, and make the residence/presence boundary visible.
          replace_once(
              "explorer/app.mjs",
              '''  genealogyForPerson,
            mapValues,''',
              '''  genealogyForPerson,
            inspectionTargetForEvent,
            mapValues,''',
          )
          replace_once(
              "explorer/app.mjs",
              '''    return `Reconstructed display from founder locations plus authoritative events through day ${selectedDay}.`;''',
              '''    return `Reconstructed persistent-residence display from founder residences plus authoritative birth/death/permanent-migration events through day ${selectedDay}. Temporary visitors and transit are excluded; use the M9 temporary-presence panel for physical presence.`;''',
          )
          replace_count(
              "explorer/app.mjs",
              '''["Occupied cells",''',
              '''["Residence-occupied cells",''',
              2,
          )
          replace_once(
              "explorer/app.mjs",
              '''  addDefinition(dl, "Living population", summary.livingPopulation);''',
              '''  addDefinition(dl, "Living persistent residents", summary.livingPopulation);''',
          )
          replace_once(
              "explorer/app.mjs",
              '''  addDefinition(dl, "Reconstructed location", reconstructed.householdLocations.get(id) ?? "—");''',
              '''  addDefinition(dl, "Persistent residence cell", reconstructed.householdLocations.get(id) ?? "—");''',
          )
          replace_once(
              "explorer/app.mjs",
              '''  addDefinition(dl, "Reconstructed cell", person.location);''',
              '''  addDefinition(dl, "Persistent residence cell", person.location);''',
          )
          replace_once(
              "explorer/app.mjs",
              '''  if (event.type === "birth") return `birth · person ${event.person} · household ${event.household} · cell ${event.cell}`;
            if (event.type === "death") return `death · person ${event.person} · ${event.cause} · cell ${event.cell}`;''',
              '''  if (event.type === "birth") return `birth · person ${event.person} · household ${event.household} · residence cell ${event.cell}`;
            if (event.type === "death") return `death · person ${event.person} · ${event.cause} · residence cell ${event.cell}`;''',
          )
          replace_once(
              "explorer/app.mjs",
              '''    button.addEventListener("click", () => {
                const event = record.event;
                if (event.type === "householdMigration") inspect("household", event.household);
                else inspect("person", event.person);
                showRawEvent(record);
              });''',
              '''    button.addEventListener("click", () => {
                const target = inspectionTargetForEvent(record.event);
                if (target) inspect(target.kind, target.id);
                showRawEvent(record);
              });''',
          )
          replace_once(
              "explorer/index.html",
              '''            <option value="population">Living population</option>''',
              '''            <option value="population">Living persistent residents</option>''',
          )

          # Regression checks run in the existing Explorer validation path.
          replace_once(
              "scripts/validate-explorer-bundle.mjs",
              '''import { parseLosslessJson, reconstructState, validateBundle } from "../explorer/model.mjs";''',
              '''import {
            eventsForEntity,
            inspectionTargetForEvent,
            parseLosslessJson,
            reconstructState,
            validateBundle,
          } from "../explorer/model.mjs";''',
          )
          replace_once(
              "scripts/validate-explorer-bundle.mjs",
              '''function fail(message) {
            throw new Error(message);
          }

          async function readArtifact''',
              '''function fail(message) {
            throw new Error(message);
          }

          function validateEventInspectionSemantics() {
            const birthTarget = inspectionTargetForEvent({ type: "birth", person: 17, household: 4 });
            if (birthTarget?.kind !== "person" || birthTarget.id !== 17) {
              fail("birth event does not route to its person inspector");
            }

            const migrationTarget = inspectionTargetForEvent({ type: "householdMigration", household: 4 });
            if (migrationTarget?.kind !== "household" || migrationTarget.id !== 4) {
              fail("permanent migration event does not route to its household inspector");
            }

            const temporaryTarget = inspectionTargetForEvent({ type: "temporaryJourneyDeparted", household: 9 });
            if (temporaryTarget?.kind !== "household" || temporaryTarget.id !== 9) {
              fail("temporary-mobility event does not route to its household inspector");
            }

            if (inspectionTargetForEvent({ type: "unknown" }) !== null) {
              fail("entity-free event unexpectedly produced an inspector target");
            }

            const residenceFixture = {
              events: {
                events: [
                  { event: { type: "temporaryJourneyCompleted", household: 9, residence: 23 } },
                ],
              },
            };
            if (eventsForEntity(residenceFixture, { cell: 23 }).length !== 1) {
              fail("M9 residence cell is not included in Explorer cell-event filtering");
            }
          }

          async function readArtifact''',
          )
          replace_once(
              "scripts/validate-explorer-bundle.mjs",
              '''async function main() {
            const runDir = resolve(process.argv[2] ?? "");''',
              '''async function main() {
            validateEventInspectionSemantics();
            const runDir = resolve(process.argv[2] ?? "");''',
          )

          # Core public/source documentation must call packed locations what they are under M9.
          replace_once(
              "crates/anthrosim-core/src/demography.rs",
              '''/// mortality draw until a later annual boundary. M2 father selection is local
          /// to the mother's current cell and uniform among eligible living male records;
          /// it does not model marriage, pair bonds, kin avoidance, or social paternity.''',
              '''/// mortality draw until a later annual boundary. M2 father selection is local
          /// to the mother's persistent residence cell and uniform among eligible living male records;
          /// M9 temporary visitor co-presence does not change parent eligibility. It does not model
          /// marriage, pair bonds, kin avoidance, or social paternity.''',
          )
          replace_once(
              "crates/anthrosim-core/src/population.rs",
              '''    pub reproductive_sex: ReproductiveSex,
            pub location: CellId,
            pub household: HouseholdId,''',
              '''    pub reproductive_sex: ReproductiveSex,
            /// Persistent residence cell. M9 temporary physical presence is stored separately.
            pub location: CellId,
            pub household: HouseholdId,''',
          )
          replace_once(
              "crates/anthrosim-core/src/population.rs",
              '''    pub household_count: u64,
            pub living_occupied_cell_count: u64,
            pub mean_living_condition_permille: u16,''',
              '''    pub household_count: u64,
            /// Number of cells containing at least one living persistent resident.
            /// M9 temporary visitors/transit are intentionally excluded.
            pub living_occupied_cell_count: u64,
            pub mean_living_condition_permille: u16,''',
          )
          replace_once(
              "crates/anthrosim-core/src/population.rs",
              '''/// Compact cell-to-person index rebuilt from authoritative person locations.
          ///
          /// It indexes persistent person records, including the dead. Consumers that
          /// need current interaction candidates must additionally filter for alive state.''',
              '''/// Compact persistent-residence cell-to-person index rebuilt from authoritative person locations.
          ///
          /// It indexes persistent person records, including the dead. Consumers that need M2/M4
          /// residence-based interaction candidates must additionally filter for alive state. M9
          /// temporary visitor/transit presence is authoritative elsewhere and is not indexed here.''',
          )
          replace_once(
              "crates/anthrosim-core/src/events.rs",
              '''        household: HouseholdId,
                cell: CellId,
                reproductive_sex: ReproductiveSex,''',
              '''        household: HouseholdId,
                /// Persistent residence cell inherited from the household at birth.
                cell: CellId,
                reproductive_sex: ReproductiveSex,''',
          )
          PY

      - name: Remove one-shot workflow and commit final diff
        run: |
          git config user.name "Jack"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git rm .github/workflows/one-shot-166-final-audit.yml
          git add explorer/model.mjs explorer/app.mjs explorer/index.html scripts/validate-explorer-bundle.mjs crates/anthrosim-core/src/demography.rs crates/anthrosim-core/src/population.rs crates/anthrosim-core/src/events.rs
          git diff --cached --check
          git commit -m "Fix final M9 Explorer residence semantics"
          git push origin HEAD:audit/166-final-m9-explorer-semantics
