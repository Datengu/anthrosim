    overlapping = dict(plan)
    overlapping["design"] = {
        "mode": "fixed",
        "groupSeedBatches": [[left_seeds], [list(range(20, 40))]],
    }
    overlapping["planIdentity"] = mc.plan_identity(overlapping)
