name: Synchronize AV6-005 v41 living documentation

on:
  push:
    branches:
      - audit/repair-708-av6-005

permissions:
  contents: write

jobs:
  synchronize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/repair-708-av6-005
          fetch-depth: 0

      - name: Verify repair ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "63e1e98b91a708ea7bb6c57c91f94b1c5565c424"
          grep -q 'anthrosim-model-semantics-v41' crates/anthrosim-core/src/provenance.rs
          grep -q 'fn duration_rounding_tie_visiting_wins(period_sequence: u64)' crates/anthrosim-core/src/resources.rs

      - name: Synchronize living documentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          current_docs = [
              'README.md',
              'docs/architecture.md',
              'docs/roadmap.md',
              'docs/scientific-model.md',
              'docs/research/README.md',
              'docs/research/trace.md',
              'docs/research/odd.md',
              'docs/research/odd-d.md',
          ]
          for name in current_docs:
              path = Path(name)
              text = path.read_text()
              marker = 'current model semantics v40'
              if marker not in text:
                  raise SystemExit(f'{name}: expected v40 current marker missing')
              path.write_text(text.replace(marker, 'current model semantics v41'))

          path = Path('docs/release-versioning.md')
          text = path.read_text()
          old = 'AV6-003/#699 extends dependency-aware household-fission relationship refinement to living external-parent persistent-residence context and advances the active repair branch to **`anthrosim-model-semantics-v40`**.'
          new = 'AV6-003/#699 extended dependency-aware household-fission relationship refinement to living external-parent persistent-residence context and advanced protected `main` to `anthrosim-model-semantics-v40`; AV6-005/#708 removes canonical household identity from the M9.5 exact duration-weighted home/visitor tie phase and advances the active repair branch to **`anthrosim-model-semantics-v41`**.'
          if old not in text:
              raise SystemExit('release-versioning v40 marker missing')
          path.write_text(text.replace(old, new, 1))

          path = Path('docs/research/m9-duration-aware-resource-semantics-v1.md')
          text = path.read_text()
          old = """Any remaining unit caused by integer division is assigned by descending fractional remainder. When the two fractional remainders are exactly equal, neither semantic side receives permanent priority. The tie is resolved by a deterministic balanced binary rotation keyed only by the household's stable zero-based index and the already-authoritative resource-period sequence. The period phase uses parity of the set bits in the zero-based sequence (the Thue-Morse binary parity sequence); the household key only complements that phase. This makes consecutive power-of-two blocks exactly balanced and avoids the seasonal aliasing that a simple odd/even period rule can create, while retaining bit-for-bit replay without introducing a new RNG stream or mutable rounding carry.

The tie policy is deliberately semantic-side symmetric: relabelling which equal-duration claim is called home versus visitor reverses the awarded side rather than preserving a home preference. Household identity selects only the phase of the balanced rotation, not a rank or a long-run advantage. Every period still conserves `N` exactly."""
          new = """Any remaining unit caused by integer division is assigned by descending fractional remainder. When the two fractional remainders are exactly equal, neither semantic side receives permanent priority. From model semantics v41, the tie is resolved by a deterministic balanced binary rotation keyed **only** by the already-authoritative resource-period sequence. The phase uses parity of the set bits in the zero-based sequence (the Thue-Morse binary parity sequence). This makes consecutive power-of-two blocks exactly balanced and avoids the seasonal aliasing that a simple odd/even period rule can create, while retaining bit-for-bit replay without introducing a new RNG stream or mutable rounding carry.

The tie policy is a numerical apportionment null rule. Canonical `HouseholdId`, packed/storage index, `PersonId` and global stochastic-coupling ordinal are excluded: scientifically equivalent households at the same resource period therefore receive the same semantic-side phase instead of bookkeeping identity deciding which physical cell receives an indivisible unit. This is not an ethnographic home/visitor priority claim. Every period still conserves `N` exactly."""
          if old not in text:
              raise SystemExit('M9.5 exact-tie paragraph missing')
          text = text.replace(old, new, 1)

          old = 'The exact-tie rounding rule adds no new mutable carry and consumes no RNG. Its complete continuation key is the stable household index plus `ResourceSystem.periods_processed`, both of which are already preserved by checkpoint state and continuation identity. A checkpoint/resumed run therefore reconstructs the same next tie side without a new checkpoint field or schema change.'
          new = 'The exact-tie rounding rule adds no new mutable carry and consumes no RNG. From model semantics v41 its complete continuation key is only `ResourceSystem.periods_processed`, which is already preserved by checkpoint state and continuation identity. A checkpoint/resumed run therefore reconstructs the same next tie side without a household-identity phase, new checkpoint field or schema change.'
          if old not in text:
              raise SystemExit('M9.5 checkpoint paragraph missing')
          text = text.replace(old, new, 1)

          old = 'M9.5 originally changed authoritative resource attribution at model-semantics v5. The post-M9 scientific audit in issue #194 changes the exact-tie allocation meaning again, removing the persistent home preference and advancing `MODEL_SEMANTICS_ID` to `anthrosim-model-semantics-v19`. The package version remains unchanged.'
          new = 'M9.5 originally changed authoritative resource attribution at model-semantics v5. The post-M9 scientific audit in issue #194 changed the exact-tie allocation meaning again, removing the persistent home preference and advancing `MODEL_SEMANTICS_ID` to `anthrosim-model-semantics-v19`. Audit-v6 AV6-005/#708 then demonstrated that the v19 balanced phase still let canonical household identity choose the physical demand side at a fixed period; v41 removes that identity term while retaining the period-balanced null rule. A v40 checkpoint must not continue under v41 while silently changing a future exact-tie home/visitor attribution. The package version remains unchanged.'
          if old not in text:
              raise SystemExit('M9.5 semantics-history paragraph missing')
          text = text.replace(old, new, 1)

          old = '- repeated same-season ties at power-of-two resource-period cadence, guarding against simple parity aliasing;'
          new = old + '\n- pure canonical-household relabelling invariance for exact home/visitor ties;'
          if old not in text:
              raise SystemExit('M9.5 acceptance marker missing')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify synchronized docs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/test-current-model-semantics-docs.py
          grep -q 'anthrosim-model-semantics-v41' docs/release-versioning.md
          grep -q 'pure canonical-household relabelling invariance' docs/research/m9-duration-aware-resource-semantics-v1.md
          git diff --check

      - name: Commit and remove helper
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/apply-av6-005-v41-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'docs: synchronize living model semantics v41'
          git push origin HEAD:audit/repair-708-av6-005
