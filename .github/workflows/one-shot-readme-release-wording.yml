name: One-shot README release wording cleanup

on:
  push:
    branches:
      - docs/fix-v0.3-scientific-status
    paths:
      - .github/workflows/one-shot-readme-release-wording.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: docs/fix-v0.3-scientific-status
          fetch-depth: 0

      - name: Correct stale release wording and self-delete
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          old = (
              "Released v0.2.0 demonstrates that the deterministic experiment engine can bind "
              "provenance-tracked real-world-derived spatial evidence, transform it through declared "
              "assumptions and analyse residence-based spatial outcomes reproducibly. Unreleased M9 "
              "demonstrates a separate software/model capability: persistent residence and temporary "
              "physical presence can generate distinguishable aggregation histories while preserving "
              "deterministic replay, checkpoint/resume and explicit resource accounting."
          )
          new = (
              "Released v0.2.0 demonstrated that the deterministic experiment engine can bind "
              "provenance-tracked real-world-derived spatial evidence, transform it through declared "
              "assumptions and analyse residence-based spatial outcomes reproducibly. Released v0.3.0 "
              "preserves that spatial path and adds a separate software/model capability: persistent "
              "residence and temporary physical presence can generate distinguishable aggregation "
              "histories while preserving deterministic replay, checkpoint/resume and explicit "
              "resource accounting."
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f"expected exactly one stale release paragraph, found {count}")
          path.write_text(text.replace(old, new), encoding="utf-8")
          PY

          git rm .github/workflows/one-shot-readme-release-wording.yml
          git config user.name "Jack"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add README.md
          git diff --cached --check
          git commit -m "Docs: correct v0.3.0 scientific-status wording"
          git push origin HEAD:docs/fix-v0.3-scientific-status
