name: Cross-platform determinism

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify cross-platform determinism
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate and classify pull-request risk
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/classify-applicable-pr-gates.py
          python3 scripts/classify-applicable-pr-gates.py --self-test

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "change_class=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.changed_files'
          )"
          test "$expected_count" -gt 0

          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > changed-file-pages.json

          actual_count="$(jq '[.[][]] | length' changed-file-pages.json)"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "GitHub changed-file listing is incomplete: expected ${expected_count} file object(s), retrieved ${actual_count}; refusing CI classification" >&2
            exit 1
          fi

          jq -r '.[][] | .filename, (.previous_filename // empty)' \
            changed-file-pages.json > changed-files.txt
          test -s changed-files.txt
          LC_ALL=C sort -u changed-files.txt -o changed-files.txt

          python3 scripts/classify-applicable-pr-gates.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  golden-run:
    name: Golden run (${{ matrix.os }})
    needs: classify
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        shell: bash
        run: echo "Cross-platform executable determinism is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Run deterministic golden fixture
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        env:
          ANTHROSIM_CROSS_PLATFORM_GOLDEN: ${{ github.workspace }}/cross-platform-golden.json
        run: cargo test --locked -p anthrosim-core --test cross_platform_golden -- --nocapture

      - name: Run enabled-M9 deterministic golden fixture
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        env:
          ANTHROSIM_M9_CROSS_PLATFORM_GOLDEN: ${{ github.workspace }}/m9-cross-platform-golden.json
        run: cargo test --locked -p anthrosim-core --test m9_cross_platform_golden -- --nocapture

      - name: Upload normalized scientific outputs
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-platform-golden-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 7
          path: |
            ${{ github.workspace }}/cross-platform-golden.json
            ${{ github.workspace }}/m9-cross-platform-golden.json

  compare-golden-runs:
    name: Compare cross-platform golden runs
    needs: [classify, golden-run]
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "Cross-platform executable comparison is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Download platform outputs
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: golden-artifacts
          pattern: cross-platform-golden-*

      - name: Require byte-identical authoritative outputs
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import difflib
          import sys

          for filename in ('cross-platform-golden.json', 'm9-cross-platform-golden.json'):
              files = sorted(Path('golden-artifacts').glob(f'*/{filename}'))
              if len(files) != 3:
                  raise SystemExit(f'expected three platform files for {filename}, found {len(files)}: {files}')

              reference = files[0]
              reference_bytes = reference.read_bytes()
              for candidate in files[1:]:
                  candidate_bytes = candidate.read_bytes()
                  if candidate_bytes == reference_bytes:
                      continue
                  before = reference.read_text().splitlines(keepends=True)
                  after = candidate.read_text().splitlines(keepends=True)
                  sys.stdout.writelines(difflib.unified_diff(
                      before,
                      after,
                      fromfile=str(reference),
                      tofile=str(candidate),
                  ))
                  raise SystemExit(
                      f'cross-platform deterministic output differs for {filename}: {reference} != {candidate}'
                  )

          print('Core and enabled-M9 golden outputs are byte-identical on all three runners.')
          PY