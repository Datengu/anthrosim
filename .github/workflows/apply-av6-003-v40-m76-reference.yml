name: Apply AV6-003 v40 M7.6 reference

on:
  push:
    branches:
      - audit/repair-699-av6-003
    paths:
      - .github/workflows/apply-av6-003-v40-m76-reference.yml

permissions:
  actions: read
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-699-av6-003

      - name: Download exact final-head M7.6 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m7-6-resource-variability-derived
          path: /tmp/m76
          github-token: ${{ github.token }}
          repository: Datengu/anthrosim
          run-id: 34616369099

      - name: Prove numerical equivalence and rebind provenance only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/m76')
          reference_path = Path('experiments/v0.1-resource-variability-reference.json')
          reference = json.loads(reference_path.read_text())
          original_points = reference['pointResults']
          points = json.loads((root / 'analysis/points.json').read_text())
          summary = json.loads((root / 'analysis/summary.json').read_text())
          manifest = json.loads((root / 'sweep-manifest.json').read_text())
          record = json.loads((root / 'reproduction-record.json').read_text())

          assert len(points) == 18
          assert summary['completedRuns'] == 144
          assert summary['scientificallyEligibleRuns'] == 144
          assert summary['operationallyCensoredRuns'] == 0
          assert record['definitionSha256'] == reference['definitionSha256']
          assert record['sweepId'] == manifest['sweepId']

          observed = []
          for row in points:
              observed.append({
                  'pointId': row['pointId'],
                  'resourceProductivityScalePermille': row['resourceProductivityScalePermille'],
                  'resourceSeasonalityScalePermille': row['resourceSeasonalityScalePermille'],
                  'migrationEnabled': not row['disableMigration'],
                  'durationReachedRuns': row['durationReachedRuns'],
                  'populationExtinctRuns': row['populationExtinctRuns'],
                  'meanFinalLivingPopulationCompletedOnly': row['meanFinalLivingPopulationScientificallyEligibleOnly'],
                  'meanFinalLivingOccupiedCellCountCompletedOnly': row['meanFinalLivingOccupiedCellCountScientificallyEligibleOnly'],
                  'meanLivingConditionPermilleCompletedOnly': row['meanLivingConditionPermilleScientificallyEligibleOnly'],
                  'meanConditionMortalityDeathsCompletedOnly': row['meanConditionMortalityDeathsScientificallyEligibleOnly'],
                  'meanResourceUnmetNeedCompletedOnly': row['meanResourceUnmetNeedScientificallyEligibleOnly'],
                  'meanMigrationMovesCompletedOnly': row['meanMigrationMovesScientificallyEligibleOnly'],
                  'meanMigrationTotalDistanceCellsCompletedOnly': row['meanMigrationTotalDistanceCellsScientificallyEligibleOnly'],
                  'pooledMeanMigrationDistanceCellsPerMoveCompletedOnly': row['pooledMeanMigrationDistanceCellsPerMoveScientificallyEligibleOnly'],
              })

          assert observed == original_points, 'v40 M7.6 point results differ numerically from checked v39 reference'

          reference['modelSemanticsId'] = 'anthrosim-model-semantics-v40'
          reference['referenceCiRunId'] = 34616369099
          reference['referenceTestMergeCommit'] = 'aef1f212ac10886bdc0778b27ba5eea5982b8217'
          reference['referenceHeadCommit'] = '79997b03705d5776fc7adbde300993fc1ec71b2f'
          reference['referenceSweepId'] = manifest['sweepId']
          reference['referenceTestMergeCommitStatus'] = 'pre-merge-v40-reverification-artifact'
          addition = (
              ' Audit-v6 AV6-003/#699 changes dependency-aware household-fission relationship refinement so living direct parents outside the source household are distinguished by persistent residence-cell context before final PersonId tie-breaking. Because M7.6 includes live demography and household dynamics, final-head CI run 34616369099 reran all 18 parameter points and 144/144 declared simulations under living v40 rather than assuming causal inapplicability. Every run completed, remained scientifically eligible, and all 18 numerical pointResults reproduced the checked v39 snapshot exactly. The derived artifact is 10271418177 (SHA-256 04615ae21dd2bd78c4c38c24f2fb78984012fe2da1e9de921a9a401ba30319c4), built from PR merge ref aef1f212ac10886bdc0778b27ba5eea5982b8217 for branch head 79997b03705d5776fc7adbde300993fc1ec71b2f. Accordingly this is a provenance-only v40 rebind: the frozen design, eligibility/accounting guards, completion/extinction classifications and every numerical endpoint remain unchanged.'
          )
          assert addition.strip() not in reference['note']
          reference['note'] += addition
          assert reference['pointResults'] == original_points
          reference_path.write_text(json.dumps(reference, separators=(',', ':')) + '\n')
          print('Verified exact 18/18 M7.6 numerical equivalence; prepared provenance-only v40 rebind.')
          PY
          git diff --check

      - name: Commit provenance-only v40 rebind and remove helper
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/apply-av6-003-v40-m76-reference.yml
          git add experiments/v0.1-resource-variability-reference.json
          git diff --cached --check
          git commit -m 'research: rebind M7.6 reference on v40'
          git push origin HEAD:audit/repair-699-av6-003
