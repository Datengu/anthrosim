name: M4 rustfmt bootstrap

on:
  push:
    branches: [feat/m4-migration]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: feat/m4-migration
          persist-credentials: true
      - name: Install pinned Rust formatter
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Format
        run: cargo fmt --all
      - name: Commit formatting
        run: |
          if git diff --quiet; then
            echo "Already formatted"
            exit 0
          fi
          git config user.name "AnthroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "M4: apply rustfmt"
          git push origin HEAD:feat/m4-migration
