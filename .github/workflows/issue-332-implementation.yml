name: Issue 332 implementation
on:
  push:
    branches:
      - fix/332-year-zero-checkpoint-metrics
jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/332-year-zero-checkpoint-metrics
      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/issue-332.py
          python3 .github/scripts/issue-332-clippy-fix.py
          python3 docs/research/audit-v2/area-g-year0-checkpoint-observability-audit.py
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo test -p anthrosim-core --test checkpoint_persistence year_zero -- --nocapture
          cargo test -p anthrosim-core --test spatial_simulation transformed_year_zero -- --nocapture
          cargo test -p anthrosim-core --test checkpoint_persistence legacy_nonterminal_year_zero -- --nocapture
          cargo test -p anthrosim-core --test spatial_simulation transformed_resume_rejects_legacy_nonterminal_year_zero -- --nocapture
          cargo test -p anthrosim-core --test history_metric_invariants -- --nocapture
          cargo test -p anthrosim-core --test checkpoint_persistence json_round_trip_checkpoint_resumes_to_identical_authoritative_final_state -- --nocapture
          cargo test -p anthrosim-core --test spatial_simulation transformed_checkpoint_resume_matches_uninterrupted -- --nocapture
          python3 scripts/test-research-long-run-diagnostics.py
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/simulation.rs crates/anthrosim-core/src/spatial_simulation.rs crates/anthrosim-core/src/invariants.rs crates/anthrosim-core/tests/checkpoint_persistence.rs crates/anthrosim-core/tests/spatial_simulation.rs docs/research/audit-v2/area-g-2026-08-29.md docs/research/audit-v2/area-g-year0-checkpoint-observability-audit.py
          git commit -m 'fix: preserve year-zero checkpoint metric history (#332)'
          git push origin HEAD:fix/332-year-zero-checkpoint-metrics