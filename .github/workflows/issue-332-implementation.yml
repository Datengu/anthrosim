name: Issue 332 implementation
on:
  push:
    branches:
      - fix/332-year-zero-checkpoint-metrics
jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/332-year-zero-checkpoint-metrics
      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          # Plain simulation: checkpoint serialization must not manufacture observations.
          p = Path('crates/anthrosim-core/src/simulation.rs')
          s = p.read_text()
          old = '''        self.ensure_terminal_metric_snapshot();
                  self.validate_state()?;
                  Ok(self.into_checkpoint())
              }

              fn advance_to_year'''
          if old not in s:
              old = '''        self.ensure_terminal_metric_snapshot();
                  self.validate_state()?;
                  Ok(self.into_checkpoint())
              }

              fn advance_to_year'''
          # Work with exact source indentation after dedent-independent normalization below.
          exact = "        self.ensure_terminal_metric_snapshot();\n        self.validate_state()?;\n        Ok(self.into_checkpoint())\n    }\n\n    fn advance_to_year"
          assert exact in s
          s = s.replace(exact, "        self.validate_state()?;\n        Ok(self.into_checkpoint())\n    }\n\n    fn advance_to_year", 1)

          marker = '''        validate_terminal_checkpoint_state(&checkpoint)?;

                  let boundary_day = checkpoint.time.days();'''
          if marker not in s:
