name: Audit v4 Area E M9 route reflection

on:
  pull_request:
    paths:
      - 'crates/anthrosim-core/tests/audit_v4_m9_route_reflection.rs'
      - '.github/workflows/audit-v4-area-e-m9-route-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m9-route-reflection:
    name: M9 route-reflection adversary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 M9 route-reflection adversary
        run: cargo test --locked -p anthrosim-core --test audit_v4_m9_route_reflection -- --nocapture
