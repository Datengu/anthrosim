name: Landscape preprocessing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    uses: ./.github/workflows/pr-ci-scope.yml
    permissions:
      contents: read
      pull-requests: read

  validate:
    name: M8.2 preprocessing validation
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.scope.outputs.full_required != 'true' }}
        run: echo "${{ needs.scope.outputs.scope }} change; landscape preprocessing is not applicable."

      - name: Checkout
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Python version
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: python3 --version

      - name: Validate Python source
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          python3 -m py_compile scripts/build-landscape-bundle.py
          python3 -m py_compile scripts/test-landscape-preprocess.py

      - name: Test preprocessing contract
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: python3 scripts/test-landscape-preprocess.py

      - name: Reproduce generic fixture twice
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          rm -rf /tmp/anthrosim-landscape-a /tmp/anthrosim-landscape-b
          mkdir -p /tmp/anthrosim-landscape-a /tmp/anthrosim-landscape-b
          python3 scripts/build-landscape-bundle.py \
            examples/landscape-preprocess/recipe.json \
            --output /tmp/anthrosim-landscape-a/landscape.json \
            --record /tmp/anthrosim-landscape-a/record.json
          python3 scripts/build-landscape-bundle.py \
            examples/landscape-preprocess/recipe.json \
            --output /tmp/anthrosim-landscape-b/landscape.json \
            --record /tmp/anthrosim-landscape-b/record.json
          cmp /tmp/anthrosim-landscape-a/landscape.json /tmp/anthrosim-landscape-b/landscape.json
          cmp /tmp/anthrosim-landscape-a/record.json /tmp/anthrosim-landscape-b/record.json
