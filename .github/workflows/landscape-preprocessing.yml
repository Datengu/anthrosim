name: Landscape preprocessing

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify landscape preprocessing
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate and classify pull-request risk
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/classify-applicable-pr-gates.py
          python3 scripts/classify-applicable-pr-gates.py --self-test

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "change_class=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.changed_files'
          )"
          test "$expected_count" -gt 0

          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > changed-file-pages.json

          actual_count="$(jq '[.[][]] | length' changed-file-pages.json)"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "GitHub changed-file listing is incomplete: expected ${expected_count} file object(s), retrieved ${actual_count}; refusing CI classification" >&2
            exit 1
          fi

          jq -r '.[][] | .filename, (.previous_filename // empty)' \
            changed-file-pages.json > changed-files.txt
          test -s changed-files.txt
          LC_ALL=C sort -u changed-files.txt -o changed-files.txt

          python3 scripts/classify-applicable-pr-gates.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  validate:
    name: M8.2 preprocessing validation
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "Landscape preprocessing execution is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Python version
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: python3 --version

      - name: Validate Python source
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          python3 -m py_compile scripts/build-landscape-bundle.py
          python3 -m py_compile scripts/test-landscape-preprocess.py

      - name: Test preprocessing contract
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: python3 scripts/test-landscape-preprocess.py

      - name: Reproduce generic fixture twice
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rm -rf /tmp/anthrosim-landscape-a /tmp/anthrosim-landscape-b
          mkdir -p /tmp/anthrosim-landscape-a /tmp/anthrosim-landscape-b
          python3 scripts/build-landscape-bundle.py \
            examples/landscape-preprocess/recipe.json \
            --output /tmp/anthrosim-landscape-a/landscape.json \
            --record /tmp/anthrosim-landscape-a/record.json
          python3 scripts/build-landscape-bundle.py \
            examples/landscape-preprocess/recipe.json \
            --output /tmp/anthrosim-landscape-b/landscape.json \
            --record /tmp/anthrosim-landscape-b/record.json
          cmp /tmp/anthrosim-landscape-a/landscape.json /tmp/anthrosim-landscape-b/landscape.json
          cmp /tmp/anthrosim-landscape-a/record.json /tmp/anthrosim-landscape-b/record.json
