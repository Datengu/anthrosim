name: Validate issue 190 M9.7 v18 rebaseline

on:
  push:
    branches:
      - fix/190-equal-cost-m9-destinations
    paths:
      - .github/workflows/rebaseline-190-m9-reference.yml

permissions:
  contents: write
  actions: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-equal-cost-m9-destinations
          fetch-depth: 0
      - name: Apply narrow protected-reference provenance and state-digest rebaseline
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('examples/m9-controlled-aggregation-benchmark/reference-result.json')
          reference = json.loads(path.read_text())

          reference['referenceExecution'].update({
              'workflowRunId': 33182836825,
              'artifactId': 9690541535,
              'artifactSha256': '10a6aafaf6f1f9b072918e345353e49a315c80700989cb859e41ba7eeac4d3f2',
              'branchHeadSha': '727dfd17f468ad0ef415ba8c18b6be5c81435737',
              'pullRequestMergeRefBuildSha': 'd38662b6f2188a27aa8b692fef114fdb049a45ab',
              'fullAggregateCanonicalSha256': 'b37d58611f4b8ebab039726e97182327d9792f3798c25b2b0a34a159393e1b49',
              'modelSemanticsId': 'anthrosim-model-semantics-v18',
          })
          reference['arms']['continuous']['experimentId'] = 'anthrosim-exp-v1-7e2dbfc23e9beb1a'
          reference['arms']['continuous']['stateDigests'] = {
              '9701': 7903912027250298511,
              '9702': 16438606349710485576,
              '9703': 12872912953526800762,
              '9704': 15635335708033199954,
              '9705': 5064292397380784043,
              '9706': 3664170270888357647,
              '9707': 15606159001905888117,
              '9708': 307728492795177067,
          }
          reference['arms']['intermittent']['experimentId'] = 'anthrosim-exp-v1-b02c8d91c5b7f022'
          reference['arms']['intermittent']['stateDigests'] = {
              '9701': 2307121472197166606,
              '9702': 8103171882575303170,
              '9703': 5461312016631092267,
              '9704': 5438181978876882935,
              '9705': 14941373482038645992,
              '9706': 11708007451372828332,
              '9707': 11459051096214790560,
              '9708': 10146699965179216951,
          }
          path.write_text(json.dumps(reference, separators=(',', ':')) + '\n')
          PY
      - name: Download exact M9.7 benchmark artifact that justifies the rebaseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 33182836825 -n m9-controlled-aggregation-benchmark -D /tmp/m9-reference-artifact
      - name: Prove all preserved scientific quantities still match
        run: |
          python3 scripts/verify-m9-aggregation-benchmark-reference.py \
            --actual /tmp/m9-reference-artifact/m9-benchmark-output/benchmark-summary.json \
            --reference examples/m9-controlled-aggregation-benchmark/reference-result.json
      - name: Confirm rebaseline is restricted to the reference file
        run: |
          git diff --name-only HEAD -- | grep -Fx 'examples/m9-controlled-aggregation-benchmark/reference-result.json'
          test "$(git diff --name-only HEAD -- | wc -l)" -eq 1
      - name: Remove validation workflow
        run: rm .github/workflows/rebaseline-190-m9-reference.yml
      - name: Commit validated rebaseline
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: rebaseline M9.7 state identity for v18"
          git push origin HEAD:fix/190-equal-cost-m9-destinations
