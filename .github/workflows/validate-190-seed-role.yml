name: Validate issue 190 seed role

on:
  push:
    branches:
      - fix/190-equal-cost-m9-destinations
    paths:
      - .github/workflows/validate-190-seed-role.yml

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-equal-cost-m9-destinations
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Bind spatial tie key to process seed
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('crates/anthrosim-core/src/spatial_simulation.rs')
          text = p.read_text()
          replacements = [
              (
                  '            .map(|definition| definition.derive_program_with_seed(&world, config.seed))',
                  '            .map(|definition| {\n                definition.derive_program_with_seed(\n                    &world,\n                    spatial_binding.environment.realization.process_seed,\n                )\n            })',
              ),
              (
                  '        validate_spatial_temporary_mobility(&checkpoint.core_checkpoint, &landscape, &world)?;',
                  '        validate_spatial_temporary_mobility(\n            &checkpoint.core_checkpoint,\n            &landscape,\n            &world,\n            checkpoint.spatial.environment.realization.process_seed,\n        )?;',
              ),
              (
                  '    validate_spatial_temporary_mobility(&run.checkpoint.core_checkpoint, landscape, &world)?;',
                  '    validate_spatial_temporary_mobility(\n        &run.checkpoint.core_checkpoint,\n        landscape,\n        &world,\n        run.checkpoint.spatial.environment.realization.process_seed,\n    )?;',
              ),
              (
                  'fn validate_spatial_temporary_mobility(\n    checkpoint: &SimulationCheckpoint,\n    landscape: &LandscapeBundle,\n    world: &World,\n) -> Result<(), SpatialLandscapeError> {',
                  'fn validate_spatial_temporary_mobility(\n    checkpoint: &SimulationCheckpoint,\n    landscape: &LandscapeBundle,\n    world: &World,\n    process_seed: u64,\n) -> Result<(), SpatialLandscapeError> {',
              ),
              (
                  '        let expected = definition.derive_program_with_seed(world, checkpoint.experiment.seed)?;',
                  '        let expected = definition.derive_program_with_seed(world, process_seed)?;',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f'expected one match, got {text.count(old)} for {old[:80]!r}')
              text = text.replace(old, new, 1)
          p.write_text(text)
          PY
      - name: Format
        run: cargo fmt --all
      - name: Compile core
        run: cargo check -p anthrosim-core --all-targets
      - name: Run equal-cost acceptance tests
        run: cargo test -p anthrosim-core --test m9_equal_cost_destinations -- --nocapture
      - name: Run M9 travel and observability unit tests
        run: |
          cargo test -p anthrosim-core temporary_travel -- --nocapture
          cargo test -p anthrosim-core temporary_observability -- --nocapture
      - name: Remove validation workflow
        if: success()
        run: rm .github/workflows/validate-190-seed-role.yml
      - name: Commit validated change
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test: verify symmetric M9 destination choice"
          git push origin HEAD:fix/190-equal-cost-m9-destinations
