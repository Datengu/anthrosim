name: Stage issue 215 compile fix
on:
  push:
    branches: [feat/215-resource-condition-observability]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[215-compile-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('crates/anthrosim-core/src/resources.rs')
          s=p.read_text()
          old='let mut values = Vec::with_capacity(population.living_count());'
          new='let mut values = Vec::with_capacity(usize::try_from(population.living_count()).map_err(|_| ResourceError::AccountingOverflow)?);'
          assert s.count(old)==1
          p.write_text(s.replace(old,new,1))
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/resources.rs
          git commit -m "fix: use checked resource observation capacity [215-compile-fix]"
          git push origin HEAD:feat/215-resource-condition-observability
