name: Source provenance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    uses: ./.github/workflows/pr-ci-scope.yml
    permissions:
      contents: read
      pull-requests: read

  provenance:
    name: Automatic Git source identity
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.scope.outputs.full_required != 'true' }}
        run: echo "${{ needs.scope.outputs.scope }} change; executable source-provenance exercise is not applicable."

      - name: Checkout
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Verify clean checkout records exact Git revision automatically
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          unset ANTHROSIM_GIT_COMMIT
          cargo run --locked -p anthrosim-cli --bin anthrosim -- run \
            --years 0 \
            --world-width 1 \
            --world-height 1 \
            --population 1 \
            --household-size 1 \
            --max-person-records 1 \
            --seed 80 \
            --output /tmp/anthrosim-clean-provenance.json
          cp target/debug/anthrosim /tmp/anthrosim-clean
          /tmp/anthrosim-clean provenance > /tmp/anthrosim-clean-binary-provenance.json
          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          expected = subprocess.check_output(
              ['git', 'rev-parse', 'HEAD'], text=True
          ).strip()
          manifest = json.loads(Path('/tmp/anthrosim-clean-provenance.json').read_text())
          binary = json.loads(Path('/tmp/anthrosim-clean-binary-provenance.json').read_text())
          assert manifest['gitCommit'] == expected, (manifest['gitCommit'], expected)
          assert binary['gitCommit'] == expected, (binary['gitCommit'], expected)
          assert binary['modelVersion'] == manifest['modelVersion']
          assert binary['modelSemanticsId']
          PY

      - name: Verify different tracked dirty trees get different exact identities
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          unset ANTHROSIM_GIT_COMMIT
          printf '\n<!-- source provenance dirty-tree probe A -->\n' >> README.md
          git diff HEAD --binary --full-index --no-ext-diff --no-textconv -- | git hash-object --stdin > /tmp/anthrosim-dirty-a-digest.txt
          cargo run --locked -p anthrosim-cli --bin anthrosim -- run \
            --years 0 \
            --world-width 1 \
            --world-height 1 \
            --population 1 \
            --household-size 1 \
            --max-person-records 1 \
            --seed 80 \
            --output /tmp/anthrosim-dirty-a-provenance.json
          cp target/debug/anthrosim /tmp/anthrosim-dirty

          git checkout -- README.md
          printf '\n<!-- source provenance dirty-tree probe B -->\n' >> README.md
          git diff HEAD --binary --full-index --no-ext-diff --no-textconv -- | git hash-object --stdin > /tmp/anthrosim-dirty-b-digest.txt
          cargo run --locked -p anthrosim-cli --bin anthrosim -- run \
            --years 0 \
            --world-width 1 \
            --world-height 1 \
            --population 1 \
            --household-size 1 \
            --max-person-records 1 \
            --seed 80 \
            --output /tmp/anthrosim-dirty-b-provenance.json
          git checkout -- README.md

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          head = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          digest_a = Path('/tmp/anthrosim-dirty-a-digest.txt').read_text().strip()
          digest_b = Path('/tmp/anthrosim-dirty-b-digest.txt').read_text().strip()
          manifest_a = json.loads(Path('/tmp/anthrosim-dirty-a-provenance.json').read_text())
          manifest_b = json.loads(Path('/tmp/anthrosim-dirty-b-provenance.json').read_text())
          expected_a = f'{head}-dirty-{digest_a}'
          expected_b = f'{head}-dirty-{digest_b}'
          assert digest_a != digest_b, (digest_a, digest_b)
          assert manifest_a['gitCommit'] == expected_a, (manifest_a['gitCommit'], expected_a)
          assert manifest_b['gitCommit'] == expected_b, (manifest_b['gitCommit'], expected_b)
          assert manifest_a['gitCommit'] != manifest_b['gitCommit']
          PY

      - name: Verify explicit build-time override remains authoritative
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        env:
          ANTHROSIM_GIT_COMMIT: controlled-source-revision
        run: |
          cargo run --locked -p anthrosim-cli --bin anthrosim -- run \
            --years 0 \
            --world-width 1 \
            --world-height 1 \
            --population 1 \
            --household-size 1 \
            --max-person-records 1 \
            --seed 80 \
            --output /tmp/anthrosim-override-provenance.json
          cp target/debug/anthrosim /tmp/anthrosim-override
          python3 - <<'PY'
          import json
          from pathlib import Path

          manifest = json.loads(Path('/tmp/anthrosim-override-provenance.json').read_text())
          assert manifest['gitCommit'] == 'controlled-source-revision'
          PY

      - name: Build binary with unavailable Git metadata
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          unset ANTHROSIM_GIT_COMMIT
          rm -rf /tmp/anthrosim-missing-git
          mkdir -p /tmp/anthrosim-missing-git
          touch crates/anthrosim-core/build.rs crates/anthrosim-cli/build.rs
          GIT_DIR=/tmp/anthrosim-missing-git \
            cargo build --locked -p anthrosim-cli --bin anthrosim
          cp target/debug/anthrosim /tmp/anthrosim-missing
          /tmp/anthrosim-missing provenance > /tmp/anthrosim-missing-provenance.json
          python3 - <<'PY'
          import json
          from pathlib import Path

          provenance = json.loads(Path('/tmp/anthrosim-missing-provenance.json').read_text())
          assert provenance['gitCommit'] is None
          PY

      - name: Preflight exact binaries before versioned sweep execution
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          cat > /tmp/anthrosim-provenance-preflight-definition.json <<'JSON'
          {
            "schemaVersion": 1,
            "definitionId": "ci-source-provenance-preflight",
            "scientificStatus": "synthetic_validation",
            "seeds": [9401],
            "base": {
              "years": 0,
              "worldWidth": 1,
              "worldHeight": 1,
              "population": 1,
              "householdSize": 1,
              "maxPersonRecords": 1
            },
            "dimensions": {
              "annualFoodNeed": [100]
            }
          }
          JSON

          rm -rf /tmp/anthrosim-preflight-clean /tmp/anthrosim-preflight-dirty \
            /tmp/anthrosim-preflight-missing /tmp/anthrosim-preflight-override

          python3 scripts/run-versioned-sweep.py \
            /tmp/anthrosim-provenance-preflight-definition.json \
            --binary /tmp/anthrosim-clean \
            --run-dir /tmp/anthrosim-preflight-clean
          test -f /tmp/anthrosim-preflight-clean/reproduction-record.json

          if python3 scripts/run-versioned-sweep.py \
            /tmp/anthrosim-provenance-preflight-definition.json \
            --binary /tmp/anthrosim-dirty \
            --run-dir /tmp/anthrosim-preflight-dirty; then
            echo 'dirty binary unexpectedly passed versioned-sweep preflight' >&2
            exit 1
          fi
          test ! -e /tmp/anthrosim-preflight-dirty

          if python3 scripts/run-versioned-sweep.py \
            /tmp/anthrosim-provenance-preflight-definition.json \
            --binary /tmp/anthrosim-missing \
            --run-dir /tmp/anthrosim-preflight-missing; then
            echo 'missing-provenance binary unexpectedly passed versioned-sweep preflight' >&2
            exit 1
          fi
          test ! -e /tmp/anthrosim-preflight-missing

          python3 scripts/run-versioned-sweep.py \
            /tmp/anthrosim-provenance-preflight-definition.json \
            --binary /tmp/anthrosim-override \
            --run-dir /tmp/anthrosim-preflight-override
          test -f /tmp/anthrosim-preflight-override/reproduction-record.json

          python3 - <<'PY'
          import json
          import subprocess
          from pathlib import Path

          for label in ('clean', 'override'):
              provenance = json.loads(subprocess.check_output(
                  [f'/tmp/anthrosim-{label}', 'provenance'], text=True
              ))
              record = json.loads(Path(
                  f'/tmp/anthrosim-preflight-{label}/reproduction-record.json'
              ).read_text())
              manifest = json.loads(Path(
                  f'/tmp/anthrosim-preflight-{label}/sweep-manifest.json'
              ).read_text())
              assert record['gitCommit'] == provenance['gitCommit']
              assert manifest['gitCommit'] == provenance['gitCommit']
              assert manifest['modelVersion'] == provenance['modelVersion']
          PY
