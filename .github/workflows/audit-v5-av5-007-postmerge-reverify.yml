name: Audit v5 AV5-007 postmerge reverify

on:
  pull_request:
    paths:
      - "scripts/audit-v5-av5-007-postmerge-reverify.py"
      - ".github/workflows/audit-v5-av5-007-postmerge-reverify.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reverify:
    name: AV5-007 large-integer coordinate adversary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Compile restored adversary
        run: python3 -m py_compile scripts/audit-v5-av5-007-postmerge-reverify.py
      - name: Re-run original AV5-007 scientific geometry against merged repair
        run: python3 scripts/audit-v5-av5-007-postmerge-reverify.py
