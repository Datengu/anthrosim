          python3 - <<'PY'
          # The old algorithm's contiguous-ID pathology is analytically preserved here rather than
          # importing the repaired implementation. Five founders followed by four newborn IDs split
          # at max=5 into [1..5] and [6..9], making the second group newborn-only.
          members=list(range(1,10)); ceiling=5
          groups=(len(members)+ceiling-1)//ceiling
          base=len(members)//groups; extra=len(members)%groups
          sizes=[base+(i<extra) for i in range(groups)]
          old=[]; cursor=0
          for size in sizes:
              old.append(members[cursor:cursor+size]); cursor+=size
          assert old == [[1,2,3,4,5],[6,7,8,9]]
          print('legacy contiguous-ID rule reproduces autonomous newborn-only daughter household:', old)
          PY
      - name: Remove helper and commit durable core repair
