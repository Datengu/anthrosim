name: PR324 core repair validation

on:
  push:
    branches:
      - fix/324-dependency-aware-household-fission

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/324-dependency-aware-household-fission
      - name: Apply dependency-aware lifecycle v2
        run: |
          python3 .github/pr324_apply.py
          python3 .github/pr324_clippy_fix.py
      - name: Format and focused tests
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p anthrosim-core --test household_fission_dependency
          cargo test --locked -p anthrosim-core --test household_lifecycle_sensitivity
          cargo test --locked -p anthrosim-core household_lifecycle --lib
          cargo clippy --locked -p anthrosim-core --all-targets -- -D warnings
      - name: Preserve source-order adversary as independent audit evidence
        run: |
          python3 - <<'PY'
          members=list(range(1,10)); ceiling=5
          groups=(len(members)+ceiling-1)//ceiling
          base=len(members)//groups; extra=len(members)%groups
          sizes=[base+int(i<extra) for i in range(groups)]
          old=[]; cursor=0
          for size in sizes:
              old.append(members[cursor:cursor+size]); cursor+=size
          assert old == [[1,2,3,4,5],[6,7,8,9]]
          print('legacy contiguous-ID rule reproduces autonomous newborn-only daughter household:', old)
          PY
      - name: Remove helpers and commit durable core repair
        run: |
          git rm .github/workflows/pr324-core-repair.yml .github/pr324_apply.py .github/pr324_clippy_fix.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: make household fission dependency-aware (#324)'
          git push origin HEAD:fix/324-dependency-aware-household-fission
