name: Temporary issue 93 dead-code fix

on:
  push:
    branches: [fix/93-run-directory-crash-recovery]

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/93-run-directory-crash-recovery
      - run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/anthrosim-cli/src/run_directory.rs')
          text = path.read_text()
          targets = [
              '#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum RecoveryOutcome {',
              'pub(crate) fn recover_interrupted_replacement(target: &Path) -> io::Result<RecoveryOutcome> {',
              'fn recover_marked_transaction(target: &Path, marker_path: &Path) -> io::Result<RecoveryOutcome> {',
              'fn recover_legacy_remnants(target: &Path) -> io::Result<RecoveryOutcome> {',
              'fn validate_marker(target: &Path, marker: &ReplacementTransactionMarker) -> io::Result<()> {',
              'fn checked_directory_exists(path: &Path, role: &str) -> io::Result<bool> {',
              'fn is_safe_single_component(value: &str) -> bool {',
          ]
          replacements = [
              '#[allow(dead_code)]\n#[derive(Debug, Clone, Copy, PartialEq, Eq)]\npub(crate) enum RecoveryOutcome {',
              '#[allow(dead_code)]\npub(crate) fn recover_interrupted_replacement(target: &Path) -> io::Result<RecoveryOutcome> {',
              '#[allow(dead_code)]\nfn recover_marked_transaction(target: &Path, marker_path: &Path) -> io::Result<RecoveryOutcome> {',
              '#[allow(dead_code)]\nfn recover_legacy_remnants(target: &Path) -> io::Result<RecoveryOutcome> {',
              '#[allow(dead_code)]\nfn validate_marker(target: &Path, marker: &ReplacementTransactionMarker) -> io::Result<()> {',
              '#[allow(dead_code)]\nfn checked_directory_exists(path: &Path, role: &str) -> io::Result<bool> {',
              '#[allow(dead_code)]\nfn is_safe_single_component(value: &str) -> bool {',
          ]
          for old, new in zip(targets, replacements):
              if text.count(old) != 1:
                  raise SystemExit(f'expected one target for {old[:60]!r}, found {text.count(old)}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          rm .github/workflows/zz-fix-dead-code-93.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Scope recovery dead-code allowances"
          git push origin HEAD:fix/93-run-directory-crash-recovery
