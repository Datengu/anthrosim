name: Audit v4 Area A M9 household-key relabel adversary

on:
  pull_request:
    paths:
      - "crates/anthrosim-core/tests/audit_v4_m9_household_key_relabel.rs"
      - ".github/workflows/audit-v4-area-a-m9-household-key.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m9-household-key-invariance:
    name: M9 household-key invariance adversary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 M9 household-key adversary
        run: cargo test -p anthrosim-core --test audit_v4_m9_household_key_relabel --locked -- --nocapture
