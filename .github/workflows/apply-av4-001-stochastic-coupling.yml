name: Apply AV4-001 stochastic coupling

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-av4-001-stochastic-coupling.py'
      - '.github/workflows/apply-av4-001-stochastic-coupling.yml'

permissions:
  contents: write

jobs:
  apply-and-test:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 553
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply persistent coupling architecture
        run: python scripts/apply-av4-001-stochastic-coupling.py
      - name: Format workspace
        run: cargo fmt --all
      - name: Run AV4-001 regressions
        run: cargo test -p anthrosim-core --test fertility_label_invariance --test fertility_person_label_invariance
      - name: Run demography observability replay tests
        run: cargo test -p anthrosim-core demography_observability
      - name: Commit tested repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/population.rs \
                  crates/anthrosim-core/src/demography.rs \
                  crates/anthrosim-core/src/demography_observability.rs \
                  crates/anthrosim-core/src/checkpoint.rs \
                  docs/research/m2-demography-observability-v1.md
          if git diff --cached --quiet; then
            echo 'Repair already applied.'
            exit 0
          fi
          git commit -m 'fix: persist person-level stochastic coupling identity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
