name: Audit v6 Area H sequential Wilson coverage

on:
  pull_request:
    paths:
      - "scripts/audit-v6-area-h-sequential-wilson-coverage.py"
      - ".github/workflows/audit-v6-area-h-sequential-wilson.yml"

permissions:
  contents: read

jobs:
  sequential-wilson-coverage:
    name: Sequential Wilson stopped-procedure coverage adversary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run controlled exact Bernoulli coverage adversary
        run: python3 scripts/audit-v6-area-h-sequential-wilson-coverage.py
