name: Audit v5 Area E spatial seed-role adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_e_spatial_seed_roles.rs'
      - '.github/workflows/audit-v5-area-e-spatial-seed-roles.yml'

permissions:
  contents: read

jobs:
  spatial-seed-role-adversary:
    name: Spatial seed-role integration adversary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-E spatial seed-role adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_e_spatial_seed_roles -- --nocapture
