name: Apply AV6-003 v40 repair

on:
  push:
    branches:
      - audit/repair-699-av6-003
    paths:
      - .github/workflows/apply-av6-003-v40-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-699-av6-003
          persist-credentials: true

      - name: Apply v40 repair
        run: python3 .github/scripts/apply-av6-003-v40-repair.py

      - name: Verify focused repair
        run: |
          cargo fmt --all
          cargo fmt --all -- --check
          cargo clippy -p anthrosim-core --tests -- -D warnings
          cargo test -p anthrosim-core --test av6_003_household_fission_external_kin_context
          cargo test -p anthrosim-core --test household_fission_relationship_invariance
          cargo test -p anthrosim-core all_cross_household_kin_locations_are_retained_independent_of_person_record_order
          python3 scripts/test-current-household-lifecycle-docs.py
          python3 scripts/test-current-model-semantics-docs.py
          git diff --check

      - name: Commit repair and remove helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-av6-003-v40-repair.yml
          git rm .github/scripts/apply-av6-003-v40-repair.py
          git add -A
          git diff --cached --check
          git commit -m "fix(audit-v6): preserve external-kin context in fission"
          git push origin HEAD:audit/repair-699-av6-003
