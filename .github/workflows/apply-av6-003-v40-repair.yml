name: Apply AV6-003 v40 repair

on:
  push:
    branches: [audit/repair-699-av6-003]
    paths:
      - '.github/workflows/apply-av6-003-v40-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-699-av6-003
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain

      - name: Apply AV6-003 production repair
        shell: python
        run: |
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          population = Path('crates/anthrosim-core/src/population.rs')
          old_parent = '''            let parent_signature = |parent: PersonId| -> (u8, u64) {
                if parent == PersonId::INVALID {
                    return (0, 0);
                }
                let Some(parent_index) = person_index(parent, person_count) else {
                    return (1, 0);
                };
                let position = member_positions[parent_index];
                if position != usize::MAX {
                    (3, ranks[parent_index])
                } else if self.is_alive_index(parent_index) {
                    (2, 0)
                } else {
                    (1, 0)
                }
            };
'''
          new_parent = '''            let parent_signature = |parent: PersonId| -> (u8, CellId, u64) {
                if parent == PersonId::INVALID {
                    return (0, CellId::INVALID, 0);
                }
                let Some(parent_index) = person_index(parent, person_count) else {
                    return (1, CellId::INVALID, 0);
                };
                let position = member_positions[parent_index];
                if position != usize::MAX {
                    (3, CellId::INVALID, ranks[parent_index])
                } else if self.is_alive_index(parent_index) {
                    // A living direct parent outside the source household carries causal
                    // cross-household context through persistent residence: M4 consumes those
                    // residence cells as first-degree kin anchors. Preserve that scientific
                    // distinction here without substituting parent/household identity, packed
                    // record order, or a globally ordinal stochastic-coupling rank.
                    (2, self.locations[parent_index], 0)
                } else {
                    (1, CellId::INVALID, 0)
                }
            };
'''
          replace_once(population, old_parent, new_parent)

          provenance = Path('crates/anthrosim-core/src/provenance.rs')
          old_semantics = 'pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v39";'
          new_semantics = '''///
/// v40 extends dependency-aware household-fission relationship refinement to living direct
/// parents outside the source household. Their persistent residence cell is causal context
/// because M4 consumes the same cross-household parent/child residences as first-degree kin
/// anchors. Canonical PersonId, HouseholdId, packed-record order and global stochastic-coupling
/// rank remain excluded from this social assignment key. A v39 checkpoint must not resume under
/// v40 while silently changing which relationship-distinct adults seed daughter households.
pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v40";'''
          replace_once(provenance, old_semantics, new_semantics)

          current_docs = [
              'README.md',
              'docs/architecture.md',
              'docs/roadmap.md',
              'docs/scientific-model.md',
              'docs/research/README.md',
              'docs/research/trace.md',
              'docs/research/odd.md',
              'docs/research/odd-d.md',
          ]
          for path in current_docs:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              old = 'current model semantics v39'
              if old not in text:
                  raise SystemExit(f'{path}: missing current v39 marker')
              p.write_text(text.replace(old, 'current model semantics v40'), encoding='utf-8')

          replace_once(
              'README.md',
              'living remediation has since advanced through AV6-006 and AV6-002 to model semantics v39 without rewriting that immutable release.',
              'living remediation has since advanced through AV6-006 and AV6-002 to merged model semantics v39, while the active AV6-003 repair advances its branch to model semantics v40 without rewriting that immutable release.',
          )
          readme = Path('README.md')
          text = readme.read_text(encoding='utf-8')
          text = text.replace(
              'Controlled remediation is in progress on living source; P1 repairs require independent post-merge adversarial re-verification before closure.',
              'Controlled P2 remediation is in progress on living source; all seven P1 findings are repaired, independently reverified and closed.',
          )
          text = text.replace(
              'Controlled remediation is active on living source, and P1 findings remain open until independent post-merge re-verification succeeds.',
              'Controlled P2 remediation is active on living source; all seven P1 findings are repaired, independently reverified and closed.',
          )
          readme.write_text(text, encoding='utf-8')

          replace_once(
              'docs/release-versioning.md',
              'AV6-002/#694 then unified male-parent reproductive-age chronology at the child-birth boundary and advances the repair branch to **`anthrosim-model-semantics-v39`**. The package version remains `0.3.6`; these living identities do not rewrite immutable v0.3.6/v35 or its Audit-v6 discovery evidence.',
              'AV6-002/#694 then unified male-parent reproductive-age chronology at the child-birth boundary and advanced merged main to `anthrosim-model-semantics-v39`; AV6-003/#699 extends dependency-aware household-fission relationship refinement to living external-parent persistent-residence context and advances the active repair branch to **`anthrosim-model-semantics-v40`**. The package version remains `0.3.6`; these living identities do not rewrite immutable v0.3.6/v35 or its Audit-v6 discovery evidence.',
          )
          replace_once(
              'docs/release-versioning.md',
              'AV6-001 at v36, AV6-004 at v37, AV6-006 at v38, and AV6-002 at v39.',
              'AV6-001 at v36, AV6-004 at v37, AV6-006 at v38, AV6-002 at v39, and AV6-003 at v40.',
          )

          replace_once(
              'docs/scientific-model.md',
              'The historical `deterministic_size_fission_v1` treatment is superseded because its stable-PersonId slicing made packed record order an unintended cohort/generation rule. Neither lifecycle treatment is an empirical household-formation claim; the current v2 contract is [`research/household-lifecycle-structural-sensitivity-v2.md`](research/household-lifecycle-structural-sensitivity-v2.md).',
              'The historical `deterministic_size_fission_v1` treatment is superseded because its stable-PersonId slicing made packed record order an unintended cohort/generation rule. From model semantics v40, living direct parents outside the source household are relationship-distinct when their persistent residence cells differ, matching the first-degree kin-location context consumed by M4; external parents at the same persistent residence remain equivalent, and external PersonId/HouseholdId, packed-record order and global stochastic-coupling rank are not social assignment keys. Neither lifecycle treatment is an empirical household-formation claim; the current v2 contract is [`research/household-lifecycle-structural-sensitivity-v2.md`](research/household-lifecycle-structural-sensitivity-v2.md).',
          )

          contract = Path('docs/research/household-lifecycle-structural-sensitivity-v2.md')
          text = contract.read_text(encoding='utf-8')
          text = text.replace(
              '7. independent-age members are assigned deterministically by age, reproductive sex and an ID-independent relationship-role refinement over the living source-household parent/child graph; PersonId is used only as a final tie-break within the same stabilized relationship class;',
              '7. independent-age members are assigned deterministically by age, reproductive sex and an ID-independent relationship-role refinement over the living source-household parent/child graph plus living direct-parent context outside that household; a living external parent is distinguished only by persistent residence cell, matching the downstream M4 first-degree kin-location state, and PersonId is used only as a final tie-break within the same stabilized scientific context;',
          )
          marker = 'From model semantics v25, the relationship comparison is executable rather than documentary: living members of the source household are partitioned into age/sex role classes, then those classes are iteratively refined by female-parent state, male-parent state and the multiset of living in-household child roles until stable. Only records still in the same stabilized role class may fall through to PersonId. This keeps deterministic replay without allowing canonical record labels to choose between relationship-distinct anchors or dependents.\n'
          if marker not in text:
              raise SystemExit('household lifecycle v25 contract marker missing')
          text = text.replace(marker, marker + '\nFrom model semantics v40, the female- and male-parent refinement also preserves one explicit cross-household context for a represented living parent: that parent\'s persistent residence cell. This is the same causal context M4 exposes as a reciprocal first-degree kin-location anchor after household topology changes. The refinement does **not** use the external parent\'s PersonId, HouseholdId, packed-record position or global stochastic-coupling rank, and two otherwise equivalent external parents at the same persistent residence remain in the same relationship context. The purpose is relabelling invariance, not an ethnographic rule that one compass direction or one relative is socially preferred.\n', 1)
          text += '\nModel semantics v40 changes authoritative daughter-household membership for the AV6-003/#699 external-kin equivalence case, so v39 checkpoints are not continuation-compatible with v40. The package version remains 0.3.6 and the immutable v0.3.6/v35 Audit-v6 discovery target is unchanged.\n'
          contract.write_text(text, encoding='utf-8')

          appendix = '''

### Current v40 household-fission external-kin context

For the optional `deterministic_dependency_fission_v2` structural treatment, relationship refinement now preserves the persistent residence cell of a represented living direct parent outside the source household. That is existing causal model state already consumed by M4 as a reciprocal first-degree kin-location anchor. It is not an empirical residence norm: external PersonId, HouseholdId, packed-record order and global stochastic-coupling rank are excluded from the social assignment key, and external parents sharing one residence remain equivalent. This AV6-003/#699 repair changes authoritative household topology and therefore advances living model semantics v39 → v40 without changing package version `0.3.6` or immutable v0.3.6/v35 audit evidence.
'''
          for path in ('docs/research/odd.md', 'docs/research/odd-d.md', 'docs/research/trace.md'):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if 'Current v40 household-fission external-kin context' not in text:
                  p.write_text(text.rstrip() + appendix + '\n', encoding='utf-8')

          status = Path('docs/research/audit-v6/STATUS.md')
          text = status.read_text(encoding='utf-8')
          replacements = {
              '| Open Audit-v6 findings | **7** |': '| Open Audit-v6 findings | **6** |',
              '| Active ownership | **AV6-002/#694 is the active first P2 remediation in PR #771; AV6-003/#699 is next unless live overlap/dependency state changes** |': '| Active ownership | **AV6-003/#699 is the active P2 remediation on `audit/repair-699-av6-003`; AV6-002/#694 is merged/closed** |',
              'Protected `main` after the verified AV6-006 production repair is `e729866f4a46d833a566a557e38570daf854d5ae`, with living model semantics `anthrosim-model-semantics-v38`. Active AV6-002 repair PR #771 advances its branch to `anthrosim-model-semantics-v39`; immutable Audit-v6 discovery remains attributed to `v0.3.6` / v35.': 'Protected `main` after merged AV6-002/#694 is `9d9c89495f66e50f30d434255069544cd8dfa866`, with living model semantics `anthrosim-model-semantics-v39`. Active AV6-003/#699 advances its repair branch to `anthrosim-model-semantics-v40`; immutable Audit-v6 discovery remains attributed to `v0.3.6` / v35.',
              '| B — demography, fertility, mortality, ageing and population structure | **complete — AV6-002/#694 P2** |': '| B — demography, fertility, mortality, ageing and population structure | **complete — AV6-002/#694 P2 repaired/verified** |',
              '| AV6-002 | **P2** | B primary; C/G/M/N | #694 | **open — active production repair #771** |': '| AV6-002 | **P2** | B primary; C/G/M/N | #694 | **closed — repaired/verified by #771** |',
              '| AV6-003 | **P2** | C primary; E/N | #699 | open; remediation pending |': '| AV6-003 | **P2** | C primary; E/N | #699 | **open — active production repair** |',
              'Audit-v6 discovery Areas **A–N are complete**. All seven P1 findings are now repaired, independently reverified and closed. **7 findings remain open, all P2.** Protected `main` is `e729866f4a46d833a566a557e38570daf854d5ae` / living semantics v38 before the active AV6-002 repair.': 'Audit-v6 discovery Areas **A–N are complete**. All seven P1 findings are repaired, independently reverified and closed. **6 findings remain open, all P2.** Protected `main` is `9d9c89495f66e50f30d434255069544cd8dfa866` / living semantics v39 after merged AV6-002/#694.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'audit-v6 status target missing: {old[:80]}')
              text = text.replace(old, new, 1)
          old_handoff = 'Active work is **AV6-002/#694** in production repair PR **#771**. The repair gives the male-parent configured age window one temporal meaning—completed age at the recorded child-birth boundary—while retaining female-fertility and annual-mortality schedule lookup at interval start and preserving pre-same-day-M4 parentage locality. The branch advances living semantics v38 → v39, includes the permanent threshold-crossing regression, and has fresh v39 demographic, M7.6, M8.6 and M9.7 evidence/reference propagation. #694 is P2, so it may close after production merge plus verification; no independent P1 evidence-only derivative is required.\n\nIf #771 merges cleanly, the next queued Audit-v6 remediation is **AV6-003/#699**, unless live overlap/dependency state changes. Preserve #698 as its external-kin relabelling adversary and #399 as the earlier in-source relationship-invariance regression; do not substitute arbitrary storage/index/global-ordinal tie-breaks for the missing causal external-kin context.'
          new_handoff = 'AV6-002/#694 is merged and closed via production PR **#771** at protected-main merge `9d9c89495f66e50f30d434255069544cd8dfa866` / living semantics v39. Exact-head central CI `34610153351`, #304 confirmation `34610153382` (780/780), applicable scientific/security gates `34610153625`, canonical M7.6 and the remaining protected matrix all passed before merge. As a P2 finding it required production merge plus verification, not a separate P1 evidence derivative.\n\nActive work is now **AV6-003/#699**. Preserve #698 as the external-kin relabelling adversary and #399 as the earlier in-source relationship-invariance regression. The v40 repair incorporates living external-parent persistent residence into the local relationship refinement because the same context is causal in downstream M4 kin-location state; it does not substitute PersonId, HouseholdId, packed-record order or a global stochastic ordinal.'
          if old_handoff not in text:
              raise SystemExit('audit-v6 handoff block missing')
          text = text.replace(old_handoff, new_handoff, 1)
          insertion = '## Verified P1 remediation progress\n'
          av6_002 = '''## Verified P2 remediation progress

### AV6-002 / #694 — repaired and verified

Production repair PR **#771**, final repair head `2a16bdcb34095f202b86d158fd8c8384f93395bd`, merged to protected `main` as `9d9c89495f66e50f30d434255069544cd8dfa866` and advanced living semantics v38 → v39. The public male-parent age window now constrains completed male age at the recorded child-birth boundary in dynamic M2, declared-founder genealogy and observability replay; female-fertility/mortality schedule lookup and pre-same-day-M4 locality retain their separate documented timing.

The final production head passed central CI **34610153351**, #304 demographic confirmation **34610153382** (780/780 runs; all precision gates passed), applicable scientific/security gates **34610153625** (M8.6/M9.7 passed), canonical M7.6, determinism, provenance, bundle/resume, performance/memory and soak checks. M7.6 was numerically rebaselined from protected v39 evidence rather than metadata-relabelled. #694 closed on merge; P2 protocol requires no independent P1 evidence-only derivative.

'''
          if '### AV6-002 / #694 — repaired and verified' not in text:
              if insertion not in text:
                  raise SystemExit('status remediation insertion marker missing')
              text = text.replace(insertion, av6_002 + insertion, 1)
          status.write_text(text, encoding='utf-8')

          test_path = Path('crates/anthrosim-core/tests/av6_003_household_fission_external_kin_context.rs')
          test_path.write_text(r'''use anthrosim_core::{
    AgeProbabilityBand, DemographyConfig, EventKind, ExperimentConfig, FounderGenealogyStatus,
    FounderHousehold, FounderPerson, FounderPopulationDefinition, HouseholdLifecycleConfig,
    MigrationConfig, ParameterProvenance, PopulationConfig, PopulationInitialization,
    ReproductiveSex, ResourceConfig, Simulation, WorldConfig,
    ids::{CellId, HouseholdId, PersonId},
};

const SOURCE_HOUSEHOLD: HouseholdId = HouseholdId::new(1);
const WEST_PARENT_HOUSEHOLD: HouseholdId = HouseholdId::new(2);
const EAST_PARENT_HOUSEHOLD: HouseholdId = HouseholdId::new(3);
const WEST_PARENT: PersonId = PersonId::new(5);
const EAST_PARENT: PersonId = PersonId::new(6);
const DAYS_PER_YEAR: i64 = 365;

fn neutral_demography() -> DemographyConfig {
    let mut config = DemographyConfig::synthetic_validation_v1();
    for band in &mut config.mortality_bands {
        band.annual_probability_per_million = 0;
    }
    // The external mothers were age 25 at the source adults' births, so retain positive support
    // only for that founder-validation chronology while leaving every living founder ineligible
    // for model-period fertility.
    config.fertility_bands = vec![
        AgeProbabilityBand::new(0, 18, 0),
        AgeProbabilityBand::new(18, 30, 1),
        AgeProbabilityBand::new(30, u32::MAX, 0),
    ];
    config
}

fn neutral_resources() -> ResourceConfig {
    let mut resources = ResourceConfig::synthetic_validation_v1();
    resources.annual_need_units_per_person = 0;
    resources.max_scarcity_mortality_probability_per_million = 0;
    resources
}

fn source_adult(id: PersonId, female_parent: Option<PersonId>) -> FounderPerson {
    FounderPerson {
        id,
        birth_day: -(30 * DAYS_PER_YEAR),
        reproductive_sex: ReproductiveSex::Male,
        household: SOURCE_HOUSEHOLD,
        female_parent,
        male_parent: None,
        last_birth_day: None,
        condition_permille: 1_000,
    }
}

fn external_mother(id: PersonId, household: HouseholdId) -> FounderPerson {
    FounderPerson {
        id,
        birth_day: -(55 * DAYS_PER_YEAR),
        reproductive_sex: ReproductiveSex::Female,
        household,
        female_parent: None,
        male_parent: None,
        last_birth_day: None,
        condition_permille: 1_000,
    }
}

fn founders(swapped_linked_adult_ids: bool) -> (FounderPopulationDefinition, PersonId, PersonId) {
    let west_linked = if swapped_linked_adult_ids {
        PersonId::new(4)
    } else {
        PersonId::new(3)
    };
    let east_linked = if swapped_linked_adult_ids {
        PersonId::new(3)
    } else {
        PersonId::new(4)
    };

    let parent_for = |id: PersonId| {
        if id == west_linked {
            Some(WEST_PARENT)
        } else if id == east_linked {
            Some(EAST_PARENT)
        } else {
            None
        }
    };

    (
        FounderPopulationDefinition::new(
            if swapped_linked_adult_ids {
                "audit-v6-area-c-external-kin-relabel-swapped"
            } else {
                "audit-v6-area-c-external-kin-relabel-baseline"
            },
            ParameterProvenance::SyntheticValidation,
            FounderGenealogyStatus::CompleteLivingDirectParents,
            vec![
                FounderHousehold {
                    id: SOURCE_HOUSEHOLD,
                    location: CellId::new(2),
                },
                FounderHousehold {
                    id: WEST_PARENT_HOUSEHOLD,
                    location: CellId::new(1),
                },
                FounderHousehold {
                    id: EAST_PARENT_HOUSEHOLD,
                    location: CellId::new(3),
                },
            ],
            vec![
                source_adult(PersonId::new(1), None),
                source_adult(PersonId::new(2), None),
                source_adult(PersonId::new(3), parent_for(PersonId::new(3))),
                source_adult(PersonId::new(4), parent_for(PersonId::new(4))),
                external_mother(WEST_PARENT, WEST_PARENT_HOUSEHOLD),
                external_mother(EAST_PARENT, EAST_PARENT_HOUSEHOLD),
            ],
        ),
        west_linked,
        east_linked,
    )
}

fn fission_outcome(swapped_linked_adult_ids: bool) -> (bool, bool, Vec<PersonId>) {
    let (founders, west_linked, east_linked) = founders(swapped_linked_adult_ids);
    let config = ExperimentConfig::new(6_301, 1)
        .with_world(WorldConfig::new(3, 1))
        .with_population(
            PopulationConfig::new(6)
                .with_initialization(PopulationInitialization::DeclaredFounderStateV1)
                .with_max_person_records(8),
        )
        .with_founder_population(founders)
        .with_demography(neutral_demography())
        .with_resources(neutral_resources())
        .with_migration(MigrationConfig::synthetic_validation_v1().with_enabled(false))
        .with_household_lifecycle(
            HouseholdLifecycleConfig::deterministic_dependency_fission_v2(2, 18),
        );

    let run = Simulation::new(config).unwrap().run_recorded().unwrap();
    run.validate_invariants().unwrap();

    let fissions = run
        .events()
        .events
        .iter()
        .filter_map(|record| match &record.event {
            EventKind::HouseholdFission {
                source_household,
                residence,
                people_reassigned,
                ..
            } if *source_household == SOURCE_HOUSEHOLD => {
                assert_eq!(record.day, 365);
                assert_eq!(*residence, CellId::new(2));
                Some(people_reassigned.clone())
            }
            _ => None,
        })
        .collect::<Vec<_>>();
    assert_eq!(
        fissions.len(),
        1,
        "the source household must fission exactly once"
    );
    let moved = fissions.into_iter().next().unwrap();
    assert_eq!(moved.len(), 2, "four adults with target two must split 2+2");

    let west_moved = moved.contains(&west_linked);
    let east_moved = moved.contains(&east_linked);
    assert_ne!(
        west_moved, east_moved,
        "exactly one of the two cross-household-kin adults should enter the daughter household"
    );
    (west_moved, east_moved, moved)
}

#[test]
fn external_kin_context_is_not_reassigned_by_canonical_person_id() {
    let baseline = fission_outcome(false);
    let relabelled = fission_outcome(true);

    println!(
        "external-kin fission controls: baseline west_moved={} east_moved={} moved={:?}; relabelled west_moved={} east_moved={} moved={:?}",
        baseline.0, baseline.1, baseline.2, relabelled.0, relabelled.1, relabelled.2
    );

    assert_eq!(
        (baseline.0, baseline.1),
        (relabelled.0, relabelled.1),
        "pure canonical PersonId relabelling must not decide whether the adult linked to the west versus east external living parent retains source-household continuity"
    );
}
''', encoding='utf-8')

      - name: Verify focused AV6-003 repair
        run: |
          cargo fmt --all -- --check
          cargo clippy -p anthrosim-core --tests -- -D warnings
          cargo test -p anthrosim-core --test av6_003_household_fission_external_kin_context
