name: Temporary issue 205 hardening

on:
  push:
    branches:
      - feat/205-exact-sensitivity-definition

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/205-exact-sensitivity-definition
          fetch-depth: 0
      - name: Apply issue 205 hardening
        shell: python
        run: |
          from pathlib import Path

          def replace_exact(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'expected block not found: {label}')
              return text.replace(old, new, 1)

          core = Path('crates/anthrosim-core/src/research_experiment.rs')
          text = core.read_text()
          text = replace_exact(
              text,
              '''use crate::{\n    ExperimentConfig, LandscapeBundle, Simulation, SourceRevisionIdentity,\n    SpatialLandscapeSimulation, SpatialMechanismConfig,\n};\n''',
              '''use crate::{\n    ExperimentConfig, LandscapeBundle, SPATIAL_MODEL_SEMANTICS_ID, Simulation,\n    SourceRevisionIdentity, SpatialLandscapeSimulation, SpatialMechanismConfig,\n};\n\nconst MAX_RESEARCH_POINTS: usize = 100_000;\n''',
              'core imports and point limit',
          )
          text = replace_exact(
              text,
              '''        if self.base.experiment.seed != self.seeds[0] {\n            return Err(ResearchExperimentError::BaseSeedMismatch {\n                base_seed: self.base.experiment.seed,\n                first_seed: self.seeds[0],\n            });\n        }\n\n        let base = serde_json::to_value(&self.base)\n''',
              '''        if self.base.experiment.seed != self.seeds[0] {\n            return Err(ResearchExperimentError::BaseSeedMismatch {\n                base_seed: self.base.experiment.seed,\n                first_seed: self.seeds[0],\n            });\n        }\n        if let Some(spatial) = &self.base.spatial {\n            if spatial.spatial_model_semantics_id != SPATIAL_MODEL_SEMANTICS_ID {\n                return Err(ResearchExperimentError::SpatialModelSemanticsMismatch {\n                    found: spatial.spatial_model_semantics_id.clone(),\n                    expected: SPATIAL_MODEL_SEMANTICS_ID.to_owned(),\n                });\n            }\n        }\n\n        let base = serde_json::to_value(&self.base)\n''',
              'base spatial semantics validation',
          )
          text = replace_exact(
              text,
              '''        let mut ids = BTreeSet::new();\n        let mut paths = BTreeSet::new();\n        for dimension in &self.dimensions {\n''',
              '''        let mut ids = BTreeSet::new();\n        let mut paths = BTreeSet::new();\n        let mut point_count = 1_usize;\n        for dimension in &self.dimensions {\n''',
              'point count initialization',
          )
          text = replace_exact(
              text,
              '''            if !paths.insert(dimension.path.clone()) {\n                return Err(ResearchExperimentError::DuplicateDimensionPath(\n                    dimension.path.clone(),\n                ));\n            }\n        }\n        Ok(())\n''',
              '''            if !paths.insert(dimension.path.clone()) {\n                return Err(ResearchExperimentError::DuplicateDimensionPath(\n                    dimension.path.clone(),\n                ));\n            }\n            point_count = point_count\n                .checked_mul(dimension.values.len())\n                .ok_or(ResearchExperimentError::TooManyPoints)?;\n            if point_count > MAX_RESEARCH_POINTS {\n                return Err(ResearchExperimentError::TooManyPoints);\n            }\n        }\n        Ok(())\n''',
              'point expansion limit',
          )
          text = replace_exact(
              text,
              '''pub struct ResearchSpatialConfig {\n    pub landscape: LandscapeBundle,\n    pub mechanisms: SpatialMechanismConfig,\n}\n''',
              '''pub struct ResearchSpatialConfig {\n    pub spatial_model_semantics_id: String,\n    pub landscape: LandscapeBundle,\n    pub mechanisms: SpatialMechanismConfig,\n}\n''',
              'spatial semantics field',
          )
          text = replace_exact(
              text,
              '''    match &run_config.spatial {\n        Some(spatial) => SpatialLandscapeSimulation::new(\n            run_config.experiment.clone(),\n            spatial.landscape.clone(),\n            spatial.mechanisms.clone(),\n        )\n        .map(|_| ())\n        .map_err(|error| ResearchExperimentError::InvalidResolvedConfiguration(error.to_string())),\n        None => Simulation::new(run_config.experiment.clone())\n''',
              '''    match &run_config.spatial {\n        Some(spatial) => {\n            if spatial.spatial_model_semantics_id != SPATIAL_MODEL_SEMANTICS_ID {\n                return Err(ResearchExperimentError::SpatialModelSemanticsMismatch {\n                    found: spatial.spatial_model_semantics_id.clone(),\n                    expected: SPATIAL_MODEL_SEMANTICS_ID.to_owned(),\n                });\n            }\n            SpatialLandscapeSimulation::new(\n                run_config.experiment.clone(),\n                spatial.landscape.clone(),\n                spatial.mechanisms.clone(),\n            )\n            .map(|_| ())\n            .map_err(|error| {\n                ResearchExperimentError::InvalidResolvedConfiguration(error.to_string())\n            })\n        }\n        None => Simulation::new(run_config.experiment.clone())\n''',
              'resolved spatial semantics validation',
          )
          text = replace_exact(
              text,
              '''    if segments.as_slice() == ["experiment", "seed"] {\n        return Err(ResearchExperimentError::SeedIsNotDimension);\n    }\n    Ok(())\n''',
              '''    if segments.as_slice() == ["experiment", "seed"] {\n        return Err(ResearchExperimentError::SeedIsNotDimension);\n    }\n    if segments.as_slice() == ["spatial", "spatialModelSemanticsId"] {\n        return Err(ResearchExperimentError::ReservedDimensionPath(\n            path.to_owned(),\n        ));\n    }\n    Ok(())\n''',
              'reserve spatial semantics identity',
          )
          text = replace_exact(
              text,
              '''    #[error(\n        "base ExperimentConfig seed {base_seed} must equal the first declared seed {first_seed}"\n    )]\n    BaseSeedMismatch { base_seed: u64, first_seed: u64 },\n    #[error("research dimension id may not be empty")]\n''',
              '''    #[error(\n        "base ExperimentConfig seed {base_seed} must equal the first declared seed {first_seed}"\n    )]\n    BaseSeedMismatch { base_seed: u64, first_seed: u64 },\n    #[error(\n        "research spatial model semantics {found} do not match this build's executable semantics {expected}"\n    )]\n    SpatialModelSemanticsMismatch { found: String, expected: String },\n    #[error("research dimension id may not be empty")]\n''',
              'spatial semantics error',
          )
          text = replace_exact(
              text,
              '''        definition.base.spatial = Some(ResearchSpatialConfig {\n            landscape,\n            mechanisms,\n        });\n''',
              '''        definition.base.spatial = Some(ResearchSpatialConfig {\n            spatial_model_semantics_id: SPATIAL_MODEL_SEMANTICS_ID.to_owned(),\n            landscape,\n            mechanisms,\n        });\n''',
              'spatial test fixture semantics',
          )
          text = replace_exact(
              text,
              '''        assert_ne!(points[0].point_id, points[1].point_id);\n    }\n\n    #[test]\n    fn invalid_model_variant_is_rejected_by_normal_execution_validation() {\n        let mut definition = base_definition();\n        definition.dimensions.push(ResearchDimension {\n            id: "migration_model".to_owned(),\n            kind: ResearchDimensionKind::Structural,\n            path: "/experiment/migration/modelId".to_owned(),\n            values: vec![Value::String("not-a-real-model".to_owned())],\n        });\n        let point = definition.expand().unwrap().remove(0);\n        assert!(matches!(\n            validate_resolved_research_run(&point.run_config),\n            Err(ResearchExperimentError::InvalidResolvedConfiguration(_))\n        ));\n    }\n}\n''',
              '''        assert_ne!(points[0].point_id, points[1].point_id);\n\n        let mut incompatible = definition.clone();\n        incompatible\n            .base\n            .spatial\n            .as_mut()\n            .unwrap()\n            .spatial_model_semantics_id = "anthrosim-spatial-model-semantics-impossible".to_owned();\n        assert!(matches!(\n            incompatible.expand(),\n            Err(ResearchExperimentError::SpatialModelSemanticsMismatch { .. })\n        ));\n    }\n\n    #[test]\n    fn invalid_enum_variant_fails_during_typed_expansion() {\n        let mut definition = base_definition();\n        definition.dimensions.push(ResearchDimension {\n            id: "population_initialization".to_owned(),\n            kind: ResearchDimensionKind::Structural,\n            path: "/experiment/population/initialization".to_owned(),\n            values: vec![Value::String("not_a_population_initialization".to_owned())],\n        });\n        assert!(matches!(\n            definition.expand(),\n            Err(ResearchExperimentError::InvalidDimensionApplication { .. })\n        ));\n    }\n\n    #[test]\n    fn cartesian_expansion_fails_closed_above_point_limit() {\n        let first = (0_u64..317).collect::<Vec<_>>();\n        let second = (0_u64..316).collect::<Vec<_>>();\n        let mut definition = base_definition();\n        definition.dimensions = vec![\n            numeric(\n                "annual_need",\n                "/experiment/resources/annualNeedUnitsPerPerson",\n                &first,\n            ),\n            numeric(\n                "minimum_utility",\n                "/experiment/migration/minimumUtilityImprovement",\n                &second,\n            ),\n        ];\n        assert_eq!(definition.expand(), Err(ResearchExperimentError::TooManyPoints));\n    }\n}\n''',
              'replace invalid variant test and add hardening tests',
          )
          core.write_text(text)

          runner = Path('crates/anthrosim-cli/src/bin/anthrosim-research.rs')
          text = runner.read_text()
          text = replace_exact(
              text,
              '''    Population, ResearchCoordinate, ResearchExperimentDefinition, ResearchPoint, ResearchRunConfig,\n    Simulation, SimulationCheckpoint, SourceRevisionIdentity, SpatialLandscapeCheckpoint,\n    SpatialLandscapeRunManifest, SpatialLandscapeSimulation, World, research_run_identity,\n''',
              '''    Population, ResearchCoordinate, ResearchExperimentDefinition, ResearchPoint, ResearchRunConfig,\n    RunManifest, Simulation, SimulationCheckpoint, SourceRevisionIdentity, SpatialLandscapeCheckpoint,\n    SpatialLandscapeRunManifest, SpatialLandscapeSimulation, World, research_run_identity,\n''',
              'runner RunManifest import',
          )
          text = replace_exact(
              text,
              '''const RESEARCH_MANIFEST: &str = "research-manifest.json";\nconst RESEARCH_STATE: &str = "research-state.json";\n''',
              '''const RESEARCH_MANIFEST: &str = "research-manifest.json";\nconst RESEARCH_PLAN: &str = "research-plan.json";\nconst RESEARCH_STATE: &str = "research-state.json";\n''',
              'research plan constant',
          )
          text = text.replace(
              'let digest = validate_completed_run(&run_dir, planned)?;',
              'let digest = validate_completed_run(&run_dir, planned, &manifest.source)?;',
          )
          text = text.replace(
              'match execute_planned_run(&run_dir, planned) {',
              'match execute_planned_run(&run_dir, planned, &manifest.source) {',
          )
          old_prepare = '''fn prepare_root(\n    root: &Path,\n    expected: &ResearchExecutionManifest,\n    retry: bool,\n) -> Result<(), Box<dyn Error>> {\n    reject_symlink(root, "research root")?;\n    let manifest_path = root.join(RESEARCH_MANIFEST);\n    if retry {\n        if !root.is_dir() {\n            return Err(format!(\n                "research root does not exist for --retry: {}",\n                root.display()\n            )\n            .into());\n        }\n        let recorded: ResearchExecutionManifest = read_json(&manifest_path)?;\n        if &recorded != expected {\n            return Err(\n                "--retry definition/source does not exactly match immutable research-manifest.json"\n                    .into(),\n            );\n        }\n        return Ok(());\n    }\n\n    if root.exists() {\n        if !root.is_dir() {\n            return Err(format!(\n                "research root exists and is not a directory: {}",\n                root.display()\n            )\n            .into());\n        }\n        if fs::read_dir(root)?.next().transpose()?.is_some() {\n            return Err(format!("research root is not empty: {}", root.display()).into());\n        }\n    } else {\n        fs::create_dir_all(root)?;\n    }\n    write_json_atomic(&manifest_path, expected, "immutable research manifest")?;\n    Ok(())\n}\n'''
          new_prepare = '''#[derive(Debug)]\nenum ImmutableMetadataRecord {\n    Missing,\n    Valid(ResearchExecutionManifest),\n    Malformed(String),\n}\n\nfn inspect_immutable_metadata(\n    path: &Path,\n    role: &str,\n) -> Result<ImmutableMetadataRecord, Box<dyn Error>> {\n    if !bundle::artifact_fs::regular_file_exists(path, role)? {\n        return Ok(ImmutableMetadataRecord::Missing);\n    }\n    let content = bundle::artifact_fs::read_to_string(path, role)?;\n    Ok(match serde_json::from_str::<ResearchExecutionManifest>(&content) {\n        Ok(manifest) => ImmutableMetadataRecord::Valid(manifest),\n        Err(error) => ImmutableMetadataRecord::Malformed(error.to_string()),\n    })\n}\n\nfn metadata_matches_expected(\n    record: &ImmutableMetadataRecord,\n    expected: &ResearchExecutionManifest,\n    role: &str,\n) -> Result<bool, Box<dyn Error>> {\n    match record {\n        ImmutableMetadataRecord::Valid(actual) if actual == expected => Ok(true),\n        ImmutableMetadataRecord::Valid(_) => Err(format!(\n            "--retry definition/source does not exactly match immutable {role}"\n        )\n        .into()),\n        ImmutableMetadataRecord::Missing | ImmutableMetadataRecord::Malformed(_) => Ok(false),\n    }\n}\n\nfn metadata_problem(record: &ImmutableMetadataRecord, role: &str) -> String {\n    match record {\n        ImmutableMetadataRecord::Missing => format!("{role} is missing"),\n        ImmutableMetadataRecord::Malformed(error) => format!("{role} is malformed: {error}"),\n        ImmutableMetadataRecord::Valid(_) => format!("{role} is valid"),\n    }\n}\n\nfn prepare_root(\n    root: &Path,\n    expected: &ResearchExecutionManifest,\n    retry: bool,\n) -> Result<(), Box<dyn Error>> {\n    reject_symlink(root, "research root")?;\n    let manifest_path = root.join(RESEARCH_MANIFEST);\n    let plan_path = root.join(RESEARCH_PLAN);\n    if retry {\n        if !root.exists() {\n            return Err(format!(\n                "research root does not exist for --retry: {}",\n                root.display()\n            )\n            .into());\n        }\n        if !root.is_dir() {\n            return Err(format!(\n                "research root exists and is not a directory: {}",\n                root.display()\n            )\n            .into());\n        }\n        if fs::read_dir(root)?.next().transpose()?.is_none() {\n            // A crash after creating the root but before publishing immutable metadata is safe to\n            // restart because no scientific child could have been published yet.\n            write_json_atomic(&plan_path, expected, "immutable research plan")?;\n            write_json_atomic(&manifest_path, expected, "immutable research manifest")?;\n            return Ok(());\n        }\n\n        let manifest_record =\n            inspect_immutable_metadata(&manifest_path, "immutable research manifest")?;\n        let plan_record = inspect_immutable_metadata(&plan_path, "immutable research plan")?;\n        let manifest_matches =\n            metadata_matches_expected(&manifest_record, expected, RESEARCH_MANIFEST)?;\n        let plan_matches = metadata_matches_expected(&plan_record, expected, RESEARCH_PLAN)?;\n        if !manifest_matches && !plan_matches {\n            return Err(format!(\n                "cannot recover immutable research metadata without one exact corroborating copy: {}; {}",\n                metadata_problem(&manifest_record, RESEARCH_MANIFEST),\n                metadata_problem(&plan_record, RESEARCH_PLAN),\n            )\n            .into());\n        }\n        if !plan_matches {\n            write_json_atomic(&plan_path, expected, "immutable research plan")?;\n        }\n        if !manifest_matches {\n            write_json_atomic(&manifest_path, expected, "immutable research manifest")?;\n        }\n        return Ok(());\n    }\n\n    if root.exists() {\n        if !root.is_dir() {\n            return Err(format!(\n                "research root exists and is not a directory: {}",\n                root.display()\n            )\n            .into());\n        }\n        if fs::read_dir(root)?.next().transpose()?.is_some() {\n            return Err(format!("research root is not empty: {}", root.display()).into());\n        }\n    } else {\n        fs::create_dir_all(root)?;\n    }\n    // Publish the redundant immutable plan first. If the process dies between these two atomic\n    // writes, --retry reconstructs the manifest from the exact plan before any run is attempted.\n    write_json_atomic(&plan_path, expected, "immutable research plan")?;\n    write_json_atomic(&manifest_path, expected, "immutable research manifest")?;\n    Ok(())\n}\n'''
          text = replace_exact(text, old_prepare, new_prepare, 'crash-recoverable root metadata')
          old_state = '''fn load_or_initialize_state(\n    path: &Path,\n    manifest: &ResearchExecutionManifest,\n    retry: bool,\n) -> Result<ResearchExecutionState, Box<dyn Error>> {\n    if path.exists() {\n        let state: ResearchExecutionState = read_json(path)?;\n        state.validate_plan(manifest)?;\n        return Ok(state);\n    }\n    if retry {\n        // A crash after publishing the immutable manifest but before the first mutable state write\n        // is recoverable because the complete run plan lives in the manifest.\n        let state = ResearchExecutionState::new(manifest);\n        write_state(path, &state)?;\n        return Ok(state);\n    }\n    let state = ResearchExecutionState::new(manifest);\n    write_state(path, &state)?;\n    Ok(state)\n}\n'''
          new_state = '''fn load_or_initialize_state(\n    path: &Path,\n    manifest: &ResearchExecutionManifest,\n    retry: bool,\n) -> Result<ResearchExecutionState, Box<dyn Error>> {\n    if bundle::artifact_fs::regular_file_exists(path, "research execution state")? {\n        let content =\n            bundle::artifact_fs::read_to_string(path, "research execution state")?;\n        match serde_json::from_str::<ResearchExecutionState>(&content) {\n            Ok(state) => {\n                state.validate_plan(manifest)?;\n                return Ok(state);\n            }\n            Err(error) if retry => {\n                // Mutable state is reconstructible from the immutable plan plus child-bundle\n                // reconciliation. Never guess immutable identity fields from a damaged state file.\n                let state = ResearchExecutionState::new(manifest);\n                write_state(path, &state)?;\n                return Ok(state);\n            }\n            Err(error) => {\n                return Err(format!("research execution state is malformed: {error}").into());\n            }\n        }\n    }\n    if retry {\n        // A crash after publishing immutable metadata but before the first mutable state write is\n        // recoverable because the complete run plan lives in the manifest/plan pair.\n        let state = ResearchExecutionState::new(manifest);\n        write_state(path, &state)?;\n        return Ok(state);\n    }\n    let state = ResearchExecutionState::new(manifest);\n    write_state(path, &state)?;\n    Ok(state)\n}\n'''
          text = replace_exact(text, old_state, new_state, 'mutable state recovery')
          text = replace_exact(
              text,
              '''fn execute_planned_run(\n    run_dir: &Path,\n    planned: &PlannedRun,\n) -> Result<RunCompletion, Box<dyn Error>> {\n''',
              '''fn execute_planned_run(\n    run_dir: &Path,\n    planned: &PlannedRun,\n    source: &SourceRevisionIdentity,\n) -> Result<RunCompletion, Box<dyn Error>> {\n''',
              'planned run source argument',
          )
          text = replace_exact(
              text,
              '''    transaction.commit()?;\n    validate_completed_run(run_dir, planned)?;\n    Ok(completion)\n}\n''',
              '''    transaction.commit()?;\n    validate_completed_run(run_dir, planned, source)?;\n    Ok(completion)\n}\n''',
              'post-commit source validation',
          )
          old_validate = '''fn validate_completed_run(run_dir: &Path, planned: &PlannedRun) -> Result<u64, Box<dyn Error>> {\n    bundle::validated_bundle_files(run_dir)?;\n    let checkpoint: SimulationCheckpoint = read_json(&run_dir.join("checkpoint.json"))?;\n    if checkpoint.experiment != planned.run_config.experiment {\n        return Err(format!(\n            "completed bundle {} has an ExperimentConfig different from immutable research plan",\n            run_dir.display()\n        )\n        .into());\n    }\n    match &planned.run_config.spatial {\n        Some(expected) => {\n            let landscape: anthrosim_core::LandscapeBundle =\n                read_json(&run_dir.join("landscape.json"))?;\n            let mechanisms: anthrosim_core::SpatialMechanismConfig =\n                read_json(&run_dir.join("spatial-mechanisms.json"))?;\n            let wrapper_manifest: SpatialLandscapeRunManifest =\n                read_json(&run_dir.join("landscape-manifest.json"))?;\n            let wrapper_checkpoint: SpatialLandscapeCheckpoint =\n                read_json(&run_dir.join("landscape-checkpoint.json"))?;\n            if landscape != expected.landscape\n                || mechanisms != expected.mechanisms\n                || wrapper_manifest.core_manifest.experiment != planned.run_config.experiment\n                || wrapper_checkpoint.core_checkpoint.experiment != planned.run_config.experiment\n            {\n                return Err("completed spatial bundle differs from immutable research plan".into());\n            }\n        }\n        None => {\n            if run_dir.join("landscape.json").exists() {\n                return Err(\n                    "non-spatial planned run unexpectedly contains spatial artifacts".into(),\n                );\n            }\n        }\n    }\n    Ok(checkpoint.state_digest64)\n}\n'''
          new_validate = '''fn validate_completed_run(\n    run_dir: &Path,\n    planned: &PlannedRun,\n    source: &SourceRevisionIdentity,\n) -> Result<u64, Box<dyn Error>> {\n    bundle::validated_bundle_files(run_dir)?;\n    let run_manifest: RunManifest = read_json(&run_dir.join("manifest.json"))?;\n    let checkpoint: SimulationCheckpoint = read_json(&run_dir.join("checkpoint.json"))?;\n    let source_mismatch = run_manifest.model_version != source.model_version\n        || run_manifest.model_semantics_id != source.model_semantics_id\n        || run_manifest.git_commit != source.git_commit\n        || checkpoint.model_version != source.model_version\n        || checkpoint.model_semantics_id != source.model_semantics_id\n        || checkpoint.git_commit != source.git_commit;\n    if source_mismatch\n        || run_manifest.experiment != planned.run_config.experiment\n        || checkpoint.experiment != planned.run_config.experiment\n        || checkpoint.state_digest64 != run_manifest.state_digest64\n    {\n        return Err(format!(\n            "completed bundle {} differs from immutable research run configuration/source",\n            run_dir.display()\n        )\n        .into());\n    }\n    match &planned.run_config.spatial {\n        Some(expected) => {\n            let landscape: anthrosim_core::LandscapeBundle =\n                read_json(&run_dir.join("landscape.json"))?;\n            let mechanisms: anthrosim_core::SpatialMechanismConfig =\n                read_json(&run_dir.join("spatial-mechanisms.json"))?;\n            let wrapper_manifest: SpatialLandscapeRunManifest =\n                read_json(&run_dir.join("landscape-manifest.json"))?;\n            let wrapper_checkpoint: SpatialLandscapeCheckpoint =\n                read_json(&run_dir.join("landscape-checkpoint.json"))?;\n            if landscape != expected.landscape\n                || mechanisms != expected.mechanisms\n                || wrapper_manifest.core_manifest != run_manifest\n                || wrapper_checkpoint.core_checkpoint != checkpoint\n                || wrapper_checkpoint.spatial.spatial_model_semantics_id\n                    != expected.spatial_model_semantics_id\n            {\n                return Err("completed spatial bundle differs from immutable research plan".into());\n            }\n        }\n        None => {\n            if run_dir.join("landscape.json").exists() {\n                return Err(\n                    "non-spatial planned run unexpectedly contains spatial artifacts".into(),\n                );\n            }\n        }\n    }\n    Ok(checkpoint.state_digest64)\n}\n'''
          text = replace_exact(text, old_validate, new_validate, 'strong completed-run validation')
          text = replace_exact(
              text,
              '''        assert!(after.runs.values().all(|run| run.attempt == 1));\n\n        let runs: serde_json::Value = read_json(&root.join("analysis/runs.json")).unwrap();\n''',
              '''        assert!(after.runs.values().all(|run| run.attempt == 1));\n        assert!(after.runs.values().all(|run| run.state_digest64.is_some()));\n        assert_eq!(\n            before\n                .runs\n                .values()\n                .map(|run| run.state_digest64)\n                .collect::<Vec<_>>(),\n            after\n                .runs\n                .values()\n                .map(|run| run.state_digest64)\n                .collect::<Vec<_>>()\n        );\n\n        let runs: serde_json::Value = read_json(&root.join("analysis/runs.json")).unwrap();\n''',
              'idempotent retry digest assertion',
          )
          insert_before = '''    #[test]\n    fn invalid_definition_fails_before_research_root_is_created() {\n'''
          extra_tests = '''    #[test]\n    fn missing_run_is_recreated_with_same_identity_configuration_and_digest() {\n        let root = temp_root("recreate-missing");\n        let definition_path = root.with_extension("json");\n        fs::write(\n            &definition_path,\n            serde_json::to_vec_pretty(&tiny_definition()).unwrap(),\n        )\n        .unwrap();\n        execute(&Cli {\n            definition: definition_path.clone(),\n            run_dir: root.clone(),\n            retry: false,\n        })\n        .unwrap();\n\n        let manifest_before: ResearchExecutionManifest =\n            read_json(&root.join(RESEARCH_MANIFEST)).unwrap();\n        let state_before: ResearchExecutionState = read_json(&root.join(RESEARCH_STATE)).unwrap();\n        let planned = &manifest_before.points[0].runs[0];\n        let run_id = planned.run_id.clone();\n        let run_config = planned.run_config.clone();\n        let relative_dir = planned.relative_dir.clone();\n        let digest_before = state_before.runs[&run_id].state_digest64.unwrap();\n        fs::remove_dir_all(root.join(&relative_dir)).unwrap();\n\n        execute(&Cli {\n            definition: definition_path.clone(),\n            run_dir: root.clone(),\n            retry: true,\n        })\n        .unwrap();\n\n        let manifest_after: ResearchExecutionManifest =\n            read_json(&root.join(RESEARCH_MANIFEST)).unwrap();\n        assert_eq!(manifest_after, manifest_before);\n        let state_after: ResearchExecutionState = read_json(&root.join(RESEARCH_STATE)).unwrap();\n        let recreated = &state_after.runs[&run_id];\n        assert_eq!(recreated.attempt, 2);\n        assert_eq!(recreated.state_digest64, Some(digest_before));\n        let checkpoint: SimulationCheckpoint =\n            read_json(&root.join(relative_dir).join("checkpoint.json")).unwrap();\n        assert_eq!(checkpoint.experiment, run_config.experiment);\n\n        fs::remove_dir_all(&root).unwrap();\n        fs::remove_file(definition_path).unwrap();\n    }\n\n    #[test]\n    fn retry_recovers_redundant_root_metadata_and_malformed_mutable_state() {\n        let root = temp_root("root-recovery");\n        let definition_path = root.with_extension("json");\n        fs::write(\n            &definition_path,\n            serde_json::to_vec_pretty(&tiny_definition()).unwrap(),\n        )\n        .unwrap();\n        execute(&Cli {\n            definition: definition_path.clone(),\n            run_dir: root.clone(),\n            retry: false,\n        })\n        .unwrap();\n        let expected: ResearchExecutionManifest = read_json(&root.join(RESEARCH_MANIFEST)).unwrap();\n\n        fs::remove_file(root.join(RESEARCH_MANIFEST)).unwrap();\n        fs::write(root.join(RESEARCH_STATE), b"{malformed").unwrap();\n        execute(&Cli {\n            definition: definition_path.clone(),\n            run_dir: root.clone(),\n            retry: true,\n        })\n        .unwrap();\n        let recovered_manifest: ResearchExecutionManifest =\n            read_json(&root.join(RESEARCH_MANIFEST)).unwrap();\n        let recovered_plan: ResearchExecutionManifest = read_json(&root.join(RESEARCH_PLAN)).unwrap();\n        assert_eq!(recovered_manifest, expected);\n        assert_eq!(recovered_plan, expected);\n        let recovered_state: ResearchExecutionState = read_json(&root.join(RESEARCH_STATE)).unwrap();\n        assert!(\n            recovered_state\n                .runs\n                .values()\n                .all(|run| run.state == RunStateKind::Completed && run.attempt == 1)\n        );\n\n        fs::write(root.join(RESEARCH_PLAN), b"{malformed-again").unwrap();\n        execute(&Cli {\n            definition: definition_path.clone(),\n            run_dir: root.clone(),\n            retry: true,\n        })\n        .unwrap();\n        let recovered_plan_again: ResearchExecutionManifest =\n            read_json(&root.join(RESEARCH_PLAN)).unwrap();\n        assert_eq!(recovered_plan_again, expected);\n\n        fs::remove_dir_all(&root).unwrap();\n        fs::remove_file(definition_path).unwrap();\n    }\n\n'''
          if insert_before not in text:
              raise SystemExit('expected runner invalid-definition test marker not found')
          text = text.replace(insert_before, extra_tests + insert_before, 1)
          runner.write_text(text)

          doc = Path('docs/research/research-experiment-definition-v1.md')
          text = doc.read_text()
          text = text.replace(
              '- optional `base.spatial`: an exact `LandscapeBundle` plus `SpatialMechanismConfig`;',
              '- optional `base.spatial`: the exact `SPATIAL_MODEL_SEMANTICS_ID`, `LandscapeBundle`, and `SpatialMechanismConfig`;',
          )
          text = text.replace(
              '`/experiment/seed` is reserved because seeds are controlled by the ordered top-level `seeds` list. Any `schemaVersion` path is also reserved. Changing either through a scientific dimension would mix provenance/schema identity with scientific coordinates and is rejected.',
              '`/experiment/seed` is reserved because seeds are controlled by the ordered top-level `seeds` list. Any `schemaVersion` path is also reserved. `/spatial/spatialModelSemanticsId` is likewise reserved: it identifies executable build semantics and cannot be pretended into existence by a within-build dimension. Changing any of these through a scientific dimension would mix provenance/schema identity with scientific coordinates and is rejected.',
          )
          text = text.replace(
              'Dimensions are expanded as a Cartesian product in declaration order. Values retain their listed order. Under schema v1 the final declared dimension varies fastest. A definition with no dimensions still produces one scientific point: the exact base configuration.',
              'Dimensions are expanded as a Cartesian product in declaration order. Values retain their listed order. Under schema v1 the final declared dimension varies fastest. A definition with no dimensions still produces one scientific point: the exact base configuration. Expansion fails closed above 100,000 scientific points rather than allocating an unbounded orchestration plan.',
          )
          text = text.replace(
              'The research runner writes one immutable `research-manifest.json` before scientific execution. It contains the original definition, source-revision identity, all expanded points, all per-seed runs, and every exact resulting configuration.',
              'The research runner writes a redundant immutable `research-plan.json` / `research-manifest.json` pair before scientific execution. Each contains the original definition, source-revision identity, all expanded points, all per-seed runs, and every exact resulting configuration. The plan is published first so a crash between the two atomic metadata writes can reconstruct the manifest before any scientific child run is attempted.',
          )
          text = text.replace(
              '`--retry` is fail-closed: the supplied definition and current source revision must reconstruct exactly the immutable recorded manifest. Existing completed bundles are revalidated against their exact planned `ExperimentConfig` and, for spatial runs, their exact landscape/mechanism configuration. Valid completed runs are retained; missing or failed runs are retried under the same immutable run identity. A retry may not silently substitute a new configuration.',
              '`--retry` is fail-closed: the supplied definition and current source revision must reconstruct exactly at least one valid immutable root copy, and any valid immutable copy that disagrees causes failure. A missing or malformed counterpart is deterministically reconstructed. Mutable `research-state.json` may also be reconstructed from the immutable plan and child bundles if a crash leaves it missing or malformed. Existing completed bundles are revalidated against their exact planned `ExperimentConfig`, exact source revision and, for spatial runs, their exact spatial semantics/landscape/mechanism configuration. Valid completed runs are retained; missing or failed runs are retried under the same immutable run identity and must reproduce the same deterministic result. A retry may not silently substitute a new configuration.',
          )
          doc.write_text(text)
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1
      - name: Format and targeted validation
        run: |
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked -p anthrosim-core research_experiment::tests --all-features
          cargo test --locked -p anthrosim-cli --bin anthrosim-research --all-features
      - name: Commit hardening pass
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/anthrosim-core/src/research_experiment.rs crates/anthrosim-cli/src/bin/anthrosim-research.rs docs/research/research-experiment-definition-v1.md
          git commit -m "fix: harden exact research experiment recovery and identity"
          git push origin HEAD:feat/205-exact-sensitivity-definition
