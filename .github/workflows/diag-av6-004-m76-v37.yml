name: Validate and stage AV6-004 M7.6 v37 refresh

on:
  push:
    branches: ["audit/diag-707-m76-v37"]

permissions:
  actions: read
  contents: write

jobs:
  validate-refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Download exact-head M7.6 derived artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m7-6-resource-variability-derived
          path: /tmp/m76
          github-token: ${{ github.token }}
          run-id: 34550568231
      - name: Validate bounded v37 delta and refresh reference
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          path = Path('experiments/v0.1-resource-variability-reference.json')
          reference = json.loads(path.read_text())
          points = json.loads(Path('/tmp/m76/analysis/points.json').read_text())
          summary = json.loads(Path('/tmp/m76/analysis/summary.json').read_text())
          record = json.loads(Path('/tmp/m76/reproduction-record.json').read_text())

          assert reference['schemaVersion'] == 3
          assert reference['modelSemanticsId'] == 'anthrosim-model-semantics-v36'
          assert record['definitionSha256'] == reference['definitionSha256']
          assert summary['completedRuns'] == 144
          assert summary['nonCompletedRuns'] == 0
          assert summary['scientificallyEligibleRuns'] == 144
          assert len(points) == 18
          assert all(row['completedRuns'] == 8 for row in points)
          assert all(row['failedRuns'] == 0 for row in points)
          assert all(row['operationallyCensoredRuns'] == 0 for row in points)

          observed = []
          for row in points:
              observed.append({
                  'pointId': row['pointId'],
                  'resourceProductivityScalePermille': row['resourceProductivityScalePermille'],
                  'resourceSeasonalityScalePermille': row['resourceSeasonalityScalePermille'],
                  'migrationEnabled': not row['disableMigration'],
                  'durationReachedRuns': row['durationReachedRuns'],
                  'populationExtinctRuns': row['populationExtinctRuns'],
                  'meanFinalLivingPopulationCompletedOnly': row['meanFinalLivingPopulationScientificallyEligibleOnly'],
                  'meanFinalLivingOccupiedCellCountCompletedOnly': row['meanFinalLivingOccupiedCellCountScientificallyEligibleOnly'],
                  'meanLivingConditionPermilleCompletedOnly': row['meanLivingConditionPermilleScientificallyEligibleOnly'],
                  'meanConditionMortalityDeathsCompletedOnly': row['meanConditionMortalityDeathsScientificallyEligibleOnly'],
                  'meanResourceUnmetNeedCompletedOnly': row['meanResourceUnmetNeedScientificallyEligibleOnly'],
                  'meanMigrationMovesCompletedOnly': row['meanMigrationMovesScientificallyEligibleOnly'],
                  'meanMigrationTotalDistanceCellsCompletedOnly': row['meanMigrationTotalDistanceCellsScientificallyEligibleOnly'],
                  'pooledMeanMigrationDistanceCellsPerMoveCompletedOnly': row['pooledMeanMigrationDistanceCellsPerMoveScientificallyEligibleOnly'],
              })

          old = {row['pointId']: row for row in reference['pointResults']}
          new = {row['pointId']: row for row in observed}
          assert old.keys() == new.keys()

          expected_changed = {
              'point-000000','point-000001','point-000002','point-000003','point-000004','point-000005',
              'point-000006','point-000007','point-000009','point-000010','point-000011',
              'point-000013','point-000015','point-000017',
          }
          allowed_outcome_fields = {
              'meanFinalLivingPopulationCompletedOnly',
              'meanFinalLivingOccupiedCellCountCompletedOnly',
              'meanLivingConditionPermilleCompletedOnly',
              'meanConditionMortalityDeathsCompletedOnly',
              'meanResourceUnmetNeedCompletedOnly',
              'meanMigrationMovesCompletedOnly',
              'meanMigrationTotalDistanceCellsCompletedOnly',
              'pooledMeanMigrationDistanceCellsPerMoveCompletedOnly',
          }
          changed = set()
          for point_id in sorted(old):
              diffs = {key for key in old[point_id] if old[point_id][key] != new[point_id][key]}
              if diffs:
                  changed.add(point_id)
                  assert diffs <= allowed_outcome_fields, (point_id, sorted(diffs))
                  # Experimental coordinates and categorical completion outcomes are representation-independent.
                  for key in ('resourceProductivityScalePermille','resourceSeasonalityScalePermille','migrationEnabled','durationReachedRuns','populationExtinctRuns'):
                      assert old[point_id][key] == new[point_id][key], (point_id, key)
                  if not new[point_id]['migrationEnabled']:
                      assert not (diffs & {
                          'meanMigrationMovesCompletedOnly',
                          'meanMigrationTotalDistanceCellsCompletedOnly',
                          'pooledMeanMigrationDistanceCellsPerMoveCompletedOnly',
                      })
          assert changed == expected_changed, (sorted(changed), sorted(expected_changed))
          assert {p for p in old if p not in changed} == {'point-000008','point-000012','point-000014','point-000016'}

          reference['modelSemanticsId'] = 'anthrosim-model-semantics-v37'
          reference['pointResults'] = observed
          reference['note'] += (
              ' Audit-v6 AV6-004/#707 changes M3 scarce-resource equal-remainder allocation by removing canonical '
              'resource-cell index from the deterministic tie phase. Exact-head CI run 34550568231 reran all 18 '
              'M7.6 parameter points and 144/144 declared simulations under living v37. All runs completed and '
              'remained scientifically eligible. A fail-closed comparison against the v36 snapshot found changes '
              'only in downstream resource/condition/population/migration outcome fields at exactly 14 points; '
              'point-000008, point-000012, point-000014 and point-000016 reproduced exactly, while experimental '
              'coordinates, completion/extinction classifications, definition identity and eligibility/accounting '
              'guards remained unchanged. Because AV6-004 intentionally changes authoritative scarce-resource '
              'recipient trajectories, this is a numerical v37 refresh rather than a provenance-only rebind.'
          )
          path.write_text(json.dumps(reference, separators=(',', ':')) + '\n')
          print('validated_changed_points=', sorted(changed))
          print('m76_reference_refresh=v36_to_v37')
          PY
      - name: Commit staged diagnostic refresh and remove helper workflow
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/diag-av6-004-m76-v37.yml
          git add experiments/v0.1-resource-variability-reference.json
          git commit -m 'test(audit-v6): stage guarded M7.6 v37 reference refresh'
          git push origin HEAD:audit/diag-707-m76-v37
