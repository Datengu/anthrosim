name: Rebaseline AV6-003 v40 household lifecycle evidence

on:
  push:
    branches:
      - audit/repair-699-av6-003
    paths:
      - .github/workflows/verify-av6-003-v40-household-lifecycle-reference.yml

permissions:
  contents: write

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-699-av6-003
          persist-credentials: true

      - name: Independently reproduce frozen issue 207 design under v40
        run: |
          cargo run --release -p anthrosim-core --example household_lifecycle_sensitivity > /tmp/household-lifecycle-v40.json

      - name: Preserve v21 evidence and bind living reference to reviewed v40 artifact
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          current_path = Path('research/household-lifecycle-sensitivity-v2/reference-result.json')
          historical_path = Path('research/household-lifecycle-sensitivity-v2/reference-result-v21.json')
          raw_path = Path('/tmp/household-lifecycle-v40.json')

          historical_bytes = current_path.read_bytes()
          historical = json.loads(historical_bytes)
          old_provenance = historical.get('provenance', {})
          assert old_provenance.get('workflowRunId') == 33272700305
          assert old_provenance.get('workflowHeadSha') == '2b8edc9130286ae991dbf76021786418ace79432'
          assert old_provenance.get('artifactId') == 9720595797

          if not historical_path.exists():
              historical_path.write_bytes(historical_bytes)
          else:
              assert historical_path.read_bytes() == historical_bytes

          raw = raw_path.read_bytes()
          raw_sha = hashlib.sha256(raw).hexdigest()
          assert raw_sha == 'e242f2ed153ca65f4aca4b91d79fdc63c82a6255ef099e505a2a4dc170997d75'
          generated = json.loads(raw)
          assert generated['schemaVersion'] == 2
          assert generated['seeds'] == [20701, 20702, 20703, 20704, 20705, 20706, 20707, 20708]
          assert generated['durationYears'] == 40
          assert generated['baseline']['completedRuns'] == 8
          assert generated['deterministicSizeFission']['completedRuns'] == 8
          assert generated['baseline']['populationExtinctRuns'] == 0
          assert generated['deterministicSizeFission']['populationExtinctRuns'] == 0

          old_science = dict(historical)
          old_science.pop('provenance', None)
          changed = [
              key for key in sorted(set(old_science) | set(generated))
              if old_science.get(key) != generated.get(key)
          ]
          assert changed == ['baseline', 'deterministicSizeFission']

          generated['provenance'] = {
              'modelSemanticsId': 'anthrosim-model-semantics-v40',
              'workflowRunId': 34614039366,
              'workflowHeadSha': '599fc83201066997e2662603a7a5516126b32972',
              'artifactId': 10269147530,
              'artifactDigest': 'sha256:1d1d400ba269e8356a55f5e98f52eb4280105367a62a38dfe1010cf74331bc38',
              'rawResultSha256': raw_sha,
              'independentReproductionRunId': int('${{ github.run_id }}'),
              'independentReproductionHeadSha': '${{ github.sha }}',
          }
          current_path.write_text(json.dumps(generated, indent=2) + '\n', encoding='utf-8')
          print('Preserved byte-identical v21 reference and rebound living #207 aggregate to reviewed v40 evidence.')
          print('Independent v40 rerun reproduced raw JSON SHA-256:', raw_sha)
          PY

      - name: Verify rebaseline hygiene
        run: |
          python3 scripts/test-current-household-lifecycle-docs.py
          python3 scripts/test-current-model-semantics-docs.py
          git diff --check

      - name: Commit evidence-bound v40 reference and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/verify-av6-003-v40-household-lifecycle-reference.yml
          git add research/household-lifecycle-sensitivity-v2/reference-result.json
          git add research/household-lifecycle-sensitivity-v2/reference-result-v21.json
          git diff --cached --check
          git commit -m "research: revalidate household lifecycle sensitivity on v40"
          git push origin HEAD:audit/repair-699-av6-003
