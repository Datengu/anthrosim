name: AV3-006 post-merge reverification
on:
  pull_request:
    paths:
      - "scripts/reverify-av3-006.py"
      - "scripts/research-monte-carlo-sufficiency.py"
      - ".github/workflows/reverify-av3-006.yml"
permissions:
  contents: read
jobs:
  reverify:
    name: Reverify same-seed covariance repair
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Run independent AV3-006 adversary
        run: python3 scripts/reverify-av3-006.py
