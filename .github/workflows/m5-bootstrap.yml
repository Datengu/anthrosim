name: M5 bootstrap

on:
  push:
    branches: [feat/m5-observability]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.1.0
      - name: Patch M2-M4 systems with M5 hooks
        run: |
          python - <<'PY'
          from pathlib import Path

          def patch(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"pattern not found in {path}: {old[:120]!r}")
              p.write_text(text.replace(old, new, 1))

          # Demography: preserve the existing API while exposing a recorded path.
          patch('crates/anthrosim-core/src/demography.rs',
          '''    population::{Population, PopulationError, ReproductiveSex},
              rng::RngFactory,
          ''',
          '''    events::{DeathCause, EventKind, EventLog},
              population::{Population, PopulationError, ReproductiveSex},
              rng::{RngFactory, RngStreamPosition},
          ''')

          patch('crates/anthrosim-core/src/demography.rs',
          '''impl DemographyRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      mortality: factory.stream("demography/mortality"),
                      fertility: factory.stream("demography/fertility"),
                      parentage: factory.stream("demography/parentage"),
                      newborn_sex: factory.stream("demography/newborn_sex"),
                  }
              }
          }
          ''',
          '''impl DemographyRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      mortality: factory.stream("demography/mortality"),
                      fertility: factory.stream("demography/fertility"),
                      parentage: factory.stream("demography/parentage"),
                      newborn_sex: factory.stream("demography/newborn_sex"),
                  }
              }

              pub(crate) fn positions(&self) -> [RngStreamPosition; 4] {
                  [
                      RngStreamPosition::capture(&self.mortality),
                      RngStreamPosition::capture(&self.fertility),
                      RngStreamPosition::capture(&self.parentage),
                      RngStreamPosition::capture(&self.newborn_sex),
                  ]
              }

              pub(crate) fn restore_positions(&mut self, positions: [RngStreamPosition; 4]) {
                  positions[0].restore(&mut self.mortality);
                  positions[1].restore(&mut self.fertility);
                  positions[2].restore(&mut self.parentage);
                  positions[3].restore(&mut self.newborn_sex);
              }
          }
          ''')

          patch('crates/anthrosim-core/src/demography.rs',
          '''pub(crate) fn process_demographic_year(
              population: &mut Population,
              world: &World,
              config: &DemographyConfig,
              day: u64,
              rngs: &mut DemographyRngs,
          ) -> Result<DemographyStepOutcome, PopulationError> {
          ''',
          '''pub(crate) fn process_demographic_year(
              population: &mut Population,
              world: &World,
              config: &DemographyConfig,
              day: u64,
              rngs: &mut DemographyRngs,
          ) -> Result<DemographyStepOutcome, PopulationError> {
              let mut events = EventLog::new();
              process_demographic_year_recorded(population, world, config, day, rngs, &mut events)
          }

          pub(crate) fn process_demographic_year_recorded(
              population: &mut Population,
              world: &World,
              config: &DemographyConfig,
              day: u64,
              rngs: &mut DemographyRngs,
              events: &mut EventLog,
          ) -> Result<DemographyStepOutcome, PopulationError> {
          ''')

          patch('crates/anthrosim-core/src/demography.rs',
          '''        if draw_per_million(&mut rngs.mortality, probability) {
                      population.mark_death(index, day);
                  }
          ''',
          '''        if draw_per_million(&mut rngs.mortality, probability) {
                      let person = population.person_id_at_index(index).ok_or(
                          PopulationError::InternalInvariant {
                              reason: "living person is missing a stable ID at mortality boundary",
                          },
                      )?;
                      let household = population.household_at_index(index).ok_or(
                          PopulationError::InternalInvariant {
                              reason: "living person is missing a household at mortality boundary",
                          },
                      )?;
                      let cell = population.location_at_index(index).ok_or(
                          PopulationError::InternalInvariant {
                              reason: "living person is missing a location at mortality boundary",
                          },
                      )?;
                      let condition = population.condition_at_index(index).ok_or(
                          PopulationError::InternalInvariant {
                              reason: "living person is missing condition at mortality boundary",
                          },
                      )?;
                      if population.mark_death(index, day) {
                          events.push_authoritative(
                              day,
                              EventKind::Death {
                                  person,
                                  household,
                                  cell,
                                  cause: DeathCause::DemographicMortality,
                                  condition_permille: condition,
                                  probability_per_million: probability,
                              },
                          );
                      }
                  }
          ''')

          patch('crates/anthrosim-core/src/demography.rs',
          '''        population.note_successful_birth(female_index, day);
                  births_added = true;
          ''',
          '''        population.note_successful_birth(female_index, day);
                  let newborn_index = population.person_count().saturating_sub(1);
                  let newborn = population.person_id_at_index(newborn_index).ok_or(
                      PopulationError::InternalInvariant {
                          reason: "newborn is missing a stable person ID",
                      },
                  )?;
                  events.push_authoritative(
                      day,
                      EventKind::Birth {
                          person: newborn,
                          female_parent,
                          male_parent,
                          household,
                          cell: location,
                          reproductive_sex: newborn_sex,
                      },
                  );
                  births_added = true;
          ''')

          # Resources: authoritative scarcity deaths plus RNG/state hooks.
          patch('crates/anthrosim-core/src/resources.rs',
          '''    config::{PROBABILITY_PER_MILLION, ResourceConfig},
              demography::draw_per_million,
              ids::HouseholdId,
              population::{Population, PopulationError},
              rng::RngFactory,
          ''',
          '''    config::{PROBABILITY_PER_MILLION, ResourceConfig},
              demography::draw_per_million,
              events::{DeathCause, EventKind, EventLog},
              ids::HouseholdId,
              population::{Population, PopulationError},
              rng::{RngFactory, RngStreamPosition},
          ''')

          patch('crates/anthrosim-core/src/resources.rs',
          '''    pub(crate) fn process_period(
                  &mut self,
                  population: &mut Population,
                  world: &World,
                  config: &ResourceConfig,
                  period_index_in_year: u16,
                  day: u64,
                  scarcity_rng: &mut ChaCha8Rng,
              ) -> Result<ResourceStepOutcome, ResourceError> {
          ''',
          '''    pub(crate) fn process_period(
                  &mut self,
                  population: &mut Population,
                  world: &World,
                  config: &ResourceConfig,
                  period_index_in_year: u16,
                  day: u64,
                  scarcity_rng: &mut ChaCha8Rng,
              ) -> Result<ResourceStepOutcome, ResourceError> {
                  let mut events = EventLog::new();
                  self.process_period_recorded(
                      population,
                      world,
                      config,
                      period_index_in_year,
                      day,
                      scarcity_rng,
                      &mut events,
                  )
              }

              pub(crate) fn process_period_recorded(
                  &mut self,
                  population: &mut Population,
                  world: &World,
                  config: &ResourceConfig,
                  period_index_in_year: u16,
                  day: u64,
                  scarcity_rng: &mut ChaCha8Rng,
                  events: &mut EventLog,
              ) -> Result<ResourceStepOutcome, ResourceError> {
          ''')

          patch('crates/anthrosim-core/src/resources.rs',
          '''            if draw_per_million(scarcity_rng, probability)
                          && population.mark_death(person_index, day)
                      {
                          self.scarcity_deaths = self
                              .scarcity_deaths
                              .checked_add(1)
                              .ok_or(ResourceError::AccountingOverflow)?;
                      }
          ''',
          '''            if draw_per_million(scarcity_rng, probability) {
                          let person = population.person_id_at_index(person_index).ok_or(
                              ResourceError::InternalInvariant("living person has no stable ID"),
                          )?;
                          let household = population.household_at_index(person_index).ok_or(
                              ResourceError::InternalInvariant("living person has no household"),
                          )?;
                          let cell = population.location_at_index(person_index).ok_or(
                              ResourceError::InternalInvariant("living person has no location"),
                          )?;
                          if population.mark_death(person_index, day) {
                              self.scarcity_deaths = self
                                  .scarcity_deaths
                                  .checked_add(1)
                                  .ok_or(ResourceError::AccountingOverflow)?;
                              events.push_authoritative(
                                  day,
                                  EventKind::Death {
                                      person,
                                      household,
                                      cell,
                                      cause: DeathCause::ResourceScarcity,
                                      condition_permille: condition,
                                      probability_per_million: probability,
                                  },
                              );
                          }
                      }
          ''')

          patch('crates/anthrosim-core/src/resources.rs',
          '''impl ResourceRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      scarcity_mortality: factory.stream("resources/scarcity_mortality"),
                  }
              }
          }
          ''',
          '''impl ResourceRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      scarcity_mortality: factory.stream("resources/scarcity_mortality"),
                  }
              }

              pub(crate) fn position(&self) -> RngStreamPosition {
                  RngStreamPosition::capture(&self.scarcity_mortality)
              }

              pub(crate) fn restore_position(&mut self, position: RngStreamPosition) {
                  position.restore(&mut self.scarcity_mortality);
              }
          }
          ''')

          patch('crates/anthrosim-core/src/resources.rs',
          '''    fn validate_accounting(&self) -> Result<(), ResourceError> {
          ''',
          '''    pub(crate) fn validate_checkpoint_state(
                  &self,
                  world: &World,
                  config: &ResourceConfig,
              ) -> Result<(), ResourceError> {
                  if self.schema_version != Self::CURRENT_SCHEMA_VERSION
                      || self.model_id != config.model_id
                      || self.cell_food_stock.len() != world.cell_count()
                      || self.initial_world_digest64 != format!("{:016x}", world.digest64())
                  {
                      return Err(ResourceError::StateShapeMismatch);
                  }
                  self.validate_accounting()
              }

              fn validate_accounting(&self) -> Result<(), ResourceError> {
          ''')

          # Migration: persistent checkpoint state, RNG positions, and all move events.
          patch('crates/anthrosim-core/src/migration.rs',
          '''    config::MigrationConfig,
              ids::{CellId, HouseholdId, PersonId},
          ''',
          '''    config::MigrationConfig,
              events::{EventKind, EventLog},
              ids::{CellId, HouseholdId, PersonId},
          ''')
          patch('crates/anthrosim-core/src/migration.rs',
          '''    rng::RngFactory,
          ''',
          '''    rng::{RngFactory, RngStreamPosition},
          ''')

          marker = '''impl MigrationSummary {
              pub const CURRENT_SCHEMA_VERSION: u32 = 1;
          }
          '''
          insertion = marker + '''
          #[derive(Debug, Clone, PartialEq, Eq, Serialize, Deserialize)]
          #[serde(rename_all = "camelCase")]
          pub struct MigrationCheckpointState {
              pub schema_version: u32,
              pub model_id: String,
              pub decision_boundaries: u64,
              pub households_evaluated: u64,
              pub households_under_pressure: u64,
              pub moves_completed: u64,
              pub people_moved: u64,
              pub total_distance_cells: u64,
              pub northward_steps: u64,
              pub eastward_steps: u64,
              pub southward_steps: u64,
              pub westward_steps: u64,
              pub travel_condition_cost_total: u64,
              pub origin_resource_score_total: u64,
              pub destination_resource_score_total: u64,
              pub origin_water_security_score_total: u64,
              pub destination_water_security_score_total: u64,
              pub occupied_cell_delta_from_migration: i64,
              pub recorded_decision_traces: Vec<MigrationDecisionTrace>,
          }

          impl MigrationCheckpointState {
              pub const CURRENT_SCHEMA_VERSION: u32 = 1;
          }
          '''
          patch('crates/anthrosim-core/src/migration.rs', marker, insertion)

          patch('crates/anthrosim-core/src/migration.rs',
          '''impl MigrationRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      choice: factory.stream("migration/choice"),
                      uncertainty: factory.stream("migration/uncertainty"),
                  }
              }
          }
          ''',
          '''impl MigrationRngs {
              #[must_use]
              pub(crate) fn new(factory: RngFactory) -> Self {
                  Self {
                      choice: factory.stream("migration/choice"),
                      uncertainty: factory.stream("migration/uncertainty"),
                  }
              }

              pub(crate) fn positions(&self) -> [RngStreamPosition; 2] {
                  [
                      RngStreamPosition::capture(&self.choice),
                      RngStreamPosition::capture(&self.uncertainty),
                  ]
              }

              pub(crate) fn restore_positions(&mut self, positions: [RngStreamPosition; 2]) {
                  positions[0].restore(&mut self.choice);
                  positions[1].restore(&mut self.uncertainty);
              }
          }
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''    pub(crate) fn process_boundary(
                  &mut self,
                  population: &mut Population,
                  context: &MigrationBoundaryContext<'_>,
                  rngs: &mut MigrationRngs,
              ) -> Result<(), MigrationError> {
          ''',
          '''    pub(crate) fn process_boundary(
                  &mut self,
                  population: &mut Population,
                  context: &MigrationBoundaryContext<'_>,
                  rngs: &mut MigrationRngs,
              ) -> Result<(), MigrationError> {
                  let mut events = EventLog::new();
                  self.process_boundary_recorded(population, context, rngs, &mut events)
              }

              pub(crate) fn process_boundary_recorded(
                  &mut self,
                  population: &mut Population,
                  context: &MigrationBoundaryContext<'_>,
                  rngs: &mut MigrationRngs,
                  events: &mut EventLog,
              ) -> Result<(), MigrationError> {
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''                condition_cost,
                      )?;
          ''',
          '''                condition_cost,
                          events,
                      )?;
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''        condition_cost: u16,
              ) -> Result<(), MigrationError> {
          ''',
          '''        condition_cost: u16,
                  events: &mut EventLog,
              ) -> Result<(), MigrationError> {
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''        let _ = household_index;
                  let _ = population;
                  Ok(())
          ''',
          '''        events.push_authoritative(
                      day,
                      EventKind::HouseholdMigration {
                          household,
                          people_moved: members,
                          origin,
                          destination: selected.cell,
                          distance_cells: selected.distance,
                          pressure_permille: pressure,
                          origin_utility,
                          destination_utility: selected.utility,
                          best_candidate,
                          best_candidate_utility,
                          selected_weight: selected.weight,
                          total_move_weight: total_weight,
                          choice_draw,
                          travel_condition_cost_per_person: condition_cost,
                      },
                  );
                  let _ = household_index;
                  let _ = population;
                  Ok(())
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''    #[must_use]
              pub fn digest64(&self) -> u64 {
          ''',
          '''    pub(crate) fn checkpoint_state(&self) -> MigrationCheckpointState {
                  MigrationCheckpointState {
                      schema_version: MigrationCheckpointState::CURRENT_SCHEMA_VERSION,
                      model_id: self.model_id.clone(),
                      decision_boundaries: self.decision_boundaries,
                      households_evaluated: self.households_evaluated,
                      households_under_pressure: self.households_under_pressure,
                      moves_completed: self.moves_completed,
                      people_moved: self.people_moved,
                      total_distance_cells: self.total_distance_cells,
                      northward_steps: self.northward_steps,
                      eastward_steps: self.eastward_steps,
                      southward_steps: self.southward_steps,
                      westward_steps: self.westward_steps,
                      travel_condition_cost_total: self.travel_condition_cost_total,
                      origin_resource_score_total: self.origin_resource_score_total,
                      destination_resource_score_total: self.destination_resource_score_total,
                      origin_water_security_score_total: self.origin_water_security_score_total,
                      destination_water_security_score_total: self.destination_water_security_score_total,
                      occupied_cell_delta_from_migration: self.occupied_cell_delta_from_migration,
                      recorded_decision_traces: self.recorded_decision_traces.clone(),
                  }
              }

              pub(crate) fn from_checkpoint_state(
                  population: &Population,
                  world: &World,
                  config: &MigrationConfig,
                  state: MigrationCheckpointState,
              ) -> Result<Self, MigrationError> {
                  if state.schema_version != MigrationCheckpointState::CURRENT_SCHEMA_VERSION
                      || state.model_id != config.model_id
                  {
                      return Err(MigrationError::CheckpointStateMismatch);
                  }
                  let mut system = Self::initialize(population, world, config)?;
                  system.decision_boundaries = state.decision_boundaries;
                  system.households_evaluated = state.households_evaluated;
                  system.households_under_pressure = state.households_under_pressure;
                  system.moves_completed = state.moves_completed;
                  system.people_moved = state.people_moved;
                  system.total_distance_cells = state.total_distance_cells;
                  system.northward_steps = state.northward_steps;
                  system.eastward_steps = state.eastward_steps;
                  system.southward_steps = state.southward_steps;
                  system.westward_steps = state.westward_steps;
                  system.travel_condition_cost_total = state.travel_condition_cost_total;
                  system.origin_resource_score_total = state.origin_resource_score_total;
                  system.destination_resource_score_total = state.destination_resource_score_total;
                  system.origin_water_security_score_total = state.origin_water_security_score_total;
                  system.destination_water_security_score_total = state.destination_water_security_score_total;
                  system.occupied_cell_delta_from_migration = state.occupied_cell_delta_from_migration;
                  system.recorded_decision_traces = state.recorded_decision_traces;
                  Ok(system)
              }

              #[must_use]
              pub fn digest64(&self) -> u64 {
          ''')

          patch('crates/anthrosim-core/src/migration.rs',
          '''    #[error("migration state shape does not match population/world")]
              StateShapeMismatch,
          ''',
          '''    #[error("migration state shape does not match population/world")]
              StateShapeMismatch,
              #[error("migration checkpoint state is incompatible with this model/config")]
              CheckpointStateMismatch,
          ''')
          PY
          cargo fmt --all
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/anthrosim-core/src
          git commit -m "M5: instrument authoritative lifecycle events and checkpoint hooks"
          git push
