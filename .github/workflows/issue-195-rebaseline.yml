name: issue-195-rebaseline
on:
  push:
    branches:
      - fix/195-m4-proportional-weights
    paths:
      - .github/issue-195-rebaseline-apply.py
      - .github/workflows/issue-195-rebaseline.yml
permissions:
  contents: read
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh latest issue branch and update active M7.6 semantics assertion
        run: |
          git fetch origin fix/195-m4-proportional-weights
          git checkout -B fix/195-m4-proportional-weights origin/fix/195-m4-proportional-weights
          python .github/issue-195-rebaseline-apply.py
      - name: Upload patched CI workflow
        uses: actions/upload-artifact@v4
        with:
          name: issue-195-patched-ci
          path: .github/workflows/ci.yml
          if-no-files-found: error
          retention-days: 1
