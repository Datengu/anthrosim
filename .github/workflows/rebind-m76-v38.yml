# Temporary fail-closed M7.6 provenance rebind; removed automatically after success.
name: Guard M7.6 v38 provenance rebind

on:
  push:
    branches: ["audit/repair-711-av6-006"]
    paths: [".github/workflows/rebind-m76-v38.yml"]

permissions:
  actions: read
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Download exact-head M7.6 derived evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m7-6-resource-variability-derived
          path: /tmp/m76
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 34557084821
          repository: Datengu/anthrosim
      - name: Prove exact numerical equality and stage provenance-only rebind
        run: |
          python3 .github/scripts/rebind_m76_v38.py
          git diff --check
      - name: Commit validated rebind and remove temporary helpers
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v0.1-resource-variability-reference.json
          git rm .github/scripts/rebind_m76_v38.py .github/workflows/rebind-m76-v38.yml
          git commit -m "test(audit-v6): rebind M7.6 reference to v38"
          git push origin HEAD:audit/repair-711-av6-006
