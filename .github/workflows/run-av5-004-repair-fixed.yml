name: Run corrected AV5-004 repair staging

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/run-av5-004-repair-fixed.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          fetch-depth: 0
          persist-credentials: true

      - name: Apply production repair with disposable anchor precondition
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Adjust only the rustfmt whitespace that differs from asserted anchor 10.
          # This checkout is disposable; cargo fmt below restores canonical formatting
          # before any production commit is permitted.
          mobility = Path('crates/anthrosim-core/src/temporary_mobility.rs')
          text = mobility.read_text()
          canonical = "            equal_cost_destinations: None,\n            destination_tie_seed: None,\n        };\n"
          staged_anchor = "            equal_cost_destinations: None,\n        destination_tie_seed: None,\n    };\n"
          if text.count(canonical) != 1:
              raise SystemExit(
                  f'anchor-10 precondition expected one canonical initializer, found {text.count(canonical)}'
              )
          mobility.write_text(text.replace(canonical, staged_anchor, 1))

          workflow = Path('.github/workflows/apply-av5-004-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')
          script = '\n'.join(
              line[10:] if line.startswith('          ') else line
              for line in workflow[start:end]
          ) + '\n'
          exec(compile(script, '<av5-004-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Format and run focused regressions
        shell: bash
        run: |
          cargo fmt --all
          cargo test --locked -p anthrosim-core \
            --test m9_spatial_isomorphism_invariance \
            --test m9_remote_founder_tie_locality \
            --test m9_household_label_invariance

      - name: Commit production repair
        shell: bash
        run: |
          git config user.name "Datengu"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_travel.rs \
                  crates/anthrosim-core/src/temporary_mobility.rs \
                  crates/anthrosim-core/src/temporary_observability.rs \
                  crates/anthrosim-core/src/spatial_simulation.rs \
                  crates/anthrosim-core/src/provenance.rs \
                  crates/anthrosim-core/tests/m9_spatial_isomorphism_invariance.rs
          git diff --cached --quiet && { echo 'no production changes staged'; exit 1; }
          git commit -m "fix: make M9 destination ties spatially equivariant"
          git push origin HEAD:audit/repair-629-av5-004
