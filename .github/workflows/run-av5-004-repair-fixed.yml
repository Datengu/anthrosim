name: Run corrected AV5-004 repair staging

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/run-av5-004-repair-fixed.yml'

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          fetch-depth: 0
          persist-credentials: true

      - name: Apply asserted production repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/apply-av5-004-repair.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line == '          from pathlib import Path')
          end = next(i for i in range(start + 1, len(workflow)) if workflow[i] == '          PY')
          source = [line[10:] if line.startswith('          ') else line for line in workflow[start:end]]

          helper_start = source.index('def replace_once(path, old, new):')
          helper_end = source.index('    path.write_text(text.replace(old, new, 1))') + 1
          source[helper_start:helper_end] = [
              'def replace_once(path, old, new):',
              '    path = Path(path)',
              '    text = path.read_text()',
              '    count = text.count(old)',
              '    if count == 1:',
              '        path.write_text(text.replace(old, new, 1))',
              '        return',
              '    if count != 0:',
              '        raise SystemExit(f"{path}: expected one replacement target, found {count}")',
              '    text_lines = text.splitlines(keepends=True)',
              '    old_lines = old.splitlines(keepends=True)',
              '    target = [line.lstrip(" \\t") for line in old_lines]',
              '    matches = []',
              '    width = len(old_lines)',
              '    for start in range(0, len(text_lines) - width + 1):',
              '        window = text_lines[start:start + width]',
              '        if [line.lstrip(" \\t") for line in window] == target:',
              '            matches.append((start, start + width))',
              '    if len(matches) != 1:',
              '        first = old.splitlines()[0] if old.splitlines() else "<empty>"',
              '        raise SystemExit(f"{path}: structural target count={len(matches)} for {first!r}")',
              '    start, stop = matches[0]',
              '    replacement = new.splitlines(keepends=True)',
              '    path.write_text("".join(text_lines[:start] + replacement + text_lines[stop:]))',
          ]
          exec(compile('\n'.join(source) + '\n', '<av5-004-repair>', 'exec'), {'__name__': '__main__'})
          PY

      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Format and run focused regressions
        shell: bash
        run: |
          cargo fmt --all
          cargo test --locked -p anthrosim-core \
            --test m9_spatial_isomorphism_invariance \
            --test m9_remote_founder_tie_locality \
            --test m9_household_label_invariance

      - name: Commit production repair
        shell: bash
        run: |
          git config user.name "Datengu"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_travel.rs \
                  crates/anthrosim-core/src/temporary_mobility.rs \
                  crates/anthrosim-core/src/temporary_observability.rs \
                  crates/anthrosim-core/src/spatial_simulation.rs \
                  crates/anthrosim-core/src/provenance.rs \
                  crates/anthrosim-core/tests/m9_spatial_isomorphism_invariance.rs
          git diff --cached --quiet && { echo 'no production changes staged'; exit 1; }
          git commit -m "fix: make M9 destination ties spatially equivariant"
          git push origin HEAD:audit/repair-629-av5-004
