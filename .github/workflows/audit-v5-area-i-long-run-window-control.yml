name: Audit v5 Area I long-run window control

on:
  pull_request:
    paths:
      - 'scripts/audit-v5-area-i-long-run-window-control.py'
      - 'scripts/research-long-run-diagnostics.py'
      - '.github/workflows/audit-v5-area-i-long-run-window-control.yml'

permissions:
  contents: read

jobs:
  adversary:
    name: Long-run window sensitivity control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run fresh Audit-v5 Area-I long-run control
        run: python3 scripts/audit-v5-area-i-long-run-window-control.py
