name: M4 Clippy fix bootstrap

on:
  push:
    branches: [feat/m4-migration]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: feat/m4-migration
          persist-credentials: true
      - name: Apply narrow migration interface fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('crates/anthrosim-core/src/migration.rs')
          text = path.read_text()

          marker = '''#[derive(Debug)]\npub struct MigrationRngs {\n'''
          insertion = '''pub(crate) struct MigrationBoundaryContext<'a> {\n    pub world: &'a World,\n    pub resources: &'a ResourceSystem,\n    pub migration: &'a MigrationConfig,\n    pub annual_food_need: u32,\n    pub resource_periods_per_year: u16,\n    pub day: u64,\n}\n\n#[derive(Debug)]\npub struct MigrationRngs {\n'''
          if text.count(marker) != 1:
              raise SystemExit('context insertion marker mismatch')
          text = text.replace(marker, insertion, 1)

          old = '''    pub(crate) fn process_boundary(\n        &mut self,\n        population: &mut Population,\n        world: &World,\n        resources: &ResourceSystem,\n        config: &MigrationConfig,\n        annual_food_need: u32,\n        resource_periods_per_year: u16,\n        day: u64,\n        rngs: &mut MigrationRngs,\n    ) -> Result<(), MigrationError> {\n        validate_migration_config(config)?;\n        if !config.enabled || population.living_count() == 0 {\n'''
          new = '''    pub(crate) fn process_boundary(\n        &mut self,\n        population: &mut Population,\n        context: &MigrationBoundaryContext<'_>,\n        rngs: &mut MigrationRngs,\n    ) -> Result<(), MigrationError> {\n        let MigrationBoundaryContext {\n            world,\n            resources,\n            migration: config,\n            annual_food_need,\n            resource_periods_per_year,\n            day,\n        } = *context;\n        validate_migration_config(config)?;\n        if !config.enabled || population.living_count() == 0 {\n'''
          if text.count(old) != 1:
              raise SystemExit('process signature marker mismatch')
          text = text.replace(old, new, 1)

          text = text.replace('u64::from(annual_food_need).div_ceil(u64::from(resource_periods_per_year))',
                              'u64::from(annual_food_need).div_ceil(u64::from(resource_periods_per_year))')

          old = '''        let resource_score = if demand == 0 {\n            PERMILLE_MAX\n        } else {\n            u16::try_from(stock.saturating_mul(u64::from(PERMILLE_MAX)) / demand)\n                .unwrap_or(PERMILLE_MAX)\n                .min(PERMILLE_MAX)\n        };\n'''
          new = '''        let resource_score = u16::try_from(\n            stock\n                .saturating_mul(u64::from(PERMILLE_MAX))\n                .checked_div(demand)\n                .unwrap_or(u64::from(PERMILLE_MAX)),\n        )\n        .unwrap_or(PERMILLE_MAX)\n        .min(PERMILLE_MAX);\n'''
          if text.count(old) != 1:
              raise SystemExit('resource score marker mismatch')
          text = text.replace(old, new, 1)

          old = '''        let total_utility = i32::try_from(positive.saturating_sub(negative)).unwrap_or_else(|_| {\n            if positive >= negative {\n                i32::MAX\n            } else {\n                i32::MIN\n            }\n        });\n'''
          new = '''        let total_utility = i32::try_from(positive.saturating_sub(negative)).unwrap_or({\n            if positive >= negative {\n                i32::MAX\n            } else {\n                i32::MIN\n            }\n        });\n'''
          if text.count(old) != 1:
              raise SystemExit('utility fallback marker mismatch')
          text = text.replace(old, new, 1)

          old = '''                .process_boundary(\n                    &mut population,\n                    &world,\n                    &resources,\n                    &experiment.migration,\n                    experiment.resources.annual_need_units_per_person,\n                    experiment.resources.periods_per_year,\n                    91,\n                    &mut rngs,\n                )\n'''
          new = '''                .process_boundary(\n                    &mut population,\n                    &MigrationBoundaryContext {\n                        world: &world,\n                        resources: &resources,\n                        migration: &experiment.migration,\n                        annual_food_need: experiment.resources.annual_need_units_per_person,\n                        resource_periods_per_year: experiment.resources.periods_per_year,\n                        day: 91,\n                    },\n                    &mut rngs,\n                )\n'''
          if text.count(old) != 1:
              raise SystemExit('test call marker mismatch')
          text = text.replace(old, new, 1)
          path.write_text(text)

          sim = Path('crates/anthrosim-core/src/simulation.rs')
          text = sim.read_text()
          text = text.replace(
              'MigrationConfigError, MigrationError, MigrationRngs, MigrationSystem,',
              'MigrationBoundaryContext, MigrationConfigError, MigrationError, MigrationRngs, MigrationSystem,'
          )
          old = '''                    self.migration.process_boundary(\n                        &mut self.population,\n                        &self.world,\n                        &self.resources,\n                        &self.config.migration,\n                        self.config.resources.annual_need_units_per_person,\n                        self.config.resources.periods_per_year,\n                        day,\n                        &mut migration_rngs,\n                    )?;\n'''
          new = '''                    self.migration.process_boundary(\n                        &mut self.population,\n                        &MigrationBoundaryContext {\n                            world: &self.world,\n                            resources: &self.resources,\n                            migration: &self.config.migration,\n                            annual_food_need: self.config.resources.annual_need_units_per_person,\n                            resource_periods_per_year: self.config.resources.periods_per_year,\n                            day,\n                        },\n                        &mut migration_rngs,\n                    )?;\n'''
          if text.count(old) != 1:
              raise SystemExit('simulation call marker mismatch')
          text = text.replace(old, new, 1)
          sim.write_text(text)
          PY
          cargo fmt --all

      - name: Verify strict Clippy
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit verified fixes
        run: |
          git config user.name "AnthroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add crates/anthrosim-core/src/migration.rs crates/anthrosim-core/src/simulation.rs
          git diff --cached --check
          git commit -m "M4: narrow migration boundary interface"
          git push origin HEAD:feat/m4-migration
