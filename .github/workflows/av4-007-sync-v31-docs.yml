name: AV4-007 sync v31 living documentation

on:
  push:
    branches:
      - repair/av4-007-m9-household-tie-key
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-007-m9-household-tie-key
          fetch-depth: 0
      - name: Apply fail-closed v31 documentation sync
        run: python scripts/av4-007-sync-v31-docs.py
      - name: Validate living semantics guard
        run: python scripts/test-current-model-semantics-docs.py
      - name: Commit living documentation changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md docs/research/m9-equal-cost-destination-choice-v1.md docs/research/m9-temporary-travel-semantics-v1.md scripts/test-current-model-semantics-docs.py
          git diff --cached --check
          git commit -m "docs: describe scientific M9 tie coupling semantics v31"
          git push origin HEAD:repair/av4-007-m9-household-tie-key
