name: Run bundle pack

# Run-bundle validity is a cross-module executable contract. Documentation-only pull requests keep
# the protected context but do not rebuild and repack simulations.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  scope:
    uses: ./.github/workflows/pr-ci-scope.yml
    permissions:
      contents: read
      pull-requests: read

  pack:
    name: Deterministic completed-run ZIP
    needs: scope
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.scope.outputs.full_required != 'true' }}
        run: echo "${{ needs.scope.outputs.scope }} change; executable bundle packing is not applicable."

      - name: Checkout
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Build simulator and packers
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: cargo build --locked --release -p anthrosim-cli --bin anthrosim --bin anthrosim-landscape --bin anthrosim-pack

      - name: Generate completed, paused and transformed-spatial bundles
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          rm -rf /tmp/anthrosim-pack-completed /tmp/anthrosim-pack-paused /tmp/anthrosim-pack-spatial
          rm -f /tmp/anthrosim-pack-completed.zip /tmp/anthrosim-pack-second.zip
          rm -f /tmp/anthrosim-pack-spatial.zip /tmp/anthrosim-pack-spatial-second.zip
          target/release/anthrosim run \
            --years 2 \
            --world-width 8 \
            --world-height 8 \
            --population 100 \
            --seed 71 \
            --run-dir /tmp/anthrosim-pack-completed
          target/release/anthrosim run \
            --years 2 \
            --world-width 8 \
            --world-height 8 \
            --population 100 \
            --seed 71 \
            --run-dir /tmp/anthrosim-pack-paused \
            --checkpoint-year 1
          target/release/anthrosim-landscape run \
            --landscape examples/landscape-loading/landscape.json \
            --mechanisms examples/landscape-loading/spatial-mechanisms.json \
            --years 1 \
            --population 20 \
            --max-person-records 1000 \
            --seed 72 \
            --run-dir /tmp/anthrosim-pack-spatial
          printf 'must not be archived\n' >/tmp/anthrosim-pack-completed/notes.txt
          printf 'must not be archived\n' >/tmp/anthrosim-pack-spatial/notes.txt

      - name: Pack core and spatial bundles twice and require deterministic bytes
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          target/release/anthrosim-pack /tmp/anthrosim-pack-completed
          target/release/anthrosim-pack /tmp/anthrosim-pack-completed \
            --output /tmp/anthrosim-pack-second.zip
          cmp /tmp/anthrosim-pack-completed.zip /tmp/anthrosim-pack-second.zip

          target/release/anthrosim-pack /tmp/anthrosim-pack-spatial
          target/release/anthrosim-pack /tmp/anthrosim-pack-spatial \
            --output /tmp/anthrosim-pack-spatial-second.zip
          cmp /tmp/anthrosim-pack-spatial.zip /tmp/anthrosim-pack-spatial-second.zip

      - name: Validate archives with Python standard ZIP reader
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          python3 - <<'PY'
          import json
          import zipfile
          from pathlib import Path

          archives = {
              Path('/tmp/anthrosim-pack-completed.zip'): [
                  'checkpoint.json',
                  'events.json',
                  'initial-population.json',
                  'manifest.json',
                  'metrics.json',
                  'world.json',
              ],
              Path('/tmp/anthrosim-pack-spatial.zip'): [
                  'checkpoint.json',
                  'events.json',
                  'initial-population.json',
                  'landscape-checkpoint.json',
                  'landscape-manifest.json',
                  'landscape.json',
                  'manifest.json',
                  'metrics.json',
                  'spatial-mechanisms.json',
                  'world.json',
              ],
          }

          for archive, expected in archives.items():
              with zipfile.ZipFile(archive) as packed:
                  assert packed.testzip() is None
                  assert packed.namelist() == expected
                  assert 'notes.txt' not in packed.namelist()
                  for name in expected:
                      json.loads(packed.read(name))
          PY

      - name: Reject paused bundle
        if: ${{ needs.scope.outputs.full_required == 'true' }}
        run: |
          if target/release/anthrosim-pack /tmp/anthrosim-pack-paused >/tmp/paused-pack.log 2>&1; then
            cat /tmp/paused-pack.log
            echo 'paused bundle unexpectedly packed successfully' >&2
            exit 1
          fi
          grep -q 'manifest.json' /tmp/paused-pack.log
