name: Audit v5 Area C death-fission boundary adversary

on:
  pull_request:
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_c_death_fission_boundary.rs'
      - '.github/workflows/audit-v5-area-c-death-fission-boundary.yml'

permissions:
  contents: read

jobs:
  adversary:
    name: Death-before-fission dependency adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-C death-fission adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_c_death_fission_boundary -- --nocapture
