name: Apply issue 190 equal-cost destination patch

on:
  push:
    branches:
      - fix/190-equal-cost-m9-destinations
    paths:
      - .github/workflows/patch-190-equal-cost-destinations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-equal-cost-m9-destinations
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Tighten observability selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/patch-190.py')
          text = p.read_text()
          old = """replace_once(
              path,
              '''    pub route_distance_unavailable_journeys: u64,\\n}\\n''',
              '''    pub route_distance_unavailable_journeys: u64,\\n    pub tied_destination_origin_cells: u64,\\n    pub maximum_equal_cost_destination_count: u32,\\n    pub journeys_started_from_tied_origins: u64,\\n}\\n''',
          )"""
          new = """replace_once(
              path,
              '''    pub route_distance_unavailable_journeys: u64,\\n}\\n\\nimpl Default for TemporaryMobilityObservabilitySummary''',
              '''    pub route_distance_unavailable_journeys: u64,\\n    pub tied_destination_origin_cells: u64,\\n    pub maximum_equal_cost_destination_count: u32,\\n    pub journeys_started_from_tied_origins: u64,\\n}\\n\\nimpl Default for TemporaryMobilityObservabilitySummary''',
          )"""
          if text.count(old) != 1:
              raise SystemExit(f'expected one selector block, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
      - name: Apply semantic patch
        run: python .github/patch-190.py
      - name: Format
        run: cargo fmt --all
      - name: Compile core
        run: cargo check -p anthrosim-core --all-targets
      - name: Run M9.4 travel tests
        run: cargo test -p anthrosim-core temporary_travel -- --nocapture
      - name: Run temporary observability tests
        run: cargo test -p anthrosim-core temporary_observability -- --nocapture
      - name: Remove patch helpers
        if: success()
        run: |
          rm .github/patch-190.py
          rm .github/workflows/patch-190-equal-cost-destinations.yml
      - name: Commit patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve equal-cost M9 destinations symmetrically"
          git push origin HEAD:fix/190-equal-cost-m9-destinations
