name: Apply issue 190 equal-cost destination patch

on:
  push:
    branches:
      - fix/190-equal-cost-m9-destinations
    paths:
      - .github/workflows/patch-190-equal-cost-destinations.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/190-equal-cost-m9-destinations
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - name: Apply semantic patch
        run: python .github/patch-190.py
      - name: Format
        run: cargo fmt --all
      - name: Compile core
        run: cargo check -p anthrosim-core --all-targets
      - name: Run M9.4 travel tests
        run: cargo test -p anthrosim-core temporary_travel -- --nocapture
      - name: Run temporary observability tests
        run: cargo test -p anthrosim-core temporary_observability -- --nocapture
      - name: Remove patch helpers
        if: success()
        run: |
          rm .github/patch-190.py
          rm .github/workflows/patch-190-equal-cost-destinations.yml
      - name: Commit patch
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: resolve equal-cost M9 destinations symmetrically"
          git push origin HEAD:fix/190-equal-cost-m9-destinations
