name: Issue 208 patch applicator

on:
  push:
    branches:
      - fix/208-competing-mortality-risks
    paths:
      - scripts/apply-issue-208.py
      - .github/workflows/issue-208-apply.yml

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[issue208-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/208-competing-mortality-risks
          fetch-depth: 0
      - name: Apply exact source transformation
        run: python3 scripts/apply-issue-208.py
      - name: Format Rust sources
        run: cargo fmt --all
      - name: Commit transformed sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates docs
          if git diff --cached --quiet; then
            echo "No source changes to commit"
            exit 0
          fi
          git commit -m "[issue208-applied] fix: define order-invariant competing mortality risks"
          git push origin HEAD:fix/208-competing-mortality-risks
