name: AV5-001 v34 demography reference rebind

on:
  push:
    branches:
      - audit/repair-606-av5-001

permissions:
  contents: write

jobs:
  rebind:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-606-av5-001
          fetch-depth: 0
      - name: Rebind reproduced demography reference to v34
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('research/general-demography-baseline-v1/confirmatory-result.json')
          text = path.read_text(encoding='utf-8')
          old = '"modelSemanticsId": "anthrosim-model-semantics-v33"'
          new = '"modelSemanticsId": "anthrosim-model-semantics-v34"'
          assert text.count(old) == 1, text.count(old)
          text = text.replace(old, new)
          assert '"modelSemanticsId": "anthrosim-model-semantics-v33"' not in text
          path.write_text(text, encoding='utf-8')
          PY

          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo test --locked -p anthrosim-cli --test general_demography_reference_semantics

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/general-demography-baseline-v1/confirmatory-result.json
          git commit -m "research: rebind reproduced demography reference to v34"
          git push origin HEAD:audit/repair-606-av5-001
