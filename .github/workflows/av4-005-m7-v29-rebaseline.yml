name: AV4-005 M7.6 v29 rebaseline

on:
  push:
    branches:
      - repair/av4-005-parentage-coupling
    paths:
      - ".github/workflows/av4-005-m7-v29-rebaseline.yml"

permissions:
  contents: write
  actions: read

jobs:
  rebaseline:
    name: Materialize reviewed M7.6 v29 reference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-005-parentage-coupling
      - name: Download exact final-head M7.6 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m7-6-resource-variability-derived
          path: /tmp/m7-v29
          repository: Datengu/anthrosim
          run-id: 33816687527
          github-token: ${{ github.token }}
      - name: Materialize reviewed v29 reference
        run: python3 scripts/av4-005-m7-v29-rebaseline.py
      - name: Validate and commit reviewed reference
        run: |
          set -euo pipefail
          git diff --check
          rm .github/workflows/av4-005-m7-v29-rebaseline.yml
          rm scripts/av4-005-m7-v29-rebaseline.py
          git add .github/workflows/ci.yml \
            experiments/v0.1-resource-variability-reference.json \
            docs/research/resource-variability-v0.1.md \
            research/general-demography-baseline-v1/model-semantics-v29-reverification.md \
            .github/workflows/av4-005-m7-v29-rebaseline.yml \
            scripts/av4-005-m7-v29-rebaseline.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "research: rebaseline M7.6 for v29"
          git push origin HEAD:repair/av4-005-parentage-coupling
