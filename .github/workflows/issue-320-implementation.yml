name: Issue 320 implementation
on:
  push:
    branches:
      - fix/320-founder-reproductive-chronology
jobs:
  implement:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/320-founder-reproductive-chronology
      - name: Patch and verify
        run: |
          set -euo pipefail
          python3 .github/scripts/issue-320.py
          python3 .github/scripts/issue-320-callsites-v3.py
          python3 docs/research/audit-v2/area-b-founder-reproductive-chronology-audit.py
          cargo fmt --all
          cargo check --workspace --all-targets
          cargo test -p anthrosim-core founder_initialization -- --nocapture
          cargo test -p anthrosim-core declared_founder -- --nocapture
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates docs/research
          git commit -m 'fix: validate founder reproductive chronology (#320)'
          git push origin HEAD:fix/320-founder-reproductive-chronology
