name: v0.3.5 release preparation patch

on:
  push:
    branches:
      - release/v0.3.5-prep
    paths:
      - .github/workflows/v035-release-prep-patch.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/v0.3.5-prep
          fetch-depth: 0

      - name: Apply fail-closed v0.3.5 release preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          # Package identity. Model semantics deliberately remains v33.
          replace_once('Cargo.toml', 'version = "0.3.4"', 'version = "0.3.5"')
          replace_once(
              'Cargo.lock',
              'name = "anthrosim-cli"\nversion = "0.3.4"',
              'name = "anthrosim-cli"\nversion = "0.3.5"',
          )
          replace_once(
              'Cargo.lock',
              'name = "anthrosim-core"\nversion = "0.3.4"',
              'name = "anthrosim-core"\nversion = "0.3.5"',
          )

          # Standing/current-facing documentation.
          replace_once(
              'README.md',
              '**This source tree is the repaired post-v0.3.4 line at current model semantics v33.** The workspace package version remains `0.3.4` during development, but that does not rewrite the immutable `v0.3.4` release identity: the release tag remains `anthrosim-model-semantics-v25`, and immutable `v0.3.3` remains model semantics v21.',
              '**This source tree carries AnthroSim software version `0.3.5` at current model semantics v33.** The v0.3.5 release line names and preserves the fully repaired and independently re-verified Audit-v4 state. The immutable `v0.3.4` release remains model semantics v25 and the frozen Audit-v4 discovery target; immutable `v0.3.3` remains model semantics v21.',
          )
          replace_once(
              'README.md',
              'The current post-v0.3.4 repaired line retains the completed M1–M9 capability set and the scientific/reproducibility hardening added through subsequent audits:',
              'The current v0.3.5/model-semantics-v33 line retains the completed M1–M9 capability set and the scientific/reproducibility hardening added through subsequent audits:',
          )
          replace_once(
              'README.md',
              '- **v0.3.4:** immutable post-Audit-v3 convergence baseline at model semantics v25 and frozen Audit-v4 target.\n- **Scientific Audit v4:**',
              '- **v0.3.4:** immutable post-Audit-v3 convergence baseline at model semantics v25 and frozen Audit-v4 target.\n- **v0.3.5:** current post-Audit-v4 repaired convergence baseline at model semantics v33; it packages the fully remediated/re-verified v4 line and subsequent documentation-consistency reconciliation without adding a new roadmap milestone.\n- **Scientific Audit v4:**',
          )

          replace_once(
              'docs/architecture.md',
              '**Current framework identity:** post-v0.3.4 repaired development line / current model semantics v33. Immutable release/audit baselines retain their own historical identities.',
              '**Current framework identity:** software version v0.3.5 / current model semantics v33. The immutable v0.3.4/v25 release remains the frozen Audit-v4 discovery target; other historical release/audit baselines retain their own identities.',
          )

          replace_once(
              'docs/roadmap.md',
              '**Current framework line:** repaired post-v0.3.4 development state / current model semantics v33. Immutable `v0.3.4` remains the v25 Audit-v4 discovery/release baseline; the repaired living line does not rewrite it.',
              '**Current framework line:** software version `v0.3.5` / current model semantics v33. Immutable `v0.3.4` remains the v25 Audit-v4 discovery/release baseline; the v0.3.5 release line preserves the repaired v33 state without rewriting that historical target.',
          )
          replace_once(
              'docs/roadmap.md',
              '- **v0.3.4:** post-Audit-v3 convergence release, immutable model semantics v25; frozen Audit-v4 target.\n\nScientific Audit v3',
              '- **v0.3.4:** post-Audit-v3 convergence release, immutable model semantics v25; frozen Audit-v4 target.\n- **v0.3.5:** post-Audit-v4 repaired convergence release line, model semantics v33; no new roadmap milestone.\n\nScientific Audit v3',
          )

          replace_once(
              'docs/research/README.md',
              '**Living framework state:** repaired post-v0.3.4 line / current model semantics v33. Immutable `v0.3.4` remains the Audit-v4 discovery target at model semantics v25; current documentation must not rewrite that historical identity.',
              '**Living framework state:** software version `v0.3.5` / current model semantics v33. Immutable `v0.3.4` remains the Audit-v4 discovery target at model semantics v25; current documentation must not rewrite that historical identity.',
          )
          replace_once(
              'docs/research/README.md',
              '- [`v0.3.4-documentation-readiness-audit.md`](v0.3.4-documentation-readiness-audit.md) — historical pre-release documentation/version-identity convergence record for the v25 release line.',
              '- [`v0.3.4-documentation-readiness-audit.md`](v0.3.4-documentation-readiness-audit.md) — historical pre-release documentation/version-identity convergence record for the v25 release line.\n- [`v0.3.5-release-readiness.md`](v0.3.5-release-readiness.md) — v0.3.5/v33 release-preparation record after completed Audit-v4 remediation and the two post-audit documentation consistency passes.',
          )
          replace_once(
              'docs/research/README.md',
              'The repaired current model semantics v33 line therefore differs scientifically from the immutable v0.3.4/v25 release target; this is intentional.',
              'The v0.3.5/current-model-semantics-v33 line therefore differs scientifically from the immutable v0.3.4/v25 release target; this is intentional.',
          )

          replace_once(
              'docs/research/trace.md',
              '**AnthroSim baseline:** repaired post-v0.3.4 line / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** v0.3.5 release line / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
          )
          replace_once(
              'docs/research/odd.md',
              '**AnthroSim baseline:** repaired post-v0.3.4 line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** v0.3.5 release line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
          )
          replace_once(
              'docs/research/odd-d.md',
              '**AnthroSim baseline:** completed M9 / repaired post-v0.3.4 line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** completed M9 / v0.3.5 release line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
          )
          replace_once(
              'docs/scientific-model.md',
              '**Status:** working specification for the repaired post-v0.3.4 line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**Status:** working specification for the v0.3.5 release line after completed Audit-v4 remediation / current model semantics v33 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
          )

          replace_once(
              'AGENTS.md',
              '- The later `v0.3.1`–`v0.3.4` releases are post-M9 scientific-hardening, documentation-convergence and audit-convergence releases. Current protected `main` may carry the latest named package version while authoritative model semantics continue on a newer post-release development identity; derive the current identity from executable provenance and the living documentation rather than assuming the latest release tag has moved.',
              '- The later `v0.3.1`–`v0.3.5` releases are post-M9 scientific-hardening, documentation-convergence and audit-convergence releases. `v0.3.5` names the fully repaired Audit-v4 line at model semantics v33. Current protected `main` may later advance scientifically beyond the latest named package version; derive current semantics from executable provenance and living documentation rather than assuming a release tag has moved.',
          )

          replace_once(
              'docs/research/citation.md',
              'The current repository citation metadata identifies AnthroSim version `0.3.4` and the Apache-2.0 software licence. That citation version refers to the immutable named `v0.3.4` release baseline. Living protected `main` can contain later compatible or scientifically versioned development work without retroactively changing what the `v0.3.4` tag represents; consult `docs/release-versioning.md` for that distinction.',
              'The current repository citation metadata identifies AnthroSim version `0.3.5` and the Apache-2.0 software licence. The v0.3.5 release line preserves `anthrosim-model-semantics-v33`, the fully repaired Audit-v4 state. The immutable `v0.3.4`/v25 release remains the prior Audit-v4 discovery target and is not rewritten by this patch release; consult `docs/release-versioning.md` for the identity distinction.',
          )

          replace_once(
              'docs/release-versioning.md',
              '- **`v0.3.4`**: post-Scientific-Audit-v3 convergence patch preserving the fully remediated and independently reverified v25 model-semantics baseline.',
              '- **`v0.3.4`**: post-Scientific-Audit-v3 convergence patch preserving the fully remediated and independently reverified v25 model-semantics baseline.\n- **`v0.3.5`**: post-Scientific-Audit-v4 repaired convergence patch preserving the fully remediated/reverified v33 model-semantics baseline plus the completed post-audit documentation-consistency reconciliation.',
          )
          replace_once(
              'docs/release-versioning.md',
              'The immutable `v0.3.4` tag remains `anthrosim-model-semantics-v25`. Scientific Audit v4 subsequently audited that frozen target, and authoritative repairs advanced the living development line through v26–v33. **Current protected `main` still carries workspace package version `0.3.4`, but its authoritative `MODEL_SEMANTICS_ID` is `anthrosim-model-semantics-v33`.** This is a post-release development state, not a retroactive mutation of the v0.3.4 tag and not a new named release.',
              'The immutable `v0.3.4` tag remains `anthrosim-model-semantics-v25`. Scientific Audit v4 subsequently audited that frozen target, and authoritative repairs advanced the living line through v26–v33. **The v0.3.5 release line carries workspace package version `0.3.5` and authoritative `MODEL_SEMANTICS_ID = anthrosim-model-semantics-v33`.** It names and preserves the fully repaired Audit-v4 state; it does not retroactively mutate the v0.3.4/v25 tag or its audit evidence.',
          )
          replace_once(
              'docs/release-versioning.md',
              'The `v0.3.4` release-preparation change itself did not introduce new authoritative model behaviour; it named and preserved the already-reviewed v25 state produced by Audit-v3 remediation. Audit-v4 repairs after that release are why living package `0.3.4` can now coexist with model semantics v33.',
              'The `v0.3.4` release-preparation change itself did not introduce new authoritative model behaviour; it named and preserved the already-reviewed v25 state produced by Audit-v3 remediation. Audit-v4 repairs after that release advanced authoritative semantics through v33. The `v0.3.5` release-preparation change likewise introduces no new causal model behaviour: it assigns a named patch-release identity to the already-reviewed v33 repaired state after Audit-v4 closure and documentation reconciliation.',
          )

          # Preserve the actual v0.3.4 package identity of the reviewed M7.6 v33 artifact,
          # but make the release-version transition explicit so it cannot look stale.
          replace_once(
              'docs/research/resource-variability-v0.1.md',
              '- sweep ID: `anthrosim-sweep-v2-b56e7e725c1ea70e`.\n\nAll **144/144** planned runs completed',
              '- sweep ID: `anthrosim-sweep-v2-b56e7e725c1ea70e`.\n\nThe `0.3.4` model-version value above is preserved execution provenance from the reviewed v33 rebaseline. The v0.3.5 release packages the same v33 scientific semantics; a package-version advance by itself does not rewrite that archived execution identity or require a new scientific reference result.\n\nAll **144/144** planned runs completed',
          )

          # Machine-readable citation metadata for the release being prepared.
          (ROOT / 'CITATION.cff').write_text('''cff-version: 1.2.0
          message: "If you use AnthroSim in research, cite the released software version and preserve the exact source revision used for the experiment."
          title: "AnthroSim"
          type: software
          authors:
            - family-names: "Datengu"
          version: "0.3.5"
          date-released: 2026-09-07
          repository-code: "https://github.com/Datengu/anthrosim"
          url: "https://github.com/Datengu/anthrosim"
          license: "Apache-2.0"
          keywords:
            - agent-based simulation
            - anthropology
            - archaeology
            - reproducibility
            - demography
            - migration
            - temporary mobility
            - aggregation
            - sensitivity analysis
            - identifiability
          abstract: >-
            AnthroSim is a reproducible agent-based simulation framework for deterministic
            demography, resource-constrained permanent household migration,
            evidence-grounded spatial experiments, and explicit temporary mobility and
            aggregation under declared model assumptions. Version 0.3.5 preserves the
            model-semantics-v33 state produced by the complete Scientific Audit v4
            remediation programme. Audit v4 independently interrogated the immutable
            v0.3.4/model-semantics-v25 baseline across Areas A-N, demonstrated 15 findings
            (13 P1 and 2 P2), and all 15 were repaired and independently re-verified or
            dispositioned before closure. The v0.3.5 baseline also incorporates the
            subsequent repository-wide documentation-consistency reconciliation. This
            release is framework-verification/convergence evidence; it does not establish
            empirical archaeological validity or prove model correctness.
          '''.replace('          ', ''), encoding='utf-8')

          # Extend the permanent documentation guard to include the new named release.
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              'V034_RELEASE_DOC = ROOT / "docs" / "releases" / "v0.3.4.md"\nVERSIONING_DOC',
              'V034_RELEASE_DOC = ROOT / "docs" / "releases" / "v0.3.4.md"\nV035_RELEASE_DOC = ROOT / "docs" / "releases" / "v0.3.5.md"\nVERSIONING_DOC',
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              'CITATION_CFF = ROOT / "CITATION.cff"\nCI_PATH_DOC',
              'CITATION_CFF = ROOT / "CITATION.cff"\nCARGO_TOML = ROOT / "Cargo.toml"\nCI_PATH_DOC',
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              'V034_SEMANTICS_ID = "anthrosim-model-semantics-v25"\nV034_SHORT = "v25"',
              'V034_SEMANTICS_ID = "anthrosim-model-semantics-v25"\nV034_SHORT = "v25"\nV035_SEMANTICS_ID = "anthrosim-model-semantics-v33"\nV035_SHORT = "v33"',
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              '    current_id = current_semantics_id()\n    current_short = short_version(current_id)\n    current_phrase = f"current model semantics {current_short}"',
              '''    current_id = current_semantics_id()
              current_short = short_version(current_id)
              current_phrase = f"current model semantics {current_short}"

              cargo_text = CARGO_TOML.read_text(encoding="utf-8")
              workspace_section = re.search(r"\\[workspace\\.package\\]\\n(.*?)(?:\\n\\[|\\Z)", cargo_text, flags=re.DOTALL)
              if workspace_section is None:
                  raise AssertionError("Cargo.toml is missing [workspace.package]")
              workspace_version_match = re.search(r'^version\\s*=\\s*"([^"]+)"', workspace_section.group(1), flags=re.MULTILINE)
              if workspace_version_match is None:
                  raise AssertionError("Cargo.toml workspace.package is missing version")
              current_software_version = workspace_version_match.group(1)
              current_release_tag = f"v{current_software_version}"'''.replace('              ', ''),
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              '        if current_phrase not in text:\n            raise AssertionError(\n                f"{path.relative_to(ROOT)} does not identify executable current semantics as {current_short}"\n            )',
              '        if current_phrase not in text:\n            raise AssertionError(\n                f"{path.relative_to(ROOT)} does not identify executable current semantics as {current_short}"\n            )\n        if current_release_tag not in text:\n            raise AssertionError(\n                f"{path.relative_to(ROOT)} does not identify current software release line as {current_release_tag}"\n            )',
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              '    versioning_text = VERSIONING_DOC.read_text(encoding="utf-8")',
              '''    v035_release_text = V035_RELEASE_DOC.read_text(encoding="utf-8")
              if "Software version: `0.3.5`" not in v035_release_text or f"Model semantics: `{V035_SEMANTICS_ID}`" not in v035_release_text:
                  raise AssertionError("docs/releases/v0.3.5.md does not identify the v0.3.5/v33 release identity")

              versioning_text = VERSIONING_DOC.read_text(encoding="utf-8")'''.replace('              ', ''),
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              '    if current_id not in versioning_text:\n        raise AssertionError("release-versioning policy does not state the current post-release development semantics")',
              '    if (\n        "v0.3.5`**: post-Scientific-Audit-v4 repaired convergence patch preserving the fully "\n        "remediated/reverified v33 model-semantics baseline"\n        not in versioning_text\n    ):\n        raise AssertionError("docs/release-versioning.md does not preserve v0.3.5/v33 identity")\n    if current_id not in versioning_text:\n        raise AssertionError("release-versioning policy does not state the current model semantics")',
          )
          replace_once(
              'scripts/test-current-model-semantics-docs.py',
              '    if cff_version is None:\n        raise AssertionError("CITATION.cff does not expose a version")\n    citation_text',
              '    if cff_version is None:\n        raise AssertionError("CITATION.cff does not expose a version")\n    if cff_version.group(1) != current_software_version:\n        raise AssertionError("CITATION.cff version does not match Cargo workspace version")\n    citation_text',
          )

          # New named release note. Tag creation is intentionally a later step.
          (ROOT / 'docs/releases/v0.3.5.md').write_text('''# AnthroSim v0.3.5 — post-Scientific-Audit-v4 repaired convergence baseline

          Release date: 2026-09-07  
          Software version: `0.3.5`  
          Model semantics: `anthrosim-model-semantics-v33`  
          Previous release: `v0.3.4` / `anthrosim-model-semantics-v25`

          ## Purpose

          v0.3.5 freezes the fully repaired and independently re-verified Scientific Audit v4 line as a named patch baseline. It does not add a new roadmap milestone, and the release-preparation change itself does not alter causal simulator behaviour: the authoritative model semantics were already advanced to v33 by the reviewed Audit-v4 repairs.

          Scientific Audit v4 independently challenged immutable `v0.3.4` / model-semantics-v25 across Areas A–N. Discovery demonstrated **15 findings: 13 P1 and 2 P2**. Post-discovery remediation repaired every finding and independently re-verified/dispositioned all 15 before closure. The frozen v0.3.4 discovery result therefore remains historically non-clean, while this v0.3.5 baseline represents the repaired living state.

          ## Scientific semantics progression since v0.3.4

          Authoritative Audit-v4 repairs advanced model semantics from v25 through v33 where scientific continuation compatibility changed. The repaired v33 state removes arbitrary identifier/container-order coupling from several stochastic assignments, hardens competing mortality and resource-allocation semantics, and preserves the reviewed current scientific contracts documented by ODD, ODD+D, TRACE and the normative model specification.

          The package-version change from 0.3.4 to 0.3.5 is not itself a model-semantics change. Existing historical evidence continues to record the package/model/source identities under which it was actually generated.

          ## Documentation convergence

          After Audit-v4 remediation closed, two repository-wide documentation consistency passes reconciled living status, release/version identities, audit closure, CI/governance wording, citation guidance and historical-versus-current boundaries. Those repairs are included in this baseline. Historical release notes, audit evidence and reviewed experiment records retain the identities they actually evaluated rather than being mechanically rewritten to v0.3.5.

          ## Benchmark/reference state

          - M7.6 resource-variability scientific reference: current model semantics v33. Its reviewed execution retains its actual `0.3.4` package provenance; the 0.3.5 package bump alone does not change the scientific result.
          - M8.6 terrain null-model machine reference: current model semantics v33; classification remains `fragile_spatial_structure` under the declared null model.
          - M9.7 controlled aggregation machine reference: model semantics v31, intentionally retained because the later v32/v33 pathways are causally inapplicable to that frozen benchmark; classification remains `capability_distinguished`.

          These are synthetic capability/regression results, not archaeological validation.

          ## Interpretation limits

          v0.3.5 is a stronger framework-verification/convergence baseline. It does **not** establish empirical calibration for a real population, validate a specific archaeological site, prove model correctness, or remove the need for question-specific evidence roles, uncertainty/sensitivity analysis, identifiability/equifinality assessment, held-out corroboration and domain review.

          ## Release gate

          The `v0.3.5` tag must be created only on the exact current protected-`main` release-candidate SHA after:

          1. workspace package version, both workspace entries in `Cargo.lock`, `CITATION.cff`, this release note and living documentation identify v0.3.5 consistently;
          2. `MODEL_SEMANTICS_ID` remains the reviewed `anthrosim-model-semantics-v33` identity;
          3. every currently required protected-main context is successful on that exact SHA;
          4. exact-SHA release-specific M8.6, M9.7 and RustSec gates are successful;
          5. there are no open release-preparation PRs or demonstrated release-blocking defects.

          Tag creation is deliberately separate from this preparation change. The repository's fail-closed `Preserve named release tag` workflow must perform the final exact-candidate verification before creating the immutable-intent tag.
          '''.replace('          ', ''), encoding='utf-8')

          (ROOT / 'docs/research/v0.3.5-release-readiness.md').write_text('''# AnthroSim v0.3.5 release readiness

          **Preparation date:** 2026-09-07  
          **Preparation base:** protected `main` `4dde49b46082b359d42bf30f1ef81d6fa49f4adf`  
          **Candidate software version:** `0.3.5`  
          **Candidate model semantics:** `anthrosim-model-semantics-v33`  
          **Previous immutable release:** `v0.3.4` / `anthrosim-model-semantics-v25`  
          **Tag state in this preparation record:** intentionally not created yet

          ## Scope

          This record prepares the already-reviewed post-Audit-v4 state for a named v0.3.5 patch release. Scientific Audit v4 is not reopened. No new simulator mechanism or causal-semantics change is introduced by the version bump.

          The preparation starts only after the second post-v0.3.4 documentation-consistency audit was merged into protected `main`. That audit closed the remaining living-document/status drift found after the first synchronization pass.

          ## Identity decision

          v0.3.5 freezes **model semantics v33**. Software/package release identity advances from 0.3.4 to 0.3.5, while `MODEL_SEMANTICS_ID` remains v33 because release naming itself does not alter authoritative scientific behaviour.

          The immutable v0.3.4/v25 tag remains the Scientific Audit v4 discovery target. Audit-v4 and older release/evidence documents therefore retain v0.3.4 where it is a historical identity. Rewriting those records to v0.3.5 would destroy provenance rather than improve consistency.

          ## Release-preparation synchronization

          The release-preparation change synchronizes:

          - root workspace version and both AnthroSim workspace entries in `Cargo.lock` to `0.3.5`;
          - `CITATION.cff` to `0.3.5` with the 2026-09-07 v33/Audit-v4 release description;
          - living README, roadmap, architecture, research index, TRACE, ODD, ODD+D, normative scientific-model, citation and agent guidance to the v0.3.5/v33 release line;
          - release/versioning policy to preserve v0.3.4/v25 while adding v0.3.5/v33;
          - permanent documentation-consistency checks to recognize v0.3.5/v33;
          - a dedicated `docs/releases/v0.3.5.md` release record.

          Reviewed experiment/reference records keep their actual execution provenance. In particular, an archived v33 run generated while the package version was 0.3.4 remains labelled 0.3.4; the v0.3.5 package bump does not fabricate a rerun.

          ## Completion gate before tagging

          This preparation is ready to freeze only after its release PR is merged and the resulting exact protected-main SHA has all ordinary required contexts plus the release-specific M8.6, M9.7 and RustSec checks green. The fail-closed release-tag verifier must also confirm that Cargo workspace identity, lockfile workspace identities, citation version and release-note tag all match `v0.3.5`.

          The tag is intentionally outside this preparation record. Once those exact-SHA conditions are satisfied, `v0.3.5` can be preserved in a separate explicit tagging step without modifying the candidate source tree.
          '''.replace('          ', ''), encoding='utf-8')

          # Fail closed on obvious stale current-facing version language while allowing historical evidence.
          current_surfaces = [
              'README.md', 'AGENTS.md', 'docs/architecture.md', 'docs/roadmap.md',
              'docs/release-versioning.md', 'docs/research/README.md', 'docs/research/trace.md',
              'docs/research/odd.md', 'docs/research/odd-d.md', 'docs/scientific-model.md',
              'docs/research/citation.md',
          ]
          for path in current_surfaces:
              text = (ROOT / path).read_text(encoding='utf-8')
              if 'v0.3.5' not in text and '0.3.5' not in text:
                  raise SystemExit(f'{path}: current-facing release identity does not mention v0.3.5')

          # Historical v0.3.4 identities must remain present in the audit/release records.
          for path in ('docs/releases/v0.3.4.md', 'docs/research/audit-v4/README.md', 'docs/research/audit-v4/STATUS.md'):
              text = (ROOT / path).read_text(encoding='utf-8')
              if 'v0.3.4' not in text or 'v25' not in text:
                  raise SystemExit(f'{path}: historical v0.3.4/v25 identity was damaged')
          PY

          python3 -m py_compile scripts/test-current-model-semantics-docs.py scripts/verify-release-candidate.py
          python3 scripts/test-current-model-semantics-docs.py
          python3 scripts/verify-release-candidate.py --self-test

      - name: Commit prepared release tree and remove helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/v035-release-prep-patch.yml
          git add Cargo.toml Cargo.lock CITATION.cff README.md AGENTS.md docs scripts/test-current-model-semantics-docs.py
          git diff --cached --check
          git commit -m "release: prepare v0.3.5"
          git push origin HEAD:release/v0.3.5-prep
