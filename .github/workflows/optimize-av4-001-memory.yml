name: Optimize AV4-001 founder coupling memory

on:
  push:
    branches:
      - fix/486-fertility-label-invariance
    paths:
      - .github/workflows/optimize-av4-001-memory.yml

permissions:
  contents: write

jobs:
  optimize-test-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/486-fertility-label-invariance
          persist-credentials: true
          fetch-depth: 0

      - name: Apply exact-equivalent synthetic founder refinement
        env:
          MARKER_B64: "ICAgIC8vLyBDYW5vbmljYWxpemUgZGF5LXplcm8gcmVwcmVzZW50ZWQgcGVvcGxlIGludG8gcGVyc2lzdGVudCBjb3VwbGluZyByYW5rcyB3aXRob3V0IHVzaW5nCiAgICAvLy8gY2Fub25pY2FsIFBlcnNvbklkIGFzIGEgc2NpZW50aWZpYyBkaXN0aW5jdGlvbi4gUmVmaW5lbWVudCBpbmNvcnBvcmF0ZXMgc2NhbGFyIHN0YXRlLAo="
          HELPER_B64: ""
          NEEDLE_B64: "ICAgIGZuIGFzc2lnbl9pbml0aWFsX3N0b2NoYXN0aWNfY291cGxpbmdfcmFua3MoCiAgICAgICAgJm11dCBzZWxmLAogICAgICAgIGZvdW5kZXJfcG9wdWxhdGlvbjogT3B0aW9uPCZGb3VuZGVyUG9wdWxhdGlvbkRlZmluaXRpb24+LAogICAgKSB7CiAgICAgICAgbGV0IHBlcnNvbl9jb3VudCA9IHNlbGYucGVyc29uX2NvdW50KCk7Cg=="
          REPLACEMENT_B64: ""
        run: |
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path
          path = Path('crates/anthrosim-core/src/population.rs')
          text = path.read_text(encoding='utf-8')
          marker = base64.b64decode(os.environ['MARKER_B64']).decode()
          helper = base64.b64decode(os.environ['HELPER_B64']).decode()
          needle = base64.b64decode(os.environ['NEEDLE_B64']).decode()
          replacement = base64.b64decode(os.environ['REPLACEMENT_B64']).decode()
          assert marker in text
          assert needle in text
          text = text.replace(marker, helper + marker, 1)
          text = text.replace(needle, replacement, 1)
          path.write_text(text, encoding='utf-8')
          PY

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1

      - name: Format and verify AV4-001 regressions
        run: |
          cargo fmt --all
          cargo test --locked -p anthrosim-core --test fertility_label_invariance
          cargo test --locked -p anthrosim-core --test fertility_person_label_invariance
          cargo test --locked -p anthrosim-core

      - name: Build release and enforce one-million-founder memory gate
        run: |
          cargo build --locked --release -p anthrosim-cli
          /usr/bin/time -v -o /tmp/anthrosim-million-founder-time.txt target/release/anthrosim run \
            --years 0 \
            --world-width 64 \
            --world-height 64 \
            --population 1000000 \
            --max-person-records 1000000 \
            --output /tmp/anthrosim-m5-memory.json
          cat /tmp/anthrosim-million-founder-time.txt
          max_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/^[ \t]+/, "", $2); print $2}' /tmp/anthrosim-million-founder-time.txt)
          test -n "$max_rss_kib"
          test "$max_rss_kib" -le 163840

      - name: Commit verified production refinement
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/population.rs
          git diff --cached --check
          git commit -m 'perf: bound synthetic coupling-rank initialization memory'
          git push origin HEAD:fix/486-fertility-label-invariance
