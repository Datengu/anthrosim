name: Audit v5 Area H Wilson small-n control

on:
  pull_request:
    paths:
      - 'scripts/audit-v5-area-h-wilson-small-n-control.py'
      - 'scripts/research-monte-carlo-sufficiency.py'
      - 'scripts/research-monte-carlo-sufficiency-legacy.py'
      - '.github/workflows/audit-v5-area-h-wilson-small-n-control.yml'

permissions:
  contents: read

jobs:
  adversary:
    name: Wilson small-n matched control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run fresh Audit-v5 Area-H Wilson control
        run: python3 scripts/audit-v5-area-h-wilson-small-n-control.py
