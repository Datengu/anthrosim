name: Issue 304 demographic baseline analysis

on:
  pull_request:
    paths:
      - "research/general-demography-baseline-v1/**"
      - "scripts/prepare-general-demography-baseline-definition.py"
      - "scripts/research-general-demography-baseline.py"
      - "crates/anthrosim-cli/src/bundle.rs"
      - "crates/anthrosim-core/src/spatial_invariants.rs"
      - "crates/anthrosim-core/src/spatial_simulation.rs"
      - ".github/workflows/general-demography-baseline-analysis.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  exploratory-analysis:
    name: Exploratory 3x2 demographic baseline analysis
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout issue 304 branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/304-general-demographic-baseline
          persist-credentials: true

      - name: Repair split-realization and extinction validation contracts
        run: |
          python3 - <<'PY'
          from pathlib import Path

          bundle = Path("crates/anthrosim-cli/src/bundle.rs")
          text = bundle.read_text()
          old = "let reconstructed_initial_population = reconstruct_initial_population(&checkpoint, &world)?;"
          new = "let reconstructed_initial_population = reconstruct_initial_population(run_dir, &checkpoint, &world)?;"
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '''fn reconstruct_initial_population(
              checkpoint: &SimulationCheckpoint,
              world: &World,
          ) -> Result<Population, BundleValidationError> {
              let config = checkpoint.experiment.population;
              let population = match config.initialization {
                  PopulationInitialization::SyntheticValidationV1 => Population::initialize(
                      config,
                      world,
                      RngFactory::new(checkpoint.experiment.seed),
                  ),'''
          new = '''fn reconstruct_initial_population(
              run_dir: &Path,
              checkpoint: &SimulationCheckpoint,
              world: &World,
          ) -> Result<Population, BundleValidationError> {
              let config = checkpoint.experiment.population;
              // Spatial split-realization runs initialize synthetic founders from the bound
              // population seed, not the dynamic process seed. The spatial artifacts are fully
              // cross-validated later in this function, so reading the declared mechanisms here
              // only selects the deterministic reconstruction seed; it does not weaken binding.
              let population_seed = if run_dir.join("spatial-mechanisms.json").is_file() {
                  let mechanisms: SpatialMechanismConfig =
                      read_json(&run_dir.join("spatial-mechanisms.json"))?;
                  mechanisms
                      .run_realization
                      .map_or(checkpoint.experiment.seed, |realization| realization.population_seed)
              } else {
                  checkpoint.experiment.seed
              };
              let population = match config.initialization {
                  PopulationInitialization::SyntheticValidationV1 => Population::initialize(
                      config,
                      world,
                      RngFactory::new(population_seed),
                  ),'''
          assert text.count(old) == 1
          bundle.write_text(text.replace(old, new))

          spatial = Path("crates/anthrosim-core/src/spatial_simulation.rs")
          text = spatial.read_text()
          old = '''    if !checkpoint.time.days().is_multiple_of(DAYS_PER_YEAR)
                  || checkpoint.completed_years != checkpoint.time.days() / DAYS_PER_YEAR
              {
                  return Err(SpatialLandscapeError::UnsupportedCheckpointBoundary {
                      day: checkpoint.time.days(),
                  });
              }'''
          new = '''    if (!checkpoint.time.days().is_multiple_of(DAYS_PER_YEAR)
                  && !matches!(
                      checkpoint.terminal_stop_reason,
                      Some(StopReason::PopulationExtinct)
                  ))
                  || checkpoint.completed_years != checkpoint.time.days() / DAYS_PER_YEAR
              {
                  return Err(SpatialLandscapeError::UnsupportedCheckpointBoundary {
                      day: checkpoint.time.days(),
                  });
              }'''
          assert text.count(old) == 1
          spatial.write_text(text.replace(old, new))

          invariants = Path("crates/anthrosim-core/src/spatial_invariants.rs")
          text = invariants.read_text()
          old = "let world = World::generate(config.world, RngFactory::new(config.seed))?"
          new = '''let world = World::generate(
                  config.world,
                  RngFactory::new(run.checkpoint.spatial.environment.realization.environment_seed),
              )?'''
          assert text.count(old) == 1
          invariants.write_text(text.replace(old, new))
          PY
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/anthrosim-cli/src/bundle.rs crates/anthrosim-core/src/spatial_invariants.rs crates/anthrosim-core/src/spatial_simulation.rs
            git commit -m "fix: validate split-realization research bundles"
            git push origin HEAD:feat/304-general-demographic-baseline
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Build research binaries
        run: |
          export ANTHROSIM_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --locked --release -p anthrosim-cli \
            --bin anthrosim-research \
            --bin anthrosim-demography-observability

      - name: Materialize exact exploratory definition
        run: |
          python3 scripts/prepare-general-demography-baseline-definition.py \
            research/general-demography-baseline-v1/exploratory-definition.json \
            /tmp/issue-304-definition.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          definition = json.loads(Path("/tmp/issue-304-definition.json").read_text())
          landscape = definition["base"]["spatial"]["landscape"]
          expected = landscape["width"] * landscape["height"]
          assert expected == 144
          assert all(len(layer["values"]) == expected for layer in landscape["layers"])
          PY

      - name: Execute immutable exploratory research plan
        run: |
          rm -rf /tmp/issue-304-research /tmp/issue-304-observability /tmp/issue-304-output
          target/release/anthrosim-research \
            --definition /tmp/issue-304-definition.json \
            --run-dir /tmp/issue-304-research

      - name: Derive M2 opportunity-funnel observability
        run: |
          mkdir -p /tmp/issue-304-observability
          python3 - <<'PY' >/tmp/issue-304-runs.tsv
          import json
          from pathlib import Path
          rows = json.loads(Path("/tmp/issue-304-research/analysis/runs.json").read_text())["runs"]
          for row in rows:
              if row["state"] != "completed":
                  raise SystemExit(f"non-completed run: {row['runId']}")
              print(f"{row['runId']}\t{row['relativeDir']}")
          PY
          while IFS=$'\t' read -r run_id relative_dir; do
            target/release/anthrosim-demography-observability \
              --run-dir "/tmp/issue-304-research/${relative_dir}" \
              --output "/tmp/issue-304-observability/${run_id}.json" \
              >/dev/null
          done </tmp/issue-304-runs.tsv

      - name: Apply long-run TRACE diagnostics
        run: |
          mkdir -p /tmp/issue-304-output
          python3 scripts/research-long-run-diagnostics.py \
            /tmp/issue-304-research \
            research/general-demography-baseline-v1/long-run-protocol.json \
            --output /tmp/issue-304-output/long-run.json

      - name: Quantify demographic outcomes
        run: |
          python3 scripts/research-general-demography-baseline.py \
            /tmp/issue-304-research \
            /tmp/issue-304-observability \
            /tmp/issue-304-output/exploratory-summary.json \
            --long-run /tmp/issue-304-output/long-run.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("/tmp/issue-304-output/exploratory-summary.json").read_text())
          assert result["runCount"] == 288, result["runCount"]
          assert len(result["arms"]) == 36, len(result["arms"])
          PY

      - name: Preserve compact scientific result
        run: |
          mkdir -p /tmp/issue-304-artifact
          cp /tmp/issue-304-definition.json /tmp/issue-304-artifact/exploratory-definition.json
          cp research/general-demography-baseline-v1/long-run-protocol.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-research/research-manifest.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-research/research-plan.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-research/analysis/points.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-research/analysis/runs.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-output/exploratory-summary.json /tmp/issue-304-artifact/
          cp /tmp/issue-304-output/long-run.json /tmp/issue-304-artifact/
          cp -R /tmp/issue-304-observability /tmp/issue-304-artifact/demography-observability

      - name: Upload scientific analysis artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: issue-304-demographic-baseline-exploratory
          if-no-files-found: error
          retention-days: 14
          path: /tmp/issue-304-artifact
