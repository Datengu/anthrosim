name: Issue 304 demographic baseline analysis
on:
  pull_request:
    paths:
      - "research/general-demography-baseline-v1/**"
      - "scripts/prepare-general-demography-baseline-definition.py"
      - "scripts/research-general-demography-baseline.py"
      - "scripts/research-monte-carlo-sufficiency.py"
      - "crates/anthrosim-cli/src/bundle.rs"
      - "crates/anthrosim-core/src/demography_observability.rs"
      - "crates/anthrosim-core/src/spatial_invariants.rs"
      - "crates/anthrosim-core/src/spatial_simulation.rs"
      - ".github/workflows/general-demography-baseline-analysis.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  confirmatory-analysis:
    name: 64-seed demographic baseline confirmation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/304-general-demographic-baseline
          persist-credentials: true
      - run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Build research binaries
        run: |
          export ANTHROSIM_GIT_COMMIT="$(git rev-parse HEAD)"
          cargo build --locked --release -p anthrosim-cli --bin anthrosim-research --bin anthrosim-demography-observability
      - name: Freeze central confirmatory design
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('research/general-demography-baseline-v1/exploratory-definition.json').read_text())
          seeds=list(range(3041001,3041065)); d['seeds']=seeds; d['base']['experiment']['seed']=seeds[0]
          d['base']['experiment']['population']['syntheticMaxAgeYears']=60
          d['base']['experiment']['resources']['productivityScalePermille']=1000
          for x in d['dimensions']:
              if x['id']=='founder_age_ceiling_years': x['values']=[60]
              if x['id']=='resource_productivity_scale_permille': x['values']=[1000]
          Path('/tmp/confirm-source.json').write_text(json.dumps(d,separators=(',',':'))+'\n')
          p=json.loads(Path('research/general-demography-baseline-v1/long-run-protocol.json').read_text())
          p['studyId']='issue-304-general-demography-baseline-confirmatory-v1'
          p['rationale']='64 new paired process seeds over the central 3x2 contrast at founder age ceiling 60 and resource productivity 1000 permille; broad founder/resource sensitivity was tested in the 288-run exploratory factorial. Long-run thresholds/windows are unchanged.'
          Path('/tmp/confirm-long-run.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          python3 scripts/prepare-general-demography-baseline-definition.py /tmp/confirm-source.json /tmp/confirm-definition.json
      - name: Execute and summarize 384 confirmatory runs
        run: |
          rm -rf /tmp/c304 /tmp/o304 /tmp/a304
          target/release/anthrosim-research --definition /tmp/confirm-definition.json --run-dir /tmp/c304
          mkdir -p /tmp/o304 /tmp/a304
          python3 - <<'PY' >/tmp/runs304.tsv
          import json
          from pathlib import Path
          rows=json.loads(Path('/tmp/c304/analysis/runs.json').read_text())['runs']; assert len(rows)==384
          for r in rows:
              assert r['state']=='completed'; print(f"{r['runId']}\t{r['relativeDir']}")
          PY
          while IFS=$'\t' read -r id rel; do target/release/anthrosim-demography-observability --run-dir "/tmp/c304/$rel" --output "/tmp/o304/$id.json" >/dev/null; done </tmp/runs304.tsv
          python3 scripts/research-long-run-diagnostics.py /tmp/c304 /tmp/confirm-long-run.json --output /tmp/a304/long-run.json
          python3 scripts/research-general-demography-baseline.py /tmp/c304 /tmp/o304 /tmp/a304/summary.json --long-run /tmp/a304/long-run.json
      - name: Apply issue 231 Monte Carlo precision gates
        run: |
          python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.loads(Path('/tmp/a304/summary.json').read_text()); seeds=list(range(3041001,3041065)); root=Path('/tmp/a304/precision'); root.mkdir()
          def make_plan(pid,kind,half,pairing):
              p={'schemaVersion':1,'planIdentity':'','planId':pid,'uncertaintyCategory':'process_stochastic_monte_carlo','estimand':{'kind':kind,'confidenceLevel':0.95,'maxHalfWidth':half},'design':{'mode':'fixed','seedBatches':[seeds]},'pairing':pairing,'rationale':'Predeclared issue #304 precision target for an estimand defined on every replicate used in the final baseline decision.'}
              q=dict(p); q['planIdentity']=''; p['planIdentity']='monte-carlo-precision-plan-v1-'+hashlib.sha256(json.dumps(q,sort_keys=True,separators=(',',':')).encode()).hexdigest(); return p
          def runs(life): return {r['seed']:r for r in s['runs'] if r['demography']=='positive_growth_control_v1' and r['householdLifecycle']==life}
          fixed=runs('fixed_founder_v1'); fiss=runs('deterministic_size_fission_v1'); assert set(fixed)==set(seeds)==set(fiss)
          # Candidate fixed-founder growth is defined for all 64 runs because extinction is zero.
          p=make_plan('issue304-positive-fixed-late-growth-v1','mean',0.001,'independent'); sample={'schemaVersion':1,'groups':[{'id':'positive-fixed','replicates':[{'seed':x,'value':fixed[x]['lateGrowthRatePerYear']} for x in seeds]}]}
          (root/'positive-fixed-growth-plan.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n'); (root/'positive-fixed-growth-samples.json').write_text(json.dumps(sample,indent=2,sort_keys=True)+'\n')
          # Extinction remains defined even when a log-growth slope is not.
          p=make_plan('issue304-positive-fission-extinction-v1','probability',0.085,'independent'); sample={'schemaVersion':1,'groups':[{'id':'positive-fission-extinction','replicates':[{'seed':x,'value':fiss[x]['extinct']} for x in seeds]}]}
          (root/'positive-fission-extinction-plan.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n'); (root/'positive-fission-extinction-samples.json').write_text(json.dumps(sample,indent=2,sort_keys=True)+'\n')
          # Structural effect on terminal population is defined for extinct and surviving trajectories alike.
          p=make_plan('issue304-positive-household-terminal-population-effect-v1','paired_mean_difference',15.0,'paired_by_seed'); sample={'schemaVersion':1,'groups':[{'id':'fission','replicates':[{'seed':x,'value':fiss[x]['terminalPopulation']} for x in seeds]},{'id':'fixed','replicates':[{'seed':x,'value':fixed[x]['terminalPopulation']} for x in seeds]}]}
          (root/'positive-household-population-effect-plan.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n'); (root/'positive-household-population-effect-samples.json').write_text(json.dumps(sample,indent=2,sort_keys=True)+'\n')
          PY
          for p in /tmp/a304/precision/*-plan.json; do s="${p%-plan.json}"; python3 scripts/research-monte-carlo-sufficiency.py diagnose "$p" "${s}-samples.json" "${s}-diagnostic.json"; done
      - name: Preserve scientific conclusion
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          s=json.loads(Path('/tmp/a304/summary.json').read_text()); arms={(a['demography'],a['householdLifecycle']):a for a in s['arms']}; prec={p.stem:json.loads(p.read_text()) for p in Path('/tmp/a304/precision').glob('*-diagnostic.json')}
          out=Path('research/general-demography-baseline-v1'); compact={'schemaVersion':1,'scientificStatus':'confirmatory_synthetic_model_analysis','recommendation':'no_universal_demographic_baseline','researchId':s['researchId'],'runCount':s['runCount'],'arms':s['arms'],'pairedHouseholdEffects':s['pairedHouseholdEffects'],'longRun':s['longRun'],'monteCarloPrecision':prec}; (out/'confirmatory-result.json').write_text(json.dumps(compact,indent=2,sort_keys=True)+'\n')
          lines=['# General scientific demographic baseline result v1','','**Conclusion: no universal demographic baseline should be designated.** Future scientific studies must explicitly declare demography. `replacement_control_v1` remains an intrinsic replacement control, not a promise of realized stationarity.','','| Demography | Household lifecycle | Late growth %/yr (95% MC CI) | Mean N240 | Extinction | Mate limitation |','|---|---|---:|---:|---:|---:|']
          for dem in ['negative_growth_control_v1','replacement_control_v1','positive_growth_control_v1']:
              for life in ['fixed_founder_v1','deterministic_size_fission_v1']:
                  a=arms[(dem,life)]; g=a['lateGrowthRatePerYear']; lines.append(f"| `{dem}` | `{life}` | {100*g['mean']:+.3f} [{100*g['ci95Lower']:+.3f}, {100*g['ci95Upper']:+.3f}] | {a['terminalPopulation']['mean']:.1f} | {100*a['extinction']['estimate']:.1f}% | {100*a['mateLimitationFraction']['mean']:.1f}% |")
          pe=next(x for x in s['pairedHouseholdEffects'] if x['demography']=='positive_growth_control_v1'); d=pe['fissionMinusFixedTerminalPopulation']; lines += ['','For the positive schedule, deterministic fission changes mean year-240 population by '+f"{d['mean']:+.1f} people (95% MC CI {d['ci95Lower']:+.1f} to {d['ci95Upper']:+.1f}) relative to fixed-founder households." ,'','This 64-seed confirmation uses new paired process seeds, founder age ceiling 60 years and resource productivity 1000 permille. The separate 288-run exploratory factorial tested founder ages 40/60 and productivity 500/750/1000. The #220 equilibrium gate and #231 precision diagnostics are preserved in the machine-readable result.','','The result demonstrates model-form dependence, not prehistoric calibration: deterministic fission is a structural sensitivity treatment, and none of these schedules is empirically calibrated. Historical `synthetic_validation_v1` and all three #239 controls remain unchanged; no target-population feedback is introduced.']
          Path('docs/research/general-scientific-demographic-baseline-v1.md').write_text('\n'.join(lines)+'\n')
          PY
          cp /tmp/confirm-definition.json research/general-demography-baseline-v1/confirmatory-definition.json
          cp /tmp/confirm-long-run.json research/general-demography-baseline-v1/confirmatory-long-run-protocol.json
          git config user.name "github-actions[bot]"; git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/general-demography-baseline-v1 docs/research/general-scientific-demographic-baseline-v1.md
          git commit -m "research: preserve issue 304 confirmatory result"
          git push origin HEAD:feat/304-general-demographic-baseline
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-304-demographic-baseline-confirmatory
          retention-days: 14
          path: /tmp/a304
