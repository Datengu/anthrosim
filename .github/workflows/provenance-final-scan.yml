name: Final provenance scan

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify no stale repository commit identities or private-site term
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, subprocess, urllib.error, urllib.request
          from pathlib import Path
          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          private_term=base64.b64decode('QnVsc3Ryb2Rl').decode().lower()
          stale=[]; private_hits=[]; checked=set()
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.as_posix().startswith('.github/workflows/provenance-final-scan.yml'):
                  continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if private_term in text.lower(): private_hits.append(p.as_posix())
              for sha in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{40}(?![0-9a-fA-F])',text):
                  sha=sha.lower()
                  if sha in checked: continue
                  checked.add(sha)
                  if subprocess.run(['git','cat-file','-e',sha],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
                      continue
                  req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/commits/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'anthrosim-provenance-final-scan'})
                  try:
                      with urllib.request.urlopen(req) as r:
                          if r.status==200: stale.append(sha)
                  except urllib.error.HTTPError as exc:
                      if exc.code != 404: raise
          print('private-term file hits:',len(private_hits))
          for p in private_hits: print('PRIVATE',p)
          print('stale repository commit identities:',len(stale))
          for s in stale: print('STALE',s)
          if private_hits or stale: raise SystemExit(1)
          PY
          rm .github/workflows/provenance-final-scan.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'chore: complete provenance reconciliation scan'
          git push
