name: AV4-006 production materializer

on:
  push:
    branches:
      - repair/av4-006-condition-mortality-coupling
    paths:
      - ".github/workflows/av4-006-production-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize and test AV4-006 production repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-006-condition-mortality-coupling
      - name: Apply production repair and permanent regressions
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str) -> None:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one replacement target, found {count}: {old[:120]!r}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          resources = Path('crates/anthrosim-core/src/resources.rs')
          replace_once(
              resources,
              '        let mut resolved_causes = vec![None; mortality_candidates.len()];\n',
              '        // Couple every mortality-stream draw and simultaneous-trigger attribution to the\n'
              '        // represented scientific person rather than canonical PersonId/record position.\n'
              '        // Persistent person stochastic-coupling ranks are globally unique.\n'
              '        let mut mortality_order = (0..mortality_candidates.len()).collect::<Vec<_>>();\n'
              '        mortality_order.sort_unstable_by_key(|&candidate_index| {\n'
              '            mortality_candidates[candidate_index].stochastic_coupling_rank\n'
              '        });\n\n'
              '        let mut resolved_causes = vec![None; mortality_candidates.len()];\n',
          )
          replace_once(
              resources,
              '            let mut condition_triggers = Vec::with_capacity(mortality_candidates.len());\n'
              '            for candidate in &mortality_candidates {\n'
              '                condition_triggers.push(draw_probability_fraction(\n'
              '                    scarcity_rng,\n'
              '                    candidate.condition_probability,\n'
              '                )?);\n'
              '            }\n\n'
              '            let mut background_order = (0..mortality_candidates.len()).collect::<Vec<_>>();\n'
              '            background_order.sort_unstable_by_key(|&candidate_index| {\n'
              '                let candidate = mortality_candidates[candidate_index];\n'
              '                (candidate.stochastic_coupling_rank, candidate.person_index)\n'
              '            });\n'
              '            let mut background_triggers = vec![false; mortality_candidates.len()];\n'
              '            for &candidate_index in &background_order {\n',
              '            let mut condition_triggers = vec![false; mortality_candidates.len()];\n'
              '            for &candidate_index in &mortality_order {\n'
              '                condition_triggers[candidate_index] = draw_probability_fraction(\n'
              '                    scarcity_rng,\n'
              '                    mortality_candidates[candidate_index].condition_probability,\n'
              '                )?;\n'
              '            }\n\n'
              '            let mut background_triggers = vec![false; mortality_candidates.len()];\n'
              '            for &candidate_index in &mortality_order {\n',
          )
          text = resources.read_text(encoding='utf-8')
          if text.count('for &candidate_index in &background_order {') != 1:
              raise SystemExit('unexpected remaining background-order loop count')
          text = text.replace('for &candidate_index in &background_order {', 'for &candidate_index in &mortality_order {', 1)
          resources.write_text(text, encoding='utf-8')
          replace_once(
              resources,
              '        } else {\n'
              '            for (candidate_index, candidate) in mortality_candidates.iter().enumerate() {\n'
              '                resolved_causes[candidate_index] =\n'
              '                    draw_probability_fraction(scarcity_rng, candidate.condition_probability)?\n'
              '                        .then_some(CompetingMortalityCause::ConditionMediated);\n'
              '            }\n'
              '        }\n',
              '        } else {\n'
              '            for &candidate_index in &mortality_order {\n'
              '                let candidate = mortality_candidates[candidate_index];\n'
              '                resolved_causes[candidate_index] =\n'
              '                    draw_probability_fraction(scarcity_rng, candidate.condition_probability)?\n'
              '                        .then_some(CompetingMortalityCause::ConditionMediated);\n'
              '            }\n'
              '        }\n',
          )

          provenance = Path('crates/anthrosim-core/src/provenance.rs')
          replace_once(
              provenance,
              '/// kin role receives each parentage realization.\n'
              'pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v29";\n',
              '/// kin role receives each parentage realization.\n'
              '///\n'
              '/// v30 removes the remaining arbitrary canonical `PersonId`/packed-record ordering from\n'
              '/// M3 condition-mediated mortality. Condition latent triggers and simultaneous-trigger\n'
              '/// cause-attribution draws now follow the same persistent person stochastic-coupling-rank\n'
              '/// schedule as background mortality while retaining independent named RNG streams and the\n'
              '/// exchange-symmetric competing-risk resolver. A v29 checkpoint must therefore not resume\n'
              '/// under v30 with unchanged mortality RNG positions.\n'
              'pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v30";\n',
          )

          checkpoint = Path('crates/anthrosim-core/src/checkpoint.rs')
          replace_once(
              checkpoint,
              '    pub const PRE_PARENTAGE_COUPLING_SCHEMA_VERSION: u32 = 16;\n'
              '    pub const CURRENT_SCHEMA_VERSION: u32 = 17;\n',
              '    pub const PRE_PARENTAGE_COUPLING_SCHEMA_VERSION: u32 = 16;\n'
              '    pub const PRE_CONDITION_MORTALITY_COUPLING_SCHEMA_VERSION: u32 = 17;\n'
              '    pub const CURRENT_SCHEMA_VERSION: u32 = 18;\n',
          )

          guard = Path('scripts/test-current-model-semantics-docs.py')
          guard_text = guard.read_text(encoding='utf-8')
          if guard_text.count('CURRENT_SEMANTICS_ID = "anthrosim-model-semantics-v29"') != 1 or guard_text.count('CURRENT_SHORT = "v29"') != 1:
              raise SystemExit('unexpected current-semantics guard state')
          guard_text = guard_text.replace('CURRENT_SEMANTICS_ID = "anthrosim-model-semantics-v29"', 'CURRENT_SEMANTICS_ID = "anthrosim-model-semantics-v30"', 1)
          guard_text = guard_text.replace('CURRENT_SHORT = "v29"', 'CURRENT_SHORT = "v30"', 1)
          guard.write_text(guard_text, encoding='utf-8')

          for name in ('docs/scientific-model.md', 'docs/research/odd.md', 'docs/research/odd-d.md'):
              path = Path(name)
              text = path.read_text(encoding='utf-8')
              count = text.count('current model semantics v29')
              if count != 1:
                  raise SystemExit(f'{name}: expected one current v29 label, found {count}')
              path.write_text(text.replace('current model semantics v29', 'current model semantics v30', 1), encoding='utf-8')

          scientific = Path('docs/scientific-model.md')
          replace_once(
              scientific,
              "M3 resource settlement and condition response occur at the configured M3 interval ends. Mortality is then resolved at those same elapsed interval ends as an order-invariant competition between the M3 condition-mediated cause and the M2 background cause. Under v27, the background cause's latent RNG trigger is assigned to living people by the persisted scientific stochastic-coupling rank rather than canonical `PersonId` record position. Condition-mediated trigger assignment remains on its independently tracked pre-v27 stream ordering until AV4-006 is remediated; this does not reintroduce first-called cause priority because both latent triggers are sampled before any simultaneous-trigger attribution. Simultaneous triggers continue to use the exchange-symmetric proportional tie rule.",
              "M3 resource settlement and condition response occur at the configured M3 interval ends. Mortality is then resolved at those same elapsed interval ends as an order-invariant competition between the M3 condition-mediated cause and the M2 background cause. Under v30, both causes' latent triggers are assigned to living people in persistent scientific stochastic-coupling-rank order rather than canonical `PersonId`/record position, while the condition and background causes retain their independent named RNG streams. Simultaneous-trigger cause attribution follows that same scientific person schedule and continues to use the exchange-symmetric proportional tie rule.",
          )

          odd = Path('docs/research/odd.md')
          replace_once(
              odd,
              '- M3 condition recovery/loss coefficients and the condition-mediated mortality probability are interpreted against four fixed reference-quarter intervals, then converted deterministically to the actual elapsed M3 interval. Changing only `P` therefore does not multiply the complete-year response budget or fixed-condition survival probability merely by creating more M3 boundaries.\n',
              '- M3 condition recovery/loss coefficients and the condition-mediated mortality probability are interpreted against four fixed reference-quarter intervals, then converted deterministically to the actual elapsed M3 interval. Changing only `P` therefore does not multiply the complete-year response budget or fixed-condition survival probability merely by creating more M3 boundaries. Under v30, both condition-mediated and background latent mortality triggers, plus simultaneous-trigger attribution, are coupled to persistent person stochastic-coupling-rank order rather than canonical `PersonId`/record order; the two named RNG streams and symmetric competing-risk mathematics remain distinct.\n',
          )

          test = Path('crates/anthrosim-core/tests/condition_mortality_label_invariance.rs')
          test.write_text(r'''use anthrosim_core::{
    DeathCause, DemographyConfig, EventKind, ExperimentConfig, FounderGenealogyStatus,
    FounderHousehold, FounderPerson, FounderPopulationDefinition, MigrationConfig,
    ParameterProvenance, PopulationConfig, PopulationInitialization, ReproductiveSex,
    ResourceConfig, RngStreamPosition, Simulation, WorldConfig,
    ids::{CellId, HouseholdId, PersonId},
};

fn demography(background_probability_per_million: u32) -> DemographyConfig {
    let mut config = DemographyConfig::synthetic_validation_v1();
    for band in &mut config.mortality_bands {
        band.annual_probability_per_million = background_probability_per_million;
    }
    for band in &mut config.fertility_bands {
        band.annual_probability_per_million = 0;
    }
    config
}

fn resources(condition_probability_per_million: u32, annual_need: u32) -> ResourceConfig {
    let mut config = ResourceConfig::synthetic_validation_v1()
        .with_annual_need_units_per_person(annual_need)
        .with_initial_stock_units_per_productivity(10)
        .with_seasonality_scale_permille(0);
    config.periods_per_year = 1;
    config.condition_recovery_per_period = 0;
    config.max_condition_loss_per_period = 0;
    config.max_scarcity_mortality_probability_per_million = condition_probability_per_million;
    config
}

fn person(id: u64, household: u64) -> FounderPerson {
    FounderPerson {
        id: PersonId::new(id),
        birth_day: -(30 * 365),
        reproductive_sex: ReproductiveSex::Male,
        household: HouseholdId::new(household),
        female_parent: None,
        male_parent: None,
        last_birth_day: None,
        condition_permille: 0,
    }
}

fn two_household_founders(swapped_labels: bool) -> FounderPopulationDefinition {
    FounderPopulationDefinition::new(
        if swapped_labels { "condition-relabel-b" } else { "condition-relabel-a" },
        ParameterProvenance::SyntheticValidation,
        FounderGenealogyStatus::Unspecified,
        vec![
            FounderHousehold { id: HouseholdId::new(1), location: CellId::new(1) },
            FounderHousehold { id: HouseholdId::new(2), location: CellId::new(2) },
        ],
        if swapped_labels {
            vec![person(1, 2), person(2, 1)]
        } else {
            vec![person(1, 1), person(2, 2)]
        },
    )
}

#[derive(Debug, PartialEq, Eq)]
struct OneYearOutcome {
    deaths: Vec<(CellId, DeathCause)>,
    background_rng: RngStreamPosition,
    condition_rng: RngStreamPosition,
}

fn run_one_year(
    seed: u64,
    swapped_labels: bool,
    condition_probability: u32,
    background_probability: u32,
) -> OneYearOutcome {
    let config = ExperimentConfig::new(seed, 1)
        .with_world(WorldConfig::new(2, 1))
        .with_population(
            PopulationConfig::new(2)
                .with_initialization(PopulationInitialization::DeclaredFounderStateV1)
                .with_max_person_records(10),
        )
        .with_founder_population(two_household_founders(swapped_labels))
        .with_demography(demography(background_probability))
        .with_resources(resources(condition_probability, 0))
        .with_migration(MigrationConfig::synthetic_validation_v1().with_enabled(false));
    let recorded = Simulation::new(config).unwrap().run_recorded().unwrap();
    let mut deaths = recorded
        .events()
        .events
        .iter()
        .filter_map(|record| match record.event {
            EventKind::Death { cell, cause, .. } => Some((cell, cause)),
            _ => None,
        })
        .collect::<Vec<_>>();
    deaths.sort_unstable_by_key(|(cell, _)| cell.0);
    OneYearOutcome {
        deaths,
        background_rng: recorded.checkpoint.rng.demography_mortality,
        condition_rng: recorded.checkpoint.rng.resource_scarcity_mortality,
    }
}

#[test]
fn condition_mortality_cells_and_rng_positions_are_person_label_invariant() {
    let mut informative = 0_u32;
    for seed in 1..=1_000 {
        let a = run_one_year(seed, false, 150_000, 0);
        let b = run_one_year(seed, true, 150_000, 0);
        if a.deaths.len() == 1 || b.deaths.len() == 1 {
            informative += 1;
        }
        assert_eq!(a, b, "condition mortality diverged under pure PersonId relabelling at seed {seed}");
    }
    assert!(informative > 0, "condition-mortality adversary never produced an asymmetric outcome");
}

fn three_household_founders(rotation: u64) -> FounderPopulationDefinition {
    let household_for_label = |label: u64| ((label - 1 + rotation) % 3) + 1;
    FounderPopulationDefinition::new(
        format!("condition-cycle-{rotation}"),
        ParameterProvenance::SyntheticValidation,
        FounderGenealogyStatus::Unspecified,
        vec![
            FounderHousehold { id: HouseholdId::new(1), location: CellId::new(1) },
            FounderHousehold { id: HouseholdId::new(2), location: CellId::new(2) },
            FounderHousehold { id: HouseholdId::new(3), location: CellId::new(3) },
        ],
        vec![
            person(1, household_for_label(1)),
            person(2, household_for_label(2)),
            person(3, household_for_label(3)),
        ],
    )
}

fn three_cell_deaths(seed: u64, rotation: u64) -> Vec<CellId> {
    let config = ExperimentConfig::new(seed, 1)
        .with_world(WorldConfig::new(3, 1))
        .with_population(
            PopulationConfig::new(3)
                .with_initialization(PopulationInitialization::DeclaredFounderStateV1)
                .with_max_person_records(10),
        )
        .with_founder_population(three_household_founders(rotation))
        .with_demography(demography(0))
        .with_resources(resources(350_000, 0))
        .with_migration(MigrationConfig::synthetic_validation_v1().with_enabled(false));
    let recorded = Simulation::new(config).unwrap().run_recorded().unwrap();
    let mut cells = recorded
        .events()
        .events
        .iter()
        .filter_map(|record| match record.event {
            EventKind::Death { cell, .. } => Some(cell),
            _ => None,
        })
        .collect::<Vec<_>>();
    cells.sort_unstable_by_key(|cell| cell.0);
    cells
}

#[test]
fn condition_mortality_is_invariant_to_three_person_cyclic_relabelling() {
    for seed in 1..=256 {
        let baseline = three_cell_deaths(seed, 0);
        assert_eq!(baseline, three_cell_deaths(seed, 1), "rotation 1 diverged at seed {seed}");
        assert_eq!(baseline, three_cell_deaths(seed, 2), "rotation 2 diverged at seed {seed}");
    }
}

#[test]
fn simultaneous_condition_and_background_cause_attribution_is_label_invariant() {
    let mut saw_condition = false;
    let mut saw_background = false;
    for seed in 1..=256 {
        let a = run_one_year(seed, false, 1_000_000, 1_000_000);
        let b = run_one_year(seed, true, 1_000_000, 1_000_000);
        assert_eq!(a, b, "dual-trigger cause attribution diverged under relabelling at seed {seed}");
        for (_, cause) in a.deaths {
            saw_condition |= cause == DeathCause::ResourceScarcity;
            saw_background |= cause == DeathCause::DemographicMortality;
        }
    }
    assert!(saw_condition && saw_background, "dual-trigger regression did not exercise both cause attributions");
}

#[derive(Debug, PartialEq, Eq)]
struct DownstreamOutcome {
    death_cells: Vec<CellId>,
    living_by_cell: [u64; 2],
    final_food_stock: [u64; 2],
    condition_rng: RngStreamPosition,
}

fn run_downstream(seed: u64, swapped_labels: bool) -> DownstreamOutcome {
    let config = ExperimentConfig::new(seed, 2)
        .with_world(WorldConfig::new(2, 1))
        .with_population(
            PopulationConfig::new(2)
                .with_initialization(PopulationInitialization::DeclaredFounderStateV1)
                .with_max_person_records(10),
        )
        .with_founder_population(two_household_founders(swapped_labels))
        .with_demography(demography(0))
        .with_resources(resources(250_000, 100))
        .with_migration(MigrationConfig::synthetic_validation_v1().with_enabled(false));
    let recorded = Simulation::new(config).unwrap().run_recorded().unwrap();
    let mut death_cells = recorded
        .events()
        .events
        .iter()
        .filter_map(|record| match record.event {
            EventKind::Death { cell, .. } => Some(cell),
            _ => None,
        })
        .collect::<Vec<_>>();
    death_cells.sort_unstable_by_key(|cell| cell.0);
    let population = &recorded.checkpoint.population;
    let mut living_by_cell = [0_u64; 2];
    for raw_id in 1..=population.person_count() as u64 {
        let person = population.person(PersonId::new(raw_id)).unwrap();
        if person.death_day.is_none() {
            living_by_cell[usize::try_from(person.location.0 - 1).unwrap()] += 1;
        }
    }
    let resource_state = &recorded.checkpoint.resources;
    DownstreamOutcome {
        death_cells,
        living_by_cell,
        final_food_stock: [
            resource_state.cell_food_stock(CellId::new(1)).unwrap(),
            resource_state.cell_food_stock(CellId::new(2)).unwrap(),
        ],
        condition_rng: recorded.checkpoint.rng.resource_scarcity_mortality,
    }
}

#[test]
fn condition_mortality_relabelling_does_not_propagate_into_resource_state() {
    for seed in 1..=256 {
        assert_eq!(
            run_downstream(seed, false),
            run_downstream(seed, true),
            "downstream state diverged under pure PersonId relabelling at seed {seed}"
        );
    }
}
