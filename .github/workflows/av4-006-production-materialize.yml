name: AV4-006 production materializer

on:
  push:
    branches:
      - repair/av4-006-condition-mortality-coupling
    paths:
      - ".github/workflows/av4-006-production-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize and test AV4-006 production repair
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-006-condition-mortality-coupling
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply production repair
        run: |
          python3 scripts/av4-006-production-materialize.py
          cargo fmt --all
          git diff --check
      - name: Run focused regressions
        run: |
          cargo test -p anthrosim-core --test condition_mortality_label_invariance --locked -- --nocapture
          cargo test -p anthrosim-core --test background_mortality_label_invariance --locked
          cargo test -p anthrosim-core --locked competing_mortality
          python3 scripts/test-current-model-semantics-docs.py
      - name: Commit production outputs
        run: |
          set -euo pipefail
          git add crates/anthrosim-core/src/resources.rs \
            crates/anthrosim-core/src/provenance.rs \
            crates/anthrosim-core/src/checkpoint.rs \
            crates/anthrosim-core/tests/condition_mortality_label_invariance.rs \
            docs/scientific-model.md \
            docs/research/odd.md \
            docs/research/odd-d.md \
            scripts/test-current-model-semantics-docs.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: make condition mortality coupling person-label invariant"
          git push origin HEAD:repair/av4-006-condition-mortality-coupling
