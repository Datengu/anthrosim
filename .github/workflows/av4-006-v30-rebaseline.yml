name: AV4-006 v30 rebaseline materializer

on:
  push:
    branches:
      - repair/av4-006-condition-mortality-coupling
    paths:
      - ".github/workflows/av4-006-v30-rebaseline.yml"

permissions:
  actions: read
  contents: write

jobs:
  materialize:
    name: Materialize reviewed v30 scientific references
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout production branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-006-condition-mortality-coupling
      - name: Download reviewed artifacts
        run: |
          set -euo pipefail
          rm -rf /tmp/av4-006-v30-review
          mkdir -p /tmp/av4-006-v30-review/issue304 /tmp/av4-006-v30-review/m8 /tmp/av4-006-v30-review/m7
          gh run download 33820753145 -n issue-304-demographic-baseline-confirmatory -D /tmp/av4-006-v30-review/issue304
          gh run download 33820753353 -n m8-evidence-grounded-benchmark -D /tmp/av4-006-v30-review/m8
          gh run download 33821069979 -n av4-006-m7-v30-review -D /tmp/av4-006-v30-review/m7
      - name: Materialize reviewed references and evidence notes
        run: |
          set -euo pipefail
          python3 scripts/av4-006-v30-rebaseline.py
          git diff --check
          python3 scripts/verify-m8-spatial-benchmark-reference.py \
            --actual /tmp/av4-006-v30-review/m8/m8-benchmark-output/benchmark-summary.json \
            --reference examples/m8-first-evidence-grounded-benchmark/reference-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          ref=json.loads(Path('research/general-demography-baseline-v1/confirmatory-result.json').read_text())
          expected=json.loads(Path('/tmp/av4-006-v30-review/issue304/expected-result.json').read_text())
          assert ref == expected
          m7=json.loads(Path('experiments/v0.1-resource-variability-reference.json').read_text())
          assert m7['modelSemanticsId']=='anthrosim-model-semantics-v30'
          assert m7['completedRuns']==144 and m7['nonCompletedRuns']==0 and len(m7['pointResults'])==18
          PY
      - name: Commit reviewed production outputs
        run: |
          set -euo pipefail
          git add \
            research/general-demography-baseline-v1/confirmatory-result.json \
            experiments/v0.1-resource-variability-reference.json \
            examples/m8-first-evidence-grounded-benchmark/reference-result.json \
            docs/research/condition-mortality-coupling-v30-reverification.md \
            docs/research/general-scientific-demographic-baseline-v1.md \
            docs/research/resource-variability-v0.1.md \
            docs/research/m8-first-evidence-grounded-benchmark-result.md \
            docs/research/m9-controlled-aggregation-benchmark-result.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: reverify v30 scientific references for AV4-006"
          git push origin HEAD:repair/av4-006-condition-mortality-coupling
