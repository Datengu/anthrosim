name: Verify AV6-004 demographic reference rebind

on:
  push:
    branches: ["audit/repair-707-av6-004"]

permissions:
  actions: read
  contents: write

jobs:
  verify-and-rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true

      - name: Download fresh v37 780-run evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-304-demographic-baseline-confirmatory
          path: /tmp/issue304-v37
          github-token: ${{ github.token }}
          run-id: 34544291570

      - name: Prove payload identity and perform narrow rebind
        run: |
          set -euo pipefail
          python3 .github/scripts/verify_av6_004_demography_rebind.py
          git diff --check
          git diff -- research/general-demography-baseline-v1/confirmatory-result.json

      - name: Commit verified rebind and remove helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/verify_av6_004_demography_rebind.py
          git rm .github/workflows/verify-av6-004-demography-rebind.yml
          git add research/general-demography-baseline-v1/confirmatory-result.json
          git add -u .github/scripts
          git commit -m 'test(audit-v6): rebind demographic reference after exact v37 reproduction'
          git push origin HEAD:audit/repair-707-av6-004
