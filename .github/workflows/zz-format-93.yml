name: Temporary issue 93 formatter

on:
  push:
    branches: [fix/93-run-directory-crash-recovery]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: fix/93-run-directory-crash-recovery
      - run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
          cargo fmt --all
          rm .github/workflows/zz-format-93.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Format run-directory recovery changes"
          git push origin HEAD:fix/93-run-directory-crash-recovery
