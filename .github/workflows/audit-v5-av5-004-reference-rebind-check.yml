name: Finalize AV5-004 v35 benchmark reference note

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/audit-v5-av5-004-reference-rebind-check.yml'

permissions:
  contents: write

jobs:
  finalize-docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: true

      - name: Record reviewed v35 M9.7 reference
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/research/m9-controlled-aggregation-benchmark-result.md')
          text = path.read_text()
          anchor = "**Current machine-readable reference: `anthrosim-model-semantics-v34`.**\n\n## Current regression reference — model semantics v34\n"
          if text.count(anchor) != 1:
              raise SystemExit(f'expected one v34 current-reference anchor, found {text.count(anchor)}')
          v35 = """**Current machine-readable reference: `anthrosim-model-semantics-v35`.**

## Current regression reference — model semantics v35

Audit-v5 AV5-004 / #629 changes the causal representation used to resolve exactly equal-cost M9 destinations so the same physical tie is equivariant under the supported grid reflections. The frozen M9.7 design was rerun unchanged on production PR #679. The exact v35 execution preserved every frozen scientific projection and the independent M9.6 travel-burden reference, while the model/program identity change produced new authoritative terminal state digests as expected.

Reviewed v35 execution:

- workflow run: `34279129383`;
- artifact: `10077039588`;
- artifact SHA-256: `4a9dc89e96f78354cad062f23bd59a65f19d9480eaeaa92e8853a2589751d248`;
- reviewed branch head: `4cb1563e52b672f05761fb6938e975d521f4ab11`;
- pull-request merge-ref build: `56b9e6665b0204b4ff6ab3838f5d8fffe06c7849`;
- aggregate canonical SHA-256: `faca4608f3229769284ee819f57f53dec19a49000de710523b22d22cfa73b0d5`;
- reference model semantics: `anthrosim-model-semantics-v35`.

The capability conclusion remains **`capability_distinguished`**: all **8/8** paired seeds pass, median focal-person-day difference remains **31 permille**, the maximum remains **36 permille**, median intermittent peak-visitor share remains **432 permille**, and the minimum remains **396 permille**. Exact intermittent replay and active annual checkpoint/resume equivalence both passed in the same scientific-gate execution.

A dedicated fail-closed rebind check then downloaded that exact artifact and proved equality with the v34 reference for the benchmark definition, declared seeds, classification, aggregate endpoints, all eight legacy scientific pair projections, both configuration identities, and every independently frozen travel-burden/reconciliation field. Only execution provenance, experiment identity and authoritative terminal state digests were permitted to change. The checked-in verifier remains strict; it was not weakened to accommodate v35.

This is a causal reference refresh and reproducibility record, not empirical calibration or archaeological validation.

## Historical reviewed reference — model semantics v34
"""
          text = text.replace(anchor, v35, 1)
          old_bottom = "The checked-in **v34** reference verifies that this capability distinction survives the Audit-v5 AV5-001 household-local M9 equal-cost destination coupling repair; the v31 execution remains the historical comparator for the prior AV4-007 repair. That is a regression/capability statement only; it is not empirical validation."
          new_bottom = "The checked-in **v35** reference verifies that this capability distinction survives the Audit-v5 AV5-004 spatial-reflection-equivariant M9 tie repair. The v34 execution remains the immediate historical comparator for AV5-001 household-local coupling, and v31 remains the comparator for the prior AV4-007 repair. That is a regression/capability statement only; it is not empirical validation."
          if text.count(old_bottom) != 1:
              raise SystemExit(f'expected one current-result paragraph, found {text.count(old_bottom)}')
          path.write_text(text.replace(old_bottom, new_bottom, 1))
          PY

      - name: Commit documentation and remove one-shot helper
        shell: bash
        run: |
          git config user.name "Datengu"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git rm .github/workflows/audit-v5-av5-004-reference-rebind-check.yml
          git add docs/research/m9-controlled-aggregation-benchmark-result.md
          git commit -m "docs: record v35 M9.7 reference rebind"
          git push origin HEAD:audit/repair-629-av5-004
