name: Audit v5 AV5-004 M9.7 reference rebind check

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/audit-v5-av5-004-reference-rebind-check.yml'

permissions:
  contents: read
  actions: read

jobs:
  verify-reference-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: false

      - name: Verify source artifact provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10077039588" > /tmp/artifact-meta.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          meta = json.loads(Path('/tmp/artifact-meta.json').read_text())
          expected = {
              'id': 10077039588,
              'name': 'm9-controlled-aggregation-benchmark',
              'digest': 'sha256:4a9dc89e96f78354cad062f23bd59a65f19d9480eaeaa92e8853a2589751d248',
          }
          for key, value in expected.items():
              if meta.get(key) != value:
                  raise SystemExit(f'artifact metadata mismatch for {key}: {meta.get(key)!r} != {value!r}')
          run = meta.get('workflow_run') or {}
          if run.get('id') != 34279129383:
              raise SystemExit(f'wrong workflow run: {run!r}')
          if run.get('head_sha') != '4cb1563e52b672f05761fb6938e975d521f4ab11':
              raise SystemExit(f'wrong artifact head SHA: {run!r}')
          print('artifact provenance matches exact failed scientific-gate execution')
          PY

      - name: Download exact M9.7 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10077039588/zip" > /tmp/m9.zip
          mkdir -p /tmp/m9-artifact
          unzip -q /tmp/m9.zip -d /tmp/m9-artifact
          test -f /tmp/m9-artifact/m9-benchmark-output/benchmark-summary.json

      - name: Prove v35 changes only allowed reference identity fields
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          actual = json.loads(Path('/tmp/m9-artifact/m9-benchmark-output/benchmark-summary.json').read_text())
          reference = json.loads(Path('examples/m9-controlled-aggregation-benchmark/reference-result.json').read_text())
          travel_reference = json.loads(Path('examples/m9-controlled-aggregation-benchmark/travel-burden-reference.json').read_text())

          def require(label, observed, expected):
              if observed != expected:
                  raise SystemExit(f'AV5-004 reference rebind mismatch for {label}: expected {expected!r}, found {observed!r}')

          continuous_keys = (
              'residentPersonDays','visitorPersonDays','daysWithAnyVisitors','peakVisitors',
              'permanentMigrations','conditionMortalityDeaths','journeysStarted','journeysCompleted'
          )
          intermittent_keys = continuous_keys + (
              'transitPersonDays','notStartedTotal','notStartedUnreachable','originCatchmentCells'
          )
          travel_keys = (
              'plannedRoundTripTravelDays','observedTransitDays','unrealizedPlannedTransitDays',
              'plannedRoundTripTravelCostUnits','realizedTravelCostUnits','unrealizedPlannedTravelCostUnits',
              'plannedRoundTripRouteDistanceEdges','realizedRouteDistanceEdges','unrealizedPlannedRouteDistanceEdges',
          )

          def project_legacy_pair(pair):
              intermittent = {k: pair['intermittent'][k] for k in intermittent_keys}
              intermittent.update({
                  'totalTravelDays': pair['intermittent']['plannedRoundTripTravelDays'],
                  'totalRoundTripTravelCostUnits': pair['intermittent']['plannedRoundTripTravelCostUnits'],
                  'totalRoundTripRouteDistanceEdges': pair['intermittent']['plannedRoundTripRouteDistanceEdges'],
              })
              return {
                  'seed': pair['seed'],
                  'continuous': {k: pair['continuous'][k] for k in continuous_keys},
                  'intermittent': intermittent,
                  'totalFocalPersonDayDifferencePermilleExact': pair['totalFocalPersonDayDifferencePermilleExact'],
                  'totalFocalPersonDayDifferencePermilleRounded': pair['totalFocalPersonDayDifferencePermilleRounded'],
                  'intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleExact': pair['intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleExact'],
                  'intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleRounded': pair['intermittentPeakVisitorShareOfContinuousMeanResidentsPermilleRounded'],
                  'criteria': pair['criteria'],
                  'pass': pair['pass'],
              }

          require('actual schemaVersion', actual.get('schemaVersion'), 3)
          require('reference schemaVersion', reference.get('schemaVersion'), 2)
          for key in ('benchmarkId','definitionCanonicalSha256','declaredSeeds','classification','aggregate'):
              require(key, actual.get(key), reference.get(key))
          for arm in ('continuous','intermittent'):
              require(f'{arm}.configCanonicalSha256', actual['arms'][arm].get('configCanonicalSha256'), reference['arms'][arm].get('configCanonicalSha256'))
          require('legacy scientific pairs', [project_legacy_pair(p) for p in actual['pairs']], reference['pairs'])

          require('travel reference schemaVersion', travel_reference.get('schemaVersion'), 1)
          require('travel observability schema', travel_reference.get('temporaryObservabilitySchemaVersion'), 2)
          by_seed = {str(pair['seed']): pair for pair in actual['pairs']}
          seeds = [str(seed) for seed in actual['declaredSeeds']]
          require('travel reference seeds', list(travel_reference['intermittentBySeed'].keys()), seeds)
          for seed in seeds:
              pair = by_seed[seed]
              c = pair['continuous']
              i = pair['intermittent']
              require(f'continuous {seed} planned transit reconciliation', c['observedTransitDays'] + c['unrealizedPlannedTransitDays'], c['plannedRoundTripTravelDays'])
              require(f'intermittent {seed} planned transit reconciliation', i['observedTransitDays'] + i['unrealizedPlannedTransitDays'], i['plannedRoundTripTravelDays'])
              require(f'continuous {seed} cost reconciliation', c['realizedTravelCostUnits'] + c['unrealizedPlannedTravelCostUnits'], c['plannedRoundTripTravelCostUnits'])
              require(f'intermittent {seed} cost reconciliation', i['realizedTravelCostUnits'] + i['unrealizedPlannedTravelCostUnits'], i['plannedRoundTripTravelCostUnits'])
              require(f'continuous {seed} distance reconciliation', c['realizedRouteDistanceEdges'] + c['unrealizedPlannedRouteDistanceEdges'], c['plannedRoundTripRouteDistanceEdges'])
              require(f'intermittent {seed} distance reconciliation', i['realizedRouteDistanceEdges'] + i['unrealizedPlannedRouteDistanceEdges'], i['plannedRoundTripRouteDistanceEdges'])
              require(f'continuous {seed} travel burden', {k:c[k] for k in travel_keys}, {k:0 for k in travel_keys})
              require(f'intermittent {seed} travel burden', {k:i[k] for k in travel_keys}, travel_reference['intermittentBySeed'][seed])

          expected_digest = 'faca4608f3229769284ee819f57f53dec19a49000de710523b22d22cfa73b0d5'
          require('aggregateCanonicalSha256', actual.get('aggregateCanonicalSha256'), expected_digest)
          print('v35 artifact exactly preserves all frozen M9.7 scientific projections and travel burden; only provenance/experiment IDs/state digests require rebind')
          PY
