name: Temporary v37 fixed planning horizon experiment

on:
  push:
    branches:
      - experiment/v37-fixed-planning-horizon

permissions:
  contents: read

jobs:
  experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout harness branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          path: harness

      - name: Checkout exact v37 source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: 9f0914e2772cd2f0c6243ab4be8b296f3ce48f30
          path: source

      - name: Prepare counterfactual source
        run: |
          python harness/experiment-harness/fixed-horizon/patch.py source
          cp harness/experiment-harness/fixed-horizon/runner.rs source/crates/anthrosim-cli/src/bin/anthrosim-fixed-horizon.rs

      - name: Build and execute counterfactual
        working-directory: source
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          export ANTHROSIM_GIT_COMMIT="9f0914e2772cd2f0c6243ab4be8b296f3ce48f30+fixed-quarter-horizon-intervention"
          cargo build --locked --release -p anthrosim-cli --bin anthrosim-fixed-horizon
          ./target/release/anthrosim-fixed-horizon > fixed-horizon-results.jsonl
          test "$(wc -l < fixed-horizon-results.jsonl)" -eq 180

      - name: Upload compact results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: anthrosim-v37-fixed-planning-horizon-results
          retention-days: 1
          path: source/fixed-horizon-results.jsonl
