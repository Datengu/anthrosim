name: Bootstrap AV6-004 repair

on:
  push:
    branches: ["audit/repair-707-av6-004"]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt --component clippy
          rustup default 1.97.1

      - name: Apply repair and run controls
        run: |
          set -euo pipefail
          python3 .github/scripts/bootstrap_av6_004_repair.py
          cargo fmt --all
          cargo fmt --all -- --check
          cargo test --locked -p anthrosim-core av6_004_resource_cell_reflection_tests -- --nocapture
          cargo test --locked -p anthrosim-core equal_scarcity_remainder_rotation_is_independent_of_cell_index -- --nocapture
          cargo test --locked -p anthrosim-core equal_scarcity_remainder_rotates_without_permanent_first_claim_advantage -- --nocapture
          cargo test --locked -p anthrosim-core relabeling_equal_claims_does_not_create_long_run_resource_advantage -- --nocapture
          cargo test --locked -p anthrosim-core --test audit_v4_resource_household_label_invariance -- --nocapture
          cargo clippy --locked -p anthrosim-core --all-targets -- -D warnings

      - name: Commit repaired branch and remove bootstrap helpers
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/scripts/bootstrap_av6_004_repair.py
          git rm .github/workflows/bootstrap-av6-004-repair.yml
          git add -A
          git commit -m 'fix(audit-v6): make resource tie phase spatially invariant'
          git push origin HEAD:audit/repair-707-av6-004
