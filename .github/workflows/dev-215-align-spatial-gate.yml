name: Stage issue 215 spatial gate alignment
on:
  push:
    branches: [feat/215-resource-condition-observability]
permissions:
  contents: write
jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: true
      - name: Align schema v4 acceptance
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/spatial-observability.yml')
          text = path.read_text()
          text = text.replace("if report['schemaVersion'] != 3 or report['provenance'] != 'derived':", "if report['schemaVersion'] != 4 or report['provenance'] != 'derived':")
          old = """          unavailable = ' '.join(report['unavailableObservables'])
          if 'historical per-cell food stock' not in unavailable:
              raise SystemExit('spatial report failed to declare unavailable resource history')
"""
          new = """          periods = report.get('resourcePeriods', [])
          temporal = report.get('resourceTemporalSummary', {})
          if temporal.get('preservedPeriods') != len(periods):
              raise SystemExit('spatial report resource-period count does not reconcile')
          if temporal.get('historyCompleteFromStart') is not True:
              raise SystemExit('fresh spatial run unexpectedly reports incomplete resource history')
          unavailable = ' '.join(report['unavailableObservables'])
          if 'historical per-cell food stock' in unavailable:
              raise SystemExit('spatial report still declares retained resource history unavailable')
"""
          if old not in text:
              raise SystemExit('expected stale resource-history gate not found')
          path.write_text(text.replace(old, new))
          PY
          git config user.name "Jack"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add .github/workflows/spatial-observability.yml
          git commit -m "test: validate retained M3 history in spatial gate"
          git push origin HEAD:feat/215-resource-condition-observability
