name: Audit v4 Area J fabricated parameter binding

on:
  pull_request:
    paths:
      - "scripts/audit-v4-test-identifiability-fabricated-parameter-binding.py"
      - ".github/workflows/audit-v4-area-j-fabricated-parameter-binding.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fabricated-parameter-binding:
    name: Fabricated parameter binding adversary
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact evidence head
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 Area J adversary
        run: python3 scripts/audit-v4-test-identifiability-fabricated-parameter-binding.py
