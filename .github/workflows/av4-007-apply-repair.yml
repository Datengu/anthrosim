name: AV4-007 apply M9 scientific tie-key repair

on:
  push:
    branches:
      - repair/av4-007-m9-household-tie-key

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-007-m9-household-tie-key
          fetch-depth: 0
      - name: Apply fail-closed AV4-007 repair
        run: python scripts/av4-007-apply-repair.py
      - name: Format and run focused regressions
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo fmt --all
          cargo test -p anthrosim-core --test m9_equal_cost_destinations --test m9_household_label_invariance --locked -- --nocapture
      - name: Commit repaired source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/events.rs crates/anthrosim-core/src/temporary_mobility.rs crates/anthrosim-core/src/temporary_observability.rs crates/anthrosim-core/src/provenance.rs crates/anthrosim-core/src/checkpoint.rs crates/anthrosim-core/tests/m9_equal_cost_destinations.rs crates/anthrosim-core/tests/m9_household_label_invariance.rs
          git diff --cached --check
          git commit -m "fix: use scientific household key for M9 destination ties"
          git push origin HEAD:repair/av4-007-m9-household-tie-key
