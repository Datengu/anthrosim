                   'M4 uses only genealogical state that already exists in the model. Under the v13 kin contract, each living parent-child relation that crosses household boundaries creates a reciprocal spatial tie: the child household retains the parent household\'s persistent residence and the parent household retains the child household\'s persistent residence. Female- and male-parent roles use the same rule. Same-household parent-child relations add no spatial term because M4 moves the household as one unit. A cell receives the bounded kin contribution when at least one reciprocal first-degree tie points to it; multiple relatives at one cell do not stack.\n\nThere is no fixed first-N kin-location cap. This makes M4 utility invariant to irrelevant packed person/birth record ordering and prevents the M2 female-parent household-inheritance rule from silently turning the kin term into one-way attraction toward external fathers. Representing each cross-household genealogical edge in both directions also avoids inventing a stay bonus for co-resident relatives who would relocate with the household. The detailed normative contract is [`research/m4-kin-proxy-v1.md`](research/m4-kin-proxy-v1.md).')
              ]
          }
          for filename, edits in replacements.items():
              p = Path(filename)
              s = p.read_text()
              for old_s, new_s in edits:
                  if old_s not in s:
                      raise SystemExit(f'doc guard not found in {filename}: {old_s[:80]!r}')
                  s = s.replace(old_s, new_s, 1)
              p.write_text(s)
          PY

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --workspace --release

      - name: Commit refined production repair and remove temporary runner
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-188-refine-kin-proxy.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/migration.rs docs/research/m4-kin-proxy-v1.md docs/research/migration-v0.1.md docs/research/odd-d.md docs/research/odd.md docs/scientific-model.md
          git commit -m 'fix: make M4 kin ties reciprocal across households'
          git push origin HEAD:fix/188-m4-kin-symmetry
