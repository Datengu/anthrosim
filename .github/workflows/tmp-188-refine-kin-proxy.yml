name: Temporary refine issue 188 kin proxy

on:
  push:
    branches:
      - fix/188-m4-kin-symmetry

permissions:
  contents: write

jobs:
  refine-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/188-m4-kin-symmetry
          fetch-depth: 0

      - name: Apply guarded reciprocal-kin refinement
        run: python3 .github/tmp-188-refine-kin-proxy.py

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Format and verify
        run: |
          cargo fmt --all
          cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --locked --workspace

      - name: Release build
        run: cargo build --locked --workspace --release

      - name: Commit refined production repair and remove temporary runner
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-188-refine-kin-proxy.yml .github/tmp-188-refine-kin-proxy.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/migration.rs docs/research/m4-kin-proxy-v1.md docs/research/migration-v0.1.md docs/research/odd-d.md docs/research/odd.md docs/scientific-model.md
          git commit -m 'fix: make M4 kin ties reciprocal across households'
          git push origin HEAD:fix/188-m4-kin-symmetry
