name: Audit v5 Area A M9 return-M4 boundary adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/src/m9_integration_tests.rs'
      - '.github/workflows/audit-v5-area-a-return-m4-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  return-m4-boundary-adversary:
    name: M9 return completion before coincident M4 adversary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-A return-boundary adversary
        run: cargo test --locked -p anthrosim-core audit_v5_area_a_return_m4_boundary_completed_return_is_immediately_visible -- --nocapture
