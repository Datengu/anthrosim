name: Audit v5 AV5-004 v35 convergence

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/audit-v5-av5-004-v35-convergence.yml'

permissions:
  contents: write

jobs:
  converge-v35:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: true

      - name: Converge living semantics docs and provenance-only references
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          current_docs = [
              Path('README.md'),
              Path('docs/architecture.md'),
              Path('docs/roadmap.md'),
              Path('docs/scientific-model.md'),
              Path('docs/research/README.md'),
              Path('docs/research/trace.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]

          for path in current_docs:
              text = path.read_text()
              count = text.lower().count('current model semantics v34')
              if count < 1:
                  raise SystemExit(f'{path}: expected at least one current model semantics v34 marker')
              # Preserve capitalization/punctuation by replacing the numeric identity only in the exact phrase.
              text = text.replace('current model semantics v34', 'current model semantics v35')
              text = text.replace('Current model semantics v34', 'Current model semantics v35')
              path.write_text(text)

          readme = Path('README.md')
          text = readme.read_text()
          replacements = {
              'workspace/model-semantics-v34 development line': 'workspace/model-semantics-v35 development line',
              'an M9 equal-cost destination ambiguity key that is household-local rather than a globally ordinal population rank on the v34 development line;': 'an M9 equal-cost destination ambiguity key that is household-local rather than a globally ordinal population rank, with supported-grid-reflection-equivariant destination realization on the v35 development line;',
              'Equal-cost destination ties are explicit ambiguity-policy decisions; the v34 development line removes unrelated global-population rank renumbering from that household tie key, while Audit-v5 AV5-004/#629 remains the separate spatial-reflection-equivariance repair.': 'Equal-cost destination ties are explicit ambiguity-policy decisions; the v35 development line preserves AV5-001/#606 household-local coupling and adds AV5-004/#629 supported-grid-reflection equivariance while retaining marginal exchangeability. #629 remains open until its required independent post-merge P1 adversarial re-verification is complete.',
          }
          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'README expected text missing: {old}')
              text = text.replace(old, new)
          readme.write_text(text)

          architecture = Path('docs/architecture.md')
          text = architecture.read_text()
          old = 'M4 candidate discovery may use deterministic enumeration internally, but under current v33 semantics candidate enumeration order is not the scientific stochastic-coupling key.'
          new = 'M4 candidate discovery may use deterministic enumeration internally, but under current v35 semantics (rule introduced at v33) candidate enumeration order is not the scientific stochastic-coupling key.'
          if old not in text:
              raise SystemExit('architecture expected current-v33 M4 sentence missing')
          text = text.replace(old, new)
          anchor = '- M4 candidate uncertainty and proportional-choice assignment are invariant to canonical candidate ordering by coupling exact deterministic utility/distance equivalence classes and sampling exchangeable members symmetrically (v33).\n'
          addition = anchor + '- M9 equal-cost destination coupling uses a household-local identity rather than a globally ordinal population rank (v34).\n- M9 equal-cost destination realization is equivariant under the supported grid-reflection group while preserving marginal exchangeability within scientifically indistinguishable alternatives (v35).\n'
          if anchor not in text:
              raise SystemExit('architecture v33 progression anchor missing')
          text = text.replace(anchor, addition, 1)
          architecture.write_text(text)

          versioning = Path('docs/release-versioning.md')
          text = versioning.read_text()
          old = ('Post-`v0.3.5` living development may keep workspace package version `0.3.5` while model semantics advance when a scientifically causal repair requires it. '
                 'Audit-v5 AV5-001/#606 is such a change: the living line advances from v33 to `anthrosim-model-semantics-v34` because future equal-cost M9 destinations use a household-local coupling identity instead of a globally ordinal population rank. '
                 'This is an unreleased development state until a later explicit release-preparation task assigns a new software version/tag.')
          new = ('Post-`v0.3.5` living development may keep workspace package version `0.3.5` while model semantics advance when a scientifically causal repair requires it. '
                 'Audit-v5 AV5-001/#606 advanced the living line from v33 to `anthrosim-model-semantics-v34` because future equal-cost M9 destinations use a household-local coupling identity instead of a globally ordinal population rank. '
                 'Audit-v5 AV5-004/#629 then advances that unreleased living line to `anthrosim-model-semantics-v35` because equal-cost M9 destination realization must be equivariant under the supported grid-reflection group rather than depend on canonical spatial representation. '
                 'These are unreleased development states until a later explicit release-preparation task assigns a new software version/tag.')
          if old not in text:
              raise SystemExit('release-versioning expected AV5-001 living-line paragraph missing')
          versioning.write_text(text.replace(old, new))

          ref_path = Path('experiments/v0.1-resource-variability-reference.json')
          before = json.loads(ref_path.read_text())
          if before.get('modelSemanticsId') != 'anthrosim-model-semantics-v34':
              raise SystemExit(f"unexpected M7.6 reference semantics: {before.get('modelSemanticsId')!r}")
          after = copy.deepcopy(before)
          after['modelSemanticsId'] = 'anthrosim-model-semantics-v35'
          note = after.get('note', '')
          suffix = (' Audit-v5 AV5-004/#629 likewise changes only M9 equal-cost temporary-destination coupling and is causally inapplicable to this pre-M9 M7.6 resource/migration factorial. '
                    'The protected Canonical M7.6 reference experiment must still rerun all 144 declared simulations under v35 and reproduce every frozen pointResults value before the repair can merge; this edit changes provenance only and does not relax that numerical guard.')
          if suffix.strip() not in note:
              after['note'] = note + suffix
          for key in ('schemaVersion','provenance','scientificStatus','definitionId','definitionSha256','modelVersion','plannedRuns','completedRuns','nonCompletedRuns','pointResults'):
              if after.get(key) != before.get(key):
                  raise SystemExit(f'M7.6 provenance-only rebind altered {key}')
          ref_path.write_text(json.dumps(after, separators=(',', ':')) + '\n')
          PY

      - name: Verify current-semantics documentation contract
        run: python3 scripts/test-current-model-semantics-docs.py

      - name: Commit convergence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Datengu'
          git config user.email '15160645+Datengu@users.noreply.github.com'
          git add README.md docs/architecture.md docs/roadmap.md docs/scientific-model.md docs/research/README.md docs/research/trace.md docs/research/odd.md docs/research/odd-d.md docs/release-versioning.md experiments/v0.1-resource-variability-reference.json
          git diff --cached --check
          git diff --cached --quiet && { echo 'no convergence changes staged'; exit 1; }
          git commit -m 'docs: converge living AV5-004 v35 semantics'
          git push origin HEAD:audit/repair-629-av5-004
