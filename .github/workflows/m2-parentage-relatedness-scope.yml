name: M2 parentage relatedness scope

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/m2_parentage_relatedness_scope.rs'
      - 'docs/research/m2-parentage-relatedness-scope-v1.md'
      - '.github/workflows/m2-parentage-relatedness-scope.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relatedness-null-model:
    name: M2 relatedness null-model contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run M2 relatedness scope regression
        run: cargo test --locked -p anthrosim-core --test m2_parentage_relatedness_scope -- --nocapture
