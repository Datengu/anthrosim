name: Stage issue 215 source patch

on:
  push:
    branches: [feat/215-resource-condition-observability]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[215-source-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          components: rustfmt
      - name: Apply source changes
        run: python3 scripts/dev-215-apply.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Commit staged implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/resources.rs crates/anthrosim-core/src/spatial_observability.rs crates/anthrosim-core/src/lib.rs crates/anthrosim-core/tests/resource_period_observability.rs docs/research/resource-condition-period-observability-v1.md
          git commit -m "feat: preserve resource-period condition observability [215-source-applied]"
          git push origin HEAD:feat/215-resource-condition-observability
