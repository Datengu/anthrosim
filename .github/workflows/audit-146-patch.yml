name: Audit 146 exact semantics patch

on:
  push:
    branches:
      - audit/146-spatial-presence-semantics
    paths:
      - .github/workflows/audit-146-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/146-spatial-presence-semantics

      - name: Apply exact replacements
        run: python3 scripts/audit_146_patch.py

      - name: Commit source changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/spatial_observability.rs \
                  crates/anthrosim-core/src/events.rs \
                  crates/anthrosim-core/src/lib.rs \
                  explorer/spatial-model.mjs \
                  explorer/spatial.mjs \
                  explorer/spatial-model.test.mjs
          git commit -m "Clarify residence and physical-presence observability semantics"
          git push origin HEAD:audit/146-spatial-presence-semantics
