name: Sync v38 living model documentation

on:
  push:
    branches: ["audit/repair-711-av6-006"]
    paths: [".github/workflows/sync-v38-current-docs.yml"]

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Synchronize current-facing semantics labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          paths = [
              Path('README.md'),
              Path('docs/architecture.md'),
              Path('docs/roadmap.md'),
              Path('docs/scientific-model.md'),
              Path('docs/research/README.md'),
              Path('docs/research/trace.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]
          for path in paths:
              text = path.read_text()
              old = 'current model semantics v37'
              count = text.lower().count(old)
              if count == 0:
                  raise SystemExit(f'{path}: expected current v37 phrase not found')
              # Preserve historical standalone v37 references; only the explicit current-state phrase changes.
              text = text.replace('current model semantics v37', 'current model semantics v38')
              text = text.replace('Current model semantics v37', 'Current model semantics v38')
              path.write_text(text)
              print(f'{path}: synchronized {count} current-state phrase(s)')
          PY
          python3 scripts/test-current-model-semantics-docs.py
          git diff --check
      - name: Commit living documentation and remove helper
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/sync-v38-current-docs.yml
          git add README.md docs/architecture.md docs/roadmap.md docs/scientific-model.md docs/research/README.md docs/research/trace.md docs/research/odd.md docs/research/odd-d.md .github/workflows/sync-v38-current-docs.yml
          git commit -m "docs(audit-v6): synchronize living v38 semantics"
          git push origin HEAD:audit/repair-711-av6-006
