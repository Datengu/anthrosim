name: Preserve named release tag

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Named SemVer tag to preserve (for example v0.3.1)
        required: true
        type: string
      sha:
        description: Exact 40-character Git commit SHA the tag must reference
        required: true
        type: string
  pull_request:
    paths:
      - .github/workflows/release-tag.yml
      - scripts/verify-release-candidate.py
      - docs/release-versioning.md
  push:
    branches:
      - main
    paths:
      - .github/workflows/release-tag.yml
      - scripts/verify-release-candidate.py

permissions:
  contents: read

concurrency:
  group: preserve-named-release-tag
  cancel-in-progress: false

jobs:
  validate-governance:
    if: ${{ github.event_name == 'pull_request' }}
    name: Validate release-tag governance
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate release-candidate verifier
        run: |
          python3 -m py_compile scripts/verify-release-candidate.py
          python3 scripts/verify-release-candidate.py --self-test

  preserve-release-tag:
    if: ${{ github.event_name != 'pull_request' }}
    name: Preserve named release tag
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: read
      statuses: read
    steps:
      - name: Resolve requested release identity
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            # Bootstrap verification for the already-preserved v0.2.0 release.
            # Future named releases are created only by explicit dispatch.
            tag="v0.2.0"
            sha="1f5904064e62b6971e4316b845d8bec3857e97c0"
          else
            tag="$INPUT_TAG"
            sha="$INPUT_SHA"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must match vMAJOR.MINOR.PATCH; got: $tag" >&2
            exit 1
          fi

          if [[ ! "$sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Release SHA must be an exact lowercase 40-character commit SHA; got: $sha" >&2
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      - name: Verify object and inspect existing release tag
        id: ref
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" \
            -H "$version_header" \
            -H "Accept: application/vnd.github+json" \
            "${api}/git/commits/${SHA}" >/dev/null

          status="$(curl --silent --show-error \
            -o existing-ref.json \
            -w '%{http_code}' \
            -H "$auth_header" \
            -H "$version_header" \
            -H "Accept: application/vnd.github+json" \
            "${api}/git/ref/tags/${TAG}")"

          if [[ "$status" == "200" ]]; then
            existing_sha="$(python3 - <<'PY'
          import json
          with open('existing-ref.json', encoding='utf-8') as handle:
              print(json.load(handle)['object']['sha'])
          PY
          )"
            if [[ "$existing_sha" != "$SHA" ]]; then
              echo "Ref ${TAG} already exists at ${existing_sha}; expected ${SHA}. Refusing to move a release tag." >&2
              exit 1
            fi
            echo "needs_creation=false" >> "$GITHUB_OUTPUT"
            echo "Ref ${TAG} already preserves ${SHA}; no mutation is required."
            exit 0
          fi

          if [[ "$status" != "404" ]]; then
            cat existing-ref.json >&2
            echo "Unexpected status while reading refs/tags/${TAG}: ${status}" >&2
            exit 1
          fi

          echo "needs_creation=true" >> "$GITHUB_OUTPUT"
          echo "${TAG} does not yet exist; release-candidate verification is required before creation."

      - name: Checkout exact release candidate
        if: ${{ steps.ref.outputs.needs_creation == 'true' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.target.outputs.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Collect exact-SHA release evidence
        if: ${{ steps.ref.outputs.needs_creation == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" -H "$version_header" -H "Accept: application/vnd.github+json" \
            "${api}/branches/main" > release-main-branch.json

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" -H "$version_header" -H "Accept: application/vnd.github+json" \
            "${api}/commits/${SHA}/check-runs?per_page=100" > release-check-runs.json

          curl --fail-with-body --silent --show-error \
            -H "$auth_header" -H "$version_header" -H "Accept: application/vnd.github+json" \
            "${api}/commits/${SHA}/status?per_page=100" > release-statuses.json

      - name: Verify exact release candidate before mutation
        if: ${{ steps.ref.outputs.needs_creation == 'true' }}
        shell: bash
        env:
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/verify-release-candidate.py
          python3 scripts/verify-release-candidate.py --self-test
          python3 scripts/verify-release-candidate.py \
            --tag "$TAG" \
            --sha "$SHA" \
            --repo-root . \
            --branch-json release-main-branch.json \
            --checks-json release-check-runs.json \
            --status-json release-statuses.json

          {
            echo "### Verified release identity"
            echo "- tag: \`$TAG\`"
            echo "- commit: \`$SHA\`"
            echo "- candidate: current protected \`main\` HEAD"
            echo "- workspace/CITATION/release-note version: matched"
            echo "- protected-main required checks: successful on exact SHA"
            echo "- release-specific M8.6/M9.7/RustSec gates: successful on exact SHA where required"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create exact release tag
        if: ${{ steps.ref.outputs.needs_creation == 'true' }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.target.outputs.tag }}
          SHA: ${{ steps.target.outputs.sha }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPOSITORY}"
          auth_header="Authorization: Bearer ${GH_TOKEN}"
          version_header="X-GitHub-Api-Version: 2022-11-28"

          python3 - <<'PY' > create-ref.json
          import json
          import os
          print(json.dumps({
              'ref': f"refs/tags/{os.environ['TAG']}",
              'sha': os.environ['SHA'],
          }))
          PY

          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "$auth_header" \
            -H "$version_header" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            --data-binary @create-ref.json \
            "${api}/git/refs" >/dev/null

          verify_status="$(curl --silent --show-error \
            -o verified-ref.json \
            -w '%{http_code}' \
            -H "$auth_header" \
            -H "$version_header" \
            -H "Accept: application/vnd.github+json" \
            "${api}/git/ref/tags/${TAG}")"

          if [[ "$verify_status" != "200" ]]; then
            cat verified-ref.json >&2
            echo "Release tag verification failed with status ${verify_status}." >&2
            exit 1
          fi

          verified_sha="$(python3 - <<'PY'
          import json
          with open('verified-ref.json', encoding='utf-8') as handle:
              print(json.load(handle)['object']['sha'])
          PY
          )"

          if [[ "$verified_sha" != "$SHA" ]]; then
            echo "Created ${TAG}, but it resolves to ${verified_sha} instead of ${SHA}." >&2
            exit 1
          fi

          echo "Preserved ${TAG} at ${SHA}."
