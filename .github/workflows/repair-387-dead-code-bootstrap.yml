name: Bootstrap repair 387 dead-code cleanup

on:
  push:
    branches:
      - fix/387-spatial-founder-history-v22
    paths:
      - .github/workflows/repair-387-dead-code-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove superseded no-founder wrapper
        shell: python
        run: |
          from pathlib import Path
          path = Path('crates/anthrosim-core/src/demography.rs')
          text = path.read_text()
          block = '''pub(crate) fn process_demographic_year_after_competing_mortality_recorded(\n    population: &mut Population,\n    world: &World,\n    config: &DemographyConfig,\n    day: u64,\n    rngs: &mut DemographyRngs,\n    events: &mut EventLog,\n) -> Result<DemographyStepOutcome, PopulationError> {\n    process_demographic_year_after_competing_mortality_recorded_with_founder_history(\n        population, world, config, day, rngs, events, None,\n    )\n}\n\n'''
          if text.count(block) != 1:
              raise SystemExit(f'unexpected wrapper count: {text.count(block)}')
          path.write_text(text.replace(block, ''))
          Path('.github/workflows/repair-387-dead-code-bootstrap.yml').unlink()
      - name: Commit cleanup
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/anthrosim-core/src/demography.rs .github/workflows/repair-387-dead-code-bootstrap.yml
          git commit -m "refactor: remove superseded founder-blind M2 wrapper"
          git push
