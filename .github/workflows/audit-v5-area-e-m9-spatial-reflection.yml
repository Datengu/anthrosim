name: Audit v5 Area E M9 spatial reflection adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_e_m9_spatial_reflection.rs'
      - '.github/workflows/audit-v5-area-e-m9-spatial-reflection.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m9-spatial-reflection-adversary:
    name: M9 equal-cost spatial reflection adversary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-E M9 spatial reflection adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_e_m9_spatial_reflection -- --nocapture
