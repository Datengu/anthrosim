name: PR326 M7.6 semantics pin

on:
  push:
    branches:
      - fix/326-partial-supply-condition-rounding
    paths:
      - .github/workflows/pr326-ci-pin.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/326-partial-supply-condition-rounding
          fetch-depth: 0
      - name: Advance M7.6 semantics pin
        run: |
          test "$(grep -c "anthrosim-model-semantics-v15" .github/workflows/ci.yml)" -eq 1
          sed -i "s/anthrosim-model-semantics-v15/anthrosim-model-semantics-v20/" .github/workflows/ci.yml
          grep "reference\['modelSemanticsId'\] == 'anthrosim-model-semantics-v20'" .github/workflows/ci.yml
      - name: Commit CI pin
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/workflows/ci.yml
          git commit -m "ci: advance M7.6 semantics pin to v20 (#326)"
          git push origin HEAD:fix/326-partial-supply-condition-rounding
