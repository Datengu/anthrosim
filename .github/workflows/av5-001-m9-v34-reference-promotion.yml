name: AV5-001 M9 v34 reference promotion

on:
  push:
    branches:
      - audit/repair-606-av5-001

permissions:
  actions: read
  contents: write

jobs:
  promote:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-606-av5-001
          fetch-depth: 0
      - name: Download exact-head M9.7 evidence artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/10069914914/zip > /tmp/m9-v34.zip
          mkdir -p /tmp/m9-v34
          unzip -q /tmp/m9-v34.zip -d /tmp/m9-v34
          find /tmp/m9-v34 -name benchmark-summary.json -print
      - name: Validate and promote v34 machine reference
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import importlib.util
          import json
          import re
          from pathlib import Path

          root = Path('/tmp/m9-v34')
          summaries = list(root.rglob('benchmark-summary.json'))
          assert len(summaries) == 1, summaries
          actual = json.loads(summaries[0].read_text(encoding='utf-8'))

          ref_path = Path('examples/m9-controlled-aggregation-benchmark/reference-result.json')
          travel_path = Path('examples/m9-controlled-aggregation-benchmark/travel-burden-reference.json')
          old = json.loads(ref_path.read_text(encoding='utf-8'))
          travel = json.loads(travel_path.read_text(encoding='utf-8'))

          spec = importlib.util.spec_from_file_location(
              'verify_m9', 'scripts/verify-m9-aggregation-benchmark-reference.py'
          )
          verify_m9 = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(verify_m9)

          assert actual['schemaVersion'] == 3
          assert old['schemaVersion'] == 2
          for key in ('benchmarkId', 'definitionCanonicalSha256', 'declaredSeeds', 'classification', 'aggregate'):
              assert actual[key] == old[key], f'unexpected scientific benchmark change at {key}'

          projected_pairs = [verify_m9.project_legacy_pair(pair) for pair in actual['pairs']]
          assert projected_pairs == old['pairs'], 'legacy M9.7 scientific pair projection changed'

          seeds = [str(seed) for seed in actual['declaredSeeds']]
          assert list(travel['intermittentBySeed'].keys()) == seeds
          by_seed = {str(pair['seed']): pair for pair in actual['pairs']}
          zero_travel = {key: 0 for key in verify_m9.TRAVEL_KEYS}
          for seed in seeds:
              pair = by_seed[seed]
              verify_m9.verify_travel_reconciliation(f'continuous seed {seed}', pair['continuous'])
              verify_m9.verify_travel_reconciliation(f'intermittent seed {seed}', pair['intermittent'])
              assert verify_m9.project_travel(pair['continuous']) == zero_travel
              assert verify_m9.project_travel(pair['intermittent']) == travel['intermittentBySeed'][seed], seed

          provenance = Path('crates/anthrosim-core/src/provenance.rs').read_text(encoding='utf-8')
          match = re.search(r'pub const MODEL_SEMANTICS_ID: &str = "([^"]+)"', provenance)
          assert match and match.group(1) == 'anthrosim-model-semantics-v34'

          new = copy.deepcopy(old)
          new['referenceExecution'] = {
              'workflowRunId': 34260754903,
              'artifactId': 10069914914,
              'artifactSha256': 'a7aa1a114186af8d585e209d304916116a6597ba9c520c7bfed0dd53f39eddd5',
              'branchHeadSha': '75f708404f337fc29c43472a55b101e1388e26b5',
              'pullRequestMergeRefBuildSha': '58c6ef003d0a74c225e8eecda6a4d44a08ad6ee0',
              'fullAggregateCanonicalSha256': actual['aggregateCanonicalSha256'],
              'modelSemanticsId': match.group(1),
              'pullRequestMergeRefBuildStatus': 'pre-merge-v34-reverification-artifact',
          }
          new['classification'] = actual['classification']
          new['aggregate'] = actual['aggregate']
          new['pairs'] = projected_pairs
          for arm in ('continuous', 'intermittent'):
              new['arms'][arm] = {
                  'experimentId': actual['arms'][arm]['experimentId'],
                  'configCanonicalSha256': actual['arms'][arm]['configCanonicalSha256'],
                  'stateDigests': actual['arms'][arm]['stateDigests'],
              }
          ref_path.write_text(json.dumps(new, separators=(',', ':')) + '\n', encoding='utf-8')

          doc_path = Path('docs/research/m9-controlled-aggregation-benchmark-result.md')
          doc = doc_path.read_text(encoding='utf-8')
          old_intro = '''**Current machine-readable reference: `anthrosim-model-semantics-v31`.**

## Current regression reference — model semantics v31
'''
          assert doc.count(old_intro) == 1
          section = f'''**Current machine-readable reference: `anthrosim-model-semantics-v34`.**

## Current regression reference — model semantics v34

Audit-v5 AV5-001 / #606 removes unrelated global-population ordinal renumbering from M9 equal-cost destination coupling. The frozen M9.7 design was rerun unchanged on the production repair PR after the household-local coupling policy was introduced. The v34 execution preserved the complete legacy scientific pair projection and the independent M9.6 travel-burden reference exactly while legitimately changing M9 program/configuration identity and authoritative terminal state digests.

Reviewed v34 execution:

- workflow run: `34260754903`;
- artifact: `10069914914`;
- artifact SHA-256: `a7aa1a114186af8d585e209d304916116a6597ba9c520c7bfed0dd53f39eddd5`;
- reviewed branch head: `75f708404f337fc29c43472a55b101e1388e26b5`;
- pull-request merge-ref build: `58c6ef003d0a74c225e8eecda6a4d44a08ad6ee0`;
- aggregate canonical SHA-256: `{actual['aggregateCanonicalSha256']}`;
- reference model semantics: `anthrosim-model-semantics-v34`.

The capability conclusion remains **`capability_distinguished`**: all **8/8** paired seeds pass, median focal-person-day difference remains **31 permille**, the maximum remains **36 permille**, median intermittent peak-visitor share remains **432 permille**, and the minimum remains **396 permille**. Exact intermittent replay and active annual checkpoint/resume equivalence both passed on the same exact-head workflow. The independently preserved travel-burden reference also matches exactly for every declared seed.

This is a causal reference refresh, not empirical calibration: AV5-001 directly changes the M9 ambiguity-key policy represented by the benchmark, so the machine reference must record the corrected authoritative state even though the predeclared capability statistics are unchanged. Audit-v5 AV5-004 / #629 remains a separate spatial-reflection-equivariance question and is not claimed resolved here.

## Historical reviewed reference — model semantics v31
'''
          doc = doc.replace(old_intro, section)
          doc = doc.replace(
              'The current machine reference is v31 rather than global current model semantics v33 because a benchmark reference records the latest **causally applicable reviewed execution**, not merely the newest global semantics label.',
              'The v31 machine reference was retained through global model semantics v33 because a benchmark reference records the latest **causally applicable reviewed execution**, not merely the newest global semantics label.'
          )
          doc = doc.replace(
              'The checked-in **v31** reference verifies that this capability distinction survives the reviewed M9 equal-cost destination coupling repair represented by AV4-007.',
              'The checked-in **v34** reference verifies that this capability distinction survives the Audit-v5 AV5-001 household-local M9 equal-cost destination coupling repair; the v31 execution remains the historical comparator for the prior AV4-007 repair.'
          )
          doc_path.write_text(doc, encoding='utf-8')
          PY

          python3 scripts/verify-m9-aggregation-benchmark-reference.py \
            --actual "$(find /tmp/m9-v34 -name benchmark-summary.json -print -quit)" \
            --reference examples/m9-controlled-aggregation-benchmark/reference-result.json
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/m9-controlled-aggregation-benchmark/reference-result.json docs/research/m9-controlled-aggregation-benchmark-result.md
          git commit -m "research: promote reviewed M9.7 v34 reference"
          git push origin HEAD:audit/repair-606-av5-001
