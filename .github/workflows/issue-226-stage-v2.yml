name: Stage issue 226 exposure analysis v2

on: [push]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/226-sweep-exposure-rates
          fetch-depth: 0
      - run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - run: python3 scripts/apply-issue-226.py
      - run: cargo fmt --all
      - run: cargo test --locked -p anthrosim-cli sweep::tests::
      - run: python3 scripts/test-issue-226-m8-fixed-horizon.py
      - run: rm scripts/apply-issue-226.py .github/workflows/issue-226-stage.yml .github/workflows/issue-226-stage-v2.yml
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[issue226-applied] fix: expose sweep duration-normalized outcomes"
          git push origin HEAD:fix/226-sweep-exposure-rates
