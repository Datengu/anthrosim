name: Audit v5 Area H small-n mean coverage adversary

on:
  pull_request:
    paths:
      - 'scripts/audit-v5-area-h-small-n-mean-coverage.py'
      - 'scripts/research-monte-carlo-sufficiency.py'
      - 'scripts/research-monte-carlo-sufficiency-legacy.py'
      - '.github/workflows/audit-v5-area-h-small-n-mean-coverage.yml'

permissions:
  contents: read

jobs:
  adversary:
    name: Small-n sequential mean coverage adversary
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run fresh Audit-v5 Area-H adversary
        run: python3 scripts/audit-v5-area-h-small-n-mean-coverage.py
