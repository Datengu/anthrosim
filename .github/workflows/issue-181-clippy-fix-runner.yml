name: Issue 181 clippy fix runner

on:
  push:
    branches:
      - feat/181-composed-evidence-closure
    paths:
      - .github/workflows/issue-181-clippy-fix-runner.yml

permissions:
  contents: write

jobs:
  fix-test-commit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: feat/181-composed-evidence-closure
          fetch-depth: 0

      - name: Apply exact lint fix
        run: python3 scripts/issue_181_clippy_fix.py

      - name: Check format
        run: cargo fmt --all -- --check

      - name: Locked Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        run: cargo test --workspace

      - name: Commit fix and remove runner
        run: |
          rm scripts/issue_181_clippy_fix.py
          rm .github/workflows/issue-181-clippy-fix-runner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: satisfy evidence closure lint"
          git push origin HEAD:feat/181-composed-evidence-closure
