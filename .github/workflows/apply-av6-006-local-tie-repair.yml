name: Apply AV6-006 local M9 tie repair

on:
  push:
    branches: ["audit/repair-711-av6-006"]
    paths: [".github/workflows/apply-av6-006-local-tie-repair.yml"]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Apply decision-local M9 coupling repair
        run: |
          python3 .github/scripts/apply_av6_006_local_tie_repair.py
          cargo fmt --all
          git diff --check
          cargo test -p anthrosim-core --test av6_006_m9_impassable_padding
          cargo test -p anthrosim-core --test m9_spatial_isomorphism_invariance
          cargo test -p anthrosim-core --test m9_household_label_invariance
      - name: Commit repair and remove staging helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/apply-av6-006-local-tie-repair.yml
          rm .github/scripts/apply_av6_006_local_tie_repair.py
          git add crates/anthrosim-core/src/temporary_travel.rs crates/anthrosim-core/src/temporary_mobility.rs crates/anthrosim-core/src/provenance.rs .github/workflows/apply-av6-006-local-tie-repair.yml .github/scripts/apply_av6_006_local_tie_repair.py
          git commit -m "fix(audit-v6): localize M9 destination tie frame"
          git push origin HEAD:audit/repair-711-av6-006
