name: Temporary #211 boundary validation

on:
  push:
    branches: [feat/211-spatial-boundary-contract]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/211-spatial-boundary-contract
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply API corrections and formatting
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/anthrosim-core/tests/spatial_boundary_dependence.rs')
          text = path.read_text()
          text = text.replace('table.resolution(origin).cloned().unwrap()', '(table.resolution(origin).unwrap(), table.accumulated_cost_units(origin))')
          text = text.replace('    assert_eq!(resolution(&tight), TemporaryTravelResolution::Unreachable);', '    let tight_resolution = resolution(&tight);\n    assert_eq!(tight_resolution.0, TemporaryTravelResolution::Unreachable);\n    assert_eq!(tight_resolution.1, None);')
          text = text.replace('        buffered_resolution,\n        TemporaryTravelResolution::Reachable {', '        buffered_resolution.0,\n        TemporaryTravelResolution::Reachable {')
          text = text.replace('            accumulated_cost_units: 8_000,', '            ..')
          needle = '            return_travel_days: 3,\n            ..\n        }\n    ));\n}'
          replacement = '            return_travel_days: 3,\n            ..\n        }\n    ));\n    assert_eq!(buffered_resolution.1, Some(8_000));\n}'
          if needle not in text:
              raise SystemExit('expected M9 assertion block not found')
          path.write_text(text.replace(needle, replacement, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/spatial_boundary.rs crates/anthrosim-core/src/lib.rs crates/anthrosim-core/tests/spatial_boundary_dependence.rs
          if ! git diff --cached --quiet; then
            git commit -m "test: align boundary fixtures with M9 travel API"
            git push origin HEAD:feat/211-spatial-boundary-contract
          fi

      - name: Validate
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo build --locked --workspace --release

      - name: Remove temporary workflow
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-211-format-validation.yml
          git commit -m "chore: remove temporary #211 validation workflow"
          git push origin HEAD:feat/211-spatial-boundary-contract
