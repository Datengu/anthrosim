name: Audit v5 Area G fission active M9 resume adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_g_fission_active_m9_resume.rs'
      - '.github/workflows/audit-v5-area-g-fission-active-m9-resume.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fission-active-m9-resume:
    name: Fission plus active M9 continuation adversary
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-G fission-active-M9 resume adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_g_fission_active_m9_resume -- --nocapture
