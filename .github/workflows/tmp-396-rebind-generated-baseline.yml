name: Temporary AV3-003 generated baseline transfer

on:
  push:
    branches:
      - fix/396-founder-latest-birth-consistency
    paths:
      - .github/workflows/tmp-396-rebind-generated-baseline.yml

permissions:
  actions: read
  contents: write

jobs:
  transfer-generated-baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/396-founder-latest-birth-consistency
      - name: Download exact v23 confirmatory artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/issue304-v23
          mkdir -p /tmp/issue304-v23
          gh run download 33560521260 \
            --repo "${GITHUB_REPOSITORY}" \
            --name issue-304-demographic-baseline-confirmatory \
            --dir /tmp/issue304-v23
          test -f /tmp/issue304-v23/expected-result.json
          cp /tmp/issue304-v23/expected-result.json research/general-demography-baseline-v1/confirmatory-result.json
      - name: Commit generated result to feature branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/general-demography-baseline-v1/confirmatory-result.json
          if git diff --cached --quiet; then
            echo "Generated baseline already matches branch"
            exit 0
          fi
          git commit -m "research: bind demographic baseline to v23 execution"
          git push origin HEAD:fix/396-founder-latest-birth-consistency
