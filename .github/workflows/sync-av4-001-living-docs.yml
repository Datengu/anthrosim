name: Finalize AV4-001 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-av4-001-living-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 553
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply final coupling integration refinements
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/anthrosim-core/src/population.rs')
          text = path.read_text(encoding='utf-8')

          old_lookup = """        let declared_last_birth_day = founder_population.and_then(|definition| {
              definition
                  .people
                  .iter()
                  .find(|founder| founder.id == person)
                  .and_then(|founder| founder.last_birth_day)
          });"""
          new_lookup = """        let declared_last_birth_day = founder_population
              .and_then(|definition| definition.person(person))
              .and_then(|founder| founder.last_birth_day);"""
          if text.count(old_lookup) != 1:
              raise SystemExit(f'founder lookup: expected one old form, found {text.count(old_lookup)}')
          text = text.replace(old_lookup, new_lookup, 1)

          digest_line = '            digest_u64(&mut hash, self.stochastic_coupling_ranks[index]);\n'
          if text.count(digest_line) != 1:
              raise SystemExit(f'coupling state digest: expected one line, found {text.count(digest_line)}')
          text = text.replace(digest_line, '', 1)
          path.write_text(text, encoding='utf-8')
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Format and targeted validation
        run: |
          cargo fmt --all
          python scripts/test-current-model-semantics-docs.py
          cargo test -p anthrosim-core --test fertility_label_invariance --test fertility_person_label_invariance
          cargo test -p anthrosim-core demography_observability
      - name: Commit tested refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/population.rs
          if git diff --cached --quiet; then
            echo 'Refinements already applied.'
            exit 0
          fi
          git commit -m 'refactor: finalize fertility coupling identity integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
