name: Finalize AV4-001 integration

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/sync-av4-001-living-docs.yml'

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 553
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply final coupling integration refinements
        shell: python
        run: |
          from pathlib import Path

          path = Path('crates/anthrosim-core/src/population.rs')
          lines = path.read_text(encoding='utf-8').splitlines()

          marker = 'let declared_last_birth_day = founder_population.and_then(|definition| {'
          starts = [i for i, line in enumerate(lines) if marker in line]
          if len(starts) != 1:
              raise SystemExit(f'founder lookup marker: expected one, found {len(starts)}')
          start = starts[0]
          end = start
          while end < len(lines) and lines[end].strip() != '});':
              end += 1
          if end >= len(lines):
              raise SystemExit('founder lookup terminator not found')
          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
              indent + 'let declared_last_birth_day = founder_population',
              indent + '    .and_then(|definition| definition.person(person))',
              indent + '    .and_then(|founder| founder.last_birth_day);',
          ]
          lines[start : end + 1] = replacement

          digest_marker = 'digest_u64(&mut hash, self.stochastic_coupling_ranks[index]);'
          digest_rows = [i for i, line in enumerate(lines) if digest_marker in line]
          if len(digest_rows) != 1:
              raise SystemExit(f'coupling state digest marker: expected one, found {len(digest_rows)}')
          del lines[digest_rows[0]]

          text = '\n'.join(lines) + '\n'
          if '.find(|founder| founder.id == person)' in text:
              raise SystemExit('old linear founder lookup remains')
          if digest_marker in text:
              raise SystemExit('coupling rank remains in scientific state digest')
          path.write_text(text, encoding='utf-8')
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Format and targeted validation
        run: |
          cargo fmt --all
          python scripts/test-current-model-semantics-docs.py
          cargo test -p anthrosim-core --test fertility_label_invariance --test fertility_person_label_invariance
          cargo test -p anthrosim-core demography_observability
      - name: Commit tested refinements
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/population.rs
          if git diff --cached --quiet; then
            echo 'Refinements already applied.'
            exit 0
          fi
          git commit -m 'refactor: finalize fertility coupling identity integration'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
