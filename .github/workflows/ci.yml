name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Bootstrap Cargo.lock onto dependency-lock branch
        if: github.event_name == 'pull_request' && github.head_ref == 'chore/locked-dependencies'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock?ref=${{ github.head_ref }}" >/dev/null 2>&1; then
            echo "Cargo.lock already exists on bootstrap branch"
            exit 0
          fi
          encoded="$(base64 -w0 Cargo.lock)"
          gh api "repos/${GITHUB_REPOSITORY}/contents/Cargo.lock" \
            --method PUT \
            --field message='Commit generated Cargo.lock for reproducible builds' \
            --field branch='${{ github.head_ref }}' \
            --field content="$encoded"

      - name: Test
        run: cargo test --workspace --all-features

      - name: Benchmark synthetic world generation
        run: cargo bench -p anthrosim-core --bench world_generation -- --noplot

      - name: Build release binaries
        run: cargo build --workspace --release
