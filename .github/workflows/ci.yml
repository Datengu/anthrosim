name: M3 lint fix bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout M3 branch
        uses: actions/checkout@v6.1.0
        with:
          ref: feat/m3-resources
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply machine-safe Clippy fixes
        run: |
          cargo clippy --fix --locked --workspace --all-targets --all-features --allow-dirty --allow-staged -- -D warnings
          cargo fmt --all

      - name: Commit fixes
        run: |
          git config user.name "AnthroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- crates/anthrosim-core/src/population.rs crates/anthrosim-core/src/resources.rs
          git diff --cached --check
          git commit -m "M3: apply strict Clippy arithmetic fixes"
          git push origin HEAD:feat/m3-resources
