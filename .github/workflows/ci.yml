name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  classify:
    name: Classify central CI
    runs-on: ubuntu-latest
    outputs:
      change_class: ${{ steps.classify.outputs.change_class }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate and classify pull-request risk
        id: classify
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/classify-applicable-pr-gates.py
          python3 scripts/classify-applicable-pr-gates.py --self-test

          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "change_class=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          expected_count="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
              --jq '.changed_files'
          )"
          test "$expected_count" -gt 0

          gh api --paginate --slurp \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" \
            > changed-file-pages.json

          actual_count="$(jq '[.[][]] | length' changed-file-pages.json)"
          if [[ "$actual_count" != "$expected_count" ]]; then
            echo "GitHub changed-file listing is incomplete: expected ${expected_count} file object(s), retrieved ${actual_count}; refusing CI classification" >&2
            exit 1
          fi

          jq -r '.[][] | .filename, (.previous_filename // empty)' \
            changed-file-pages.json > changed-files.txt
          test -s changed-files.txt
          LC_ALL=C sort -u changed-files.txt -o changed-files.txt

          python3 scripts/classify-applicable-pr-gates.py \
            --changed-files changed-files.txt \
            --github-output "$GITHUB_OUTPUT"

  quality:
    name: Quality and tests
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Documentation consistency
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: |
          python3 scripts/test-current-model-semantics-docs.py
          python3 - <<'PY'
          from pathlib import Path

          audit_root = Path("docs/research/audit-v2")
          documents = sorted(audit_root.glob("*.md"))
          if not documents:
              raise SystemExit("audit-v2 documentation surface is unexpectedly empty")
          for path in documents:
              text = path.read_text(encoding="utf-8")
              if not text.strip():
                  raise SystemExit(f"empty audit-v2 document: {path}")
              if "<<<<<<<" in text or "=======" in text or ">>>>>>>" in text:
                  raise SystemExit(f"merge-conflict marker in audit-v2 document: {path}")
          status = (audit_root / "STATUS.md").read_text(encoding="utf-8")
          for required in ("## Current baseline and state", "## Coverage matrix", "## Finding register"):
              if required not in status:
                  raise SystemExit(f"STATUS.md is missing required section: {required}")
          print("Documentation-only consistency checks passed.")
          PY

      - name: Install pinned Rust toolchain
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Versions
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rustc --version --verbose
          cargo --version
          node --version
          python3 --version

      - name: Verify locked dependency graph
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: cargo fmt --all -- --check

      - name: Clippy
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test workspace
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: cargo test --locked --workspace --all-features

  explorer:
    name: Explorer and script validation
    needs: classify
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "Explorer and script validation is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Validate M6/M7 source syntax
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          node --check explorer/model.mjs
          node --check explorer/app.mjs
          node --check scripts/validate-explorer-bundle.mjs
          python3 -m py_compile scripts/serve-explorer.py
          python3 -m py_compile scripts/benchmark-performance-acceptance.py
          python3 -m py_compile scripts/run-versioned-sweep.py

      - name: Test M6 explorer artifact model
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: node --test explorer/model.test.mjs

  benchmarks:
    name: Core benchmarks
    needs: [classify, quality, explorer]
    if: ${{ needs.classify.outputs.change_class == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Benchmark synthetic world generation
        run: cargo bench --locked -p anthrosim-core --bench world_generation -- --noplot

      - name: Benchmark population initialization
        run: cargo bench --locked -p anthrosim-core --bench population_initialization -- --noplot

      - name: Benchmark M4 bounded candidate lookup
        run: cargo bench --locked -p anthrosim-core --bench migration_candidates -- --noplot

      - name: Benchmark full resource-migration-demographic lifecycle
        run: cargo bench --locked -p anthrosim-core --bench empty_run -- --noplot

      - name: Benchmark M5 checkpoint persistence
        run: cargo bench --locked -p anthrosim-core --bench checkpoint_persistence -- --noplot

  release-build:
    name: Release build
    needs: [classify, quality, explorer]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "Release build is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1

      - name: Build release binaries
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        env:
          ANTHROSIM_GIT_COMMIT: ${{ github.sha }}
        run: cargo build --locked --workspace --release

      - name: Archive release binary for downstream gates
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: anthrosim-ci-release-linux
          if-no-files-found: error
          retention-days: 1
          path: target/release/anthrosim

  soak-ensemble:
    name: 1000-run ensemble soak
    needs: [classify, release-build]
    if: ${{ needs.classify.outputs.change_class == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anthrosim-ci-release-linux
          path: target/release

      - name: Restore executable bit
        run: chmod +x target/release/anthrosim

      - name: Exercise unattended 1000-run M7 ensemble scale
        run: |
          rm -rf /tmp/anthrosim-m7-thousand-runs
          target/release/anthrosim ensemble \
            --years 0 \
            --world-width 1 \
            --world-height 1 \
            --population 1 \
            --household-size 1 \
            --max-person-records 1 \
            --seed-start 900000 \
            --seed-count 1000 \
            --run-dir /tmp/anthrosim-m7-thousand-runs \
            >/tmp/anthrosim-m7-thousand-runs.log
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/anthrosim-m7-thousand-runs')
          manifest = json.loads((root / 'experiment-manifest.json').read_text())
          statuses = [json.loads(path.read_text()) for path in sorted((root / 'status').glob('*.json'))]
          assert len(manifest['runs']) == 1000
          assert len(statuses) == 1000
          assert all(status['state'] == 'completed' for status in statuses)
          assert all(status['attempt'] == 1 for status in statuses)
          PY

  performance-memory:
    name: Performance and memory acceptance
    needs: [classify, release-build]
    if: ${{ needs.classify.outputs.change_class == 'full' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download release binary
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anthrosim-ci-release-linux
          path: target/release

      - name: Restore executable bit
        run: chmod +x target/release/anthrosim

      - name: Run M7.5 10k-person 2000-year performance acceptance
        run: |
          python3 scripts/benchmark-performance-acceptance.py \
            --binary target/release/anthrosim \
            --report /tmp/anthrosim-m7-5-performance.json \
            --enforce
          cat /tmp/anthrosim-m7-5-performance.json

      - name: Measure and gate one-million-founder process memory
        run: |
          /usr/bin/time -v -o /tmp/anthrosim-million-founder-time.txt target/release/anthrosim run \
            --years 0 \
            --world-width 64 \
            --world-height 64 \
            --population 1000000 \
            --max-person-records 1000000 \
            --output /tmp/anthrosim-m5-memory.json
          cat /tmp/anthrosim-million-founder-time.txt
          max_rss_kib=$(awk -F: '/Maximum resident set size/ {gsub(/^[ \t]+/, "", $2); print $2}' /tmp/anthrosim-million-founder-time.txt)
          test -n "$max_rss_kib"
          test "$max_rss_kib" -le 163840

  reference-experiment:
    name: Canonical M7.6 reference experiment
    needs: [classify, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "Canonical M7.6 reference experiment is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download release binary
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anthrosim-ci-release-linux
          path: target/release

      - name: Restore executable bit
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: chmod +x target/release/anthrosim

      - name: Run M7.6 canonical resource variability experiment
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rm -rf /tmp/anthrosim-m7-6-resource-variability
          python3 scripts/run-versioned-sweep.py \
            experiments/v0.1-resource-variability.json \
            --binary target/release/anthrosim \
            --run-dir /tmp/anthrosim-m7-6-resource-variability
          cat /tmp/anthrosim-m7-6-resource-variability/reproduction-record.json
          cat /tmp/anthrosim-m7-6-resource-variability/analysis/summary.json
          cat /tmp/anthrosim-m7-6-resource-variability/analysis/points.csv
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('/tmp/anthrosim-m7-6-resource-variability')
          runs = json.loads((root / 'analysis/runs.json').read_text())
          points = json.loads((root / 'analysis/points.json').read_text())
          summary = json.loads((root / 'analysis/summary.json').read_text())
          manifest = json.loads((root / 'sweep-manifest.json').read_text())
          record = json.loads((root / 'reproduction-record.json').read_text())
          reference = json.loads(Path('experiments/v0.1-resource-variability-reference.json').read_text())

          assert len(manifest['points']) == 18
          assert len(runs) == 144
          assert len(points) == 18
          assert all(row['state'] == 'completed' for row in runs)
          assert all(row['completedRuns'] == 8 for row in points)
          assert all(row['failedRuns'] == 0 for row in points)
          assert all(row['incompleteRuns'] == 0 for row in points)
          assert all(row['personRecordLimitReachedRuns'] == 0 for row in points)
          assert all(row['scientificallyEligibleRuns'] == 8 for row in points)
          assert all(row['operationallyCensoredRuns'] == 0 for row in points)
          assert all(row['scientificAggregationStatus'] == 'eligibleScientificOutcome' for row in runs)
          assert all(row['simulatedDays'] is not None for row in runs)
          assert all(row['endDay'] is not None for row in runs)
          assert summary['schemaVersion'] == 6
          assert summary['runRows'] == 144
          assert summary['pointRows'] == 18
          assert summary['completedRuns'] == 144
          assert summary['nonCompletedRuns'] == 0
          assert summary['scientificallyEligibleRuns'] == 144
          assert summary['operationallyCensoredRuns'] == 0
          assert reference['schemaVersion'] == 3
          assert reference['modelSemanticsId'] == 'anthrosim-model-semantics-v29'
          assert record['sweepId'] == manifest['sweepId']
          assert record['modelVersion'] == manifest['modelVersion']
          assert record['gitCommit'] == manifest['gitCommit']
          assert record['gitCommit']
          assert record['definitionSha256'] == reference['definitionSha256']

          observed = []
          for row in points:
              observed.append({
                  'pointId': row['pointId'],
                  'resourceProductivityScalePermille': row['resourceProductivityScalePermille'],
                  'resourceSeasonalityScalePermille': row['resourceSeasonalityScalePermille'],
                  'migrationEnabled': not row['disableMigration'],
                  'durationReachedRuns': row['durationReachedRuns'],
                  'populationExtinctRuns': row['populationExtinctRuns'],
                  'meanFinalLivingPopulationCompletedOnly': row['meanFinalLivingPopulationScientificallyEligibleOnly'],
                  'meanFinalLivingOccupiedCellCountCompletedOnly': row['meanFinalLivingOccupiedCellCountScientificallyEligibleOnly'],
                  'meanLivingConditionPermilleCompletedOnly': row['meanLivingConditionPermilleScientificallyEligibleOnly'],
                  'meanConditionMortalityDeathsCompletedOnly': row['meanConditionMortalityDeathsScientificallyEligibleOnly'],
                  'meanResourceUnmetNeedCompletedOnly': row['meanResourceUnmetNeedScientificallyEligibleOnly'],
                  'meanMigrationMovesCompletedOnly': row['meanMigrationMovesScientificallyEligibleOnly'],
                  'meanMigrationTotalDistanceCellsCompletedOnly': row['meanMigrationTotalDistanceCellsScientificallyEligibleOnly'],
                  'pooledMeanMigrationDistanceCellsPerMoveCompletedOnly': row['pooledMeanMigrationDistanceCellsPerMoveScientificallyEligibleOnly'],
              })
          assert observed == reference['pointResults']
          PY

      - name: Archive M7.6 derived experiment results
        if: ${{ always() && needs.classify.outputs.change_class == 'full' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: m7-6-resource-variability-derived
          if-no-files-found: error
          retention-days: 30
          path: |
            /tmp/anthrosim-m7-6-resource-variability/source-definition.json
            /tmp/anthrosim-m7-6-resource-variability/reproduction-record.json
            /tmp/anthrosim-m7-6-resource-variability/sweep-manifest.json
            /tmp/anthrosim-m7-6-resource-variability/analysis/

  bundle-integration:
    name: M5/M6 bundle integration
    needs: [classify, release-build]
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Documentation-only disposition
        if: ${{ needs.classify.outputs.change_class != 'full' }}
        run: echo "M5/M6 bundle integration is N/A for ${{ needs.classify.outputs.change_class }} changes."

      - name: Checkout
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - name: Download release binary
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: anthrosim-ci-release-linux
          path: target/release

      - name: Restore executable bit
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: chmod +x target/release/anthrosim

      - name: Generate completed M5 sample bundle
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rm -rf /tmp/anthrosim-m6-completed
          target/release/anthrosim run \
            --years 6 \
            --world-width 32 \
            --world-height 32 \
            --population 1000 \
            --seed 4242 \
            --run-dir /tmp/anthrosim-m6-completed \
            --checkpoint-year 3
          target/release/anthrosim resume \
            --checkpoint /tmp/anthrosim-m6-completed/checkpoint.json \
            --run-dir /tmp/anthrosim-m6-completed
          test -f /tmp/anthrosim-m6-completed/manifest.json
          test -f /tmp/anthrosim-m6-completed/world.json
          test -f /tmp/anthrosim-m6-completed/initial-population.json
          test -f /tmp/anthrosim-m6-completed/events.json
          test -f /tmp/anthrosim-m6-completed/metrics.json
          test -f /tmp/anthrosim-m6-completed/checkpoint.json

      - name: Generate paused M5 sample bundle
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          rm -rf /tmp/anthrosim-m6-paused
          target/release/anthrosim run \
            --years 6 \
            --world-width 32 \
            --world-height 32 \
            --population 1000 \
            --seed 4242 \
            --run-dir /tmp/anthrosim-m6-paused \
            --checkpoint-year 3
          test ! -f /tmp/anthrosim-m6-paused/manifest.json
          test -f /tmp/anthrosim-m6-paused/world.json
          test -f /tmp/anthrosim-m6-paused/initial-population.json
          test -f /tmp/anthrosim-m6-paused/events.json
          test -f /tmp/anthrosim-m6-paused/metrics.json
          test -f /tmp/anthrosim-m6-paused/checkpoint.json

      - name: Validate M6 explorer against completed and paused sample runs
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          node scripts/validate-explorer-bundle.mjs /tmp/anthrosim-m6-completed
          node scripts/validate-explorer-bundle.mjs /tmp/anthrosim-m6-paused

      - name: Smoke-test M6 completed bundle server as read-only
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          sha256sum /tmp/anthrosim-m6-completed/*.json > /tmp/m6-completed-before.sha256
          python3 scripts/serve-explorer.py /tmp/anthrosim-m6-completed --port 8765 --no-browser >/tmp/m6-completed-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8765/ >/tmp/m6-completed-index.html; then
              break
            fi
            sleep 0.2
          done
          test -s /tmp/m6-completed-index.html
          curl -fsS http://127.0.0.1:8765/run/manifest.json | cmp - /tmp/anthrosim-m6-completed/manifest.json
          status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8765/run/manifest.json)
          test "$status" = "405"
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          sha256sum /tmp/anthrosim-m6-completed/*.json > /tmp/m6-completed-after.sha256
          diff -u /tmp/m6-completed-before.sha256 /tmp/m6-completed-after.sha256

      - name: Smoke-test M6 paused bundle server as read-only
        if: ${{ needs.classify.outputs.change_class == 'full' }}
        run: |
          sha256sum /tmp/anthrosim-m6-paused/*.json > /tmp/m6-paused-before.sha256
          python3 scripts/serve-explorer.py /tmp/anthrosim-m6-paused --port 8766 --no-browser >/tmp/m6-paused-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/ >/tmp/m6-paused-index.html; then
              break
            fi
            sleep 0.2
          done
          test -s /tmp/m6-paused-index.html
          curl -fsS http://127.0.0.1:8766/run/checkpoint.json | cmp - /tmp/anthrosim-m6-paused/checkpoint.json
          manifest_status=$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8766/run/manifest.json)
          test "$manifest_status" = "404"
          write_status=$(curl -sS -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8766/run/checkpoint.json)
          test "$write_status" = "405"
          kill "$server_pid"
          wait "$server_pid" 2>/dev/null || true
          trap - EXIT
          sha256sum /tmp/anthrosim-m6-paused/*.json > /tmp/m6-paused-after.sha256
          diff -u /tmp/m6-paused-before.sha256 /tmp/m6-paused-after.sha256