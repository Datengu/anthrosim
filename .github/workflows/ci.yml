name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Benchmark synthetic world generation
        run: cargo bench --locked -p anthrosim-core --bench world_generation -- --noplot

      - name: Benchmark population initialization
        run: cargo bench --locked -p anthrosim-core --bench population_initialization -- --noplot

      - name: Benchmark M4 bounded candidate lookup
        run: cargo bench --locked -p anthrosim-core --bench migration_candidates -- --noplot

      - name: Benchmark full resource-migration-demographic lifecycle
        run: cargo bench --locked -p anthrosim-core --bench empty_run -- --noplot

      - name: Benchmark M5 checkpoint persistence
        run: cargo bench --locked -p anthrosim-core --bench checkpoint_persistence -- --noplot

      - name: Build release binaries
        run: cargo build --locked --workspace --release

      - name: Smoke-test M5 checkpoint resume bundle
        run: |
          rm -rf /tmp/anthrosim-m5-resume
          target/release/anthrosim run \
            --years 6 \
            --world-width 32 \
            --world-height 32 \
            --population 1000 \
            --seed 4242 \
            --run-dir /tmp/anthrosim-m5-resume \
            --checkpoint-year 3
          target/release/anthrosim resume \
            --checkpoint /tmp/anthrosim-m5-resume/checkpoint.json \
            --run-dir /tmp/anthrosim-m5-resume
          test -f /tmp/anthrosim-m5-resume/manifest.json
          test -f /tmp/anthrosim-m5-resume/world.json
          test -f /tmp/anthrosim-m5-resume/initial-population.json
          test -f /tmp/anthrosim-m5-resume/events.json
          test -f /tmp/anthrosim-m5-resume/metrics.json
          test -f /tmp/anthrosim-m5-resume/checkpoint.json

      - name: Measure one-million-founder process memory
        run: |
          /usr/bin/time -v target/release/anthrosim run \
            --years 0 \
            --world-width 64 \
            --world-height 64 \
            --population 1000000 \
            --max-person-records 1000000 \
            --output /tmp/anthrosim-m5-memory.json
