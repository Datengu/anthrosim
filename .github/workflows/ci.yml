name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Benchmark synthetic world generation
        run: cargo bench --locked -p anthrosim-core --bench world_generation -- --noplot

      - name: Build release binaries
        run: cargo build --locked --workspace --release
