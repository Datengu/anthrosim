name: M3 checked-division fix bootstrap

on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout M3 branch
        uses: actions/checkout@v6.1.0
        with:
          ref: feat/m3-resources
          persist-credentials: true

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Apply checked-division rewrites
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          population = Path('crates/anthrosim-core/src/population.rs')
          text = population.read_text()
          text, count = re.subn(
              r'if count == 0 \{\s*0\s*\} else \{\s*u16::try_from\(total / count\)\.unwrap_or\(PERMILLE_MAX\)\s*\}',
              'u16::try_from(total.checked_div(count).unwrap_or(0)).unwrap_or(PERMILLE_MAX)',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'population checked-division rewrite count={count}')
          population.write_text(text)

          resources = Path('crates/anthrosim-core/src/resources.rs')
          text = resources.read_text()
          text, count = re.subn(
              r'let supplied_permille = if need == 0 \{\s*u64::from\(PERMILLE_MAX\)\s*\} else \{\s*\(harvest\.saturating_mul\(u64::from\(PERMILLE_MAX\)\) / need\)\s*\.min\(u64::from\(PERMILLE_MAX\)\)\s*\};',
              '''let supplied_permille = harvest
                  .saturating_mul(u64::from(PERMILLE_MAX))
                  .checked_div(need)
                  .unwrap_or(u64::from(PERMILLE_MAX))
                  .min(u64::from(PERMILLE_MAX));''',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'resource checked-division rewrite count={count}')
          resources.write_text(text)
          PY
          cargo fmt --all
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Commit verified fixes
        run: |
          git config user.name "AnthroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add -- crates/anthrosim-core/src/population.rs crates/anthrosim-core/src/resources.rs
          git diff --cached --check
          git commit -m "M3: use checked division for condition metrics"
          git push origin HEAD:feat/m3-resources
