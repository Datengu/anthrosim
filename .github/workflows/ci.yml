name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: true
          ref: feat/m5-observability

      - name: Patch M5 documentation once
        if: github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f'pattern not found in {path}')
              p.write_text(text.replace(old, new, 1))

          replace(
              'docs/scientific-model.md',
              '''### Observation

          The run manifest records aggregate world, population, resource and migration measurements while preserving authoritative persistent state.

          Resource summaries include initial/final stock, cumulative regeneration, harvest/consumption, unmet need, household-periods with unmet need, scarcity deaths, final mean living condition, count below half condition and a deterministic resource-state digest.

          M4 migration summaries include:

          - decision boundaries;
          - households evaluated and households under pressure;
          - completed household moves and people moved;
          - total Manhattan distance;
          - north/east/south/west step totals;
          - realized travel-condition cost;
          - mean origin/destination resource scores;
          - mean origin/destination water/security scores;
          - migration-attributable occupied-cell delta;
          - deterministic migration digest;
          - a bounded sample of detailed completed-move traces.

          Each retained trace contains the household, origin/destination, distance, pressure, local candidate count, factor-by-factor origin and selected-destination utility, best visible candidate, stochastic choice weights/draw and travel condition cost. The default trace cap is 256 so ordinary manifests remain bounded even if many moves occur.

          A trace explains why the implemented model selected a move. It is not evidence of a real person's motive.

          Full chronological event streams remain deferred to M5.
          ''',
              '''### Observation

          M5 separates authoritative engine facts from recalculable summaries. This distinction is part of the scientific model rather than merely an output format.

          **Authoritative events** are versioned, ordered state-transition records. M5 v1 emits births, demographic deaths, resource-scarcity deaths and completed household migrations. Migration events retain the implemented pressure, factor-by-factor origin/destination utility, best locally visible candidate and deterministic stochastic-choice information. These records describe what the implemented model did; they are not inferred historical motives or archaeological interpretations.

          **Derived metric snapshots** are explicitly labelled `derived` and are emitted at completed annual boundaries plus the terminal boundary when necessary. They summarize population, resources and migration and carry the same composite state digest used for deterministic regression checks. Their final values are tested to reconcile with authoritative population/resource/migration summaries.

          The run manifest records experiment configuration, artifact schema versions, world/population/resource/migration summaries, stop reason, deterministic state digest and compact runtime counters. Controlled run directories also contain the generated world, founder population, event log, metric series and checkpoint so later analysis does not require a live simulation process or database.

          M4's bounded retained migration-trace sample remains useful in the aggregate migration summary, while M5's event stream records every completed move. A trace or event explains the implemented mechanism; it is not evidence that a real person held the encoded motive.

          Interpretation remains downstream. Labels such as "collapse", "migration wave", "recovery" or future archaeological classifications must not be silently promoted into authoritative simulated ground truth.
          ''',
          )

          replace(
              'docs/architecture.md',
              '''## Persistence

          A database is not the simulation loop. v0.1 writes versioned manifests, metrics, events, and later checkpoints at controlled boundaries. The authoritative state remains in memory while a run is executing.

          The eventual persistence pattern is expected to combine:

          - immutable run manifest;
          - append-oriented event/metric outputs;
          - periodic checkpoints;
          - compact experiment summaries;
          - optional analytical columnar formats for research workflows.

          M4 currently emits aggregate resource and migration summaries in the run manifest. Migration also retains a configured bounded sample of detailed decision traces so factor-by-factor choice explanations can be inspected without allowing normal manifests to grow without bound. Full chronological event/metric streams remain deferred to M5.
          ''',
              '''## Persistence and observability

          A database is not the simulation loop. The authoritative simulation remains in memory while a run executes; M5 writes versioned artifacts at controlled boundaries for offline analysis and deterministic resumption.

          M5 introduces three explicit artifact classes:

          - authoritative chronological events for births, deaths and completed household moves;
          - derived annual/terminal metric snapshots that reconcile against authoritative state;
          - deterministic annual-boundary checkpoints containing dynamic state, history and exact named-RNG stream positions.

          A controlled run directory contains a manifest, generated world, founder population, event log, metric series and checkpoint. The explorer and research tooling can therefore inspect a completed run without a live database or simulation process.

          Checkpoint restoration reconstructs the immutable synthetic world from experiment configuration + seed and verifies its digest, restores full population/resource state, reconstructs migration scratch buffers from persistent migration state, and restores all seven named ChaCha8 streams from stable stream labels plus their recorded word positions. A composite state digest is checked before execution continues.

          M5 v1 deliberately supports resumable checkpoints only at completed annual boundaries. This keeps the resource -> migration -> demography schedule position unambiguous; partially completed subannual boundaries are not serialized as resumable states.

          Migration still retains a bounded summary sample of detailed decision traces for ordinary manifests, while the authoritative event log records every completed move. Future analytical columnar formats may be added downstream without changing the in-memory simulation ownership boundary.
          ''',
          )
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs
          if ! git diff --cached --quiet; then
            git commit -m "M5: align scientific and architecture documentation"
            git push origin HEAD:feat/m5-observability
          fi

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Versions
        run: |
          rustc --version --verbose
          cargo --version

      - name: Verify locked dependency graph
        run: cargo metadata --locked --no-deps --format-version 1 >/dev/null

      - name: Format
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Test
        run: cargo test --locked --workspace --all-features

      - name: Benchmark synthetic world generation
        run: cargo bench --locked -p anthrosim-core --bench world_generation -- --noplot

      - name: Benchmark population initialization
        run: cargo bench --locked -p anthrosim-core --bench population_initialization -- --noplot

      - name: Benchmark M4 bounded candidate lookup
        run: cargo bench --locked -p anthrosim-core --bench migration_candidates -- --noplot

      - name: Benchmark full resource-migration-demographic lifecycle
        run: cargo bench --locked -p anthrosim-core --bench empty_run -- --noplot

      - name: Benchmark M5 checkpoint persistence
        run: cargo bench --locked -p anthrosim-core --bench checkpoint_persistence -- --noplot

      - name: Build release binaries
        run: cargo build --locked --workspace --release

      - name: Smoke-test M5 checkpoint resume bundle
        run: |
          rm -rf /tmp/anthrosim-m5-resume
          target/release/anthrosim run --years 6 --world-width 32 --world-height 32 --population 1000 --seed 4242 --run-dir /tmp/anthrosim-m5-resume --checkpoint-year 3
          target/release/anthrosim resume --checkpoint /tmp/anthrosim-m5-resume/checkpoint.json --run-dir /tmp/anthrosim-m5-resume
          test -f /tmp/anthrosim-m5-resume/manifest.json
          test -f /tmp/anthrosim-m5-resume/world.json
          test -f /tmp/anthrosim-m5-resume/initial-population.json
          test -f /tmp/anthrosim-m5-resume/events.json
          test -f /tmp/anthrosim-m5-resume/metrics.json
          test -f /tmp/anthrosim-m5-resume/checkpoint.json

      - name: Measure one-million-founder process memory
        run: |
          /usr/bin/time -v target/release/anthrosim run \
            --years 0 \
            --world-width 64 \
            --world-height 64 \
            --population 1000000 \
            --max-person-records 1000000 \
            --output /tmp/anthrosim-m5-memory.json
