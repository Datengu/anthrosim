name: M9.6 Explorer development integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'm9/m9-6-observability-integration' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          ref: m9/m9-6-observability-integration
          fetch-depth: 0

      - name: Apply M9.6 Explorer patch
        run: python scripts/apply_m9_6_explorer.py

      - name: Check Explorer modules
        run: |
          node --check explorer/model.mjs
          node --check explorer/app.mjs

      - name: Test Explorer
        run: node --test explorer/*.test.mjs

      - name: Test CLI targets
        run: cargo test --locked -p anthrosim-cli --all-targets

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Remove development helper
        run: |
          rm scripts/apply_m9_6_explorer.py
          rm .github/workflows/m9-6-explorer-dev.yml

      - name: Commit integrated M9.6 Explorer support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M9.6: surface temporary observability in Explorer"
          git push origin HEAD:m9/m9-6-observability-integration
