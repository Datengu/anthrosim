name: Audit v6 Area B birthday cadence adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v6_area_b_birthday_cadence.rs'
      - '.github/workflows/audit-v6-area-b-birthday-cadence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  birthday-cadence-adversary:
    name: Birthday crossing demographic cadence adversary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v6 Area-B birthday-cadence adversary
        run: cargo test --locked -p anthrosim-core --test audit_v6_area_b_birthday_cadence -- --nocapture
