name: Apply AV4-001 semantics docs

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/apply-av4-001-semantics-docs.py'
      - '.github/workflows/apply-av4-001-semantics-docs.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.number == 553
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true
          fetch-depth: 0
      - name: Apply semantics and living-document updates
        run: python scripts/apply-av4-001-semantics-docs.py
      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo 'Already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md docs/research/trace.md docs/research/audit-v4/STATUS.md scripts/test-current-model-semantics-docs.py
          git commit -m 'docs: bind AV4-001 remediation line to model semantics v26'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
