name: Temporary issue 95 documentation patch

on:
  pull_request:

permissions:
  contents: write

jobs:
  patch:
    if: github.event.pull_request.head.ref == 'docs/95-post-m8-reconciliation' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: docs/95-post-m8-reconciliation
      - name: Reconcile post-M8 documentation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          # Main-CLI examples in the M7 experiment guide must select the main
          # binary explicitly now that anthrosim-cli contains multiple binaries.
          experiments = Path('docs/experiments-v0.1.md')
          text = experiments.read_text()
          for command in ('run', 'resume', 'ensemble', 'sweep', 'provenance'):
              text = text.replace(
                  f'cargo run --release -p anthrosim-cli -- {command}',
                  f'cargo run --release -p anthrosim-cli --bin anthrosim -- {command}',
              )
              text = text.replace(
                  f'cargo run -p anthrosim-cli -- {command}',
                  f'cargo run -p anthrosim-cli --bin anthrosim -- {command}',
              )
          experiments.write_text(text)

          architecture = Path('docs/architecture.md')
          text = architecture.read_text()
          old = '''A completed controlled run directory contains a manifest, generated world, founder population, event log, metric series and checkpoint. A deliberately paused `--checkpoint-year` directory contains world, founder population, event log, metric series and checkpoint but no completed-run manifest. The explorer and research tooling can inspect either form without a live database or simulation process.'''
          new = '''A fresh completed controlled run directory contains a manifest, generated world, the day-zero founder population in `initial-population.json`, event log, metric series and checkpoint. A deliberately paused `--checkpoint-year` directory contains the same day-zero founder artifact plus world, event log, metric series and checkpoint but no completed-run manifest. The explorer and research tooling can inspect either form without a live database or simulation process.\n\nA run resumed into a different directory also retains `resume-start-population.json` as the population snapshot at the resume boundary. That boundary snapshot is provenance, **not** a replacement for the founders. Before the resumed bundle is promoted, AnthroSim deterministically materializes the true day-zero `initial-population.json` from the checkpoint's immutable population configuration, seed and authoritative world. An in-place resume preserves the original founder artifact. Full-history reconstruction therefore always begins from `initial-population.json`; treating `resume-start-population.json` as founders would double-apply the pre-resume event history.'''
          if old not in text:
              raise SystemExit('architecture persistence paragraph anchor not found')
          text = text.replace(old, new, 1)

          old = '''`scripts/serve-explorer.py` binds to loopback by default and exposes only fixed explorer assets plus the five run files common to completed and paused M5 bundles. `manifest.json` is additionally exposed only when it actually exists. The server implements GET/HEAD only and rejects write methods. The browser application performs no API call that can mutate simulation or artifact state.'''
          new = '''`scripts/serve-explorer.py` binds to loopback by default and exposes only fixed explorer assets plus an explicit allowlist of run artifacts. The required M5 reconstruction inputs are `world.json`, `initial-population.json`, `events.json`, `metrics.json` and `checkpoint.json`; `manifest.json` is exposed only when it exists. A resumed bundle may additionally expose `resume-start-population.json` as boundary provenance, while M8 landscape/spatial artifacts remain optional allowlisted extensions. The server implements GET/HEAD only and rejects write methods. The browser application performs no API call that can mutate simulation or artifact state.'''
          if old not in text:
              raise SystemExit('architecture explorer paragraph anchor not found')
          architecture.write_text(text.replace(old, new, 1))

          readme = Path('README.md')
          text = readme.read_text()
          anchor = '''cargo run --release -p anthrosim-cli --bin anthrosim -- resume --checkpoint runs/m5-resume/checkpoint.json --run-dir runs/m5-resume\n```\n'''
          addition = '''cargo run --release -p anthrosim-cli --bin anthrosim -- resume --checkpoint runs/m5-resume/checkpoint.json --run-dir runs/m5-resume\n```\n\n`initial-population.json` is always the day-zero founder state used by the explorer for full-history reconstruction. If a checkpoint is resumed into a **different** output directory, the completed bundle also retains `resume-start-population.json` as the population at the resume boundary. AnthroSim deterministically reconstructs/writes the true original `initial-population.json` into that new bundle; `resume-start-population.json` is boundary provenance and must never be treated as the founders.\n'''
          if anchor not in text:
              raise SystemExit('README resume example anchor not found')
          readme.write_text(text.replace(anchor, addition, 1))

          # Give the later independent-engine decision the next unused stable ADR
          # number rather than renumbering established ADRs 0001-0004.
          old_adr = Path('docs/adr/0001-independent-simulation-engine-and-external-tooling.md')
          new_adr = Path('docs/adr/0005-independent-simulation-engine-and-external-tooling.md')
          adr = old_adr.read_text()
          heading = '# ADR 0001: Keep AnthroSim as an independent simulation engine and integrate mature external scientific tooling'
          if heading not in adr:
              raise SystemExit('ADR heading anchor not found')
          new_adr.write_text(adr.replace(heading, heading.replace('0001', '0005'), 1))
          old_adr.unlink()

          ci = Path('docs/ci-validation.md')
          ci.write_text('''# CI validation topology\n\nAnthroSim separates validation by responsibility so cheap correctness failures are reported before expensive research and performance work consumes runner time. Workflow files are kept independent where a failure represents a distinct research-engineering contract; this document describes those responsibilities rather than duplicating their implementation steps.\n\n## Main CI workflow\n\nThe `CI` workflow (`.github/workflows/ci.yml`) owns the general Rust/application quality and scale gates:\n\n1. **Quality and tests** — locked dependency metadata, formatting, Clippy, and the full Rust workspace test suite.\n2. **Explorer and script validation** — JavaScript/Python syntax checks and explorer model tests.\n3. Once both cheap gates pass, **Core benchmarks** and **Release build** run independently.\n4. The release build is reused by the focused downstream gates for the 1000-run ensemble soak, performance/memory acceptance, the canonical M7.6 reference experiment, and M5/M6 bundle integration.\n\nThe dependency graph prevents formatting, lint, unit-test, or script failures from spending time on the expensive acceptance stages while keeping the release binary identical across downstream gates.\n\n## Independent reproducibility and research-artifact workflows\n\nThe following workflow families remain separate from the main CI graph because each protects a distinct contract:\n\n- **Cross-platform determinism** (`cross-platform-determinism.yml`) — requires normalized authoritative outputs from the compact golden fixture to agree across Ubuntu, Windows and macOS.\n- **Landscape preprocessing** (`landscape-preprocessing.yml`) — checks deterministic normalization/preprocessing of declared landscape inputs.\n- **Landscape loading determinism** (`landscape-loading.yml`) — verifies normalized landscape loading and landscape-bound execution remain deterministic and correctly bound.\n- **Spatial mechanism determinism** (`spatial-mechanisms.yml`) — validates versioned landscape-to-model transformations, mechanism identity and transformed spatial execution.\n- **Spatial observability** (`spatial-observability.yml`) — regenerates/validates downstream spatial observability, including resumed spatial histories and tamper rejection.\n- **Resumed Explorer compatibility** (`resumed-explorer.yml`) — proves new-directory resumed core and transformed-spatial bundles contain true day-zero founders, retain resume-boundary provenance, reconcile through M6, and are served read-only.\n- **Run bundle pack** (`run-bundle-pack.yml`) — validates semantic pack acceptance/rejection and deterministic canonical ZIP output for shareable completed run bundles.\n- **Source provenance** (`source-provenance.yml`) — checks clean/dirty/override source identities and the exact-binary provenance preflight used by versioned research sweeps.\n- **M8 benchmark data** (`m8-benchmark-data.yml`) — validates the committed benchmark input/data provenance contract independently of simulation output.\n- **M8.6 evidence-grounded spatial benchmark** (`m8-spatial-benchmark.yml`) — executes and checks the declared evidence-grounded reference benchmark/reproduction path.\n\nThese workflows complement rather than replace semantic validation inside the binaries. A green workflow shows that the corresponding contract passed in CI; artifact readers and research commands still validate the artifacts they consume.\n\n## Supply-chain rule\n\nEvery third-party GitHub Action is pinned to an immutable full commit SHA with a human-readable release comment. Updates follow the reviewed process in `CONTRIBUTING.md`; mutable tags and branches are not accepted as CI dependencies.\n''')
          PY

          echo 'Population-artifact references after reconciliation:'
          git grep -n -E 'initial-population\.json|resume-start-population\.json' -- '*.md' || true

          echo 'Checking for ambiguous main anthrosim-cli cargo examples:'
          if git grep -n -E 'cargo run([^\n]* )?-p anthrosim-cli -- (run|resume|ensemble|sweep|provenance)([[:space:]\\]|$)' -- '*.md'; then
            echo 'Found ambiguous main CLI examples that still omit --bin anthrosim' >&2
            exit 1
          fi

          rm .github/workflows/zz-temp-issue-95-docs.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Reconcile post-M8 documentation contracts'
          git push origin HEAD:docs/95-post-m8-reconciliation
