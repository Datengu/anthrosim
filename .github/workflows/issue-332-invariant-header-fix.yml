name: Issue 332 invariant header fix
on:
  push:
    branches:
      - fix/332-year-zero-checkpoint-metrics
jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/332-year-zero-checkpoint-metrics
      - name: Patch invariant and verify
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('crates/anthrosim-core/src/invariants.rs')
          s = p.read_text()
          old = '''    let nonterminal_initial_checkpoint = recorded_stop_reason.is_none()
              && checkpoint.terminal_stop_reason.is_none()
              && checkpoint.time.days() == 0;
          '''.replace('          ', '')
          assert old in s
          new = '''    if checkpoint.metrics.schema_version != MetricSeries::CURRENT_SCHEMA_VERSION
              || checkpoint.metrics.cadence != "annual_boundary_plus_terminal"
          {
              return violation("metric series schema/cadence is invalid");
          }
          let nonterminal_initial_checkpoint = recorded_stop_reason.is_none()
              && checkpoint.terminal_stop_reason.is_none()
              && checkpoint.time.days() == 0;
          '''.replace('          ', '')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('crates/anthrosim-core/tests/checkpoint_persistence.rs')
          s = p.read_text()
          marker = '''#[test]
          fn legacy_nonterminal_year_zero_metric_snapshot_is_rejected_after_reseal() {'''.replace('          ', '')
          assert marker in s
          test = '''#[test]
          fn year_zero_checkpoint_invariants_still_validate_metric_series_identity() {
              let mut checkpoint = Simulation::new(experiment_with_duration(2))
                  .unwrap()
                  .checkpoint_at_year(0)
                  .unwrap();
              checkpoint.metrics.schema_version += 1;
              let error = checkpoint.validate_invariants().unwrap_err();
              assert!(error.to_string().contains("metric series schema/cadence is invalid"));
          }

          '''.replace('          ', '')
          assert 'year_zero_checkpoint_invariants_still_validate_metric_series_identity' not in s
          s = s.replace(marker, test + marker, 1)
          p.write_text(s)
          PY

          cargo fmt --all
          cargo test -p anthrosim-core --test checkpoint_persistence year_zero -- --nocapture
          cargo clippy --workspace --all-targets -- -D warnings
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/invariants.rs crates/anthrosim-core/tests/checkpoint_persistence.rs
          git commit -m 'fix: retain metric identity validation at year zero (#332)'
          git push origin HEAD:fix/332-year-zero-checkpoint-metrics