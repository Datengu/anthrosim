name: AV3-007 post-merge reverification

on:
  push:
    branches:
      - audit-v3/413-post-merge-reverification
  pull_request:
    paths:
      - scripts/audit-v3-post-merge-test-support-sensitivity-execution-binding.py
      - scripts/research-observable-support-results.py
      - scripts/research-analysis-provenance.py
      - .github/workflows/audit-v3-413-post-merge.yml

permissions:
  contents: read

jobs:
  reverify-av3-007:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
      - name: Replay original fabricated-analysis adversary
        run: python3 scripts/audit-v3-post-merge-test-support-sensitivity-execution-binding.py
