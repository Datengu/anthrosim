name: M9.6 CLI development integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'm9/m9-6-cli-integration' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          ref: m9/m9-6-cli-integration
          fetch-depth: 0

      - name: Apply M9.6 CLI patch
        run: python scripts/apply_m9_6_cli_integration.py

      - name: Update direct landscape config test calls
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('crates/anthrosim-cli/src/bin/anthrosim-landscape.rs')
          text = path.read_text()
          old = '''            Some(evidence),\n        );'''
          new = '''            Some(evidence),\n            None,\n        );'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one evidence fixture call, found {text.count(old)}')
          text = text.replace(old, new, 1)
          old = 'let config = experiment_config(78, 0, 1, 1, 1, 1, 16, 1_000, 1_000, 100, false, 1, None);'
          new = 'let config = experiment_config(78, 0, 1, 1, 1, 1, 16, 1_000, 1_000, 100, false, 1, None, None);'
          if text.count(old) != 1:
              raise SystemExit(f'expected one missing-evidence fixture call, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test CLI M9 integration
        run: cargo test --locked -p anthrosim-cli --all-targets

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Remove development helper
        run: |
          rm scripts/apply_m9_6_cli_integration.py
          rm .github/workflows/m9-6-cli-integration-dev.yml

      - name: Commit integrated M9.6 CLI support
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M9.6: expose temporary mobility to experiment runners"
          git push origin HEAD:m9/m9-6-cli-integration
