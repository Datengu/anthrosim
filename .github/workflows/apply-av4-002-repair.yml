name: Apply AV4-002 background mortality repair

on:
  push:
    branches:
      - repair/av4-002-background-mortality-coupling
    paths:
      - '.github/workflows/apply-av4-002-repair.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: repair/av4-002-background-mortality-coupling
      - name: Apply repair patch
        run: |
          python3 scripts/tmp_apply_av4_002_repair.py
          python3 scripts/tmp_fix_av4_002_candidate.py
      - name: Format and targeted verification
        run: |
          cargo fmt --all -- --check || cargo fmt --all
          cargo test -p anthrosim-core --test background_mortality_label_invariance --locked -- --nocapture
          cargo test -p anthrosim-core mortality::tests --locked
          cargo clippy -p anthrosim-core --all-targets -- -D warnings
          python3 scripts/test-current-model-semantics-docs.py
      - name: Commit repair candidate
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/mortality.rs crates/anthrosim-core/src/resources.rs crates/anthrosim-core/src/demography.rs crates/anthrosim-core/src/provenance.rs crates/anthrosim-core/src/checkpoint.rs crates/anthrosim-core/tests/background_mortality_label_invariance.rs scripts/test-current-model-semantics-docs.py README.md docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md docs/research/trace.md docs/research/README.md docs/roadmap.md
          git diff --cached --check
          git commit -m 'fix: make background mortality RNG assignment person-label invariant'
          git push origin HEAD:repair/av4-002-background-mortality-coupling
