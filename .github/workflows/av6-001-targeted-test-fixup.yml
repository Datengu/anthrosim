name: AV6-001 targeted regression fixup

on:
  push:
    branches:
      - audit/repair-687-av6-001

permissions:
  contents: write

jobs:
  targeted-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-687-av6-001
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1

      - name: Fix fixture type and run targeted regressions
        run: |
          python3 -c "from pathlib import Path; p=Path('crates/anthrosim-core/tests/av6_001_scheduler_boundary.rs'); s=p.read_text(); assert s.count('capacity_per_day: u64') == 4; p.write_text(s.replace('capacity_per_day: u64', 'capacity_per_day: u32'))"
          cargo fmt --all
          cargo test --locked -p anthrosim-core --test av6_001_scheduler_boundary --test av6_001_core_scheduler_boundary
          git rm .github/workflows/av6-001-targeted-test-fixup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "test(audit-v6): validate AV6-001 boundary regressions"
          git push origin HEAD:audit/repair-687-av6-001
