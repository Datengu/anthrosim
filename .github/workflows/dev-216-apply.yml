name: Dev 216 apply
on:
  push:
    branches:
      - fix/216-initial-resource-state
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/216-initial-resource-state
      - name: Apply source patch
        run: python3 scripts/dev-216-apply.py
      - name: Format
        run: cargo fmt --all
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/config.rs crates/anthrosim-core/src/resources.rs crates/anthrosim-core/src/provenance.rs
          git commit -m "fix: make initial resource stock explicit"
          git push origin HEAD:fix/216-initial-resource-state
