name: Validate issue 197 branch

on:
  push:
    branches:
      - fix/197-target-arrival-reconsideration

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/197-target-arrival-reconsideration
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Format branch changes
        run: cargo fmt --all
      - name: Run issue 197 acceptance tests
        run: cargo test -p anthrosim-core target_arrival_reconsideration_tests
      - name: Remove temporary validation workflow
        run: git rm .github/workflows/validate-197-local.yml
      - name: Commit formatting and cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_mobility.rs crates/anthrosim-core/src/target_arrival_reconsideration_tests.rs crates/anthrosim-core/src/lib.rs crates/anthrosim-core/src/provenance.rs
          git commit -m "test: validate target-arrival reconsideration"
          git push origin HEAD:fix/197-target-arrival-reconsideration
