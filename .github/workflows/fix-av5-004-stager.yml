name: Fix AV5-004 staging anchor

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/fix-av5-004-stager.yml'

permissions:
  contents: write

jobs:
  fix-stager:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: true
      - name: Correct anchor indentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/apply-av5-004-repair.yml')
          text = path.read_text()
          old_a = "              '''            equal_cost_destinations: None,\n                  destination_tie_seed: None,\n              };\n          ''',"
          new_a = "              '''            equal_cost_destinations: None,\n                      destination_tie_seed: None,\n                  };\n          ''',"
          old_b = "              '''            equal_cost_destinations: None,\n                  destination_tie_seed: None,\n                  destination_coupling_context: None,\n              };\n          ''',"
          new_b = "              '''            equal_cost_destinations: None,\n                      destination_tie_seed: None,\n                      destination_coupling_context: None,\n                  };\n          ''',"
          if text.count(old_a) != 1 or text.count(old_b) != 1:
              raise SystemExit(f'anchor fix counts old={text.count(old_a)} new={text.count(old_b)}')
          path.write_text(text.replace(old_a, new_a, 1).replace(old_b, new_b, 1))
          PY
          git config user.name "Datengu"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add .github/workflows/apply-av5-004-repair.yml
          git commit -m "chore: correct AV5-004 staging anchor"
          git push origin HEAD:audit/repair-629-av5-004
