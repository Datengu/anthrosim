name: AV4-008 temporary diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-av4-008-diagnostics.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reference-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Upload stored Issue-304 reference
        uses: actions/upload-artifact@v4
        with:
          name: av4-008-stored-issue304-reference
          path: research/general-demography-baseline-v1/confirmatory-result.json
          if-no-files-found: error
