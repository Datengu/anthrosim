name: AV4-008 temporary diagnostics

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/tmp-av4-008-diagnostics.yml'
      - 'crates/anthrosim-core/**'
      - 'docs/**'
      - 'scripts/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  workspace-test-diagnostics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: dtolnay/rust-toolchain@4305c38b25d97ef35a8ad1f985ccf2d2242004f2
        with:
          toolchain: 1.97.1
      - name: Capture workspace test output
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked -- --nocapture 2>&1 | tee /tmp/av4-008-cargo-test.log
          status=${PIPESTATUS[0]}
          echo "$status" > /tmp/av4-008-status.txt
          exit 0
      - name: Upload diagnostic log
        uses: actions/upload-artifact@v4
        with:
          name: av4-008-workspace-test-diagnostics
          path: |
            /tmp/av4-008-cargo-test.log
            /tmp/av4-008-status.txt
          if-no-files-found: error
