name: M9.5 acceptance helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply guarded M9.5 acceptance patch
        run: python3 scripts/m9_5_acceptance_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Test core M9.5 integration and acceptance
        run: cargo test --locked -p anthrosim-core
      - name: Commit M9.5 acceptance coverage
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/anthrosim-core/src/resources.rs \
            crates/anthrosim-core/src/temporary_resource.rs \
            crates/anthrosim-core/tests/m9_5_resources.rs
          git commit -m "Add M9.5 duration-aware resource acceptance coverage"
          git push origin HEAD:m9/m9-5-duration-aware-resources

# Temporary integration machinery; remove before PR completion.
