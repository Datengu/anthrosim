name: M9.5 cleanup helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Mark M9.5 complete and remove temporary helpers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('docs/roadmap.md')
          text = path.read_text()
          old = '#### M9.5 — Duration-aware resource/presence accounting\n'
          new = '#### M9.5 — Duration-aware resource/presence accounting — complete\n'
          if new not in text:
              if text.count(old) != 1:
                  raise SystemExit('expected exactly one M9.5 roadmap heading')
              text = text.replace(old, new, 1)
              path.write_text(text)
          PY
          rm .github/workflows/m9-5-integration-helper.yml
          rm scripts/m9_5_integrate.py
          rm scripts/m9_5_acceptance_patch.py
      - name: Commit final M9.5 cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete M9.5 roadmap and remove development helpers"
          git push origin HEAD:m9/m9-5-duration-aware-resources

# This workflow removes itself after the guarded M9.5 implementation is validated.
