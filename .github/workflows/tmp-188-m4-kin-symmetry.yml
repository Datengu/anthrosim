name: Temporary #188 M4 kin symmetry repair

on:
  push:
    branches:
      - fix/188-m4-kin-symmetry

permissions:
  contents: write

concurrency:
  group: tmp-188-m4-kin-symmetry
  cancel-in-progress: false

jobs:
  patch-test-and-commit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          ref: fix/188-m4-kin-symmetry
          fetch-depth: 0
      - name: Apply guarded source and documentation patch
        run: python3 .github/scripts/patch_188_m4_kin_symmetry.py
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1
      - name: Format
        run: cargo fmt --all
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace --all-features
      - name: Release build
        run: cargo build --locked --workspace --release
      - name: Commit production repair and remove temporary runner
        run: |
          rm .github/scripts/patch_188_m4_kin_symmetry.py
          rm .github/workflows/tmp-188-m4-kin-symmetry.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: make M4 kin proxy symmetric"
          git push origin HEAD:fix/188-m4-kin-symmetry
