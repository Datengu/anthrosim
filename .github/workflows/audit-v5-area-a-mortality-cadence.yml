name: Audit v5 Area A mortality cadence adversary

on:
  pull_request:
    branches: [main]
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_a_mortality_cadence.rs'
      - '.github/workflows/audit-v5-area-a-mortality-cadence.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mortality-cadence-adversary:
    name: Annual mortality M3 cadence adversary
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-A cadence adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_a_mortality_cadence -- --nocapture
