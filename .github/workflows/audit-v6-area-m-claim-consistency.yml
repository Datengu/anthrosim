name: Audit v6 Area M claim consistency

on:
  pull_request:
    paths:
      - "scripts/audit-v6-area-m-claim-consistency.py"
      - ".github/workflows/audit-v6-area-m-claim-consistency.yml"
      - "docs/research/long-run-regime-diagnostics-v1.md"
      - "docs/research/analysis-provenance-v2.md"
      - "docs/research/trace.md"
      - "docs/research/audit-v6/area-k-2026-09-09.md"
      - "docs/research/audit-v6/area-l-2026-09-09.md"
      - "scripts/research-long-run-diagnostics.py"

permissions:
  contents: read

jobs:
  claim-consistency-adversary:
    name: Documentation scientific-contract adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run Area M claim-consistency adversary
        run: python3 scripts/audit-v6-area-m-claim-consistency.py
