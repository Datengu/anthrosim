name: Bootstrap repair 387 docs

on:
  push:
    branches:
      - fix/387-spatial-founder-history-v22
    paths:
      - .github/workflows/repair-387-docs-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize living semantics documentation
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('docs/scientific-model.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]
          for path in paths:
              text = path.read_text()
              old = 'current model semantics v21'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one current v21 phrase, found {text.count(old)}')
              path.write_text(text.replace(old, 'current model semantics v22'))

          contract = Path('docs/research/m2-demographic-time-contract-v1.md')
          text = contract.read_text()
          marker = 'Founder demographic/kin prehistory is handled by the separate declared-founder contract rather than hidden inside annual transition code.\n'
          addition = marker + '\nFrom model semantics v22, both the synthetic and spatial authoritative hosts pass declared founder reproductive history into the same annual fertility-spacing finalizer, including after spatial checkpoint/resume. Immutable v0.3.3/v21 remains the historical baseline before that cross-host parity repair.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'M2 contract founder-history marker count: {text.count(marker)}')
          contract.write_text(text.replace(marker, addition))

          Path('.github/workflows/repair-387-docs-bootstrap.yml').unlink()
      - name: Commit documentation synchronization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md docs/research/m2-demographic-time-contract-v1.md .github/workflows/repair-387-docs-bootstrap.yml
          git commit -m "docs: document v22 spatial founder-history parity"
          git push
