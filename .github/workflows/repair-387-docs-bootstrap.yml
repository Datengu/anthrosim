name: Bootstrap repair 387 docs

on:
  push:
    branches:
      - fix/387-spatial-founder-history-v22
    paths:
      - .github/workflows/repair-387-docs-bootstrap.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Synchronize living semantics documentation
        shell: python
        run: |
          from pathlib import Path

          paths = [
              Path('docs/scientific-model.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]
          for path in paths:
              text = path.read_text()
              old = 'current model semantics v21'
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one current v21 phrase, found {text.count(old)}')
              path.write_text(text.replace(old, 'current model semantics v22'))

          model = Path('docs/scientific-model.md')
          text = model.read_text()
          marker = '- Female parenthood and a female founder\'s pre-run `lastBirthDay` must fall inside configured fertility-age bands with positive probability support; male parenthood must fall inside `[maleParentMinAgeYears, maleParentMaxAgeYearsExclusive)`.\n'
          addition = marker + '- From model semantics v22, that declared pre-run reproductive history is supplied to annual M2 identically by both synthetic and spatial authoritative hosts, including after spatial checkpoint/resume; v0.3.3/v21 remains the immutable historical baseline where the spatial host omitted this fallback.\n'
          if text.count(marker) != 1:
              raise SystemExit(f'scientific-model founder-history marker count: {text.count(marker)}')
          model.write_text(text.replace(marker, addition))

          Path('.github/workflows/repair-387-docs-bootstrap.yml').unlink()
      - name: Commit documentation synchronization
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md .github/workflows/repair-387-docs-bootstrap.yml
          git commit -m "docs: document v22 spatial founder-history parity"
          git push
