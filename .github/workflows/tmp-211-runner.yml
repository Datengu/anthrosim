name: Temporary #211 runner

on:
  push:
    branches: [feat/211-spatial-boundary-contract]

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: feat/211-spatial-boundary-contract
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1

      - name: Fix convergence result ownership
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/anthrosim-core/src/spatial_boundary.rs')
          text = path.read_text()
          old = """    let latest = comparisons
        .last()
        .expect(\"two observations must produce one comparison\");
    let adequate = trailing_stable_extensions >= criterion.required_consecutive_stable_extensions;

    Ok(SpatialExtentConvergenceAssessment {
        schema_version: SpatialExtentConvergenceAssessment::CURRENT_SCHEMA_VERSION,
        criterion,
        observations,
        comparisons,
        trailing_stable_extensions,
        latest_extension_within_tolerance: latest.all_metrics_within_tolerance,
        latest_extension_eligible_for_stability_sequence: latest.eligible_for_stability_sequence,
        material_boundary_dependence_at_latest_extension: !latest.all_metrics_within_tolerance,
        adequate,
    })
"""
          new = """    let latest = comparisons
        .last()
        .expect(\"two observations must produce one comparison\");
    let latest_extension_within_tolerance = latest.all_metrics_within_tolerance;
    let latest_extension_eligible_for_stability_sequence = latest.eligible_for_stability_sequence;
    let material_boundary_dependence_at_latest_extension = !latest_extension_within_tolerance;
    let adequate = trailing_stable_extensions >= criterion.required_consecutive_stable_extensions;

    Ok(SpatialExtentConvergenceAssessment {
        schema_version: SpatialExtentConvergenceAssessment::CURRENT_SCHEMA_VERSION,
        criterion,
        observations,
        comparisons,
        trailing_stable_extensions,
        latest_extension_within_tolerance,
        latest_extension_eligible_for_stability_sequence,
        material_boundary_dependence_at_latest_extension,
        adequate,
    })
"""
          if old not in text:
              raise SystemExit('expected convergence return block not found')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          cargo fmt --all -- --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/spatial_boundary.rs
          git commit -m "fix: finalize spatial extent convergence assessment"
          git push origin HEAD:feat/211-spatial-boundary-contract

      - name: Validate
        run: |
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo build --locked --workspace --release

      - name: Remove temporary helpers
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/tmp-211-format-validation.yml .github/workflows/tmp-211-runner.yml
          git commit -m "chore: remove temporary #211 validation workflows"
          git push origin HEAD:feat/211-spatial-boundary-contract
