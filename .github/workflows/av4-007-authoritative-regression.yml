name: AV4-007 authoritative M9 household-label regression

on:
  push:
    branches:
      - repair/av4-007-m9-household-tie-key

permissions:
  contents: write

jobs:
  patch-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-007-m9-household-tie-key
          fetch-depth: 0
      - name: Install pinned Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.97.1
          components: rustfmt
      - name: Apply authoritative regression
        run: python scripts/av4-007-add-authoritative-regression.py
      - name: Format
        run: cargo fmt --all -- --check || (cargo fmt --all && cargo fmt --all -- --check)
      - name: Run authoritative and existing AV4-007 regressions
        run: |
          cargo test -p anthrosim-core authoritative_tied_destination_is_household_label_invariant --locked -- --nocapture
          cargo test -p anthrosim-core --test m9_household_label_invariance --locked -- --nocapture
          cargo test -p anthrosim-core --test m9_equal_cost_destinations --locked -- --nocapture
      - name: Commit permanent regression
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_mobility.rs
          git diff --cached --check
          git commit -m "test: cover authoritative M9 household-label invariance"
          git push origin HEAD:repair/av4-007-m9-household-tie-key
