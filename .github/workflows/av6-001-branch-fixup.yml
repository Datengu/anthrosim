name: AV6-001 branch fixup

on:
  push:
    branches:
      - audit/repair-687-av6-001

permissions:
  contents: write

jobs:
  fixup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-687-av6-001
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1

      - name: Synchronize repair branch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=None):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old!r}')
              if count is None:
                  text = text.replace(old, new)
              else:
                  text = text.replace(old, new, count)
              p.write_text(text, encoding='utf-8')

          replace(
              'crates/anthrosim-core/src/simulation.rs',
              'checkpoint model semantics identity {found} does not match current model version {expected}',
              'checkpoint model semantics identity {found} does not match current model semantics identity {expected}',
              1,
          )

          current_docs = [
              'README.md',
              'docs/architecture.md',
              'docs/roadmap.md',
              'docs/scientific-model.md',
              'docs/research/README.md',
              'docs/research/trace.md',
              'docs/research/odd.md',
              'docs/research/odd-d.md',
          ]
          for path in current_docs:
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              text = text.replace('current model semantics v35', 'current model semantics v36')
              p.write_text(text, encoding='utf-8')

          replace(
              'README.md',
              '**This living source tree carries AnthroSim software version `0.3.6` at current model semantics v36.** The v0.3.6 release line freezes the fully remediated Scientific Audit-v5 state.',
              '**This living source tree carries AnthroSim software version `0.3.6` at current model semantics v36.** The immutable `v0.3.6` release remains the Scientific Audit-v6 discovery baseline at model semantics v35; living v36 contains post-discovery Audit-v6 remediation.',
              1,
          )
          replace(
              'README.md',
              '**Scientific Audits v4 and v5 are complete.** Audit v5 independently restarted Areas A–N against immutable `v0.3.5`/v33 and demonstrated **8 findings: 4 P1 and 4 P2**. All eight received their required production dispositions; all P1 repairs received independent post-merge adversarial re-verification; living semantics advanced to v35 where causal meaning changed. Audit v5 is therefore a **non-clean convergence pass** because it discovered new P1 defects. Under the repository convergence rule, another fresh full audit against the newly frozen repaired baseline is required before the first empirical/site-specific study. See [`docs/research/audit-v5/STATUS.md`](docs/research/audit-v5/STATUS.md).',
              '**Scientific Audit v6 discovery is complete against immutable `v0.3.6`/v35.** It demonstrated **14 findings: 7 P1 and 7 P2**, so it is another **non-clean convergence pass**. Controlled remediation is in progress on living source; P1 repairs require independent post-merge adversarial re-verification before closure. The authoritative live ledger is [`docs/research/audit-v6/STATUS.md`](docs/research/audit-v6/STATUS.md).',
              1,
          )

          replace(
              'docs/scientific-model.md',
              '**Status:** working specification for the v0.3.6 release line after completed Audit-v5 remediation / current model semantics v36 (immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**Status:** working specification for living v0.3.6-source development during Scientific Audit-v6 remediation / current model semantics v36 (immutable v0.3.6 release baseline and Audit-v6 discovery target: v35; immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              1,
          )
          replace(
              'docs/research/trace.md',
              '**AnthroSim baseline:** v0.3.6 release line / current model semantics v36 (immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** living v0.3.6-source development / current model semantics v36 (immutable v0.3.6 release baseline and Audit-v6 discovery target: v35; immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              1,
          )
          replace(
              'docs/research/odd.md',
              '**AnthroSim baseline:** v0.3.6 release line after completed Audit-v5 remediation / current model semantics v36 (immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** living v0.3.6-source development during Scientific Audit-v6 remediation / current model semantics v36 (immutable v0.3.6 release baseline and Audit-v6 discovery target: v35; immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              1,
          )
          replace(
              'docs/research/odd-d.md',
              '**AnthroSim baseline:** completed M9 / v0.3.6 release line after completed Audit-v5 remediation / current model semantics v36 (immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**AnthroSim baseline:** completed M9 / living v0.3.6-source development during Scientific Audit-v6 remediation / current model semantics v36 (immutable v0.3.6 release baseline and Audit-v6 discovery target: v35; immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              1,
          )

          replace(
              'research/general-demography-baseline-v1/confirmatory-result.json',
              '"modelSemanticsId": "anthrosim-model-semantics-v35"',
              '"modelSemanticsId": "anthrosim-model-semantics-v36"',
              1,
          )
          PY

          cargo fmt --all
          git rm .github/workflows/av6-001-branch-fixup.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No fixup changes required"
            exit 0
          fi
          git commit -m "chore(audit-v6): finalize AV6-001 branch consistency"
          git push origin HEAD:audit/repair-687-av6-001
