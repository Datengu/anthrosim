          replace_once(
              mobility,
              '''        let mut hash = FNV_OFFSET_BASIS;
              digest_str(&mut hash, M9_DESTINATION_TIE_POLICY_ID);
              digest_u64(&mut hash, self.destination_tie_seed.unwrap_or(0));
              digest_u64(&mut hash, origin.0);
