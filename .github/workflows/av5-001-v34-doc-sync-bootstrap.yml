name: AV5-001 v34 doc sync bootstrap

on:
  push:
    branches:
      - audit/repair-606-av5-001

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-606-av5-001
          fetch-depth: 0
      - name: Update asserted living semantics phrases
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path('docs/architecture.md'),
              Path('docs/roadmap.md'),
              Path('docs/scientific-model.md'),
              Path('docs/research/README.md'),
              Path('docs/research/trace.md'),
              Path('docs/research/odd.md'),
              Path('docs/research/odd-d.md'),
          ]
          old = 'current model semantics v33'
          new = 'current model semantics v34'
          for path in paths:
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              assert count >= 1, f'{path}: expected at least one {old!r}, found {count}'
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY

          python scripts/test-current-model-semantics-docs.py

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/architecture.md docs/roadmap.md docs/scientific-model.md docs/research/README.md docs/research/trace.md docs/research/odd.md docs/research/odd-d.md
          git commit -m "docs: synchronize living model semantics v34"
          git push origin HEAD:audit/repair-606-av5-001
