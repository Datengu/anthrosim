name: Stage issue 226 exposure analysis

on:
  push:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/226-sweep-exposure-rates
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1

      - name: Apply source patch
        run: python3 scripts/apply-issue-226.py

      - name: Format
        run: cargo fmt --all

      - name: Focused Rust tests
        run: cargo test --locked -p anthrosim-cli sweep::tests::

      - name: Fixed-horizon benchmark regression
        run: python3 scripts/test-issue-226-m8-fixed-horizon.py

      - name: Remove staging machinery
        run: rm scripts/apply-issue-226.py .github/workflows/issue-226-stage.yml

      - name: Commit applied patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[issue226-applied] fix: expose sweep duration-normalized outcomes"
          git push origin HEAD:fix/226-sweep-exposure-rates
