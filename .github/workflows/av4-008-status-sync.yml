name: AV4-008 STATUS sync

on:
  pull_request:
    paths:
      - docs/research/audit-v4/STATUS.md
      - .github/workflows/av4-008-status-sync.yml

permissions:
  contents: write

jobs:
  sync-status:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/audit-v4-status-av4-008
          fetch-depth: 0
      - name: Patch STATUS fail-closed
        shell: python
        run: |
          from pathlib import Path
          p = Path('docs/research/audit-v4/STATUS.md')
          s = p.read_text()
          replacements = [
              ('| Current P1 findings | **6 open — AV4-008/#514; AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |', '| Current P1 findings | **5 open — AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |'),
              ('| Verified remediated findings | **7 — AV4-001/#486 through AV4-007/#500 closed after production repair plus independent merged-main re-verification** |', '| Verified remediated findings | **8 — AV4-001/#486 through AV4-008/#514 closed after production repair plus independent merged-main re-verification** |'),
              ('| Current remediation line | `anthrosim-model-semantics-v31`; checkpoint schema `19` |', '| Current remediation line | `anthrosim-model-semantics-v32`; checkpoint schema `20` |'),
              ('| Repair state | **post-discovery remediation in progress; AV4-001/#486 through AV4-007/#500 are verified closed; 6 P1 and 2 P2 findings remain open** |', '| Repair state | **post-discovery remediation in progress; AV4-001/#486 through AV4-008/#514 are verified closed; 5 P1 and 2 P2 findings remain open** |'),
              ('| AV4-008 — scarce-resource remainder assignment is sensitive to arbitrary household labels | **P1** | D; C/H/N | **demonstrated; open; deliberately unrepaired** | #514 | PR #513 / run `33699132098`, job `100474385648`. |', '| AV4-008 — scarce-resource remainder assignment is sensitive to arbitrary household labels | **P1** | D; C/H/N | **verified repaired; closed after independent merged-main re-verification** | #514 | Discovery PR #513 exact head `e49be041d3a596590629c7bebe4ee40cf8f9e11e`, run `33699132098`, job `100474385648`; production PR #574 final head `fc6a205a9b21257ec2a81caadbdf51419a113ef0`, merged as `74c2f0d90577a138f972a9abd10d4354c8e1202b`; exact original adversary blob `7331f305d0235b442261bbfce4786b211fef62cb` restored in evidence PR #575 head `4a2e82abee4af0a4bd2332ee4decee9a1fbbf0c0`, central CI run `33860961292`, Quality and tests job `100985082121`: the original household-label invariance test passed 1/1; PR #575 closed unmerged. |'),
              ('- **Remaining remediation backlog:** 6 P1 findings (AV4-008 through AV4-013) and 2 P2 findings (AV4-014/015) remain independently open.', '- **AV4-008/#514 is verified closed.** Production PR #574 final head `fc6a205a9b21257ec2a81caadbdf51419a113ef0` passed the complete exact-head protected/applicable matrix and was merged as `74c2f0d90577a138f972a9abd10d4354c8e1202b`. The repair replaces canonical HouseholdId/claim-position tie assignment for equal scarce-resource largest remainders with a persistent scientific household coupling key derived from living-member `stochastic_coupling_rank`, while retaining the established period/cell rotation, repeated-period fairness, unequal-remainder priority, exact accounting and M9 split-claim semantics. The causal assignment change advances the remediation line to `anthrosim-model-semantics-v32` and checkpoint schema 20.\n- Reviewed v32 scientific rebaselines were explicit: #304 completed 780/780 runs with all three precision gates `sufficient_stop` and retained `no_universal_demographic_baseline`; M8.6 completed 32/32 runs and remained `fragile_spatial_structure` with no robust metrics and the same two fragile metrics; M9.7 required no machine-reference change and retained exact replay/checkpoint-resume; M7.6 completed 144/144 scientifically eligible runs and preserved every predeclared migration/resource contrast. Review artifacts are recorded on production PR #574.\n- Independent evidence PR #575 restored the exact original PR #513 adversary blob `7331f305d0235b442261bbfce4786b211fef62cb` against merged main. Central CI run `33860961292`, Quality and tests job `100985082121` on pinned Rust 1.97.1 executed `equal_resource_claims_are_invariant_to_pure_household_label_rotation` successfully (**1 passed, 0 failed**); applicable scientific/security run `33860961455` and the other protected evidence-head workflows also succeeded. PR #575 was closed unmerged.\n- **Remaining remediation backlog:** 5 P1 findings (AV4-009 through AV4-013) and 2 P2 findings (AV4-014/015) remain independently open.'),
              ('Post-discovery remediation has now verified and closed AV4-001/#486 through AV4-007/#500, leaving 6 P1 and 2 P2 findings open; each remaining finding still requires production repair plus independent post-merge re-verification.', 'Post-discovery remediation has now verified and closed AV4-001/#486 through AV4-008/#514, leaving 5 P1 and 2 P2 findings open; each remaining finding still requires production repair plus independent post-merge re-verification.'),
          ]
          for old, new in replacements:
              count = s.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one STATUS target, got {count}: {old[:100]}')
              s = s.replace(old, new, 1)
          p.write_text(s)
      - name: Validate only intended STATUS semantics changed
        run: |
          grep -F 'Current P1 findings | **5 open — AV4-009/#518' docs/research/audit-v4/STATUS.md
          grep -F 'Verified remediated findings | **8 — AV4-001/#486 through AV4-008/#514' docs/research/audit-v4/STATUS.md
          grep -F 'anthrosim-model-semantics-v32' docs/research/audit-v4/STATUS.md
          grep -F 'AV4-008/#514 is verified closed' docs/research/audit-v4/STATUS.md
          git diff --check
      - name: Commit STATUS
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/audit-v4/STATUS.md
          git commit -m 'docs: record AV4-008 verified remediation'
          git push origin HEAD:docs/audit-v4-status-av4-008
