name: v0.3.4 convergence validation

on:
  push:
    branches:
      - maintenance/v034-converge-runner

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v0.3.4-converged-preview
          fetch-depth: 0
      - name: Validate privacy and rewritten provenance identities
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, json, os, re, subprocess, urllib.error, urllib.request
          from collections import defaultdict
          from pathlib import Path

          repo=os.environ['GITHUB_REPOSITORY']; token=os.environ['GH_TOKEN']
          private_term=base64.b64decode('QnVsc3Ryb2Rl').decode().lower()
          private=[]; stale=defaultdict(set); checked={}
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try: text=p.read_text(encoding='utf-8')
              except (UnicodeDecodeError,OSError): continue
              if private_term in text.lower(): private.append(p.as_posix())
              for sha in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{40}(?![0-9a-fA-F])',text):
                  sha=sha.lower()
                  if subprocess.run(['git','cat-file','-e',sha],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0:
                      continue
                  if sha not in checked:
                      req=urllib.request.Request(f'https://api.github.com/repos/{repo}/git/commits/{sha}',headers={'Authorization':f'Bearer {token}','Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','User-Agent':'v034-convergence-validation'})
                      try:
                          with urllib.request.urlopen(req) as r: checked[sha]=(r.status==200)
                      except urllib.error.HTTPError as exc:
                          if exc.code==404: checked[sha]=False
                          else: raise
                  if checked[sha]: stale[sha].add(p.as_posix())
          print('private-term hits',len(private))
          for p in private: print('PRIVATE',p)
          print('stale repository commit identities',len(stale))
          for sha,paths in sorted(stale.items()): print('STALE',sha,'paths=',','.join(sorted(paths)))
          if private or stale: raise SystemExit(1)
          PY
          python scripts/test-current-model-semantics-docs.py
