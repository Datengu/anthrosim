name: AV4-002 M7.6 v27 rebaseline helper

on:
  push:
    branches:
      - repair/av4-002-background-mortality-coupling
    paths:
      - '.github/workflows/tmp-av4-002-m7-rebaseline.yml'

permissions:
  contents: write
  actions: read

jobs:
  rebaseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: repair/av4-002-background-mortality-coupling
          persist-credentials: true
          fetch-depth: 0

      - name: Download exact M7.6 evidence artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: m7-6-resource-variability-derived
          path: /tmp/m7-v27
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: Datengu/anthrosim
          run-id: 33789214317

      - name: Generate reviewed reference
        run: python3 scripts/tmp_rebaseline_m7_v27.py

      - name: Verify and commit production candidate
        run: |
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'research: rebaseline M7.6 for model semantics v27'
          git push origin HEAD:repair/av4-002-background-mortality-coupling
