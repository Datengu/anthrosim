name: AV4-005 STATUS materializer

on:
  push:
    branches:
      - tmp/av4-005-status-materializer
    paths:
      - ".github/workflows/av4-005-status-materialize.yml"

permissions:
  contents: write

jobs:
  materialize:
    name: Materialize AV4-005 STATUS-only update
    runs-on: ubuntu-latest
    steps:
      - name: Checkout clean STATUS target branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: docs/av4-005-status
      - name: Update Audit-v4 STATUS ledger
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/research/audit-v4/STATUS.md')
          text = path.read_text(encoding='utf-8')

          replacements = [
              (
                  '| Current P1 findings | **9 open — AV4-005/#495; AV4-006/#497; AV4-007/#500; AV4-008/#514; AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |',
                  '| Current P1 findings | **8 open — AV4-006/#497; AV4-007/#500; AV4-008/#514; AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |',
              ),
              (
                  '| Verified remediated findings | **4 — AV4-001/#486 through AV4-004/#493 closed after production repair plus independent merged-main re-verification** |',
                  '| Verified remediated findings | **5 — AV4-001/#486 through AV4-005/#495 closed after production repair plus independent merged-main re-verification** |',
              ),
              (
                  '| Current P2 findings | **2 open — AV4-014/#546; AV4-015/#549** |',
                  '| Current P2 findings | **2 open — AV4-014/#546; AV4-015/#549** |\n| Current remediation line | `anthrosim-model-semantics-v29`; checkpoint schema `17` |',
              ),
              (
                  '| Repair state | **post-discovery remediation in progress; AV4-001/#486 through AV4-004/#493 are verified closed; 9 P1 and 2 P2 findings remain open** |',
                  '| Repair state | **post-discovery remediation in progress; AV4-001/#486 through AV4-005/#495 are verified closed; 8 P1 and 2 P2 findings remain open** |',
              ),
              (
                  '| AV4-005 — parentage RNG assignment is sensitive to arbitrary male person labels | **P1** | A; B/C/H/N | **demonstrated; open; deliberately unrepaired** | #495 | PR #494 / run `33690127728`. |',
                  '| AV4-005 — parentage RNG assignment is sensitive to arbitrary male person labels | **P1** | A; B/C/H/N | **verified repaired; closed after independent merged-main re-verification** | #495 | Discovery PR #494 head `c48ebe8ddc45a4f3762552545139b74a085d80e6`, run `33690127728`, job `100446717352`; production PR #565 final head `cb7e9e0ca064f63b69e19cf4e12ba0f4346a9472`, squash-merged as `0349a34fd6135f08a19eedf3947e3a35abba6a34`; exact original adversary restored byte-for-byte in evidence PR #566 head `2c63bc2c31f4494a491c754a64f80739c46bcfbc`, run `33819654440`, job `100859344852`: **0/1000 divergent same-seed parent-role assignments**; PR #566 closed unmerged. |',
              ),
              (
                  '- **Remaining remediation backlog:** 9 P1 findings (AV4-005 through AV4-013) and 2 P2 findings (AV4-014/015) remain independently open.',
                  '- **AV4-005/#495 is verified closed.** Production PR #565 final head `cb7e9e0ca064f63b69e19cf4e12ba0f4346a9472` passed the full exact-head protected/applicable matrix, including central CI run `33818536005` and Canonical M7.6 job `100858427929`, then was squash-merged as `0349a34fd6135f08a19eedf3947e3a35abba6a34`. The repair orders residence-local parentage candidates by persistent person `stochastic_coupling_rank` before the unchanged eligibility filtering and uniform reservoir sampler, preserving the pre-boundary residence snapshot, named `demography/parentage` stream and draw accounting. The causal assignment change advances the current remediation line to `anthrosim-model-semantics-v29` and checkpoint schema 17.\n- Reviewed v29 scientific rebaselines were explicit rather than cosmetic: #304 retained `no_universal_demographic_baseline` after 780/780 confirmatory runs and all precision gates; M8.6 remained `fragile_spatial_structure` with terminal largest-cell share changing from robust to fragile; M9.7 remained `capability_distinguished` with exact replay and checkpoint/resume; and M7.6 completed 144/144 scientifically eligible runs with all 9/9 migration-disabled point summaries unchanged from v28 and all 9/9 migration-enabled summaries changed while the predeclared persistence/resource contrasts remained intact. The reviewed v29 M7.6 artifact came from run `33816687527`, job `100852554519`, artifact `9917067903`, SHA-256 `202a464f058a80e7c1b788a5de9bd2f7ab30434a747524f0d7df66fcf7174f48`, and the rebaselined reference then passed on the exact final production head.\n- Independent evidence PR #566 restored the exact original PR #494 blobs byte-for-byte (test blob `28d3d8de4755d040d71e5ce2db2023e2bb41cf16`, workflow blob `71c7220b2405a14212ff700ab5dc060040c75104`) and ran against merged main. Run `33819654440`, job `100859344852` passed the immutable internal `seed in 1..=1000` adversary with **0/1000 divergent same-seed parent-role assignments**, versus the original seed-1 discovery result `A_existing_father=true`, `B_existing_father=false`; PR #566 was closed unmerged.\n- **Remaining remediation backlog:** 8 P1 findings (AV4-006 through AV4-013) and 2 P2 findings (AV4-014/015) remain independently open.',
              ),
              (
                  'Post-discovery remediation has now verified and closed AV4-001/#486 through AV4-004/#493, leaving 9 P1 and 2 P2 findings open;',
                  'Post-discovery remediation has now verified and closed AV4-001/#486 through AV4-005/#495, leaving 8 P1 and 2 P2 findings open;',
              ),
              (
                  '| initialization × demography | Declared founder state feeds the label-sensitive stochastic mechanisms in AV4-001/002/004/005/006. Area G separately showed exact checkpoint continuation and quantified initialization transients. Existing findings/obligations cover the demonstrated risk. |',
                  '| initialization × demography | Declared founder state fed the label-sensitive stochastic mechanisms demonstrated in AV4-001/002/004/005/006. AV4-001/002/004/005 are now independently verified repaired; AV4-006 remains open. Area G separately showed exact checkpoint continuation and quantified initialization transients. Existing findings/obligations cover the demonstrated risk. |',
              ),
              (
                  '| households × movement | Fresh C/E evidence established temporary-presence lifecycle boundaries and M9 route invariance in passing cases, while **AV4-003/#491** and **AV4-007/#500** show arbitrary HouseholdId can still alter M4/M9 stochastic assignment/selection. No additional independent N defect was demonstrated. |',
                  '| households × movement | Fresh C/E evidence established temporary-presence lifecycle boundaries and M9 route invariance in passing cases. **AV4-003/#491** is now independently verified repaired; **AV4-007/#500** remains open for M9 arbitrary-HouseholdId tie selection. No additional independent N defect was demonstrated. |',
              ),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one STATUS replacement target, found {count}: {old[:80]}')
              text = text.replace(old, new, 1)

          for stale in (
              '9 P1 findings (AV4-005 through AV4-013)',
              'AV4-005 — parentage RNG assignment is sensitive to arbitrary male person labels | **P1** | A; B/C/H/N | **demonstrated; open; deliberately unrepaired**',
              'through AV4-004/#493 are verified closed; 9 P1',
          ):
              if stale in text:
                  raise SystemExit(f'stale AV4-005 STATUS text remains: {stale}')

          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          git diff -- docs/research/audit-v4/STATUS.md
      - name: Commit STATUS-only update
        run: |
          set -euo pipefail
          test "$(git status --short | wc -l)" -eq 1
          git status --short | grep -F " M docs/research/audit-v4/STATUS.md"
          git add docs/research/audit-v4/STATUS.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: record verified AV4-005 remediation"
          git push origin HEAD:docs/av4-005-status
