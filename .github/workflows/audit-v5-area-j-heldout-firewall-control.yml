name: Audit v5 Area J held-out firewall control

on:
  pull_request:
    paths:
      - 'scripts/audit-v5-area-j-heldout-firewall-control.py'
      - 'scripts/research-identifiability.py'
      - 'scripts/research-identifiability-legacy.py'
      - '.github/workflows/audit-v5-area-j-heldout-firewall-control.yml'

permissions:
  contents: read

jobs:
  control:
    name: Held-out discrimination firewall control
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run fresh Audit-v5 Area-J control
        run: python3 scripts/audit-v5-area-j-heldout-firewall-control.py
