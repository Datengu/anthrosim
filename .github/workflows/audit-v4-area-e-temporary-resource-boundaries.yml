name: Audit v4 Area E temporary resource boundaries

on:
  pull_request:
    paths:
      - 'crates/anthrosim-core/tests/audit_v4_temporary_resource_boundaries.rs'
      - '.github/workflows/audit-v4-area-e-temporary-resource-boundaries.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  temporary-resource-boundaries:
    name: Temporary-resource boundary adversary
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 temporary-resource boundary adversary
        run: cargo test --locked -p anthrosim-core --test audit_v4_temporary_resource_boundaries -- --nocapture
