name: AV4-009 v33 identity sync

on:
  push:
    branches:
      - repair/av4-009-m4-spatial-candidate-coupling

permissions:
  contents: write

jobs:
  sync-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: repair/av4-009-m4-spatial-candidate-coupling
          fetch-depth: 0
      - name: Apply fail-closed v33 identity sync
        run: python3 scripts/av4-009-v33-identity-sync.py
      - name: Validate living semantics documentation
        run: python3 scripts/test-current-model-semantics-docs.py
      - name: Validate focused AV4-009 regression on pinned Rust
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo test --locked -p anthrosim-core --test m4_spatial_isomorphism_invariance -- --nocapture
      - name: Commit permanent identity/doc sync
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add crates/anthrosim-core/src/provenance.rs crates/anthrosim-core/src/checkpoint.rs docs/scientific-model.md docs/research/odd.md docs/research/odd-d.md scripts/test-current-model-semantics-docs.py
          git diff --cached --check
          git commit -m 'model: advance AV4-009 remediation semantics to v33'
          git push origin HEAD:repair/av4-009-m4-spatial-candidate-coupling
