name: Apply verified AV5-004 demographic provenance rebind

on:
  push:
    branches: [audit/repair-629-av5-004]
    paths:
      - '.github/workflows/audit-v5-av5-004-demography-rebind-check.yml'

permissions:
  contents: write

jobs:
  apply-demography-rebind:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout repair branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit/repair-629-av5-004
          persist-credentials: true

      - name: Rebind model-semantics provenance only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path=Path('research/general-demography-baseline-v1/confirmatory-result.json')
          text=path.read_text()
          old='"modelSemanticsId": "anthrosim-model-semantics-v34"'
          new='"modelSemanticsId": "anthrosim-model-semantics-v35"'
          if text.count(old) != 1:
              raise SystemExit(f'expected exactly one demographic v34 semantics field, found {text.count(old)}')
          path.write_text(text.replace(old,new,1))
          PY
          git config user.name "Datengu"
          git config user.email "15160645+Datengu@users.noreply.github.com"
          git add research/general-demography-baseline-v1/confirmatory-result.json
          git commit -m "research: rebind demographic reference to v35"
          git push origin HEAD:audit/repair-629-av5-004
