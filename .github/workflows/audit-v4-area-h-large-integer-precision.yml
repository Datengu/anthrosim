name: Audit v4 Area H large-integer precision

on:
  pull_request:
    paths:
      - "scripts/audit-v4-test-monte-carlo-large-integer-precision.py"
      - ".github/workflows/audit-v4-area-h-large-integer-precision.yml"

permissions:
  contents: read

jobs:
  large-integer-precision-adversary:
    name: Large-integer precision adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v4 large-integer precision adversary
        run: python3 scripts/audit-v4-test-monte-carlo-large-integer-precision.py
