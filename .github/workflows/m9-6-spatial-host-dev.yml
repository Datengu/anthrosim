name: M9.6 spatial host development integration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ github.head_ref == 'm9/m9-6-spatial-host' && github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@ac593985615ec2ede58e132d2e21d2b1cbd6127c # v3.3.0
        with:
          ref: m9/m9-6-spatial-host
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@6d653acede28d24f02e3cd41383119e8b1b35921
        with:
          toolchain: 1.88.0
          components: rustfmt,clippy

      - name: Apply M9.6 spatial-host patch
        run: python scripts/apply_m9_6_spatial_host.py

      - name: Correct validation fixture and test-only compatibility wrappers
        run: |
          python - <<'PY'
          from pathlib import Path

          test = Path('crates/anthrosim-core/tests/spatial_temporary_mobility.rs')
          text = test.read_text()
          text = text.replace('    CellId, DemographyConfig,', '    DemographyConfig,', 1)
          text = text.replace('    GridGeometry, HouseholdId, LandscapeBundle,', '    GridGeometry, LandscapeBundle,', 1)
          marker = '};\n\nfn layer'
          if marker not in text:
              raise SystemExit('could not locate spatial temporary mobility import boundary')
          text = text.replace(marker, '};\nuse anthrosim_core::ids::{CellId, HouseholdId};\n\nfn layer', 1)
          test.write_text(text)

          for path, needle in [
              (Path('crates/anthrosim-core/src/migration.rs'), '    pub(crate) fn process_boundary_recorded('),
              (Path('crates/anthrosim-core/src/resources.rs'), '    pub(crate) fn process_period_recorded('),
          ]:
              source = path.read_text()
              if source.count(needle) != 1:
                  raise SystemExit(f'expected one compatibility wrapper in {path}')
              source = source.replace(needle, '    #[cfg(test)]\n' + needle, 1)
              path.write_text(source)
          PY

      - name: Format
        run: cargo fmt --all

      - name: Test focused spatial temporary mobility
        run: cargo test --locked -p anthrosim-core --test spatial_temporary_mobility

      - name: Test workspace
        run: cargo test --locked --workspace --all-features

      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

      - name: Remove development helper
        run: |
          rm scripts/apply_m9_6_spatial_host.py
          rm .github/workflows/m9-6-spatial-host-dev.yml

      - name: Commit integrated M9.6 spatial host
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "M9.6: enable temporary mobility in spatial host"
          git push origin HEAD:m9/m9-6-spatial-host
