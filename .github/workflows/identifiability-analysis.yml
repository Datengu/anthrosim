name: Identifiability and equifinality analysis

on:
  pull_request:
    paths:
      - "scripts/research-identifiability.py"
      - "scripts/research-identifiability-legacy.py"
      - "scripts/research-identifiability-bind-design.py"
      - "scripts/test-research-identifiability-fixed-design.py"
      - "scripts/test-research-identifiability-held-out-envelope.py"
      - "scripts/test-research-identifiability-equifinality-compensation.py"
      - "scripts/test-research-identifiability-executed-design-binding.py"
      - "research/identifiability-benchmark-v1/**"
      - "research/general-demography-baseline-v1/confirmatory-definition.json"
      - "docs/research/identifiability-equifinality-v1.md"
      - "docs/research/audit-v2/area-j-identifiability-monte-carlo-audit.py"
      - "crates/anthrosim-cli/src/bin/anthrosim-research.rs"
      - "crates/anthrosim-core/src/research_experiment.rs"
      - ".github/workflows/identifiability-analysis.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  identifiability-gate:
    name: Synthetic identifiability benchmark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Compile and self-test analyzer
        run: |
          python3 -m py_compile \
            scripts/research-identifiability.py \
            scripts/research-identifiability-legacy.py \
            scripts/research-identifiability-bind-design.py \
            scripts/test-research-identifiability-executed-design-binding.py
          python3 scripts/research-identifiability.py --self-test
      - name: Verify AV4-011 executed-design binding against the real research runner
        run: |
          cargo build --locked --bin anthrosim-research
          python3 scripts/test-research-identifiability-executed-design-binding.py \
            --research-binary target/debug/anthrosim-research
      - name: Verify fixed-by-design parameters fail closed
        run: python3 scripts/test-research-identifiability-fixed-design.py
      - name: Verify held-out discrimination uses conservative structural envelopes
        run: python3 scripts/test-research-identifiability-held-out-envelope.py
      - name: Verify equifinality preserves nuisance-parameter compensation
        run: python3 scripts/test-research-identifiability-equifinality-compensation.py
      - name: Run independent audit-v2 Area J uncertainty checker
        run: python3 docs/research/audit-v2/area-j-identifiability-monte-carlo-audit.py
      - name: Verify independent second pattern identifies benchmark
        run: |
          python3 scripts/research-identifiability.py \
            research/identifiability-benchmark-v1/plan.json \
            research/identifiability-benchmark-v1/data.json \
            /tmp/identifiability-result.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/identifiability-result.json').read_text())
          assert r['schemaVersion'] == 2
          assert r['researchGate']['passes'] is True
          assert r['researchGate']['executedDesignBound'] is True
          assert r['executedDesignBinding']['sourceKind'] == 'synthetic_fixture'
          assert r['stagedEvidenceDiagnostics'][0]['compatiblePointCount'] == 4
          assert r['stagedEvidenceDiagnostics'][1]['compatiblePointCount'] == 1
          assert r['compatibleRegion']['pointIds'] == ['o2-n2']
          assert r['unresolvedRegion']['pointCount'] == 0
          first=r['stagedEvidenceDiagnostics'][0]['parameterDiagnostics']
          assert all(d['identified'] is False for d in first)
          assert all(d['identified'] is True for d in r['parameterDiagnostics'])
          PY
      - name: Verify ratio-only calibration fails closed with equifinality
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('research/identifiability-benchmark-v1/plan.json').read_text())
          p['analysisId']='synthetic-ratio-only-nonidentifiable-v2'
          p['calibrationTargets']=p['calibrationTargets'][:1]
          Path('/tmp/ratio-only-plan.json').write_text(json.dumps(p,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python3 scripts/research-identifiability.py \
            /tmp/ratio-only-plan.json \
            research/identifiability-benchmark-v1/data.json \
            /tmp/ratio-only-result.json
          status=$?
          set -e
          test "$status" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/ratio-only-result.json').read_text())
          assert r['researchGate']['passes'] is False
          assert r['researchGate']['executedDesignBound'] is True
          assert r['equifinality']['present'] is True
          assert r['compatibleRegion']['pointCount'] == 4
          assert r['unresolvedRegion']['pointCount'] == 0
          assert r['equifinality']['reportingPolicy'] == 'report_compatible_region_not_unique_optimum'
          PY
      - name: Verify structural equifinality preserves held-out discriminator
        run: |
          python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          plan={
            'schemaVersion':2,
            'analysisId':'structural-equifinality-self-test-v2',
            'calibrationTargets':[{'observable':'calibration_pattern','target':10.0,'tolerance':0.0}],
            'corroborationObservables':['heldout_pattern'],
            'corroborationDiscriminationTolerance':1.0,
            'claim':{'parameterIds':['x'],'structuralHypothesis':True},
            'maxNormalizedAcceptableWidth':0.25,
          }
          raw_points=[
            {'id':'a','parameters':{'x':1},'structure':'model_a','outputs':{'calibration_pattern':10.0,'heldout_pattern':2.0}},
            {'id':'b','parameters':{'x':1},'structure':'model_b','outputs':{'calibration_pattern':10.0,'heldout_pattern':8.0}},
            {'id':'c','parameters':{'x':2},'structure':'model_a','outputs':{'calibration_pattern':12.0,'heldout_pattern':4.0}},
          ]
          points=[]
          for point in raw_points:
            point=dict(point)
            point['outputEvidence']={key:{'kind':'deterministic'} for key in point['outputs']}
            points.append(point)
          projection=[
            {'id':point['id'],'parameters':point['parameters'],'structure':point['structure']}
            for point in points
          ]
          digest='sha256:'+hashlib.sha256(
            json.dumps(projection,sort_keys=True,separators=(',',':'),ensure_ascii=False).encode('utf-8')
          ).hexdigest()
          data={
            'schemaVersion':2,
            'monteCarloDiagnostics':{},
            'executedDesignBinding':{
              'schemaVersion':1,
              'bindingType':'anthrosim-identifiability-executed-design',
              'sourceKind':'synthetic_fixture',
              'sourceIdentity':'structural-equifinality-self-test-v2',
              'pointDigest':digest,
            },
            'points':points,
          }
          Path('/tmp/structural-plan.json').write_text(json.dumps(plan,indent=2,sort_keys=True)+'\n')
          Path('/tmp/structural-data.json').write_text(json.dumps(data,indent=2,sort_keys=True)+'\n')
          PY
          set +e
          python3 scripts/research-identifiability.py /tmp/structural-plan.json /tmp/structural-data.json /tmp/structural-result.json
          status=$?
          set -e
          test "$status" -eq 2
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('/tmp/structural-result.json').read_text())
          assert r['researchGate']['passes'] is False
          assert r['researchGate']['executedDesignBound'] is True
          assert r['structuralDiagnostic']['equifinal'] is True
          assert r['structuralDiagnostic']['compatibleStructures'] == ['model_a','model_b']
          assert any(x['observable']=='heldout_pattern' and x['discriminating'] is True for x in r['discriminatingPredictions'])
          assert all(x['role']=='held_out_corroboration_prediction' for x in r['discriminatingPredictions'])
          PY
