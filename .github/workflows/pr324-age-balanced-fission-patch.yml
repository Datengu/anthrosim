name: PR324 age-balanced fission patch

on:
  push:
    branches:
      - fix/324-age-balanced-household-fission

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/324-age-balanced-household-fission
          fetch-depth: 0

      - name: Apply age-balanced household-fission semantics
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected one replacement, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          # Scientific configuration identity: do not silently reinterpret v1.
          p = Path('crates/anthrosim-core/src/config.rs')
          text = p.read_text()
          text = text.replace(
              'pub const DETERMINISTIC_SIZE_FISSION_HOUSEHOLD_LIFECYCLE_ID: &str = "deterministic_size_fission_v1";',
              'pub const DETERMINISTIC_AGE_BALANCED_FISSION_HOUSEHOLD_LIFECYCLE_ID: &str =\n    "deterministic_age_balanced_fission_v2";'
          )
          text = text.replace(
              '/// Stable identity for the deliberately neutral structural-sensitivity alternative introduced by\n/// #207. It is a stress-test mechanism, not a calibrated household-formation model.',
              '/// Stable identity for the age/sex-balanced structural-sensitivity alternative.\n///\n/// Version 2 supersedes the PersonId-sliced v1 treatment after audit-v2 #324. It remains a\n/// deterministic stress-test mechanism, not a calibrated household-formation model.'
          )
          text = text.replace('pub const CURRENT_SCHEMA_VERSION: u32 = 1;\n\n    #[must_use]\n    pub fn deterministic_size_fission_v1(max_living_members: u16) -> Self {',
                              'pub const CURRENT_SCHEMA_VERSION: u32 = 2;\n\n    #[must_use]\n    pub fn deterministic_age_balanced_fission_v2(max_living_members: u16) -> Self {', 1)
          text = text.replace('model_id: DETERMINISTIC_SIZE_FISSION_HOUSEHOLD_LIFECYCLE_ID.to_owned(),',
                              'model_id: DETERMINISTIC_AGE_BALANCED_FISSION_HOUSEHOLD_LIFECYCLE_ID.to_owned(),', 1)
          p.write_text(text)

          # Validator follows the new treatment identity.
          p = Path('crates/anthrosim-core/src/household_lifecycle.rs')
          text = p.read_text().replace(
              'DETERMINISTIC_SIZE_FISSION_HOUSEHOLD_LIFECYCLE_ID',
              'DETERMINISTIC_AGE_BALANCED_FISSION_HOUSEHOLD_LIFECYCLE_ID'
          )
          p.write_text(text)

          # Authoritative causal meaning changes when household membership changes.
          replace_once(
              'crates/anthrosim-core/src/provenance.rs',
              'pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v20";',
              'pub const MODEL_SEMANTICS_ID: &str = "anthrosim-model-semantics-v21";'
          )

          # Replace contiguous PersonId slicing with a scientific composition key and
          # deterministic capacity-aware round-robin assignment.
          p = Path('crates/anthrosim-core/src/population.rs')
          text = p.read_text()
          old = '''            // Use the minimum number of groups needed to obey the configured ceiling, then\n            // balance group sizes so deterministic fission does not manufacture avoidable\n            // singleton households. Stable PersonId order is the explicit neutral partition rule.\n            let group_count = living_members.len().div_ceil(ceiling);\n            let base_group_size = living_members.len() / group_count;\n            let larger_group_count = living_members.len() % group_count;\n            let source_group_size = base_group_size + if larger_group_count > 0 { 1 } else { 0 };\n            let residence = self.household_locations[household_index];\n            let mut cursor = source_group_size;\n\n            for group_index in 1..group_count {\n                let group_size = base_group_size\n                    + if group_index < larger_group_count {\n                        1\n                    } else {\n                        0\n                    };\n                let new_household_raw = u64::try_from(self.household_locations.len())\n                    .map_err(|_| PopulationError::HouseholdIdSpaceExhausted)?\n                    .checked_add(1)\n                    .ok_or(PopulationError::HouseholdIdSpaceExhausted)?;\n                let new_household = HouseholdId::new(new_household_raw);\n                self.household_locations.push(residence);\n                let mut reassigned = Vec::with_capacity(group_size);\n                for &person_index in &living_members[cursor..cursor + group_size] {\n                    self.households[person_index] = new_household;\n                    reassigned.push(person_id_from_index(person_index));\n                    outcome.people_reassigned = outcome.people_reassigned.saturating_add(1);\n                }\n                outcome.households_created = outcome.households_created.saturating_add(1);\n                outcome.fissions.push(HouseholdFissionRecord {\n                    source_household: household,\n                    new_household,\n                    residence,\n                    people_reassigned: reassigned,\n                });\n                cursor += group_size;\n            }\n\n            debug_assert_eq!(cursor, living_members.len());\n'''
          new = '''            // Use the minimum number of groups needed to obey the configured ceiling and\n            // balance target sizes as before, but assign membership by scientific composition\n            // rather than packed-storage/PersonId order. Oldest members are distributed first;\n            // reproductive sex is the deterministic secondary key. PersonId breaks ties only\n            // among otherwise age/sex-equivalent records, so it cannot create cohort sorting.\n            let group_count = living_members.len().div_ceil(ceiling);\n            let base_group_size = living_members.len() / group_count;\n            let larger_group_count = living_members.len() % group_count;\n            let target_sizes = (0..group_count)\n                .map(|group_index| {\n                    base_group_size + usize::from(group_index < larger_group_count)\n                })\n                .collect::<Vec<_>>();\n            let mut ordered_members = living_members;\n            ordered_members.sort_by_key(|&person_index| {\n                let sex_key = match self.reproductive_sexes[person_index] {\n                    ReproductiveSex::Female => 0_u8,\n                    ReproductiveSex::Male => 1_u8,\n                };\n                (self.birth_days[person_index], sex_key, person_index)\n            });\n            let mut groups = target_sizes\n                .iter()\n                .map(|&target| Vec::with_capacity(target))\n                .collect::<Vec<_>>();\n            let mut next_group = 0_usize;\n            for person_index in ordered_members {\n                while groups[next_group].len() >= target_sizes[next_group] {\n                    next_group = (next_group + 1) % group_count;\n                }\n                groups[next_group].push(person_index);\n                next_group = (next_group + 1) % group_count;\n            }\n            debug_assert!(groups\n                .iter()\n                .zip(&target_sizes)\n                .all(|(group, &target)| group.len() == target));\n\n            let residence = self.household_locations[household_index];\n            for group_members in groups.iter().skip(1) {\n                let new_household_raw = u64::try_from(self.household_locations.len())\n                    .map_err(|_| PopulationError::HouseholdIdSpaceExhausted)?\n                    .checked_add(1)\n                    .ok_or(PopulationError::HouseholdIdSpaceExhausted)?;\n                let new_household = HouseholdId::new(new_household_raw);\n                self.household_locations.push(residence);\n                let mut reassigned = Vec::with_capacity(group_members.len());\n                for &person_index in group_members {\n                    self.households[person_index] = new_household;\n                    reassigned.push(person_id_from_index(person_index));\n                    outcome.people_reassigned = outcome.people_reassigned.saturating_add(1);\n                }\n                outcome.households_created = outcome.households_created.saturating_add(1);\n                outcome.fissions.push(HouseholdFissionRecord {\n                    source_household: household,\n                    new_household,\n                    residence,\n                    people_reassigned: reassigned,\n                });\n            }\n'''
          if text.count(old) != 1:
              raise SystemExit(f"population fission block mismatch: {text.count(old)}")
          text = text.replace(old, new, 1)

          # Add direct adversarial tests in the private-state unit-test module.
          marker = '''    #[test]\n    fn rejects_zero_household_size() {\n'''
          tests = r'''    fn household_science_composition(population: &Population) -> Vec<Vec<(i64, u8)>> {
        let mut groups = (1..=population.household_count())
            .map(|household_raw| {
                let household = HouseholdId::new(household_raw as u64);
                let mut records = (0..population.person_count())
                    .filter(|&index| {
                        population.is_alive_index(index) && population.households[index] == household
                    })
                    .map(|index| {
                        (
                            population.birth_days[index],
                            match population.reproductive_sexes[index] {
                                ReproductiveSex::Female => 0_u8,
                                ReproductiveSex::Male => 1_u8,
                            },
                        )
                    })
                    .collect::<Vec<_>>();
                records.sort_unstable();
                records
            })
            .collect::<Vec<_>>();
        groups.sort();
        groups
    }

    #[test]
    fn age_balanced_fission_is_invariant_to_person_id_relabeling_of_unique_science_records() {
        let world = World::generate(WorldConfig::new(1, 1), RngFactory::new(71)).unwrap();
        let config = PopulationConfig::new(9).with_target_household_size(9);
        let mut a = Population::initialize(config, &world, RngFactory::new(71)).unwrap();
        let mut b = a.clone();
        let records = [
            (-18_250, ReproductiveSex::Female),
            (-17_885, ReproductiveSex::Male),
            (-14_600, ReproductiveSex::Female),
            (-13_870, ReproductiveSex::Male),
            (-10_950, ReproductiveSex::Female),
            (-7_300, ReproductiveSex::Male),
            (-3_650, ReproductiveSex::Female),
            (-365, ReproductiveSex::Male),
            (0, ReproductiveSex::Female),
        ];
        for (index, &(birth_day, sex)) in records.iter().enumerate() {
            a.birth_days[index] = birth_day;
            a.reproductive_sexes[index] = sex;
            let reverse = records.len() - 1 - index;
            b.birth_days[reverse] = birth_day;
            b.reproductive_sexes[reverse] = sex;
        }
        let eligible = [true];
        a.fission_oversized_households(5, &eligible).unwrap();
        b.fission_oversized_households(5, &eligible).unwrap();
        assert_eq!(household_science_composition(&a), household_science_composition(&b));
    }

    #[test]
    fn age_balanced_fission_prevents_newborn_only_tail_when_older_members_can_seed_groups() {
        let world = World::generate(WorldConfig::new(1, 1), RngFactory::new(73)).unwrap();
        let config = PopulationConfig::new(9).with_target_household_size(9);
        let mut population = Population::initialize(config, &world, RngFactory::new(73)).unwrap();
        let birth_days = [-18_250, -17_885, -14_600, -13_870, -10_950, 0, 0, 0, 0];
        for (index, &birth_day) in birth_days.iter().enumerate() {
            population.birth_days[index] = birth_day;
            population.reproductive_sexes[index] = if index % 2 == 0 {
                ReproductiveSex::Female
            } else {
                ReproductiveSex::Male
            };
        }
        population.fission_oversized_households(5, &[true]).unwrap();

        let mut adult_counts = vec![0_usize; population.household_count()];
        let mut newborn_counts = vec![0_usize; population.household_count()];
        for index in 0..population.person_count() {
            let household_index = usize::try_from(population.households[index].0 - 1).unwrap();
            if population.birth_days[index] < 0 {
                adult_counts[household_index] += 1;
            } else {
                newborn_counts[household_index] += 1;
            }
        }
        assert_eq!(adult_counts, vec![3, 2]);
        assert_eq!(newborn_counts, vec![2, 2]);
        assert!(adult_counts.iter().all(|&count| count > 0));
    }

'''
          if text.count(marker) != 1:
              raise SystemExit('population test insertion marker mismatch')
          text = text.replace(marker, tests + marker, 1)
          p.write_text(text)

          # Migrate current executable/config/test surfaces from treatment v1 to v2.
          old_literal = 'deterministic_size_fission_v1'
          new_literal = 'deterministic_age_balanced_fission_v2'
          historical = {
              Path('docs/research/household-lifecycle-structural-sensitivity-v1.md'),
              Path('research/household-lifecycle-sensitivity-v1/reference-result.json'),
              Path('docs/research/household-lifecycle-structural-sensitivity-result.md'),
          }
          for path in Path('.').rglob('*'):
              if not path.is_file() or path in historical or '.git' in path.parts:
                  continue
              if path.suffix.lower() not in {'.rs', '.json', '.md', '.py', '.toml', '.yml', '.yaml'}:
                  continue
              try:
                  file_text = path.read_text()
              except UnicodeDecodeError:
                  continue
              if old_literal in file_text:
                  path.write_text(file_text.replace(old_literal, new_literal))

          # Any JSON object carrying the new treatment identity uses lifecycle schema v2.
          def bump_lifecycle_schema(value):
              changed = False
              if isinstance(value, dict):
                  if value.get('modelId') == new_literal:
                      if value.get('schemaVersion') != 2:
                          value['schemaVersion'] = 2
                          changed = True
                  for child in value.values():
                      changed = bump_lifecycle_schema(child) or changed
              elif isinstance(value, list):
                  for child in value:
                      changed = bump_lifecycle_schema(child) or changed
              return changed
          for path in Path('.').rglob('*.json'):
              if path in historical or '.git' in path.parts:
                  continue
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  continue
              if bump_lifecycle_schema(value):
                  path.write_text(json.dumps(value, indent=2) + '\n')

          # Mark v1 documentation/result as historical and add the repaired active contract.
          p = Path('docs/research/household-lifecycle-structural-sensitivity-v1.md')
          v1 = p.read_text()
          notice = '> **Superseded historical contract.** Audit-v2 issue #324 demonstrated that the v1 stable-PersonId partition rule sorts cohort/generation structure. Current executable treatment semantics are defined in `household-lifecycle-structural-sensitivity-v2.md`; this file remains for provenance of the original #207 comparison.\n\n'
          if notice not in v1:
              v1 = v1.replace('# Household lifecycle structural sensitivity v1\n\n', '# Household lifecycle structural sensitivity v1\n\n' + notice, 1)
          p.write_text(v1)

          Path('docs/research/household-lifecycle-structural-sensitivity-v2.md').write_text('''# Household lifecycle structural sensitivity v2\n\n## Status\n\nThis is a **synthetic structural-sensitivity contract**, not an ethnographic or archaeological model of household formation. It supersedes the PersonId-sliced v1 treatment after audit-v2 issue #324.\n\n## Alternative treatment\n\n`deterministic_age_balanced_fission_v2` is enabled through the versioned `householdLifecycle` experiment field (schema version 2). At each completed annual boundary after M2 fertility:\n\n- only households physically at residence are eligible;\n- an oversized household is divided into the minimum number of balanced groups needed to satisfy `maxLivingMembers`;\n- living members are ordered by birth day (oldest first), then reproductive sex, with PersonId used only to break ties among otherwise age/sex-equivalent records;\n- ordered members are distributed round-robin across groups while respecting the precomputed balanced target sizes;\n- the original household retains group 0 and each remaining group becomes a new household at the same persistent residence;\n- person identity, parent links, condition and persistent residence are otherwise unchanged;\n- future M4/M9 decisions treat daughter households independently after topology reconciliation.\n\nThis is an explicit **age/sex-composition balancing rule**, not a claim about real household fission, adulthood, marriage, inheritance, post-marital residence or dependency. Parent-child co-residence is not guaranteed. Cross-household kin can therefore result. If fewer older/adult-like members exist than daughter groups, the model cannot invent adults and a child-only unit can still be unavoidable.\n\nThe scientific purpose is narrower: remove storage/PersonId cohort sorting from the structural-sensitivity arm while keeping the treatment deterministic, balanced in size and transparent. For any chosen adulthood threshold, if at least as many members above that threshold exist as resulting groups, distributing the oldest members first seeds every group with one of them before younger members fill capacity.\n\n## Determinism and relabelling contract\n\nRelabelling people while preserving unique age/sex scientific records must not change the per-household age/sex composition produced by fission. PersonId may affect only which otherwise age/sex-equivalent individual occupies a tied slot; it must not determine cohort structure. Exact repeated execution and checkpoint/resume equivalence remain required.\n\n## Integration\n\nM3 resource sharing, M4 permanent migration and M9 temporary mobility continue to operate at household level after fission. Because composition changes those downstream mechanisms can change scientifically; v2 therefore advances global `MODEL_SEMANTICS_ID` from v20 to v21 rather than silently reinterpreting prior results. The historical v1 reference remains preserved for provenance and must be re-run/rebaselined explicitly before a v2 comparison is treated as canonical.\n''')

          Path('docs/research/audit-v2/area-c-household-fission-composition-audit.py').write_text(r'''#!/usr/bin/env python3
"""Independent arithmetic checker for audit-v2 #324 household composition."""

from collections import Counter


def balanced_targets(n: int, ceiling: int) -> list[int]:
    groups = (n + ceiling - 1) // ceiling
    base, larger = divmod(n, groups)
    return [base + (i < larger) for i in range(groups)]


def legacy_partition(records: list[tuple[str, int]], ceiling: int) -> list[list[tuple[str, int]]]:
    targets = balanced_targets(len(records), ceiling)
    out, cursor = [], 0
    for size in targets:
        out.append(records[cursor:cursor + size])
        cursor += size
    return out


def repaired_partition(records: list[tuple[str, int]], ceiling: int) -> list[list[tuple[str, int]]]:
    targets = balanced_targets(len(records), ceiling)
    ordered = sorted(records, key=lambda r: (r[1], r[0]))
    groups = [[] for _ in targets]
    next_group = 0
    for record in ordered:
        while len(groups[next_group]) >= targets[next_group]:
            next_group = (next_group + 1) % len(groups)
        groups[next_group].append(record)
        next_group = (next_group + 1) % len(groups)
    return groups


def cohort_counts(groups):
    return [Counter('newborn' if age == 0 else 'older' for _, age in group) for group in groups]


def science_signature(groups):
    return sorted(tuple(sorted(age for _, age in group)) for group in groups)


def main() -> None:
    # Five older members followed by four same-day newborns is the demonstrated v1 failure.
    records = [(f'p{i+1}', age) for i, age in enumerate([-50, -45, -40, -35, -30, 0, 0, 0, 0])]
    legacy = legacy_partition(records, 5)
    repaired = repaired_partition(records, 5)
    assert cohort_counts(legacy) == [Counter({'older': 5}), Counter({'newborn': 4})]
    assert cohort_counts(repaired) == [Counter({'older': 3, 'newborn': 2}), Counter({'older': 2, 'newborn': 2})]

    # Relabel the same unique scientific ages across PersonIds/storage positions.
    unique = [(f'a{i}', age) for i, age in enumerate([-90, -80, -70, -60, -50, -40, -30, -20, -10])]
    relabelled = list(reversed([(f'z{i}', age) for i, (_, age) in enumerate(unique)]))
    assert science_signature(repaired_partition(unique, 5)) == science_signature(repaired_partition(relabelled, 5))

    print('legacy cohort counts:', cohort_counts(legacy))
    print('repaired cohort counts:', cohort_counts(repaired))
    print('relabelled unique-age composition invariant: yes')


if __name__ == '__main__':
    main()
''')

          print('Remaining historical v1 treatment references:')
          for path in historical:
              if path.exists() and old_literal in path.read_text():
                  print(path)
          PY

      - name: Format and independent adversarial check
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo fmt --all
          python3 docs/research/audit-v2/area-c-household-fission-composition-audit.py

      - name: Focused household tests
        run: |
          cargo test --locked -p anthrosim-core --lib population::tests::age_balanced_fission -- --nocapture
          cargo test --locked -p anthrosim-core --test household_lifecycle_sensitivity -- --nocapture

      - name: Ensure no current executable v1 treatment remains
        run: |
          ! git grep -n 'deterministic_size_fission_v1' -- '*.rs' '*.json' '*.py' '*.toml' '*.yml' '*.yaml' || {
            echo 'current executable/config v1 references remain' >&2
            exit 1
          }
          ! git grep -n 'DETERMINISTIC_SIZE_FISSION_HOUSEHOLD_LIFECYCLE_ID' -- '*.rs' || {
            echo 'old Rust treatment identity remains' >&2
            exit 1
          }

      - name: Commit durable repair
        run: |
          git rm .github/workflows/pr324-age-balanced-fission-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: age-balance deterministic household fission (#324)'
          git push origin HEAD:fix/324-age-balanced-household-fission
