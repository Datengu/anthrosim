name: PR324 age-balanced fission patch

on:
  push:
    branches:
      - fix/324-age-balanced-household-fission

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/324-age-balanced-household-fission
          fetch-depth: 0
      - name: Apply repair
        run: python3 scripts/pr324_patch.py
      - name: Format and independent audit
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
          cargo fmt --all
          python3 docs/research/audit-v2/area-c-household-fission-composition-audit.py
      - name: Focused household tests
        run: |
          cargo test --locked -p anthrosim-core --lib population::tests::age_balanced_fission -- --nocapture
          cargo test --locked -p anthrosim-core --test household_lifecycle_sensitivity -- --nocapture
      - name: Reject current executable v1 treatment references
        run: |
          if git grep -n 'deterministic_size_fission_v1' -- '*.rs' '*.json' '*.py' '*.toml' '*.yml' '*.yaml'; then
            echo 'current executable/config v1 references remain' >&2
            exit 1
          fi
          if git grep -n 'DETERMINISTIC_SIZE_FISSION_HOUSEHOLD_LIFECYCLE_ID' -- '*.rs'; then
            echo 'old Rust treatment identity remains' >&2
            exit 1
          fi
      - name: Commit durable repair
        run: |
          git rm .github/workflows/pr324-age-balanced-fission-patch.yml scripts/pr324_patch.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'fix: age-balance deterministic household fission (#324)'
          git push origin HEAD:fix/324-age-balanced-household-fission
