name: Temporary apply AV3-011 patch

on:
  pull_request:
    paths:
      - "tmp-419.patch"
      - ".github/workflows/tmp-apply-419.yml"

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.head_ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply staged repair and remove temporary machinery
        run: |
          git apply tmp-419.patch
          rm tmp-419.patch .github/workflows/tmp-apply-419.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: reject fixed-by-design parameter identification"
          git push origin HEAD:${GITHUB_HEAD_REF}
