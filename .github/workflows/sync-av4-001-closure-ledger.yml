name: Synchronize AV4-001 closure ledger

on:
  push:
    branches:
      - audit-v4/close-av4-001-ledger
    paths:
      - '.github/workflows/sync-av4-001-closure-ledger.yml'

permissions:
  contents: write

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout ledger branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: audit-v4/close-av4-001-ledger
      - name: Record verified AV4-001 closure
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('docs/research/audit-v4/STATUS.md')
          text = path.read_text(encoding='utf-8')
          replacements = {
              "| Current P1 findings | **13 open — AV4-001/#486; AV4-002/#488; AV4-003/#491; AV4-004/#493; AV4-005/#495; AV4-006/#497; AV4-007/#500; AV4-008/#514; AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |":
              "| Current P1 findings | **12 open — AV4-002/#488; AV4-003/#491; AV4-004/#493; AV4-005/#495; AV4-006/#497; AV4-007/#500; AV4-008/#514; AV4-009/#518; AV4-010/#528; AV4-011/#535; AV4-012/#539; AV4-013/#543** |\n| Verified remediated findings | **1 — AV4-001/#486 closed after production PR #553 and independent merged-main evidence PR #554** |",
              "| Repair state | **post-discovery remediation in progress; AV4-001/#486 has production PR #553 under exact-head validation; all findings remain open until independent merged-main re-verification** |":
              "| Repair state | **post-discovery remediation in progress; AV4-001/#486 is verified closed; 12 P1 and 2 P2 findings remain open** |",
              "| AV4-001 — fertility RNG assignment is sensitive to arbitrary founder person labels | **P1** | A; B/E/H/N | **remediation in progress; production PR #553; independent post-merge re-verification required** | #486 | PR #485 / run `33687262609`; Area-N propagation PR #551 / run `33747718724`, job `100623957213`. |":
              "| AV4-001 — fertility RNG assignment is sensitive to arbitrary founder person labels | **P1** | A; B/E/H/N | **verified repaired; closed after independent merged-main re-verification** | #486 | Discovery PR #485 / run `33687262609`; Area-N propagation PR #551 / run `33747718724`, job `100623957213`; production PR #553 final head `a64bfcd1f204b7efef8806f8fa796113a406c7aa`, merged as `1480dbea1033733df3d84770b4d0ee2193fc8377`; exact original adversary restored in evidence PR #554 head `c98ae837a1d076674e07527fae7162b22a01cd44`, run `33769505785`, job `100695811795`: **0/1000 divergent pairs**; PR #554 closed unmerged. |",
              "- **AV4-001/#486:** production repair is under review in PR #553. The proposed repair removes canonical PersonId record order from annual fertility RNG assignment using a persistent person-level stochastic coupling rank canonicalized from represented day-zero scientific state, while preserving the named fertility stream, checkpoint/replay identity and exact RNG-position accounting.\n- The causal same-seed assignment change advances the current remediation line to `anthrosim-model-semantics-v26`; immutable discovery target `v0.3.4` remains `anthrosim-model-semantics-v25`.\n- #486 remains open until PR #553 is merged from an exact green head and the original Audit-v4 adversary is independently rerun against merged `main` in a separate evidence PR.":
              "- **AV4-001/#486 is verified closed.** Production PR #553 final head `a64bfcd1f204b7efef8806f8fa796113a406c7aa` passed all protected/applicable gates and was squash-merged as `1480dbea1033733df3d84770b4d0ee2193fc8377`. The repair removes canonical PersonId record order from annual fertility RNG assignment using a persistent person-level stochastic coupling rank canonicalized from represented day-zero scientific state, while preserving the named fertility stream, checkpoint/replay identity and exact RNG-position accounting.\n- The causal same-seed assignment change advances the current remediation line to `anthrosim-model-semantics-v26`; immutable discovery target `v0.3.4` remains `anthrosim-model-semantics-v25`.\n- Independent evidence PR #554 restored the exact original PR #485 adversary blobs and ran against merged main. Run `33769505785`, job `100695811795` passed seeds `1..=1000`, giving **0/1000 divergent pairs** versus the original **747/1000** measured defect; #554 was closed unmerged.\n- **Remaining remediation backlog:** 12 P1 findings (AV4-002 through AV4-013) and 2 P2 findings (AV4-014/015) remain independently open.",
              "**Area N is complete with no additional independent defect beyond the existing AV4-001 through AV4-015 backlog. Audit-v4 A–N discovery is therefore complete and classified non-clean: 13 P1 findings and 2 P2 findings remain open and unrepaired on the immutable v0.3.4/v25 target. After this ledger closure is merged, the next phase is production remediation plus independent post-merge re-verification of each finding.**":
              "**Area N is complete with no additional independent defect beyond the existing AV4-001 through AV4-015 backlog. Audit-v4 A–N discovery closed non-clean with 13 P1 and 2 P2 findings on the immutable v0.3.4/v25 target. Post-discovery remediation has now verified and closed AV4-001/#486, leaving 12 P1 and 2 P2 findings open; each remaining finding still requires production repair plus independent post-merge re-verification.**",
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'expected ledger text not found: {old[:120]!r}')
              text = text.replace(old, new, 1)

          path.write_text(text, encoding='utf-8')
          assert '**12 open — AV4-002/#488' in text
          assert 'AV4-001/#486 is verified closed' in text
          assert '**0/1000 divergent pairs**' in text
          assert '12 P1 and 2 P2 findings open' in text
          PY
      - name: Commit ledger synchronization
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/research/audit-v4/STATUS.md
          git diff --cached --check
          git commit -m 'docs: record verified AV4-001 closure'
          git push origin HEAD:audit-v4/close-av4-001-ledger
