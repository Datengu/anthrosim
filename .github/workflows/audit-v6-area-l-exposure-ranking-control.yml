name: Audit v6 Area L exposure ranking control

on:
  pull_request:
    paths:
      - "scripts/audit-v6-area-l-exposure-ranking-control.py"
      - ".github/workflows/audit-v6-area-l-exposure-ranking-control.yml"
      - "scripts/research-sweep-exposure.py"

permissions:
  contents: read

jobs:
  exposure-ranking-control:
    name: Cumulative versus exposure-rate ranking control
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false

      - name: Run exposure-ranking control
        run: python3 scripts/audit-v6-area-l-exposure-ranking-control.py
