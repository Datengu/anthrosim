name: AV5-001 M7.6 v34 provenance rebind

on:
  push:
    branches:
      - audit/repair-606-av5-001

permissions:
  contents: write

jobs:
  rebind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: audit/repair-606-av5-001
          fetch-depth: 0
      - name: Rebind M7.6 provenance only
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import copy
          import json
          from pathlib import Path

          path = Path('experiments/v0.1-resource-variability-reference.json')
          before = json.loads(path.read_text(encoding='utf-8'))
          assert before['modelSemanticsId'] == 'anthrosim-model-semantics-v33'
          assert before['schemaVersion'] == 3
          assert before['plannedRuns'] == 144
          assert before['completedRuns'] == 144
          assert len(before['pointResults']) == 18

          after = copy.deepcopy(before)
          after['modelSemanticsId'] = 'anthrosim-model-semantics-v34'
          after['note'] = (
              'Derived M7.6 reference summary originally rebound under model semantics v33 after Audit-v4 AV4-009 / #518 corrected M4 weighted migration candidate coupling. '
              'Audit-v5 AV5-001 / #606 changes only M9 temporary-mobility equal-cost destination coupling and is causally inapplicable to this M7.6 resource/migration factorial. '
              'Current-semantics CI run 34262100413 reran all 18 parameter points and 144/144 declared runs under v34; every run completed and remained scientifically eligible, and the point summaries reproduced the frozen v33 pointResults exactly. '
              'Accordingly this is a provenance-only v34 rebind: the source definition, definition digest, factorial design, paired seeds, completion/censoring rules, migration/resource settings, declared endpoints, and all 18 numerical pointResults remain unchanged. '
              'The synthetic validation pattern therefore remains unchanged and this snapshot remains verification evidence only, not calibration evidence or an empirical anthropological claim.'
          )

          changed = {k for k in before if before[k] != after[k]}
          assert changed == {'modelSemanticsId', 'note'}, changed
          assert before['pointResults'] == after['pointResults']
          assert before['definitionSha256'] == after['definitionSha256']
          assert before['referenceCiRunId'] == after['referenceCiRunId']
          assert before['referenceHeadCommit'] == after['referenceHeadCommit']
          assert before['referenceSweepId'] == after['referenceSweepId']

          path.write_text(json.dumps(after, separators=(',', ':')) + '\n', encoding='utf-8')
          PY
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add experiments/v0.1-resource-variability-reference.json
          git commit -m "research: rebind M7.6 reference provenance to v34"
          git push origin HEAD:audit/repair-606-av5-001
