name: Provenance reconciliation

on:
  push:
    branches:
      - docs/history-provenance-reconcile

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reconcile rewritten release provenance
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          old = '358ae93b57a9b8f7053575dc6651aa959de2b4f9'
          new = 'd3b6fc0b0750933b57252c9087513d156d88f218'
          changed = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts:
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              updated = text.replace(old, new)
              if p.as_posix() == 'docs/releases/v0.3.2.md':
                  updated = updated.replace(
                      'The immutable v0.3.1 tag is intentionally not moved or rewritten. Its source identity remains part of the project record. v0.3.2 is the corrective archival baseline for users who want the post-audit implementation together with living documentation that accurately describes it.\n\nThis preserves provenance rather than retroactively rewriting the earlier release.',
                      'The v0.3.1 release semantics and version identity remain part of the project record. A repository-wide privacy sanitisation on 2026-09-02 subsequently rewrote historical Git object identities, including historical release-tag commit SHAs, without changing the released source semantics. v0.3.2 remains the corrective archival baseline for users who want the post-audit implementation together with documentation that accurately describes it.\n\nThis preserves scientific and version provenance while acknowledging the exceptional privacy-driven Git-history rewrite.'
                  )
              if p.as_posix() == 'docs/release-versioning.md' and '## Exceptional privacy-driven history rewrites' not in updated:
                  updated += '''\n\n## Exceptional privacy-driven history rewrites\n\nRelease tags are immutable-intent scientific/version identities and must not ordinarily move after publication. The sole exception is an explicitly authorized repository-wide privacy or sensitive-data sanitisation where retaining the original Git objects would preserve information that must be removed.\n\nWhen such an exceptional rewrite occurs:\n\n- the release version and `MODEL_SEMANTICS_ID` do not change merely because Git object identities change;\n- rewritten tags must continue to identify source trees with the same released scientific semantics, apart from non-semantic sanitisation;\n- living provenance documentation must be reconciled to the rewritten tag SHA and must state that a privacy-driven rewrite occurred rather than pretending the original Git SHA is still the live tag identity;\n- the rewrite does not constitute a new scientific validation or a new release; and\n- subsequent releases must use the ordinary exact-candidate protected-CI and release-specific verification gates.\n\nOn 2026-09-02, AnthroSim underwent such an authorized privacy sanitisation. Historical release-tag commit identities were rewritten while release versions and model-semantics identities were preserved.\n'''
              if updated != text:
                  p.write_text(updated, encoding='utf-8')
                  changed.append(p.as_posix())
          print('Updated files:')
          for p in changed:
              print(' -', p)
          PY

          echo 'Current release refs:'
          git show-ref --tags

          echo 'Unresolvable 40-hex tokens in docs (diagnostic only):'
          python - <<'PY'
          import re, subprocess
          from pathlib import Path
          seen = set()
          for p in Path('docs').rglob('*'):
              if not p.is_file():
                  continue
              try:
                  text = p.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for token in re.findall(r'(?<![0-9a-fA-F])[0-9a-fA-F]{40}(?![0-9a-fA-F])', text):
                  low = token.lower()
                  key = (p.as_posix(), low)
                  if key in seen:
                      continue
                  seen.add(key)
                  ok = subprocess.run(['git','cat-file','-e',low], stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL).returncode == 0
                  if not ok:
                      print(f'{p}:{low}')
          PY

          rm .github/workflows/provenance-reconcile.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No reconciliation changes required.'
            exit 0
          fi
          git commit -m 'docs: reconcile privacy-rewritten release provenance'
          git push
