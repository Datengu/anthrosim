name: Apply M7.6 development patch

on:
  push:
    branches: [feat/m7-6-resource-variability-v0-1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[m7.6-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6.1.0
        with:
          ref: feat/m7-6-resource-variability-v0-1
          fetch-depth: 1

      - name: Apply staged patch and commit
        run: |
          git apply --check tools/m7-6.patch
          git apply tools/m7-6.patch
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/config.rs crates/anthrosim-core/src/world.rs crates/anthrosim-cli/src/ensemble.rs crates/anthrosim-cli/src/main.rs crates/anthrosim-cli/src/sweep.rs
          git commit -m "Implement M7.6 resource variability controls [m7.6-patch-applied]"
          git push origin HEAD:feat/m7-6-resource-variability-v0-1
