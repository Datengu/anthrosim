name: Apply M7.6 development patch

on:
  push:
    branches: [feat/m7-6-resource-variability-v0-1]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: ${{ github.event_name == 'pull_request' || !contains(github.event.head_commit.message, '[m7.6-patch-applied]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout development branch
        uses: actions/checkout@v6.1.0
        with:
          ref: feat/m7-6-resource-variability-v0-1
          fetch-depth: 1

      - name: Apply source transformations and commit
        run: |
          sed -i 's/expected=6,/expected=3,/' tools/apply-m7-6.py
          python3 tools/apply-m7-6.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/anthrosim-cli/src/main.rs')
          text = path.read_text(encoding='utf-8')
          old = "                resource_productivity_scale_permille,\n                annual_food_need,"
          new = "                resource_productivity_scale_permille,\n                resource_seasonality_scale_permille,\n                annual_food_need,"
          count = text.count(old)
          if count != 3:
              raise SystemExit(f'expected 3 settings insertions, found {count}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          cargo fmt --all
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/config.rs crates/anthrosim-core/src/resources.rs crates/anthrosim-core/src/manifest.rs crates/anthrosim-core/src/checkpoint.rs crates/anthrosim-cli/src/ensemble.rs crates/anthrosim-cli/src/main.rs crates/anthrosim-cli/src/sweep.rs
          git commit -m "Implement M7.6 resource variability controls [m7.6-patch-applied]"
          git push origin HEAD:feat/m7-6-resource-variability-v0-1
