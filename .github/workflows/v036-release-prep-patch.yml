              '**Living framework state:** software version `v0.3.6` / current model semantics v35. Immutable `v0.3.5` remains the Scientific Audit-v5 discovery target at model semantics v33; immutable `v0.3.4` remains the historical Audit-v4 target at model semantics v25. Current documentation must not rewrite either historical audit identity.'
          )
          replace_once(
              'docs/research/README.md',
              '- [`audit-v5/README.md`](audit-v5/README.md) — active fifth independent scientific-audit charter for immutable `v0.3.5` / model semantics v33.\n- [`audit-v5/STATUS.md`](audit-v5/STATUS.md) — repository-authoritative Audit-v5 discovery/remediation ledger; begin here when reconstructing or continuing the active audit.',
              '- [`audit-v5/README.md`](audit-v5/README.md) — completed/historical fifth independent scientific-audit charter for immutable `v0.3.5` / model semantics v33; do not use it to restart Audit v5.\n- [`audit-v5/STATUS.md`](audit-v5/STATUS.md) — final Audit-v5 ledger: 8 findings demonstrated (4 P1, 4 P2), 8/8 repaired/dispositioned and closed, with required P1 re-verification complete.'
          )
          replace_once(
              'docs/research/README.md',
              '- [`v0.3.5-release-readiness.md`](v0.3.5-release-readiness.md) — v0.3.5/v33 release-preparation record after completed Audit-v4 remediation and the two post-audit documentation consistency passes.',
              '- [`v0.3.5-release-readiness.md`](v0.3.5-release-readiness.md) — historical v0.3.5/v33 release-preparation record after completed Audit-v4 remediation.\n- [`v0.3.6-release-readiness.md`](v0.3.6-release-readiness.md) — v0.3.6/v35 release-preparation and documentation-convergence record after completed Audit-v5 remediation.'
          )
          replace_once(
              'docs/research/README.md',
              '## Earlier audit generations\n\n- [`audit-v4/README.md`](audit-v4/README.md) and [`audit-v4/STATUS.md`](audit-v4/STATUS.md) preserve the completed fourth independent audit against immutable `v0.3.4` / v25.',
              '## Earlier audit generations\n\n- [`audit-v5/README.md`](audit-v5/README.md) and [`audit-v5/STATUS.md`](audit-v5/STATUS.md) preserve the completed fifth independent audit against immutable `v0.3.5` / v33. It found 4 P1 and 4 P2 defects; all were repaired/dispositioned, producing v35, but the pass remains non-clean for convergence purposes.\n- [`audit-v4/README.md`](audit-v4/README.md) and [`audit-v4/STATUS.md`](audit-v4/STATUS.md) preserve the completed fourth independent audit against immutable `v0.3.4` / v25.'
          )
          replace_once('docs/research/README.md', 'current v33 language', 'current v35 language')
          replace_once(
              'docs/research/README.md',
