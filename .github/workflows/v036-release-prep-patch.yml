              '**Status:** working specification for the v0.3.5 release line after completed Audit-v4 remediation / current model semantics v35 (immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)',
              '**Status:** working specification for the v0.3.6 release line after completed Audit-v5 remediation / current model semantics v35 (immutable v0.3.5 release baseline: v33; immutable v0.3.4 release baseline: v25; immutable v0.3.3 release baseline: v21)'
