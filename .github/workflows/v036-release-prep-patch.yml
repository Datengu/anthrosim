              'No fixed M10 feature list is declared. **Do not begin the first empirical/site-specific research question yet:** the project convergence rule requires another fresh full A–N audit after this v0.3.6 freeze because Audit v5 was non-clean. Once a future audit achieves a P1-clean convergence pass, substantive work should return to the question-led strategy and separately establish evidence, calibration/validation, uncertainty, sensitivity, applicability and corroboration appropriate to the intended inference.'
