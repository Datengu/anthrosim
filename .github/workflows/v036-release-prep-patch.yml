name: v0.3.6 release preparation patch

on:
  push:
    branches:
      - release/v0.3.6-prep
    paths:
      - .github/workflows/v036-release-prep-patch.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release preparation branch
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: release/v0.3.6-prep
          fetch-depth: 0

      - name: Apply fail-closed v0.3.6 release preparation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          ROOT = Path('.')

          def replace_once(path: str, old: str, new: str) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one occurrence, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          def regex_once(path: str, pattern: str, replacement: str, flags: int = 0) -> None:
              p = ROOT / path
              text = p.read_text(encoding='utf-8')
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one regex match, found {count}: {pattern!r}')
              p.write_text(updated, encoding='utf-8')

          def write_new(path: str, content: str) -> None:
              p = ROOT / path
              if p.exists():
                  raise SystemExit(f'{path}: release-preparation file already exists')
              p.write_text(content, encoding='utf-8')

          # Package identity. Release preparation itself does not change model semantics v35.
          replace_once('Cargo.toml', 'version = "0.3.5"', 'version = "0.3.6"')
          replace_once('Cargo.lock', 'name = "anthrosim-cli"\nversion = "0.3.5"', 'name = "anthrosim-cli"\nversion = "0.3.6"')
          replace_once('Cargo.lock', 'name = "anthrosim-core"\nversion = "0.3.5"', 'name = "anthrosim-core"\nversion = "0.3.6"')

          # README: release identity, completed Audit-v5 state, convergence gate and closed AV5-004 evidence.
          replace_once(
              'README.md',
              '**This living source tree carries AnthroSim workspace software version `0.3.5` at current model semantics v35.** The immutable `v0.3.5` release/tag remains model semantics v33 and preserves the fully repaired and independently re-verified Audit-v4 state. The immutable `v0.3.4` release remains model semantics v25 and the frozen Audit-v4 discovery target; immutable `v0.3.3` remains model semantics v21. See [`docs/release-versioning.md`](docs/release-versioning.md) for the release/source/semantics distinction.',
              '**This living source tree carries AnthroSim software version `0.3.6` at current model semantics v35.** The v0.3.6 release line freezes the fully remediated Scientific Audit-v5 state. The immutable `v0.3.5` release remains model semantics v33 and is the frozen Audit-v5 discovery target; immutable `v0.3.4` remains model semantics v25 and the historical Audit-v4 target; immutable `v0.3.3` remains model semantics v21. See [`docs/release-versioning.md`](docs/release-versioning.md) for the release/source/semantics distinction.'
          )
          replace_once(
              'README.md',
              '**Scientific Audit v4 is complete.** It independently audited immutable `v0.3.4`/v25 across Areas A–N, demonstrated 15 findings (13 P1 and 2 P2), and all 15 were repaired and independently re-verified/dispositioned on the living line. The final repaired Audit-v4 line is `anthrosim-model-semantics-v33`; there are no open Audit-v4 findings. **Scientific Audit v5 discovery is also complete against immutable `v0.3.5`/v33, with post-discovery remediation in progress on the living line.** See [`docs/research/audit-v4/STATUS.md`](docs/research/audit-v4/STATUS.md) and [`docs/research/audit-v5/STATUS.md`](docs/research/audit-v5/STATUS.md).',
              '**Scientific Audits v4 and v5 are complete.** Audit v5 independently restarted Areas A–N against immutable `v0.3.5`/v33 and demonstrated **8 findings: 4 P1 and 4 P2**. All eight received their required production dispositions; all P1 repairs received independent post-merge adversarial re-verification; living semantics advanced to v35 where causal meaning changed. Audit v5 is therefore a **non-clean convergence pass** because it discovered new P1 defects. Under the repository convergence rule, another fresh full audit against the newly frozen repaired baseline is required before the first empirical/site-specific study. See [`docs/research/audit-v5/STATUS.md`](docs/research/audit-v5/STATUS.md).'
          )
          replace_once(
              'README.md',
              'The living `0.3.5` workspace/model-semantics-v35 development line retains the completed M1–M9 capability set and the scientific/reproducibility hardening added through subsequent audits:',
              'The v0.3.6/model-semantics-v35 release line retains the completed M1–M9 capability set and the scientific/reproducibility hardening added through subsequent audits:'
          )
          replace_once(
              'README.md',
              '- **v0.3.5:** immutable post-Audit-v4 repaired convergence baseline at model semantics v33; it packages the fully remediated/re-verified v4 line and subsequent documentation-consistency reconciliation without adding a new roadmap milestone.\n- **Scientific Audit v4:**',
