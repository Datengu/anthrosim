              'docs/roadmap.md',
              'The M9.7 benchmark remains **`capability_distinguished`**. Its current checked-in machine reference is on model semantics v31 because later v32/v33 changes are causally inapplicable to its preserved reference behavior. That is a capability/regression result, not evidence for a real social motive or archaeological interpretation.',
              'The M9.7 benchmark remains **`capability_distinguished`**. Its current checked-in machine reference is on model semantics v35 after the Audit-v5 M9 coupling repairs and reviewed reference rebaseline; earlier v31–v34 references remain historical evidence. That is a capability/regression result, not evidence for a real social motive or archaeological interpretation.'
