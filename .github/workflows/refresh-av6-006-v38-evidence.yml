# Temporary fail-closed evidence refresh; removed automatically after successful validation.
name: Guard and refresh AV6-006 v38 references

on:
  push:
    branches: ["audit/repair-711-av6-006"]
    paths: [".github/workflows/refresh-av6-006-v38-evidence.yml"]

permissions:
  actions: read
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
      - name: Download v38 demographic evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: issue-304-demographic-baseline-confirmatory
          path: /tmp/demog
          github-token: ${{ github.token }}
          run-id: 34555842374
      - name: Download v38 M9.7 evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: m9-controlled-aggregation-benchmark
          path: /tmp/m97
          github-token: ${{ github.token }}
          run-id: 34555842586
      - name: Prove bounded deltas and stage references
        run: |
          python3 .github/scripts/refresh_av6_006_v38_evidence.py
          python3 scripts/test-current-demographic-baseline-docs.py
          git diff --check
      - name: Commit guarded evidence refresh and remove helpers
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm .github/workflows/refresh-av6-006-v38-evidence.yml
          rm .github/scripts/refresh_av6_006_v38_evidence.py
          git add research/general-demography-baseline-v1/confirmatory-result.json docs/research/general-scientific-demographic-baseline-v1.md examples/m9-controlled-aggregation-benchmark/reference-result.json docs/research/m9-controlled-aggregation-benchmark-result.md .github/workflows/refresh-av6-006-v38-evidence.yml .github/scripts/refresh_av6_006_v38_evidence.py
          git commit -m "test(audit-v6): refresh v38 scientific references"
          git push origin HEAD:audit/repair-711-av6-006
