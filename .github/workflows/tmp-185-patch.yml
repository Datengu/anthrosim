name: Temporary issue 185 patch

on:
  push:
    branches:
      - fix/185-grid-geometry-contract

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: fix/185-grid-geometry-contract
          persist-credentials: true
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component clippy --component rustfmt
          rustup default 1.97.1
      - name: Apply narrow core patch
        run: python3 scripts/tmp-185-patch.py
      - name: Format
        run: cargo fmt --all
      - name: Test preprocessing contract
        run: python3 scripts/test-landscape-preprocess.py
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Test workspace
        run: cargo test --locked --workspace
      - name: Commit production changes and remove temporary runner
        run: |
          rm scripts/tmp-185-patch.py .github/workflows/tmp-185-patch.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix: enforce unambiguous spatial grid geometry"
          git push origin HEAD:fix/185-grid-geometry-contract
