name: M9.4 integration helper

on:
  push:
    branches:
      - m9/m9-4-travel-semantics
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          persist-credentials: true
          ref: ${{ github.head_ref || github.ref_name }}
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply guarded M9.4 integration
        run: |
          python3 scripts/m9_4_integrate.py
          sed -i 's/region\.cells()/region.member_cells()/g' \
            crates/anthrosim-core/src/temporary_mobility.rs \
            crates/anthrosim-core/src/temporary_travel.rs
      - name: Format Rust
        run: cargo fmt --all
      - name: Compile and run M9.4 travel tests
        run: cargo test --locked -p anthrosim-core temporary_travel
      - name: Commit integrated source when present
        run: |
          if git diff --quiet -- \
            crates/anthrosim-core/src/temporary_mobility.rs \
            crates/anthrosim-core/src/temporary_travel.rs \
            crates/anthrosim-core/src/lib.rs \
            crates/anthrosim-core/src/provenance.rs \
            crates/anthrosim-core/src/checkpoint.rs \
            docs/roadmap.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            crates/anthrosim-core/src/temporary_mobility.rs \
            crates/anthrosim-core/src/temporary_travel.rs \
            crates/anthrosim-core/src/lib.rs \
            crates/anthrosim-core/src/provenance.rs \
            crates/anthrosim-core/src/checkpoint.rs \
            docs/roadmap.md
          git commit -m "Integrate M9.4 travel semantics"
          git push origin HEAD:m9/m9-4-travel-semantics

# Removed once the guarded integration commit lands.
