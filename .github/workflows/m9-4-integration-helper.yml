name: M9.4 cleanup helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Remove temporary M9.4 development helpers
        run: |
          rm -f \
            .github/workflows/m9-4-integration-helper.yml \
            scripts/m9_4_integrate.py \
            scripts/m9_4_journey_cost_patch.py \
            scripts/m9_4_resolution_invariant_patch.py
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove temporary M9.4 integration helpers"
          git push origin HEAD:m9/m9-4-travel-semantics
