name: M9.4 resolution invariant helper

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v5.0.0
        with:
          persist-credentials: true
          ref: ${{ github.head_ref }}
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1 --component rustfmt
          rustup default 1.97.1
      - name: Apply guarded exact-resolution invariant patch
        run: python3 scripts/m9_4_resolution_invariant_patch.py
      - name: Format Rust
        run: cargo fmt --all
      - name: Test core M9.4 integration
        run: cargo test --locked -p anthrosim-core
      - name: Commit exact-resolution invariant when present
        run: |
          if git diff --quiet -- crates/anthrosim-core/src/temporary_mobility.rs; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/anthrosim-core/src/temporary_mobility.rs
          git commit -m "Validate exact M9.4 travel resolution"
          git pull --rebase origin m9/m9-4-travel-semantics
          git push origin HEAD:m9/m9-4-travel-semantics

# Removed after this guarded integration commit lands.
