name: M4 scientific doc patch

on:
  push:
    branches: [feat/m4-migration]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6.1.0
        with:
          ref: feat/m4-migration
          persist-credentials: true
      - name: Update ODD-oriented model specification
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/scientific-model.md')
          t = p.read_text()

          replacements = [
          ('''In M2/M3, a newborn is assigned to the female parent's current household and cell. This is a transparent synthetic co-residence rule required to place a newborn into valid state; it is not an empirical claim about universal residence systems.\n\nIn M3, resource acquisition is accounted at the household level after same-cell competition. All living members of a household receive the same resource-satisfaction fraction for that period. There is no within-household age, status, sex, bargaining, preferential feeding, storage, theft, exchange, or food-waste model yet.\n''',
           '''In M2–M4, a newborn is assigned to the female parent's current household and cell. This is a transparent synthetic co-residence rule required to place a newborn into valid state; it is not an empirical claim about universal residence systems.\n\nResource acquisition is accounted at the household level after same-cell competition. All living members of a household receive the same resource-satisfaction fraction for that period. There is no within-household age, status, sex, bargaining, preferential feeding, storage, theft, exchange, or food-waste model yet.\n\nIn M4, the household is also the relocation unit. All currently living members of a selected household move together; people who died before a later household move retain their location at death. Household-coordinated relocation is an explicit v0.1 modelling choice, not a claim that all real mobility decisions occur at that social scale.\n'''),
          ('''Authoritative simulation time is represented in integer days. M3 resource/condition processing occurs at explicit subannual boundaries: the default synthetic resource configuration uses four periods per year. M2 demographic hazards remain evaluated at explicit annual boundaries after the resource periods for that year. These are temporal approximations, not claims that real gathering, physiological change, births, or deaths occur synchronously at those intervals.\n''',
           '''Authoritative simulation time is represented in integer days. Resource/condition processing occurs at explicit subannual boundaries: the default synthetic resource configuration uses four periods per year. M4 migration is evaluated immediately after each surviving resource boundary, and selected household moves complete atomically at that same boundary with an explicit travel-condition cost. M2 demographic hazards remain evaluated at explicit annual boundaries after the resource/migration periods for that year. These are temporal approximations, not claims that real gathering, physiological change, travel, births, or deaths occur synchronously at those intervals.\n'''),
          ('''For each M3 simulated year, the implemented order is:\n\n1. divide the year into the configured number of resource periods (four by default);\n2. at each resource boundary, regenerate renewable cell stock from baseline productivity, the configured productivity scale, synthetic seasonality and environmental stress, subject to a cell stock capacity;\n3. count living household members and calculate household resource need for the period;\n4. aggregate household demand by cell;\n5. allocate available cell stock among co-located households in proportion to household need, with bounded integer remainder resolved in stable household-ID order;\n6. treat household harvest as immediate household consumption in the M3 baseline;\n7. update each living member's condition from the household supply fraction;\n8. apply an additional scarcity-mortality draw whose probability increases with condition deficit;\n9. stop immediately if the population becomes extinct;\n10. after the final resource period of the year, evaluate the existing M2 annual demographic boundary: baseline mortality first, then fertility/births among survivors;\n11. stop explicitly if extinction or the operational persistent-record limit occurs;\n12. at run completion, validate population/resource accounting and emit manifest summaries.\n''',
           '''For each M4 simulated year, the implemented order is:\n\n1. divide the year into the configured number of resource periods (four by default);\n2. at each resource boundary, regenerate renewable cell stock from baseline productivity, the configured productivity scale, synthetic seasonality and environmental stress, subject to a cell stock capacity;\n3. count living household members and calculate household resource need for the period;\n4. aggregate household demand by cell;\n5. allocate available cell stock among co-located households in proportion to household need, with bounded integer remainder resolved in stable household-ID order;\n6. treat household harvest as immediate household consumption in the current baseline;\n7. update each living member's condition from the household supply fraction;\n8. apply an additional scarcity-mortality draw whose probability increases with condition deficit;\n9. stop immediately if the population becomes extinct;\n10. for surviving households, derive one shared pre-move local snapshot and evaluate M4 relocation pressure;\n11. pressured households compare only candidate cells within the configured bounded Manhattan radius, decompose origin/candidate utility into explicit factors, and use the named migration streams for uncertainty and weighted stochastic choice;\n12. apply all selected household relocations simultaneously in one packed pass, deducting distance-dependent travel condition cost and rebuilding occupancy once;\n13. after the final resource/migration period of the year, evaluate the existing M2 annual demographic boundary: baseline mortality first, then fertility/births among survivors;\n14. stop explicitly if extinction or the operational persistent-record limit occurs;\n15. at run completion, validate population/resource accounting and emit world, population, resource and migration summaries.\n'''),
          ('''M3 now allows local density and environmental productivity to create different condition/survival outcomes without scripting which population or cell should succeed.\n''',
           '''M3 allows local density and environmental productivity to create different condition/survival outcomes without scripting which population or cell should succeed. M4 adds a behavioural response: pressured households can relocate toward locally acceptable alternatives without any rule naming a historical destination, route, settlement or population outcome.\n'''),
          ('''Migration uses an interpretable local utility or probability model. Candidate destinations are knowledge-limited rather than globally optimal. Migration is still deferred to M4, so M3 households currently cannot leave a poor cell.\n\nA starting conceptual form for M4 is:\n\n```text\nmove utility = expected resources\n             + water/security benefit\n             + kin proximity\n             - travel cost\n             - uncertainty\n             - relocation risk\n```\n\nWeights will be explicit experimental parameters, not hidden tuning constants.\n''',
           '''M4 uses an interpretable bounded local utility model. A household only evaluates cells within a configured Manhattan radius (three cells by default), so candidate discovery does not become a global best-cell search as the world grows. Staying is represented by the origin utility against which candidate improvement is compared.\n\nThe implemented synthetic utility decomposition is:\n\n```text\nmove utility = local dynamic-resource score × resource weight\n             + water/security proxy × water weight\n             + bounded direct-parent location score × kin weight\n             - distance/terrain travel penalty × travel weight\n             - deterministic uncertainty penalty\n             - relocation-risk penalty\n```\n\nA candidate must exceed the configured minimum improvement over staying. Eligible alternatives receive weights proportional to improvement and one is selected using the named deterministic `migration/choice` stream. The current factors and weights are explicit experimental parameters, not hidden tuning constants or empirical estimates of hunter-gatherer preferences.\n'''),
          ('''M3 cell competition is local: household demand is aggregated only among households occupying the same cell. The hot path uses contiguous arrays indexed by cell/household/person rather than pairwise person searches or a global household-interaction graph.\n''',
           '''Cell competition is local: household demand is aggregated only among households occupying the same cell. M4 destination discovery is also local: an interior household sees at most `2r(r + 1)` candidate cells for radius `r` (24 at the default radius three), regardless of total world size. The hot path uses contiguous arrays indexed by cell/household/person plus reusable bounded candidate buffers rather than pairwise person searches or a global household-interaction graph.\n'''),
          ('''M2 uses separate streams for mortality, fertility, parentage and newborn reproductive sex. M3 adds an independent `resources/scarcity_mortality` stream so scarcity-death draws do not consume demographic or world RNG state.\n\nResource regeneration, household demand, allocation, condition changes, and integer accounting are deterministic conditional on state/configuration; the current M3 scarcity-mortality coupling is stochastic.\n''',
           '''M2 uses separate streams for mortality, fertility, parentage and newborn reproductive sex. M3 adds an independent `resources/scarcity_mortality` stream so scarcity-death draws do not consume demographic or world RNG state. M4 adds independent `migration/choice` and `migration/uncertainty` streams.\n\nResource regeneration, household demand, allocation, condition changes, candidate enumeration and integer utility/accounting are deterministic conditional on state/configuration. Scarcity mortality, migration uncertainty and weighted migration choice are stochastic but reproducible through their named streams.\n'''),
          ('''The run manifest records aggregate world, population and resource measurements while preserving authoritative persistent state. M3 resource summaries include initial/final stock, cumulative regeneration, harvest/consumption, unmet need, household-periods with unmet need, scarcity deaths, final mean living condition, count below half condition, and a deterministic resource-state digest.\n\nDetailed chronological event streams remain deferred to the later events/history milestone. Interpretive labels must not be confused with authoritative state or events.\n''',
           '''The run manifest records aggregate world, population, resource and migration measurements while preserving authoritative persistent state. Resource summaries include initial/final stock, cumulative regeneration, harvest/consumption, unmet need, household-periods with unmet need, scarcity deaths, final mean living condition, count below half condition, and a deterministic resource-state digest.\n\nM4 migration summaries include decision boundaries, households evaluated/under pressure, move/person counts, distance and direction totals, travel-condition cost, mean origin/destination resource and water/security scores, migration-attributable occupied-cell delta and a deterministic migration digest. A configured bounded sample of detailed completed-move traces records factor-by-factor origin/destination utility and stochastic-choice audit fields. Full chronological event streams remain deferred to M5. Interpretive labels must not be confused with authoritative state or real-world motives.\n'''),
          ('''- migration parameters when implemented;\n''', '''- migration preset, local-information radius, pressure thresholds, utility weights, uncertainty/risk and travel-cost parameters;\n'''),
          ('''M3 initializes dynamic resource stock from each synthetic world's initial food-stock/productivity fields, the resource productivity scale, and the configured stock-capacity rule. This is an engine-validation initial condition, not reconstructed environmental carrying capacity.\n''',
           '''M3 initializes dynamic resource stock from each synthetic world's initial food-stock/productivity fields, the resource productivity scale, and the configured stock-capacity rule. This is an engine-validation initial condition, not reconstructed environmental carrying capacity. M4 initializes no historical route or destination knowledge; households begin only with current co-residence/location and bounded genealogical information already present in persistent person state.\n'''),
          ('''v0.1 has no external anthropological, archaeological, energetic, or palaeoecological **runtime dataset**. The M1 environment and M3 resource quantities are synthetic. M2 demographic mechanisms are informed by published comparative evidence, documented in `docs/research/demography-v0.1.md`, but the first executable demographic preset remains explicitly synthetic for engine validation.\n''',
           '''v0.1 has no external anthropological, archaeological, energetic, mobility, or palaeoecological **runtime dataset**. The M1 environment, M3 resource quantities and M4 migration utility parameters are synthetic. M2 demographic mechanisms are informed by published comparative evidence, documented in `docs/research/demography-v0.1.md`, but the first executable demographic preset remains explicitly synthetic for engine validation.\n'''),
          ('''Later empirical presets must retain source identity, transformations, units, uncertainty and provenance status.\n''',
           '''The M4 executable migration preset is likewise `synthetic_validation_v1`. Its information radius, pressure thresholds, utility weights, uncertainty, relocation-risk and travel-condition costs are mechanism-testing assumptions rather than estimates of observed mobility. `docs/research/migration-v0.1.md` records the exact interpretation boundary.\n\nLater empirical presets must retain source identity, transformations, units, uncertainty and provenance status.\n'''),
          ('''M3 deliberately does not let households migrate away from scarcity. That response is M4.\n\n### Households (minimal M2/M3 baseline; deeper rules deferred)\n''',
           '''M4 now provides a bounded household response to local pressure; resource production itself remains local and unchanged by the migration utility model.\n\n### Households (minimal M2–M4 baseline; deeper rules deferred)\n'''),
          ('''### Migration (planned M4)\n\nHouseholds/individuals compare staying with a bounded set of locally plausible alternatives. Movement incurs distance/environment costs and uncertainty. No destination is selected because of its real-world historical importance.\n''',
           '''### Migration (M4 — implemented synthetic baseline)\n\nSurviving households whose condition and/or local resource support cross configured pressure thresholds compare staying with cells inside a bounded Manhattan information radius. Candidate utility uses current M3 resource stock relative to local demand, a synthetic water/security proxy, a deliberately narrow direct-parent-location kin proxy, travel/terrain cost, uncertainty and relocation risk.\n\nCandidate evaluation is not global optimization. Candidates that sufficiently improve on staying enter a deterministic weighted stochastic choice. All household decisions at one boundary use the same pre-move snapshot; selected household moves are then applied simultaneously. Living members relocate together and lose condition according to distance. Dead records retain their location at death.\n\nThere is no hard-coded historical destination or route, no persistent en-route state, no route memory, no clan/tribe institution and no claim that the synthetic utility weights reproduce real mobility behaviour. Detailed provenance and limitations are in `docs/research/migration-v0.1.md`.\n'''),
          ('''- directional productivity test: under otherwise identical synthetic assumptions designed to isolate the resource mechanism, a resource-rich environment must support at least as much condition/survival as a zero-productivity environment.\n\nPassing these targets verifies implementation properties. It does not validate the resource model against reality.\n''',
           '''- directional productivity test: under otherwise identical synthetic assumptions designed to isolate the resource mechanism, a resource-rich environment must support at least as much condition/survival as a zero-productivity environment;\n- bounded migration-candidate discovery independent of total-world search;\n- deterministic migration replay, including migration digest and recorded choice traces;\n- directional migration-pressure test: worsening local resource/condition state must not reduce the implemented relocation pressure under otherwise equal inputs;\n- household relocation consistency: living household members and current household location remain coherent after moves;\n- migration-enabled and migration-disabled otherwise-equal experiments can diverge spatially through the migration mechanism rather than scripted routes.\n\nPassing these targets verifies implementation properties. It does not validate the resource or migration model against reality.\n'''),
          ('''The implemented M2 and M3 baselines remain **unvalidated**. Passing software verification is not equivalent to empirical validation.\n\nA research-capable demographic/resource configuration will require:\n''',
           '''The implemented M2, M3 and M4 baselines remain **unvalidated**. Passing software verification is not equivalent to empirical validation.\n\nA research-capable demographic/resource/migration configuration will require:\n'''),
          ('''- explicit examination of initialization transients and initial resource stock;\n- calibration only where justified by a stated research question;\n''',
           '''- explicit examination of initialization transients and initial resource stock;\n- evidence-grounded mobility scale, information horizon, social/kin structure and travel-cost assumptions where migration is part of the claim;\n- explicit sensitivity analysis for simultaneous-move crowding and the current atomic-travel approximation;\n- calibration only where justified by a stated research question;\n'''),
          ('''A reasonable first research-style exercise after migration is implemented is:\n''',
           '''A reasonable first research-style exercise now that the complete v0.1 environmental-response loop exists is:\n'''),
          ('''M3 now provides the resource-to-condition-to-survival half of that causal experiment. M4 will add behavioural movement responses. Until empirical parameterization/validation exists, this remains an engine/model validation exercise rather than a claim about actual prehistory.\n''',
           '''M3 provides the resource-to-condition-to-survival pathway and M4 now adds bounded behavioural movement responses. Until empirical parameterization/validation exists, this remains an engine/model validation exercise rather than a claim about actual prehistory.\n'''),
          ]

          for old, new in replacements:
              if t.count(old) != 1:
                  raise SystemExit(f'replacement marker count {t.count(old)} for: {old[:80]!r}')
              t = t.replace(old, new, 1)
          p.write_text(t)
          PY

      - name: Commit scientific model update
        run: |
          git config user.name "AnthroSim CI"
          git config user.email "actions@users.noreply.github.com"
          git add docs/scientific-model.md
          git diff --cached --check
          git commit -m "M4: update scientific model specification"
          git push origin HEAD:feat/m4-migration
