name: Audit v5 Area D fission-resource conservation adversary

on:
  pull_request:
    paths:
      - 'crates/anthrosim-core/tests/audit_v5_area_d_fission_resource_conservation.rs'
      - '.github/workflows/audit-v5-area-d-fission-resource-conservation.yml'

permissions:
  contents: read

jobs:
  adversary:
    name: Fission-resource cell conservation adversary
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.97.1
          rustup default 1.97.1
      - name: Run fresh Audit-v5 Area-D fission-resource adversary
        run: cargo test --locked -p anthrosim-core --test audit_v5_area_d_fission_resource_conservation -- --nocapture
