[workspace]
members = [
    "crates/anthrosim-core",
    "crates/anthrosim-cli",
]
resolver = "3"

[workspace.package]
version = "0.3.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["AnthroSim contributors"]
repository = "https://github.com/Datengu/anthrosim"
license = "Apache-2.0"

[workspace.dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rand = "0.10.2"
rand_chacha = "0.10.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"

[profile.release]
lto = "thin"
codegen-units = 1

[profile.bench]
debug = 1
